extends: default

# `bad-malformed.yml` fixtures are intentionally unparsable YAML that
# exercise the parse-failure branch of the workflow-lint checks.
ignore: |
  tests/fixtures/**/bad-malformed.yml

rules:
  # Renovate marker comments push lines past the 80-char default; the
  # alternative (wrapping) defeats Renovate's regex matcher.
  line-length: disable
  # Trailing `# vX.Y.Z` version comments after action SHAs need a single
  # space, not two.
  comments:
    min-spaces-from-content: 1
  # GitHub Actions `on:` is a YAML truthy value; allow the literal `on` key.
  truthy:
    check-keys: false
  # nested job-step lists indent deeper than yamllint's 2-space default.
  indentation:
    indent-sequences: consistent
  # Multiline strings appear inside `extra_nix_config: |` blocks.
  document-start: disable
  # prettier's YAML style puts a single space inside non-empty flow-map
  # braces (`{ pull_request: {} }`) and none inside empty ones; match that
  # instead of fighting the formatter on every flow-map `on:` block.
  braces:
    min-spaces-inside: 1
    max-spaces-inside: 1
    min-spaces-inside-empty: 0
    max-spaces-inside-empty: 0
