extends: default

# `bad-malformed.yml` fixtures are intentionally unparsable YAML that
# exercise the parse-failure branch of the workflow-lint checks. Some
# harnesses require the malformed content under a name other than
# `bad-malformed.yml` (a manifest override, an allowlist override, or a
# per-fixture directory's own `ci.yml`); list those individually.
ignore: |
  tests/fixtures/**/bad-malformed.yml
  tests/fixtures/permission-scopes/malformed-allowlist/allowlist.yml
  tests/fixtures/ci-job-in-summary/bad-malformed-manifest/lint-groups.yml
  tests/fixtures/commitlint-config-explicit/bad-malformed/ci.yml

rules:
  # Renovate marker comments push lines past the 80-char default; the
  # alternative (wrapping) defeats Renovate's regex matcher.
  line-length: disable
  # Trailing `# vX.Y.Z` version comments after action SHAs need a single
  # space, not two.
  comments:
    min-spaces-from-content: 1
  # GitHub Actions `on:` is a YAML truthy value; allow the literal `on` key.
  truthy:
    check-keys: false
  # nested job-step lists indent deeper than yamllint's 2-space default.
  indentation:
    indent-sequences: consistent
  # Multiline strings appear inside `extra_nix_config: |` blocks.
  document-start: disable
