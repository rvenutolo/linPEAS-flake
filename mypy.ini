# mypy configuration for the repo's Python. The `mypy-strict` pre-commit
# hook runs bare `mypy`, so a local run in the devShell reads this same
# file and checks the same files.
[mypy]
strict = True
files = scripts, docs/_data
# No .mypy_cache in the tree, and nothing to write inside the
# `nix flake check` sandbox, where the hook also runs.
cache_dir = /dev/null
# The types-PyYAML stubs leave several loader methods unannotated
# (`construct_object`, `resolve`, `add_multi_constructor`), and strict mode
# rejects every call to them. mypy names such a call by the receiver's
# class, so the exemption is the checker's own `SiteLoader`, which declares
# no methods of its own: only PyYAML's inherited ones are exempt, and this
# repo's functions still must be fully typed.
untyped_calls_exclude = _scripts_reference_roundtrip.SiteLoader
