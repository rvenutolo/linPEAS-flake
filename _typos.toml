[files]
extend-exclude = [
  "flake.lock",
  "linpeas-pin.json",
  "docs/_data/**",
  "result*",
  ".direnv/**",
  "tests/fixtures/**",
]

[default.extend-words]
# "intoto" is the in-toto provenance framework name (https://in-toto.io/),
# used in the .intoto.jsonl release-asset sidecar suffix required by
# OSSF Scorecard's releasesHaveProvenance probe.
intoto = "intoto"
