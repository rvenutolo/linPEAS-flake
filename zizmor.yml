rules:
  # workflow_run trigger in dockerhub-sync.yml is
  # intentional and safe. We trigger on release-on-bump (a trusted, repo-owned
  # workflow), the sync job is gated to completed-successfully, and the job has
  # only `permissions: contents: read`. There is no pull_request context and no
  # contents: write surface, so the privilege-escalation attack zizmor warns
  # about is not present here.
  #
  # workflow_run in renovate-flake-lock-refresh.yml is also intentional. The
  # `identify` job gates on the Renovate App author identity via
  # scripts/classify-renovate-pr-author.sh, which accepts only the spellings
  # GitHub reports for that App and rejects a login that merely contains
  # `renovate`. Fork PRs and write-access users cannot produce them. `compute-refresh` runs Nix in `contents:
  # read` mode without the App key (`nix flake update <input>` only
  # re-resolves an input URL → SHA; it does not evaluate flake outputs, so
  # malicious code in flake.nix does not execute here). The App key lands
  # only in `push-refresh`, which performs a REST PUT to flake.lock and
  # nothing else.
  dangerous-triggers:
    ignore:
      - dockerhub-sync.yml
      - renovate-flake-lock-refresh.yml

  # `self-repository` asks that a local composite action be reached
  # through the `$/` self-repository form rather than the path-relative
  # `uses: ./...`, so it resolves at the running commit instead of out
  # of the checked-out working tree. The concern is a job that checks
  # out a ref it does not control and then runs an action from it.
  #
  # The form is not adoptable here: no released `actionlint` parses
  # `$/`, and `actionlint` runs as a blocking hook, so converting these
  # call sites trades this audit for a hard parse error on every one of
  # them. The suppression lifts when `actionlint` ships support.
  #
  # In every listed workflow but one, the checkout is the workflow's own
  # commit, which makes `./` and `$/` resolve to the same tree. The
  # exception is `compute-refresh` in renovate-flake-lock-refresh.yml,
  # which checks out a Renovate branch head before `uses: ./`. That job
  # holds `contents: read`, carries no App key, checks out with
  # `persist-credentials: false`, and runs under a blocking egress
  # allowlist, so what a modified composite could reach there is bounded
  # — but it is the one site where the two forms differ, and the
  # SHA-pinned self-reference pages.yml already uses is the fix that
  # does not wait on `actionlint`.
  self-repository:
    ignore:
      - allowed-actions-api-drift-check.yml
      - ci.yml
      - codeql.yml
      - cron-table-drift-check.yml
      - dockerhub-sync.yml
      - flake-lock-staleness-check.yml
      - image-cve-scan.yml
      - octoscan.yml
      - pages.yml
      - pr-title-lint.yml
      - ratchet-pin-audit.yml
      - release-on-bump.yml
      - renovate-flake-lock-refresh.yml
      - reproducibility-check.yml
      - scorecard-drift-check.yml
      - settings-posture-drift-check.yml
      - stale-pin-check.yml
      - update-flake-lock.yml
      - update-linpeas.yml
      - verify-latest-release.yml
      - zizmor-drift-check.yml
