site_name: linPEAS-flake
site_description: Nix-flake wrapper around peass-ng/PEASS-ng linpeas.sh
site_url: https://rvenutolo.github.io/linPEAS-flake/
repo_url: https://github.com/rvenutolo/linPEAS-flake
repo_name: rvenutolo/linPEAS-flake
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  custom_dir: docs/overrides
  favicon: assets/favicon.svg
  logo: assets/favicon.svg
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/extra.css

plugins:
  - search
  - macros:
      module_name: docs/_data/macros
      include_yaml:
        - dashboard: docs/_data/dashboard.yml

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Invariants: invariant-index.md
  - Install:
      - Nix: install/nix.md
      - Docker: install/docker.md
      - Consume as flake input: install/consume-from-flake.md
  - Dashboard: dashboard.md
  - Architecture:
      - Auto-update: architecture/auto-update.md
      - CI: architecture/ci.md
      - CI DAG: architecture/ci-dag.md
      - Flake-input bumps: architecture/flake-input-bumps.md
      - Pin convention: architecture/pin-convention.md
  - Development:
      - Git workflow: development/git.md
      - Linting & formatting: development/linting.md
      - Labeling: development/labeling.md
      - Cache cleanup: development/cache-cleanup.md
      - Changelog: development/changelog.md
  - Reference:
      - Flake outputs: reference/flake-outputs.md
      - Just recipes: reference/just-recipes.md
      - Scripts: reference/scripts.md
      - Treefmt config: reference/treefmt-config.md
  - Runbooks:
      - actionlint embedded linters: actionlint-embedded-linters.md
      - Docker Hub recovery: runbooks/dockerhub-recovery.md
      - Ratchet pin audit: runbooks/ratchet-pin-audit.md
      - Reproducibility check: runbooks/reproducibility-check.md
      - Scorecard PAT rotation: runbooks/scorecard-pat-rotation.md
      - Scorecard signed-releases backfill: runbooks/scorecard-signed-releases-backfill.md
      - Settings-drift App: runbooks/settings-drift-app.md
  - Security:
      - Repository configuration: security/repo-config.md
      - Allowed actions: security/allowed-actions.md
      - Enforcement matrix: security/enforcement-matrix.md
      - Minimum permissions: security/min-permissions.md
      - Required checks: security/required-checks.md
      - Settings posture: security/settings-posture.md
      - Trust model: security/trust-model.md
      - Threat model: security/threat-model.md
      - Verification: security/verification.md
      - Workflow hardening: security/workflow-hardening.md
      - Workflow scanners: security/workflow-scanners.md
  - Releases: releases.md
