name: setup-nix
description: "Install Nix with authenticated GitHub access-tokens so flake-input tarball fetches don't hit the 60/hour unauthenticated rate limit."

# WHY this composite exists:
# `cachix/install-nix-action` defaults to unauthenticated tarball fetches
# (`api.github.com/repos/<o>/<r>/tarball/<sha>`). GitHub caps unauthenticated
# requests at 60/hour per source IP. GitHub Actions runner IP pools share
# that budget across many concurrent jobs; once exhausted, the API returns
# 401 ("Bad credentials"). Passing `access-tokens = github.com=<token>`
# raises the limit to ~1000/hour and eliminates the recurring 401s.

inputs:
  github-token:
    description: "GitHub token used by Nix for `access-tokens = github.com=...`. Pass `secrets.GITHUB_TOKEN` from the caller."
    required: true
  install-url:
    description: "Nix installer URL. Defaults to the pinned NixOS release; matrix callers override with `matrix.nix-install-url`."
    required: false
    # datasource=github-tags, not github-releases: NixOS/nix publishes
    # tags only and zero GitHub releases, so a releases lookup resolves
    # to an empty set and the pin below never moves. Every tag is plain
    # MAJOR.MINOR.PATCH, so no versioning template is needed.
    default: "https://releases.nixos.org/nix/nix-2.34.7/install" # renovate: datasource=github-tags depName=nix packageName=NixOS/nix
  extra-nix-config:
    description: "Additional lines appended to nix.conf beyond the baseline (experimental-features, access-tokens)."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Wait for egress DNS to settle
      # harden-runner block mode restarts systemd-resolved at job start; the
      # brief resolver gap can race the first Nix substituter fetch. Wait for
      # cache.nixos.org to resolve so the installer and substituter fetches
      # don't fail on a first run that a manual re-run would clear.
      #
      # `host` is used rather than `getent`: `host` is the portable resolver
      # probe available across the runner images this action targets,
      # whereas `getent` availability varies by libc implementation.
      #
      # A timeout here is a WARNING, not a failure. This probe is a race
      # mitigation, not a correctness gate — if the resolver is still cold, the
      # substituter retry settings below (download-attempts, connect-timeout,
      # stalled-download-timeout) absorb it. Hard-failing here would convert a
      # slow resolver into a red build.
      shell: bash
      run: |
        set -Eeuo pipefail
        # A failing probe is the expected state while the resolver is cold, so
        # the lookup is deliberately run as an `if` condition: a condition's
        # exit status is consumed by the branch and never trips `-e`, leaving
        # the loop free to retry. Keep the probe in a condition — a bare
        # `host ...` line would abort the step on the first cold lookup.
        for _ in $(seq 1 30); do
          if host cache.nixos.org >/dev/null 2>&1; then
            exit 0
          fi
          sleep 1
        done
        echo '::warning::cache.nixos.org did not resolve within 30s; proceeding and relying on nix download retries' >&2
        # Exhausting the retries is a warning, not a failure; say so explicitly
        # rather than inheriting the exit status of the preceding echo.
        exit 0
    - uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31 # patch-tag-exception: pinned SHA is the v31 annotated-tag object, not a release commit; cachix publishes only floating major tags (v31 retargets across patches) so there is no immutable patch tag to ratchet to
      with:
        install_url: ${{ inputs.install-url }}
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ inputs.github-token }}
          # Substituter resilience. cache.nixos.org intermittently returns
          # HTTP 416 on resumed NAR ranges or rate-limits under burst load;
          # nix defaults of zero retries + short timeouts
          # convert these transient blips into red CI jobs that re-run clean.
          download-attempts = 5
          connect-timeout = 15
          stalled-download-timeout = 30
          ${{ inputs.extra-nix-config }}
