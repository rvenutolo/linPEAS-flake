name: setup-nix
description: "Install Determinate Nix with authenticated GitHub access-tokens so flake-input tarball fetches don't hit the 60/hour unauthenticated rate limit."

# WHY this composite exists:
# Nix fetches flake-input tarballs from api.github.com. GitHub caps
# unauthenticated requests at 60/hour per source IP, shared across the
# runner IP pool; once exhausted the API returns 401 ("Bad credentials").
# determinate-nix-action injects `access-tokens = github.com=<github-token>`
# automatically when `github-token` is set, raising the limit to ~1000/hour
# and eliminating the recurring 401s. Determinate Nix also evaluates flakes
# with lazy-trees, avoiding the eager copy of flake source trees into the
# store that dominates cold flake eval.
#
# Flakehub-cache is intentionally NOT bundled here: callers that need fresh
# fetches (`update-flake-lock`, `renovate-flake-lock-refresh`) must omit it.
# Callers add `DeterminateSystems/flakehub-cache-action` explicitly when wanted.

inputs:
  github-token:
    description: "GitHub token used by Nix for `access-tokens = github.com=...`. Pass `secrets.GITHUB_TOKEN` from the caller."
    required: true
  extra-nix-config:
    description: "Additional lines appended to nix.conf beyond the baseline (experimental-features, lazy-trees, download resilience)."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: DeterminateSystems/determinate-nix-action@9adf02b41cfdac2632e1c16f0480ff5bf3b05dd6 # v3.21.1
      with:
        github-token: ${{ inputs.github-token }}
        extra-conf: |
          extra-experimental-features = nix-command flakes
          lazy-trees = true
          # Substituter resilience. cache.nixos.org and flakehub-cache
          # intermittently return HTTP 416 on resumed NAR ranges or rate-limit
          # under burst load; nix defaults of zero retries + short timeouts
          # convert these transient blips into red CI jobs that re-run clean.
          download-attempts = 5
          connect-timeout = 15
          stalled-download-timeout = 30
          ${{ inputs.extra-nix-config }}
