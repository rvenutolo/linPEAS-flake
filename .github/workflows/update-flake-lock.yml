name: update-flake-lock

on:
  schedule:
    - cron: "0 5 * * 5" # Friday 05:00 UTC (leads the weekly window so the auto-merge PR's CI runs inside it)
  workflow_dispatch:

permissions: {}

# Docs this repo generates from evaluated flake state: a lock bump can
# make them stale without touching any other tracked file, so the bumper
# regenerates them alongside the lock it writes. The set is asserted
# against the freshness hooks that declare `flake.lock` a trigger by
# scripts/check-lock-derived-docs.sh.
env:
  LOCK_DERIVED_GENERATORS: |
    scripts/refresh-flake-show.sh
    scripts/refresh-treefmt-config.sh
  # Every path push-and-merge is allowed to commit. compute-lock holds no
  # write credential, so this list — not the artifact it uploads — is what
  # bounds the file set a bump PR can carry.
  COMMITTABLE_PATHS: |
    flake.lock
    docs/reference/flake-outputs.md
    docs/reference/treefmt-config.md

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

jobs:
  # This job runs untrusted Nix-evaluating actions with
  # ZERO write credentials. `BUMP_APP_PRIVATE_KEY` is not present in env
  # or on disk here. Mirrors the credential split in update-linpeas.yml.
  compute-lock:
    if: github.repository == 'rvenutolo/linPEAS-flake'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # TODO: restore egress-policy block once block mode stops dropping allowed hosts on
          # westus2 runners: https://github.com/step-security/harden-runner/issues/708
          egress-policy: audit
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            api.github.com:443
            cache.nixos.org:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            releases.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository]
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: update flake.lock in-place
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          cp flake.lock flake.lock.before
          # --commit-lock-file=false is unsupported on nix 2.34.x; use plain
          # update which always writes flake.lock (commit happens in push-and-merge).
          nix flake update

      - name: detect change
        id: diff
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          if cmp --silent flake.lock flake.lock.before; then
            printf 'changed=false\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'changed=true\n' >> "${GITHUB_OUTPUT}"
          fi

      - name: regenerate lock-derived docs
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          while IFS= read -r gen; do
            [[ -n "${gen}" ]] || continue
            printf 'running %s\n' "${gen}"
            nix develop --command bash "${gen}"
          done <<< "${LOCK_DERIVED_GENERATORS}"

      - name: assert writes stay inside the committable set
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          allowed="$(mktemp)"
          changed="$(mktemp)"
          trap 'rm --force -- "${allowed}" "${changed}"' EXIT
          printf '%s' "${COMMITTABLE_PATHS}" | grep --invert-match '^$' | sort > "${allowed}"
          # Captured to a file rather than piped or process-substituted in:
          # a redirection from a substitution runs the producer in its own
          # subshell, so a `git diff` that failed would hand the loop empty
          # output to score as "nothing written outside the allowlist" —
          # the one answer this assertion must never give for free.
          git diff --name-only > "${changed}"
          status=0
          while IFS= read -r path; do
            [[ -n "${path}" ]] || continue
            if ! grep --quiet --line-regexp --fixed-strings -- "${path}" "${allowed}"; then
              printf 'generator wrote %s, which is not in COMMITTABLE_PATHS\n' "${path}" >&2
              status=1
            fi
          done < "${changed}"
          exit "${status}"

      # The path list is written out rather than read from `env` because
      # octoscan flags any `env.*` expression in a `with:` value;
      # scripts/check-lock-derived-docs.sh requires it to equal
      # COMMITTABLE_PATHS as a set.
      - name: upload lock artifact
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-lock-result
          path: |
            flake.lock
            docs/reference/flake-outputs.md
            docs/reference/treefmt-config.md
          retention-days: 1
          if-no-files-found: error

  # Bump credentials live here only. The job authenticates
  # to the GitHub API as the `linpeas-flake-bumper` GitHub App via a
  # short-lived installation token minted by `actions/create-github-app-token`
  # (Client ID = `vars.BUMP_APP_CLIENT_ID`; private key =
  # `secrets.BUMP_APP_PRIVATE_KEY`).
  # Commits land on the bump branch via REST `PUT /contents`, which
  # GitHub web-flow-signs when the request is authenticated by an App
  # installation token. No `git push` happens.
  push-and-merge:
    needs: compute-lock
    if: needs.compute-lock.outputs.changed == 'true' && github.repository == 'rvenutolo/linPEAS-flake'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # TODO: restore egress-policy block once block mode stops dropping allowed hosts on
          # westus2 runners: https://github.com/step-security/harden-runner/issues/708
          egress-policy: audit
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
      # No checkout: nothing in this job reads the repository tree, and a
      # tree with `.git/` in it is somewhere git could be pointed at. The
      # artifact goes to the runner's temp directory and is read by
      # absolute path.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flake-lock-result
          path: ${{ runner.temp }}/flake-lock-result

      # download-artifact's own path-traversal protection keeps entries
      # inside the target directory; this checks the target itself sits
      # outside the workspace, where the steps below run.
      - name: assert the artifact sits outside the workspace
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/flake-lock-result
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          workspace="$(realpath -- "${GITHUB_WORKSPACE}")"
          artifact="$(realpath -- "${ARTIFACT_DIR}")"
          if [[ "${artifact}/" == "${workspace}/"* ]]; then
            printf 'artifact directory %s is inside the workspace - aborting\n' "${artifact}" >&2
            exit 1
          fi

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.BUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}
          # Least-privilege scope: token only needs to write file contents
          # (PUT /contents for each path in COMMITTABLE_PATHS) and
          # open/merge the update PR. No other installation scopes are
          # needed.
          permission-contents: write
          permission-pull-requests: write

      - name: sanity-check artifact
        working-directory: ${{ runner.temp }}/flake-lock-result
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          # JSON shape check: flake.lock must be valid JSON with a "nodes" object.
          # Defense-in-depth vs a compromised compute-lock writing garbage.
          jq -e '.nodes | type == "object"' flake.lock >/dev/null
          # A generated doc that arrives without its managed-block markers
          # is garbage from a broken generator. Reject it before anything
          # is pushed, rather than committing a doc that the freshness
          # gate will then fail on inside the PR.
          for doc in docs/reference/flake-outputs.md docs/reference/treefmt-config.md; do
            if ! grep --quiet -- '<!-- BEGIN ' "${doc}"; then
              printf '%s has no managed-block BEGIN marker - aborting\n' "${doc}" >&2
              exit 1
            fi
            if ! grep --quiet -- '<!-- END ' "${doc}"; then
              printf '%s has no managed-block END marker - aborting\n' "${doc}" >&2
              exit 1
            fi
          done

      - name: open PR with signed commits via REST PUT /contents
        env:
          BUMP_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Pins gh's repository context, so an `{owner}`-style placeholder
          # in an endpoint resolves from this variable and never from
          # `git remote`.
          GH_REPO: ${{ github.repository }}
          # `gh pr create` and `gh pr merge` run git themselves (remote and
          # branch lookups) even with GH_REPO set. A GIT_DIR that does not
          # exist makes each of those calls fail without reading any
          # repository, wherever the step's working directory is.
          GIT_DIR: /nonexistent
          ARTIFACT_DIR: ${{ runner.temp }}/flake-lock-result
          REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'

          branch="chore/update-flake-lock-$(date -u +%Y%m%d)"
          api_header="X-GitHub-Api-Version: 2022-11-28"

          # Idempotency gate. The branch is date-based, so a same-UTC-day
          # re-run targets the same branch. `gh pr view` returns PRs in
          # any state, so inspect state explicitly before touching the ref.
          pr_state="$(gh pr view "${branch}" --json state --jq .state 2>/dev/null || true)"
          case "${pr_state}" in
          OPEN)
            # Reuse the existing PR. Its branch is rebuilt on main HEAD
            # below (strict required-status policy needs the branch
            # current) before auto-merge picks it up again.
            open_pr=true
            ;;
          CLOSED|MERGED)
            # PR already closed (declined) or merged (shipped). Recreating
            # would overwrite that outcome, so fail loudly and let notify
            # file an issue. The one exception is a PR this App closed
            # itself: GitHub closes a PR whose head is force-moved onto
            # its base, and no human decided anything, so the PR is
            # opened afresh.
            closed_by=""
            if [[ "${pr_state}" == CLOSED ]]; then
              # A failed lookup leaves closed_by empty, which aborts.
              pr_number="$(gh pr view "${branch}" --json number --jq .number 2>/dev/null || true)"
              if [[ "${pr_number}" =~ ^[0-9]+$ ]]; then
                # shellcheck disable=SC2016 # $owner etc. are GraphQL variables, bound below
                closed_by="$(gh api graphql \
                  --raw-field query='query($owner: String!, $name: String!, $number: Int!) {
                    repository(owner: $owner, name: $name) {
                      pullRequest(number: $number) {
                        timelineItems(itemTypes: CLOSED_EVENT, last: 1) {
                          nodes { ... on ClosedEvent { actor { __typename login } } }
                        }
                      }
                    }
                  }' \
                  --raw-field owner="${REPO%%/*}" \
                  --raw-field name="${REPO#*/}" \
                  --field number="${pr_number}" \
                  --jq '.data.repository.pullRequest.timelineItems.nodes[0].actor // {} | "\(.__typename)/\(.login)"' \
                  2>/dev/null)" || closed_by=""
              fi
            fi
            if [[ -n "${BUMP_APP_SLUG}" && "${closed_by}" == "Bot/${BUMP_APP_SLUG}" ]]; then
              printf 'PR for %s was closed by %s itself - opening a new one\n' "${branch}" "${BUMP_APP_SLUG}"
              open_pr=false
            else
              if [[ "${pr_state}" == CLOSED ]]; then
                printf 'PR for %s was closed by %s\n' "${branch}" "${closed_by:-unknown}" >&2
              fi
              printf 'PR for %s already in state %s - aborting\n' "${branch}" "${pr_state}" >&2
              exit 1
            fi
            ;;
          '')
            open_pr=false
            ;;
          *)
            printf 'unexpected PR state %q for %s\n' "${pr_state}" "${branch}" >&2
            exit 1
            ;;
          esac

          # Resolve main HEAD sha. Every base blob SHA below is read at
          # this commit, the one the work branch is created from, so each
          # PUT names the blob it replaces on that branch.
          base_sha="$(gh api "repos/${REPO}/git/refs/heads/main" \
            --jq .object.sha --header "${api_header}")"
          if [[ ! "${base_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'unexpected main HEAD sha %q - aborting\n' "${base_sha}" >&2
            exit 1
          fi

          # The git blob SHA the contents API reports, computed without
          # git: git run against the artifact would read a `.git/config`
          # and `.gitattributes` it carries, and a configured clean filter
          # would run as a command while GH_TOKEN is in the environment.
          # Only a regular file whose resolved path is exactly the
          # expected one is hashed, so a symlink anywhere on the path, which
          # would read and then commit content from outside the artifact,
          # aborts. Called inside `$(...)`, where errexit is off, so each
          # failure returns explicitly and the caller's assignment aborts.
          artifact="$(realpath -- "${ARTIFACT_DIR}")"
          function artifact_blob_sha() {
            local file="${artifact}/$1" size
            if [[ ! -f "${file}" || -L "${file}" ]] ||
              [[ "$(realpath -- "${file}")" != "${file}" ]]; then
              printf '%s is not a regular file in the artifact - aborting\n' "$1" >&2
              return 1
            fi
            size="$(stat --format=%s -- "${file}")" || return 1
            { printf 'blob %d\0' "${size}"; cat -- "${file}"; } | sha1sum | cut --delimiter=' ' --fields=1
          }

          # Two passes, so a refused path aborts the job before the work
          # branch exists and before any PUT: a half-pushed bump is the
          # worse outcome. Pass one compares each committable path with its
          # blob on main and keeps the ones that differ.
          to_commit=()
          to_sha=()
          while IFS= read -r path; do
            [[ -n "${path}" ]] || continue
            if [[ ! -e "${artifact}/${path}" ]]; then
              printf '%s is missing from the artifact - aborting\n' "${path}" >&2
              exit 1
            fi
            local_sha="$(artifact_blob_sha "${path}")"
            main_sha="$(gh api "repos/${REPO}/contents/${path}?ref=${base_sha}" \
              --jq .sha --header "${api_header}")"
            if [[ "${local_sha}" == "${main_sha}" ]]; then
              if [[ "${path}" == 'flake.lock' ]]; then
                printf 'artifact flake.lock is identical to main - aborting\n' >&2
                exit 1
              fi
              printf 'skipping %s: identical to main\n' "${path}"
              continue
            fi
            to_commit+=("${path}")
            to_sha+=("${main_sha}")
          done <<< "${COMMITTABLE_PATHS}"

          # The commits are written to work_branch, created fresh from
          # main HEAD. For a new PR that is the PR branch itself. An open
          # PR has to be rebased onto main HEAD, because protect-main sets
          # strict_required_status_checks_policy: true and a PR cannot
          # merge while behind. Its branch must never point at main HEAD
          # itself: GitHub closes a PR the moment its head has no commits
          # beyond its base. So the commits go to a staging branch, and
          # the PR branch then moves straight to the finished tip.
          if [[ "${open_pr}" == true ]]; then
            work_branch="${branch}-staging"
          else
            work_branch="${branch}"
          fi

          # Delete a stale work_branch ref if a prior failed run left one
          # behind. Safe: the PR-state gate above already rejected every
          # case where a PR a human closed, or a merged PR, references
          # the PR branch, and nothing references the staging branch.
          if gh api "repos/${REPO}/git/refs/heads/${work_branch}" \
            --header "${api_header}" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${REPO}/git/refs/heads/${work_branch}" \
              --header "${api_header}"
          fi
          gh api --method POST "repos/${REPO}/git/refs" \
            --field ref="refs/heads/${work_branch}" \
            --field sha="${base_sha}" \
            --header "${api_header}" >/dev/null

          # One signed commit per changed path. Each PUT names the file's
          # blob SHA at base_sha: the commits touch disjoint paths, so an
          # earlier commit in this loop never invalidates a later file's
          # base SHA. flake.lock goes first, so a partial failure leaves
          # the lock without its docs — which the freshness gate then
          # reports — rather than docs describing an absent lock.
          for i in "${!to_commit[@]}"; do
            path="${to_commit[i]}"
            # The lock's own commit keeps the PR title's wording so the PR
            # and its first commit agree.
            msg="chore: update ${path} for flake.lock bump"
            if [[ "${path}" == 'flake.lock' ]]; then
              msg='chore: update flake.lock'
            fi
            content_b64="$(base64 --wrap=0 -- "${artifact}/${path}")"
            tip_sha="$(gh api --method PUT "repos/${REPO}/contents/${path}" \
              --field message="${msg}" \
              --field content="${content_b64}" \
              --field sha="${to_sha[i]}" \
              --field branch="${work_branch}" \
              --jq .commit.sha \
              --header "${api_header}")"
            printf 'committed %s\n' "${path}"
          done

          if [[ "${open_pr}" == true ]]; then
            printf 'rebasing open PR for %s onto main HEAD %s (new tip %s)\n' \
              "${branch}" "${base_sha}" "${tip_sha}"
            gh api --method PATCH "repos/${REPO}/git/refs/heads/${branch}" \
              --raw-field sha="${tip_sha}" \
              --field force=true \
              --header "${api_header}" >/dev/null
            gh api --method DELETE "repos/${REPO}/git/refs/heads/${work_branch}" \
              --header "${api_header}"
          fi

          if [[ "${open_pr}" == false ]]; then
            body="$(mktemp)"
            trap 'rm --force -- "${body}"' EXIT
            printf 'Auto-generated weekly flake.lock update.\n' > "${body}"
            # Merge by URL: a recovered branch also carries the closed
            # PR, so the branch name alone is ambiguous.
            pr_ref="$(gh pr create \
              --base main \
              --head "${branch}" \
              --title "chore: update flake.lock" \
              --label dependencies \
              --body-file "${body}")"
          else
            pr_ref="${branch}"
          fi

          gh pr merge "${pr_ref}" --auto --merge

  notify:
    name: notify
    needs: [compute-lock, push-and-merge]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      issues: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # TODO: restore egress-policy block once block mode stops dropping allowed hosts on
          # westus2 runners: https://github.com/step-security/harden-runner/issues/708
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/notify-workflow-result # zizmor: ignore[self-repository]
        with:
          result: ${{ needs.push-and-merge.result == 'skipped' && needs.compute-lock.result || needs.push-and-merge.result }}
          label: update-flake-lock-failure
          title: "update-flake-lock: weekly bump failed"
          body: |
            The weekly `update-flake-lock` cron failed.

            - Trigger: `${{ github.event_name }}`
            - compute-lock conclusion: `${{ needs.compute-lock.result }}`
            - push-and-merge conclusion: `${{ needs.push-and-merge.result }}`

            Investigate the failing job's logs. Common causes:
            - `BUMP_APP_PRIVATE_KEY` invalid or App uninstalled (affects push-and-merge only)
            - `nixpkgs` input fetch failure (affects compute-lock)
            - Sanity-check rejected artifact (flake.lock garbage from compute-lock)
          label-description: update-flake-lock workflow failure
          github-token: ${{ secrets.GITHUB_TOKEN }}
