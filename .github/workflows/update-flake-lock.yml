name: update-flake-lock

on:
  schedule:
    - cron: "0 6 * * 5" # Friday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # DeterminateSystems/update-flake-lock commits + pushes branch
      pull-requests: write # action creates/updates PR
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (D2)
        with:
          # DeterminateSystems/update-flake-lock receives the token via its
          # own `token:` input below; the checkout itself doesn't need a
          # persisted credential for any later `git push`.
          persist-credentials: false
          token: ${{ secrets.BUMP_PAT }}

      - uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31 (D2)
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install # renovate: datasource=github-releases depName=nix packageName=NixOS/nix
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28 (D2)
        id: lock
        with:
          token: ${{ secrets.BUMP_PAT }}
          pr-title: "chore: update flake.lock"
          pr-labels: dependencies
          commit-msg: "chore: update flake.lock"

      - name: enable auto-merge
        if: steps.lock.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.BUMP_PAT }}
          PR: ${{ steps.lock.outputs.pull-request-number }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          gh pr merge "${PR}" --auto --squash

  notify:
    name: notify
    needs: update
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (D2)
        with:
          persist-credentials: false
      - uses: ./.github/actions/notify-workflow-result
        with:
          result: ${{ needs.update.result }}
          label: update-flake-lock-failure
          title: "update-flake-lock: weekly bump failed"
          body: |
            The weekly `update-flake-lock` cron failed.

            - Trigger: `${{ github.event_name }}`
            - Update conclusion: `${{ needs.update.result }}`

            Investigate the `update` job logs. Common causes:
            - `BUMP_PAT` expired
            - `nixpkgs` input fetch failure
            - DeterminateSystems action upstream regression
          label-description: update-flake-lock workflow failure
          github-token: ${{ secrets.GITHUB_TOKEN }}
