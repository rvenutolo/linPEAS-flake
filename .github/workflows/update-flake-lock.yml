name: update-flake-lock

on:
  schedule:
    - cron: "0 6 * * 5" # Friday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

jobs:
  # P3.2 / GAP-8: this job runs untrusted Nix-evaluating actions with
  # ZERO write credentials. `BUMP_APP_PRIVATE_KEY` is not present in env
  # or on disk here. Mirrors update-linpeas.yml's AU-P-1 split.
  compute-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3 (D2)
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (D2)
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31 (D2)
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install # renovate: datasource=github-releases depName=nix packageName=NixOS/nix
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: update flake.lock in-place
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          cp flake.lock flake.lock.before
          # --commit-lock-file=false is unsupported on nix 2.34.x; use plain
          # update which always writes flake.lock (commit happens in push-and-merge).
          nix flake update

      - name: detect change
        id: diff
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          if cmp --silent flake.lock flake.lock.before; then
            printf 'changed=false\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'changed=true\n' >> "${GITHUB_OUTPUT}"
          fi

      - name: upload lock artifact
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (D2)
        with:
          name: flake-lock-result
          path: flake.lock
          retention-days: 1
          if-no-files-found: error

  # P3.2 / GAP-8: bump credentials live here only. The job authenticates
  # to the GitHub API as the `linpeas-flake-bumper` GitHub App via a
  # short-lived installation token minted by `actions/create-github-app-token`
  # (Client ID = `vars.BUMP_APP_CLIENT_ID`; private key =
  # `secrets.BUMP_APP_PRIVATE_KEY`).
  # Commits land on the bump branch via REST `PUT /contents`, which
  # GitHub web-flow-signs when the request is authenticated by an App
  # installation token. No `git push` happens.
  push-and-merge:
    needs: compute-lock
    if: needs.compute-lock.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3 (D2)
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (D2)
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8 (D2)
        with:
          name: flake-lock-result

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0 (D1)
        id: app-token
        with:
          client-id: ${{ vars.BUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}

      - name: sanity-check artifact
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          if git diff --quiet flake.lock; then
            printf 'artifact produced no diff in flake.lock - aborting\n' >&2
            exit 1
          fi
          # JSON shape check: flake.lock must be valid JSON with a "nodes" object.
          # Defense-in-depth vs a compromised compute-lock writing garbage.
          jq -e '.nodes | type == "object"' flake.lock >/dev/null

      - name: open PR with signed commit via REST PUT /contents
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'

          branch="chore/update-flake-lock-$(date -u +%Y%m%d)"
          api_header="X-GitHub-Api-Version: 2022-11-28"

          # Resolve main HEAD sha + flake.lock blob sha on main.
          base_sha="$(gh api "repos/${REPO}/git/refs/heads/main" \
            --jq .object.sha --header "${api_header}")"
          lock_blob_sha="$(git rev-parse "origin/main:flake.lock")"

          # Delete stale branch ref if a prior failed run left one behind.
          if gh api "repos/${REPO}/git/refs/heads/${branch}" \
               --header "${api_header}" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${REPO}/git/refs/heads/${branch}" \
              --header "${api_header}"
          fi

          # Create branch ref from main HEAD.
          gh api --method POST "repos/${REPO}/git/refs" \
            --field ref="refs/heads/${branch}" \
            --field sha="${base_sha}" \
            --header "${api_header}" >/dev/null

          # Commit: flake.lock. Web-flow signs this commit.
          lock_b64="$(base64 --wrap=0 flake.lock)"
          gh api --method PUT "repos/${REPO}/contents/flake.lock" \
            --field message="chore: update flake.lock" \
            --field content="${lock_b64}" \
            --field sha="${lock_blob_sha}" \
            --field branch="${branch}" \
            --header "${api_header}" >/dev/null

          # Open PR only if one does not already exist for this branch.
          if ! gh pr view "${branch}" >/dev/null 2>&1; then
            body="$(mktemp)"
            trap 'rm --force -- "${body}"' EXIT
            printf 'Auto-generated weekly flake.lock update.\n' > "${body}"
            gh pr create \
              --base main \
              --head "${branch}" \
              --title "chore: update flake.lock" \
              --label dependencies \
              --body-file "${body}"
          fi

          gh pr merge "${branch}" --auto --merge

  notify:
    name: notify
    needs: [compute-lock, push-and-merge]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3 (D2)
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (D2)
        with:
          persist-credentials: false
      - uses: ./.github/actions/notify-workflow-result
        with:
          result: ${{ needs.push-and-merge.result == 'skipped' && needs.compute-lock.result || needs.push-and-merge.result }}
          label: update-flake-lock-failure
          title: "update-flake-lock: weekly bump failed"
          body: |
            The weekly `update-flake-lock` cron failed.

            - Trigger: `${{ github.event_name }}`
            - compute-lock conclusion: `${{ needs.compute-lock.result }}`
            - push-and-merge conclusion: `${{ needs.push-and-merge.result }}`

            Investigate the failing job's logs. Common causes:
            - `BUMP_APP_PRIVATE_KEY` invalid or App uninstalled (affects push-and-merge only)
            - `nixpkgs` input fetch failure (affects compute-lock)
            - Sanity-check rejected artifact (flake.lock garbage from compute-lock)
          label-description: update-flake-lock workflow failure
          github-token: ${{ secrets.GITHUB_TOKEN }}
