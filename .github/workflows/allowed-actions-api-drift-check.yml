name: allowed-actions-api-drift-check

# Asserts the live `actions.permissions.allowed_actions` API state
# (selected-actions list, github_owned_allowed flag, verified_allowed
# flag) matches the canonical allowlist in
# `docs/security/allowed-actions.md`.
#
# Workflow-YAML linting (scripts/check-uses-sha-pinned.sh) catches new
# `uses:` strings but cannot see an API-level vendor expansion until a
# workflow happens to call the newly-allowed vendor. This watchdog
# closes that gap.
#
# Schedule + dispatch only — the /actions/permissions/selected-actions
# endpoint requires admin scope, which github.token never receives.
# Auth is via the same read-only `settings-drift-checker` GitHub App
# used by settings-posture-drift-check (Administration:Read,
# Metadata:Read). See docs/runbooks/settings-drift-app.md.

on:
  schedule:
    - cron: "35 9 * * *" # daily 09:35 UTC (after settings-posture-drift-check in the drift-check cluster)
  workflow_dispatch:

permissions: {}

concurrency:
  group: allowed-actions-api-drift-check
  cancel-in-progress: false

jobs:
  drift-check:
    runs-on: ubuntu-latest
    if: github.repository == 'rvenutolo/linPEAS-flake'
    # Budget covers the flakehub-cache-action post-step retrying uploads
    # against a degraded cache service, not just the check itself.
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      result: ${{ steps.probe.outcome }}
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            cache.nixos.org:443
            codeload.github.com:443
            github.com:443
            install.determinate.systems:443
            objects.githubusercontent.com:443
            releases.nixos.org:443
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/flakehub-cache-action@c01e819d047464c3edf6ba778f075952af5a3aa7 # v3.21.0
      - name: harness passes against fixtures
        run: nix develop --command bash tests/check-allowed-actions-api.test.sh

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.SETTINGS_DRIFT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SETTINGS_DRIFT_APP_PRIVATE_KEY }}
          # Least-privilege scope: read-only administration access to probe
          # allowed-actions API. No write permissions needed.
          permission-administration: read

      - name: probe live allowed-actions API matches doc
        id: probe
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: nix develop --command ./scripts/check-allowed-actions-api.sh

  notify:
    name: notify
    needs: drift-check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            api.github.com:443
            cache.nixos.org:443
            github.com:443
            objects.githubusercontent.com:443
            releases.nixos.org:443
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/notify-workflow-result
        with:
          # Raw job result: the composite files cancelled runs as
          # infrastructure failures and is inert on skipped.
          result: ${{ needs.drift-check.result }}
          label: allowed-actions-drift
          title: "allowed-actions-api-drift-check: live allowlist has drifted"
          body: |
            The daily `allowed-actions-api-drift-check` watchdog
            detected that the live `actions.permissions.allowed_actions`
            API state on `rvenutolo/linPEAS-flake` no longer matches
            the canonical allowlist in
            `docs/security/allowed-actions.md`.

            Drift modes:

            - `patterns_allowed drift: extra on API: <vendor>` — a
              vendor not in the doc is allowed live. Most often: a
              maintainer clicked "Approve" on an unlisted vendor in
              repo Settings → Actions. Either add the vendor to the
              doc (treat as a security review — why is it needed?)
              or remove it from the live state via the API call in
              the doc's "Adding a vendor" section.
            - `patterns_allowed drift: missing on API: <vendor>` —
              the doc declares a vendor but the live API does not.
              Most likely: someone removed the vendor live without
              updating the doc. Reconcile.
            - `github_owned_allowed drift` — `actions/*` and
              `github/*` should be implicit-allowed; flipping to
              false silently breaks every workflow using those.
            - `verified_allowed drift` — `verified_allowed` must
              stay false. `true` lets opaque "verified creator"
              vendors in without our involvement.

            See the failing job logs for the specific drift line(s).

            This issue auto-closes once the next watchdog run sees
            the allowlist reconciled.
          label-description: live allowed-actions API state drifted from doc
          github-token: ${{ secrets.GITHUB_TOKEN }}
