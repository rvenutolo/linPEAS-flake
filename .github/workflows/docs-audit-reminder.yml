name: docs-audit-reminder

# Monthly prompt to run the semantic docs audit.
#
# Freshness gates (*-fresh) validate only generated content. Nothing
# generates hand-written prose about CI, so a sentence naming a job that
# does not exist passes every freshness gate. check-prose-ci-names.sh fails
# some forms of such a name (a backticked name in claim position; its
# section in docs/security/workflow-hardening.md says which). For the forms
# that lint does not read, a reading agent is the only mechanism that
# catches that class. This workflow decides when running one is worth it, using CI churn
# as the proxy for prose drift.
#
# Non-zero drift pressure always exits 0: it never signals "audit due" by
# failing, because a workflow that goes red during normal CI churn trains
# the maintainer to ignore red. A genuine failure — the pressure script
# erroring, or a GitHub API call failing — does go red: that is a real
# problem, not a drift signal, and deserves attention on its own. An
# unreadable `.github/docs-audit-state` is one of those: pressure is
# measured from the commit it names, so without it there is no number to
# report rather than a number meaning zero drift.

on:
  schedule:
    - cron: "0 10 1 * *" # monthly, 1st 10:00 UTC (off the daily and weekly clusters)
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-audit-reminder-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pressure:
    # Fork guard: a fork's scheduled run has no business filing issues here.
    if: github.repository == 'rvenutolo/linPEAS-flake'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: pressure diffs against the commit recorded in
          # .github/docs-audit-state, which a shallow clone may not carry.
          fetch-depth: 0
          persist-credentials: false
      - name: compute drift pressure
        id: pressure
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          body_file="$(mktemp)"
          ./scripts/docs-audit-pressure.sh >"${body_file}"
          pressure="$(sed -n 's/^PRESSURE=//p' "${body_file}")"
          if [[ -z ${pressure} ]]; then
            printf 'pressure script emitted no PRESSURE line\n' >&2
            exit 1
          fi
          # The trailer is the machine-readable line this step reads; the
          # issue body a maintainer reads should end with the instruction.
          sed --in-place '/^PRESSURE=/d' "${body_file}"
          printf 'pressure=%s\n' "${pressure}" >>"${GITHUB_OUTPUT}"
          printf 'body_file=%s\n' "${body_file}" >>"${GITHUB_OUTPUT}"
      - name: open, update, or close the reminder issue
        env:
          GH_TOKEN: ${{ github.token }}
          PRESSURE: ${{ steps.pressure.outputs.pressure }}
          BODY_FILE: ${{ steps.pressure.outputs.body_file }}
          LABEL: docs-audit
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          existing="$(gh issue list --label "${LABEL}" --state open \
            --json number --jq '.[0].number // empty')"

          if [[ ${PRESSURE} -eq 0 ]]; then
            if [[ -n ${existing} ]]; then
              gh issue close "${existing}" \
                --comment 'No CI-structure churn since the last audit; closing until drift accrues.'
            fi
            printf 'no pressure; nothing to do\n'
            exit 0
          fi

          if [[ -n ${existing} ]]; then
            gh issue comment "${existing}" --body-file "${BODY_FILE}"
          else
            gh label create "${LABEL}" --color ededed \
              --description 'Docs correctness audit is due' 2>/dev/null || true
            gh issue create --label "${LABEL}" \
              --title 'docs-audit: CI churn since last audit — run /docs-audit' \
              --body-file "${BODY_FILE}"
          fi

  notify:
    name: notify
    needs: pressure
    if: always() && github.repository == 'rvenutolo/linPEAS-flake'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      issues: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/notify-workflow-result # zizmor: ignore[self-repository]
        with:
          # Raw job result: the composite files cancelled runs as
          # infrastructure failures and is inert on skipped. The label is
          # not `docs-audit`: a green run closes every open issue under
          # its label, and the reminder issue must outlive it.
          result: ${{ needs.pressure.result }}
          label: docs-audit-reminder-failure
          title: "docs-audit-reminder: drift pressure could not be measured"
          label-description: docs-audit-reminder could not measure CI drift pressure or update its issue
          body: |
            The monthly `docs-audit-reminder` workflow failed, so this
            month's docs-audit drift pressure was not reported. Drift
            pressure itself never fails the run: this is the pressure
            script erroring, a GitHub API call failing, or
            `.github/docs-audit-state` being unreadable.

            Run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            To resolve: read the failing step's log, fix the cause, and
            dispatch the workflow again
            (`gh workflow run docs-audit-reminder.yml`). This issue
            auto-closes on the next clean run.
          github-token: ${{ secrets.GITHUB_TOKEN }}
