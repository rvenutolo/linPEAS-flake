name: flake-lock-staleness-check

# Asserts every top-level flake input was refreshed recently enough that
# the mechanism responsible for refreshing it is demonstrably still
# running.
#
# Two things refresh this repo's inputs — the weekly
# `update-flake-lock.yml` cron and Renovate — and neither announces
# having stopped. A disabled workflow, a broken trigger, or a manager
# that stops opening PRs leaves the inputs the affected mechanism
# refreshes frozen while every check stays green. The latter two — a
# broken trigger and a manager that stops opening PRs — are live risks
# here, so the freeze is the thing worth watching rather than any single
# mechanism.
#
# Schedule + dispatch, deliberately NOT a required check. A gate keyed
# on wall-clock age turns every unrelated PR red the moment a cron runs
# late, which charges contributors for infrastructure lateness. The
# scheduled issue-filer is the same shape the other drift checks use.
#
# Thresholds and the reasoning behind their two tiers live in
# scripts/check-flake-lock-staleness.sh.
#
# On failure, opens a deduped `flake-lock-stale` issue. Auto-closes on
# the next clean run.

on:
  schedule:
    - cron: "45 9 * * *" # daily 09:45 UTC (closes the drift-check cluster, before the pages cron)
  workflow_dispatch:

permissions: {}

concurrency:
  group: flake-lock-staleness-check
  cancel-in-progress: false

jobs:
  staleness-check:
    runs-on: ubuntu-latest
    if: github.repository == 'rvenutolo/linPEAS-flake'
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      result: ${{ steps.probe.outcome }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            cache.nixos.org:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: harness passes against fixtures
        run: nix develop --command bash tests/check-flake-lock-staleness.test.sh
      - name: every top-level input is within its staleness bound
        id: probe
        run: nix develop --command ./scripts/check-flake-lock-staleness.sh

  notify:
    name: notify
    needs: staleness-check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/notify-workflow-result
        with:
          # Raw job result: the composite files cancelled runs as
          # infrastructure failures and is inert on skipped.
          result: ${{ needs.staleness-check.result }}
          label: flake-lock-stale
          title: "flake-lock-staleness-check: an input has stopped moving"
          body: |
            The daily `flake-lock-staleness-check` watchdog found a
            top-level `flake.lock` input whose `locked.lastModified` is
            older than the bound declared for it in
            `scripts/check-flake-lock-staleness.sh`.

            The failing job log names every input past its bound, its
            age, and the bound it exceeded.

            An input stops moving when the mechanism that refreshes it
            stops. Check, in this order:

            - `update-flake-lock.yml` — is the weekly cron still
              running, and are its PRs still merging? It floats every
              branch-tracked input.
            - The Renovate dependency dashboard — is a manager still
              opening PRs for `pre-commit-hooks`, the one rev-pinned
              input, and is Renovate itself still enabled?
            - `renovate-flake-lock-refresh.yml` — a Renovate PR that
              never gets its lockfile stays red and never merges.

            If the input is genuinely fine and the bound is simply too
            tight for its upstream cadence, move the threshold and say
            why in the same change — the bounds encode observed churn,
            not preference.

            This issue auto-closes once the next watchdog run sees every
            input within bounds.
          label-description: a flake.lock input has stopped being refreshed
          github-token: ${{ secrets.GITHUB_TOKEN }}
