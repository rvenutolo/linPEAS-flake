name: scorecard

# OpenSSF Scorecard weekly self-assessment. Surfaces a numeric grade
# across ~20 supply-chain hygiene checks (SHA-pinned actions, branch
# protection, signed releases, SAST coverage, dangerous workflows,
# token permissions, etc.). Results upload to the Security tab via
# SARIF and to <https://scorecard.dev> for the public badge.
#
# Not in branch protection's required-check set — a Scorecard outage
# (or a transient `publish_results` failure) must not block linpeas
# pin bumps. Failures surface via the badge going red and the standard
# email channel.

on:
  # `branch_protection_rule` fires on creation/edit/deletion of branch
  # protection rules. Scorecard grades branch protection posture, so
  # any change to those rules should re-evaluate the score promptly
  # rather than waiting for the weekly cron. Do not prune as "unused";
  # see SECURITY.md "Supply-chain posture monitoring" for context.
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to code-scanning
      id-token: write # publish to scorecard.dev via OIDC
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (D2)
        with:
          persist-credentials: false

      - name: run scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3 (D2)
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to scorecard.dev so the README badge stays fresh.
          # Public repos only; no token required.
          publish_results: true

      - name: upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (D2)
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@458d36d7d4f47d0dd16ca424c1d3cda0060f1360 # v3 (D2)
        with:
          sarif_file: results.sarif
