name: stale-pin-check

# Daily watchdog: catches the silent-regression case where
# `update-linpeas` runs green but the pin doesn't advance for an
# extended window (network blip, API quota, GitHub App installation
# revoked, etc.). The cron itself can't see "we stopped bumping"
# because it would need to run AFTER `update-linpeas` and correlate
# state.
#
# Logic: read the timestamp prefix of `pin.version` (peass-ng tags use
# `YYYYMMDD-<sha>`). If we are >14d behind that date AND the upstream
# `peass-ng/PEASS-ng` latest tag is newer than the pinned one, the
# pin is considered stalled and a deduped `pin-stalled` issue opens.
#
# When the pin catches back up, the same composite auto-closes the
# stalled issue on the next green run.

on:
  schedule:
    - cron: "0 9 * * *" # daily 09:00 UTC (after update-linpeas has had time to open and merge a bump PR)
  workflow_dispatch:

permissions: {}

concurrency:
  group: stale-pin-check
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      result: ${{ steps.evaluate.outputs.result }}
      reason: ${{ steps.evaluate.outputs.reason }}
      pin_version: ${{ steps.evaluate.outputs.pin_version }}
      upstream_version: ${{ steps.evaluate.outputs.upstream_version }}
      pin_age_days: ${{ steps.evaluate.outputs.pin_age_days }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: evaluate pin freshness
        id: evaluate
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_DAYS: "14"
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'

          # Helper: emit `result=failure` plus a typed `reason=` to
          # $GITHUB_OUTPUT and exit 0 so the notify job can attribute the
          # failure correctly. Without explicit attribution, an upstream-API
          # rate-limit looks identical to a stall-detected event and the
          # auto-filed issue suggests irrelevant remediations (App
          # installation validity, asset-URL prefix).
          # @arg $1 reason token (pin-malformed | upstream-api-failure
          #         | upstream-tag-malformed | stall-detected)
          emit_failure() {
            local -r reason="$1"
            {
              printf 'result=failure\n'
              printf 'reason=%s\n' "${reason}"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          }

          pin_version="$(jq --raw-output .version linpeas-pin.json)"
          # Canonical pin shape, YYYYMMDD-<7..40 hex>: one copy of the
          # regex asserted in nix/linpeas.nix. Matching it here rejects a
          # malformed pin at the check rather than downstream. Every copy
          # is listed in docs/architecture/auto-update.md.
          if [[ ! "${pin_version}" =~ ^([0-9]{4})([0-9]{2})([0-9]{2})-[0-9a-f]{7,40}$ ]]; then
            printf 'pin version %q does not match expected format\n' "${pin_version}" >&2
            printf 'pin_version=%s\n' "${pin_version}" >> "${GITHUB_OUTPUT}"
            emit_failure pin-malformed
          fi
          pin_date="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}-${BASH_REMATCH[3]}"

          pin_epoch="$(date --utc --date "${pin_date}" +%s)"
          now_epoch="$(date --utc +%s)"
          age_days=$(( (now_epoch - pin_epoch) / 86400 ))

          {
            printf 'pin_version=%s\n' "${pin_version}"
            printf 'pin_age_days=%s\n' "${age_days}"
          } >> "${GITHUB_OUTPUT}"

          # Capture upstream call status separately so an API failure
          # (rate-limit, transient 5xx, empty body) is attributed as
          # `reason=upstream-api-failure` rather than `stall-detected` in
          # the auto-filed issue body. The `X-GitHub-Api-Version`
          # header is defense-in-depth, mirroring `scripts/bump-linpeas.sh`.
          upstream_version=""
          if ! upstream_version="$(
            gh api \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              repos/peass-ng/PEASS-ng/releases/latest --jq .tag_name
          )" || [[ -z "${upstream_version}" ]]; then
            printf 'upstream API call failed or returned empty tag_name\n' >&2
            emit_failure upstream-api-failure
          fi

          # Shape-validate the upstream tag before it reaches $GITHUB_OUTPUT
          # and the notify-composite issue body. Mirrors the pin_version
          # check above and the validate-then-use pattern in
          # bump-linpeas.sh. Prevents markdown injection in the auto-filed
          # issue body if upstream publishes a hostile tag.
          if [[ ! "${upstream_version}" =~ ^[0-9]{8}-[0-9a-f]{7,40}$ ]]; then
            printf 'upstream tag %q does not match expected format\n' "${upstream_version}" >&2
            emit_failure upstream-tag-malformed
          fi

          printf 'upstream_version=%s\n' "${upstream_version}" >> "${GITHUB_OUTPUT}"

          if [[ "${pin_version}" == "${upstream_version}" ]]; then
            printf 'pin matches upstream (%s); fresh\n' "${pin_version}"
            printf 'result=success\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if (( age_days <= STALE_DAYS )); then
            printf 'pin %s differs from upstream %s but is only %s days old; fresh\n' \
              "${pin_version}" "${upstream_version}" "${age_days}"
            printf 'result=success\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          printf 'pin %s is %s days old; upstream latest is %s; STALLED\n' \
            "${pin_version}" "${age_days}" "${upstream_version}" >&2
          emit_failure stall-detected

  notify:
    name: notify
    needs: check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/notify-workflow-result
        with:
          # If `check` itself errored (e.g. malformed pin, API rate-limit) we
          # treat that as a stall-equivalent: surface to the same channel.
          # Logical result computed by `check` wins; if the job died
          # before producing one, fall back to its raw result so the
          # composite files failed/cancelled runs and stays inert on
          # skipped.
          result: ${{ needs.check.outputs.result || needs.check.result }}
          label: pin-stalled
          title: "stale-pin-check: pin not advancing"
          body: |
            The daily `stale-pin-check` watchdog flagged a failure.

            - Reason: `${{ needs.check.outputs.reason || 'unknown' }}`
            - Pinned version: `${{ needs.check.outputs.pin_version }}`
            - Upstream latest: `${{ needs.check.outputs.upstream_version }}`
            - Pin age (days): `${{ needs.check.outputs.pin_age_days }}`

            Reason values and what they mean:

            - `stall-detected` — `update-linpeas` is reporting green runs but
              has not advanced the pin for over 14 days while upstream has moved.
              Investigate:
              - `update-linpeas.yml` recent run logs (action may be silently
                exiting 0 without bumping)
              - `linpeas-flake-bumper` GitHub App installation intact
                (`BUMP_APP_PRIVATE_KEY` not rotated, App not uninstalled)
              - Asset-URL prefix check rejecting upstream (peass-ng moved host)
              - Upstream `.digest` field absent (silent skip is supposed to
                hard-fail now; verify `bump-linpeas.sh`)
            - `upstream-api-failure` — the `gh api
              repos/peass-ng/PEASS-ng/releases/latest` call failed or returned
              empty. Likely a transient GitHub API issue or rate-limit
              (`github.token` authenticates at 5000/hr). The pin may or may
              not actually be stale — re-run the workflow before investigating
              the bump pipeline.
            - `upstream-tag-malformed` — upstream published a tag outside the
              canonical `YYYYMMDD-<hex>` shape. Check
              <https://github.com/peass-ng/PEASS-ng/releases/latest>; if
              upstream has switched versioning schemes, every file carrying
              the old regex has to move together — the current list is at
              <https://rvenutolo.github.io/linPEAS-flake/architecture/auto-update/#canonical-pin-shape>.
            - `pin-malformed` — local `linpeas-pin.json` has a malformed
              `.version` field. Inspect the file; likely a manual edit or a
              broken bump pipeline.
            - `unknown` — the check step exited non-zero without setting an
              output. Inspect the run log directly.

            This issue auto-closes once the next watchdog run sees a healthy
            pin within tolerance of the upstream latest tag.
          label-description: pin not advancing despite green update-linpeas runs
          github-token: ${{ secrets.GITHUB_TOKEN }}
