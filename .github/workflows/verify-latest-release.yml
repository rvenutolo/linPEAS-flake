name: verify-latest-release

on:
  schedule:
    - cron: "40 5 * * 5" # Friday 05:40 UTC (weekly post-publish tamper check; publish-time verification lives in release-on-bump)
  workflow_dispatch:

permissions: {}

concurrency:
  group: verify-latest-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
      packages: read
    outputs:
      # Failure-attribution token consumed by the `notify` job's body.
      # Mirrors the `reason=` pattern in `stale-pin-check.yml` — only
      # `upstream-sri-drift` warrants the "security incident" framing
      # in the auto-filed issue; the rest are operational.
      reason: ${{ steps.attribute.outputs.reason }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            api.github.com:443
            auth.docker.io:443
            cache.nixos.org:443
            codeload.github.com:443
            ghcr.io:443
            github.com:443
            index.docker.io:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            tarballs.nixos.org:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Nix installer is required for `nix shell .#cosign` in the
      # cosign verify-blob / verify steps below.
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: read latest release tag
        id: read-tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          tag="$(gh release view --repo rvenutolo/linPEAS-flake --json tagName --jq .tagName)"
          printf 'tag=%s\n' "${tag}" >> "${GITHUB_OUTPUT}"

      - name: download pin file from latest release
        id: download-assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.read-tag.outputs.tag }}
        # Scheduled cron — same release-asset visibility lag possible if the run
        # happens to fire moments after a release. Same poll-with-backoff.
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          for i in 1 2 3 4 5 6; do
            if gh release download "${TAG}" \
                --repo rvenutolo/linPEAS-flake \
                --pattern linpeas-pin.json \
                --clobber; then
              break
            fi
            printf 'assets not yet visible, retry %d/6\n' "${i}" >&2
            sleep 5
          done
          [[ -f linpeas-pin.json ]] \
            || { printf 'release assets never appeared\n' >&2; exit 1; }

      - name: verify ghcr per-arch attestations
        id: verify-ghcr
        # The release pipeline attaches per-arch attestations to the
        # `<tag>-amd64` / `<tag>-arm64` digests captured at push time, NOT
        # to the multi-arch manifest list digest that `docker pull <tag>`
        # resolves to. Use `docker manifest inspect` against the tag to
        # enumerate per-arch manifest digests directly, then verify each.
        # Verifying against the manifest list digest returns 404 because
        # `attest-build-provenance` never wrote an attestation for that
        # subject.
        #
        # Anonymous: `docker manifest inspect` and `gh attestation verify`
        # both work without docker login against public ghcr.io repos.
        # No registry credentials enter this verify path.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.read-tag.outputs.tag }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          for arch in amd64 arm64; do
            digest="$(docker manifest inspect "ghcr.io/rvenutolo/linpeas:${TAG}" \
              | jq --raw-output --arg arch "${arch}" \
                  '.manifests[] | select(.platform.architecture==$arch and .platform.os=="linux") | .digest')"
            if [[ "${digest}" != sha256:* ]]; then
              printf 'unexpected ghcr digest for %s: %s\n' "${arch}" "${digest}" >&2
              exit 1
            fi
            gh attestation verify "oci://ghcr.io/rvenutolo/linpeas@${digest}" \
              --repo rvenutolo/linPEAS-flake
          done

      - name: verify Docker Hub per-arch attestations
        id: verify-hub
        # Docker Hub is the only long-lived stealable-credential
        # registry in the release pipeline (DOCKERHUB_TOKEN_RW). A
        # Docker-Hub-only compromise — stolen token, registry incident,
        # accidental manual push — would replace published tags without
        # surfacing on this cron unless docker.io is verified alongside
        # ghcr. The block below mirrors the ghcr per-arch verification
        # against docker.io.
        #
        # Anonymous: `docker manifest inspect` against a public docker.io
        # repo + `gh attestation verify oci://docker.io/...` both resolve
        # without docker login. Dropping DOCKERHUB_TOKEN_RW from this
        # read-only path means a compromised step inside this verify job
        # cannot exfiltrate registry push credentials.
        #
        # Pull rate: `docker manifest inspect` does not count against the
        # anonymous pull quota; this loop is well within budget regardless.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.read-tag.outputs.tag }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          for arch in amd64 arm64; do
            digest="$(docker manifest inspect "docker.io/rvenutolo/linpeas:${TAG}" \
              | jq --raw-output --arg arch "${arch}" \
                  '.manifests[] | select(.platform.architecture==$arch and .platform.os=="linux") | .digest')"
            if [[ "${digest}" != sha256:* ]]; then
              printf 'unexpected docker hub digest for %s: %s\n' "${arch}" "${digest}" >&2
              exit 1
            fi
            gh attestation verify "oci://docker.io/rvenutolo/linpeas@${digest}" \
              --repo rvenutolo/linPEAS-flake
          done

      - name: verify :latest manifest matches :VERSION on both registries
        id: verify-latest-parity
        # Asserts that the floating `:latest` tag still resolves to the
        # same multi-arch manifest as the release-tagged `:VERSION` on
        # both ghcr.io and docker.io. The release-pipeline verify job
        # checks this at publish time; this cron is the only place the
        # parity is re-asserted after release. A registry-side `:latest`
        # repoint between releases (incident, account compromise,
        # accidental `docker tag` push) would otherwise persist
        # undetected for up to 24h until the next pin bump.
        #
        # Anonymous `docker buildx imagetools inspect --raw` works on
        # public repos for both registries — no auth required.
        env:
          TAG: ${{ steps.read-tag.outputs.tag }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          for reg in ghcr.io docker.io; do
            latest_raw="$(docker buildx imagetools inspect --raw \
              "${reg}/rvenutolo/linpeas:latest")"
            tagged_raw="$(docker buildx imagetools inspect --raw \
              "${reg}/rvenutolo/linpeas:${TAG}")"
            latest_norm="$(jq --sort-keys . <<<"${latest_raw}")"
            tagged_norm="$(jq --sort-keys . <<<"${tagged_raw}")"
            if [[ "${latest_norm}" != "${tagged_norm}" ]]; then
              printf '%s:latest manifest differs from %s:%s\n' \
                "${reg}" "${reg}" "${TAG}" >&2
              printf '%s:latest:\n%s\n' "${reg}" "${latest_norm}" >&2
              printf '%s:%s:\n%s\n' "${reg}" "${TAG}" "${tagged_norm}" >&2
              exit 1
            fi
            printf '%s: :latest matches :%s\n' "${reg}" "${TAG}"
          done

      - name: verify ghcr.io and docker.io serve the same manifest
        id: verify-cross-registry
        # Anchors the two registries to ONE content identity. Every other
        # check in this job proves "signed by us at some point": cosign
        # and attestation bind a signature to a digest, not to recency,
        # and `verify-latest-parity` compares tags only WITHIN a
        # registry. So an attacker holding a Docker Hub push credential
        # could retag an older release's still-signed digests onto
        # docker.io `:latest` and `:VERSION` — every check above passes
        # while docker.io serves a stale linPEAS to every `docker pull`.
        #
        # Both registries receive the same nix-built bytes, and each
        # index is assembled from content-addressed per-arch digests, so
        # the `:VERSION` index is byte-identical across registries by
        # construction. Comparing it here makes a one-sided rollback
        # fail. Index equality implies per-arch equality: the index
        # enumerates the per-arch digests.
        #
        # Residual: a simultaneous rollback of BOTH registries still
        # passes. That requires ghcr.io push — repo compromise — which is
        # outside this job's threat model; it exists to catch a
        # Docker-Hub-only compromise.
        #
        # Anonymous `docker buildx imagetools inspect --raw` works on
        # public repos for both registries — no auth required.
        env:
          TAG: ${{ steps.read-tag.outputs.tag }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          ghcr_raw="$(docker buildx imagetools inspect --raw \
            "ghcr.io/rvenutolo/linpeas:${TAG}")"
          hub_raw="$(docker buildx imagetools inspect --raw \
            "docker.io/rvenutolo/linpeas:${TAG}")"
          ghcr_norm="$(jq --sort-keys . <<<"${ghcr_raw}")"
          hub_norm="$(jq --sort-keys . <<<"${hub_raw}")"
          if [[ "${ghcr_norm}" != "${hub_norm}" ]]; then
            printf 'ghcr.io and docker.io disagree on :%s\n' "${TAG}" >&2
            printf 'ghcr.io:\n%s\n' "${ghcr_norm}" >&2
            printf 'docker.io:\n%s\n' "${hub_norm}" >&2
            exit 1
          fi
          printf 'ghcr.io and docker.io serve identical :%s manifests\n' "${TAG}"

      - name: cosign verify images (both registries, per-arch + index)
        id: verify-images-cosign
        # Re-uses the per-arch digests resolved by the earlier steps via
        # `docker manifest inspect`, plus the multi-arch index digest of
        # `:VERSION` on each registry. Every ref must carry a valid cosign
        # signature from this repo's release workflow identity; a missing,
        # invalid, or wrong-identity signature fails the run.
        env:
          COSIGN_IDENTITY: https://github.com/rvenutolo/linPEAS-flake/.github/workflows/release-on-bump.yml@refs/heads/main
          COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com
          TAG: ${{ steps.read-tag.outputs.tag }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          # Every published release is cosign-signed (signed at release
          # time; historic releases are kept signed by the backfill
          # runbook). So a signature that is missing, invalid, from the
          # wrong identity, or unverifiable is a real regression — it must
          # fail the run, never be swallowed as "pre-cosign". Each index
          # and per-arch digest is verified in the loop below; any failure
          # aborts the step under set -e.
          ghcr_index_digest="$(
            docker buildx imagetools inspect --raw \
              "ghcr.io/rvenutolo/linpeas:${TAG}" \
              | sha256sum \
              | awk '{print "sha256:" $1}'
          )"
          hub_index_digest="$(
            docker buildx imagetools inspect --raw \
              "docker.io/rvenutolo/linpeas:${TAG}" \
              | sha256sum \
              | awk '{print "sha256:" $1}'
          )"
          refs=(
            "ghcr.io/rvenutolo/linpeas@${ghcr_index_digest}"
            "docker.io/rvenutolo/linpeas@${hub_index_digest}"
          )
          for arch in amd64 arm64; do
            for reg in ghcr.io docker.io; do
              digest="$(docker manifest inspect "${reg}/rvenutolo/linpeas:${TAG}" \
                | jq --raw-output --arg arch "${arch}" \
                    '.manifests[] | select(.platform.architecture==$arch and .platform.os=="linux") | .digest')"
              refs+=("${reg}/rvenutolo/linpeas@${digest}")
            done
          done
          for ref in "${refs[@]}"; do
            nix shell .#cosign --command cosign verify \
              --certificate-identity "${COSIGN_IDENTITY}" \
              --certificate-oidc-issuer "${COSIGN_OIDC_ISSUER}" \
              "${ref}" > /dev/null
            printf 'cosign verified: %s\n' "${ref}"
          done

      - name: verify pin file attestation
        id: verify-pin
        # The pin file uploaded to the release is the same blob attested at
        # release-on-bump time. Re-verifying detects post-release tamper.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          gh attestation verify linpeas-pin.json --repo rvenutolo/linPEAS-flake

      - name: verify upstream linpeas.sh still matches pinned hash
        id: verify-upstream-sri
        # Detects upstream tag-replacement: re-fetch from peass-ng's release
        # URL and confirm the SRI hash still matches the pinned value. The
        # attestation steps above only prove *our* artifacts are untampered;
        # they cannot detect upstream replacing the asset after we pinned it.
        # Failure of this step is the canonical "treat as security incident"
        # signal; all other failures are operational.
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          url="$(jq --raw-output .url linpeas-pin.json)"
          expected_sri="$(jq --raw-output .hash linpeas-pin.json)"
          if [[ "${expected_sri}" != sha256-* ]]; then
            printf 'unsupported SRI algorithm in pin: %s\n' "${expected_sri}" >&2
            exit 1
          fi
          tmpfile="$(mktemp)"
          trap 'rm --force -- "${tmpfile:-}"' EXIT
          curl --disable --fail --silent --show-error --location \
            --output "${tmpfile}" "${url}"
          # openssl is pre-installed on ubuntu-latest; produces the binary
          # sha256 digest which we base64-encode to match Nix's SRI format.
          sha256_b64="$(openssl dgst -sha256 -binary "${tmpfile}" | base64 --wrap=0)"
          actual_sri="sha256-${sha256_b64}"
          if [[ "${actual_sri}" != "${expected_sri}" ]]; then
            printf 'upstream content drift: pin says %s, upstream now %s\n' \
              "${expected_sri}" "${actual_sri}" >&2
            exit 1
          fi
          printf 'upstream linpeas.sh matches pinned hash (%s)\n' "${expected_sri}"

      - name: cosign verify-blob linpeas-pin.json
        id: verify-blob-pin
        # Re-fetch both the pin asset and its `.sigstore` sidecar from
        # the release and verify the bundle against the pinned workflow
        # identity. Distinct from `verify-pin` (gh attestation verify)
        # above: that path checks the GitHub-Sigstore attestation; this
        # path checks the user-facing `cosign verify-blob` flow that
        # external consumers run per `docs/security/verification.md`.
        env:
          COSIGN_IDENTITY: https://github.com/rvenutolo/linPEAS-flake/.github/workflows/release-on-bump.yml@refs/heads/main
          COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.read-tag.outputs.tag }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          gh release download "${TAG}" \
            --repo rvenutolo/linPEAS-flake \
            --pattern linpeas-pin.json \
            --pattern linpeas-pin.json.sigstore \
            --clobber
          nix shell .#cosign --command cosign verify-blob \
            --certificate-identity "${COSIGN_IDENTITY}" \
            --certificate-oidc-issuer "${COSIGN_OIDC_ISSUER}" \
            --bundle linpeas-pin.json.sigstore \
            linpeas-pin.json > /dev/null
          printf 'cosign verify-blob ok: linpeas-pin.json\n'

      - name: cosign verify-blob linpeas-image-amd64.cdx.json
        id: verify-blob-sbom-amd64
        env:
          COSIGN_IDENTITY: https://github.com/rvenutolo/linPEAS-flake/.github/workflows/release-on-bump.yml@refs/heads/main
          COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.read-tag.outputs.tag }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          gh release download "${TAG}" \
            --repo rvenutolo/linPEAS-flake \
            --pattern linpeas-image-amd64.cdx.json \
            --pattern linpeas-image-amd64.cdx.json.sigstore \
            --clobber
          nix shell .#cosign --command cosign verify-blob \
            --certificate-identity "${COSIGN_IDENTITY}" \
            --certificate-oidc-issuer "${COSIGN_OIDC_ISSUER}" \
            --bundle linpeas-image-amd64.cdx.json.sigstore \
            linpeas-image-amd64.cdx.json > /dev/null
          printf 'cosign verify-blob ok: linpeas-image-amd64.cdx.json\n'

      - name: cosign verify-blob linpeas-image-arm64.cdx.json
        id: verify-blob-sbom-arm64
        env:
          COSIGN_IDENTITY: https://github.com/rvenutolo/linPEAS-flake/.github/workflows/release-on-bump.yml@refs/heads/main
          COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.read-tag.outputs.tag }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          gh release download "${TAG}" \
            --repo rvenutolo/linPEAS-flake \
            --pattern linpeas-image-arm64.cdx.json \
            --pattern linpeas-image-arm64.cdx.json.sigstore \
            --clobber
          nix shell .#cosign --command cosign verify-blob \
            --certificate-identity "${COSIGN_IDENTITY}" \
            --certificate-oidc-issuer "${COSIGN_OIDC_ISSUER}" \
            --bundle linpeas-image-arm64.cdx.json.sigstore \
            linpeas-image-arm64.cdx.json > /dev/null
          printf 'cosign verify-blob ok: linpeas-image-arm64.cdx.json\n'

      - name: attribute failure reason
        id: attribute
        # Maps the first failed step to a reason token consumed by the
        # `notify` job's body. Without explicit attribution, the auto-filed
        # issue treats every failure as a possible security incident and
        # the maintainer learns to skim-read the body — exactly the wrong
        # reflex for the one time it really is `upstream-sri-drift`.
        # `if: always()` ensures this runs even after a prior failure.
        if: always()
        env:
          READ_TAG: ${{ steps.read-tag.outcome }}
          DOWNLOAD_ASSETS: ${{ steps.download-assets.outcome }}
          VERIFY_GHCR: ${{ steps.verify-ghcr.outcome }}
          VERIFY_HUB: ${{ steps.verify-hub.outcome }}
          VERIFY_IMAGES_COSIGN: ${{ steps.verify-images-cosign.outcome }}
          VERIFY_LATEST_PARITY: ${{ steps.verify-latest-parity.outcome }}
          VERIFY_CROSS_REGISTRY: ${{ steps.verify-cross-registry.outcome }}
          VERIFY_PIN: ${{ steps.verify-pin.outcome }}
          VERIFY_UPSTREAM_SRI: ${{ steps.verify-upstream-sri.outcome }}
          VERIFY_BLOB_PIN: ${{ steps.verify-blob-pin.outcome }}
          VERIFY_BLOB_SBOM_AMD64: ${{ steps.verify-blob-sbom-amd64.outcome }}
          VERIFY_BLOB_SBOM_ARM64: ${{ steps.verify-blob-sbom-arm64.outcome }}
          # Names no step outcome: it is how the terminal branch below
          # distinguishes a clean run from a failure no ladder arm matched.
          JOB_STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          reason='ok'
          # Order matters: the first failed step wins. Downstream steps
          # skipped after a failure show outcome `skipped`; only the
          # actually-failed step shows `failure`. Walk in execution order.
          # The terminal branch is load-bearing: without it a failed step
          # the ladder does not cover leaves the initializer in place and
          # a real verification failure reports `ok`.
          if   [[ ${READ_TAG}              == 'failure' ]]; then reason='release-tag-fetch-failed'
          elif [[ ${DOWNLOAD_ASSETS}       == 'failure' ]]; then reason='release-asset-download-failed'
          elif [[ ${VERIFY_GHCR}           == 'failure' ]]; then reason='ghcr-attest-failed'
          elif [[ ${VERIFY_HUB}            == 'failure' ]]; then reason='hub-attest-failed'
          elif [[ ${VERIFY_LATEST_PARITY}  == 'failure' ]]; then reason='manifest-tag-drift'
          elif [[ ${VERIFY_CROSS_REGISTRY} == 'failure' ]]; then reason='cross-registry-manifest-mismatch'
          elif [[ ${VERIFY_IMAGES_COSIGN}  == 'failure' ]]; then reason='images-cosign-failed'
          elif [[ ${VERIFY_PIN}            == 'failure' ]]; then reason='pin-attest-failed'
          elif [[ ${VERIFY_UPSTREAM_SRI}   == 'failure' ]]; then reason='upstream-sri-drift'
          elif [[ ${VERIFY_BLOB_PIN}        == 'failure' ]]; then reason='pin-blob-sig-failed'
          elif [[ ${VERIFY_BLOB_SBOM_AMD64} == 'failure' ]]; then reason='sbom-amd64-blob-sig-failed'
          elif [[ ${VERIFY_BLOB_SBOM_ARM64} == 'failure' ]]; then reason='sbom-arm64-blob-sig-failed'
          elif [[ ${JOB_STATUS} == 'failure' ]]; then reason='unattributed'
          fi
          printf 'reason=%s\n' "${reason}" >> "${GITHUB_OUTPUT}"
          printf 'attributed reason: %s\n' "${reason}"

  notify:
    name: notify
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/notify-workflow-result
        with:
          result: ${{ needs.verify.result }}
          label: verify-latest-release-failure
          title: "verify-latest-release: scheduled verification failed"
          body: |
            The scheduled `verify-latest-release` cron failed.

            - Trigger: `${{ github.event_name }}`
            - Verify conclusion: `${{ needs.verify.result }}`
            - Reason: `${{ needs.verify.outputs.reason || 'unknown' }}`

            Reason values and what they mean:

            - `upstream-sri-drift` — **TREAT AS SECURITY INCIDENT.** The
              upstream `linpeas.sh` URL still resolves but its SHA-256
              no longer matches the pinned SRI. Either upstream
              tag-replaced the asset or someone tampered with the pin.
              Do NOT merge subsequent pin bumps until investigated.
            - `manifest-tag-drift` — `:latest` on ghcr.io or docker.io
              no longer resolves to the same manifest as the
              release-tagged `:VERSION`. Likely registry-side repoint
              (incident, account compromise, accidental `docker tag`
              push); also a security signal but lower-confidence than
              SRI drift.
            - `cross-registry-manifest-mismatch` — **TREAT AS SECURITY
              INCIDENT.** ghcr.io and docker.io no longer serve the same
              multi-arch manifest for the current release tag. Both
              registries receive identical bytes at release time, so a
              divergence means one registry's tags were rewritten after
              publication — most likely a Docker Hub push-credential
              compromise rolling the tag back to an older, still-validly-
              signed release. Signature and attestation checks cannot
              catch this: the rolled-back image is genuinely ours. Follow
              `docs/runbooks/dockerhub-recovery.md`, and treat the Docker
              Hub token as compromised until proven otherwise.
            - `ghcr-attest-failed` / `hub-attest-failed` /
              `pin-attest-failed` — attestation
              verification failed for one of the per-arch images or
              the pin asset. Could be artifact tampering or
              a Sigstore TUF trust-root rotation lag (newer `gh` CLI
              with rotated root has shipped to runners but the cron
              still runs on the old runner image). Re-run the cron 24h
              later to distinguish.
            - `images-cosign-failed` — cosign
              signature verification failed for one
              of the per-arch / multi-arch image digests. Same
              authenticity guarantee as the `*-attest-failed` reasons
              above, exposed via the user-facing `cosign verify` path.
              Same Sigstore TUF rotation caveat applies — re-run 24h
              later before treating as tampering.
            - `pin-blob-sig-failed` — `cosign verify-blob` failed for
              `linpeas-pin.json` on the latest release. Either the
              `linpeas-pin.json.sigstore` sidecar is missing from the
              release, or the bundle no longer verifies against the
              pinned `release-on-bump.yml` workflow identity. Triage:
              download both files with `gh release download`, re-run
              `cosign verify-blob` locally using the identity flags in
              `docs/security/verification.md`. If the sidecar is
              missing, the release pipeline's `release` job did not run
              the sign-blob step (possible registry-side asset loss);
              re-trigger via `workflow_dispatch` with
              `force-republish: true`.
            - `sbom-amd64-blob-sig-failed` — `cosign verify-blob`
              failed for `linpeas-image-amd64.cdx.json`. Either the
              `linpeas-image-amd64.cdx.json.sigstore` sidecar is
              missing from the release, or the bundle no longer
