name: trufflehog

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "50 6 * * 5" # Friday 06:50 UTC (after gitleaks; complementary detector set)
  workflow_dispatch:

permissions: {}

concurrency:
  group: trufflehog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Verifies the release and never executes the TruffleHog binary, so the
  # broad nix and Sigstore egress this job needs is never reachable from
  # code TruffleHog ships. The scan job below enforces this job's result;
  # it is not a required check itself.
  trufflehog-verify:
    name: trufflehog-verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.verify.outputs.version }}
      sha256: ${{ steps.verify.outputs.sha256 }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            api.github.com:443
            cache.nixos.org:443
            codeload.github.com:443
            fulcio.sigstore.dev:443
            github.com:443
            objects.githubusercontent.com:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            tarballs.nixos.org:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Nix supplies the lock-pinned cosign the verify step runs.
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository]
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Checks the checksums file's keyless signature against the
      # TruffleHog release workflow's identity for the pinned tag, then
      # writes the version and the linux/amd64 tarball digest as outputs.
      - name: verify the pinned TruffleHog release
        id: verify
        run: nix shell .#cosign --command bash scripts/trufflehog-release.sh verify >> "${GITHUB_OUTPUT}"

  # The binary runs on the runner, not in a container, so no token reaches
  # the scan step (the job token, which checkout and harden-runner read,
  # is `contents: read` only), the job reaches only GitHub hosts and it
  # cannot use sudo or start a container: a malicious binary can forge a
  # clean scan and nothing else.
  trufflehog:
    name: trufflehog
    needs: trufflehog-verify
    # A skipped required check counts as passing, so this job runs even
    # when verification failed and fails in its first step instead.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - name: require a verified release
        env:
          VERIFY_RESULT: ${{ needs.trufflehog-verify.result }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          if [[ ${VERIFY_RESULT} != 'success' ]]; then
            printf 'trufflehog-verify concluded %s; the release is unverified\n' "${VERIFY_RESULT}" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The script rejects a version or digest of the wrong shape before
      # downloading, checks the tarball against the verified digest and
      # runs the binary with `--results=verified,unknown`: egress is
      # blocked, so only GitHub credentials can verify, and any other
      # provider's finding is `unknown` and must still fail.
      - name: scan with the verified TruffleHog binary
        env:
          VERSION: ${{ needs.trufflehog-verify.outputs.version }}
          SHA256: ${{ needs.trufflehog-verify.outputs.sha256 }}
        run: bash scripts/trufflehog-release.sh scan --version "${VERSION}" --sha256 "${SHA256}"

  notify:
    name: notify
    needs: [trufflehog-verify, trufflehog]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      issues: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Both jobs must succeed. The scan job runs even in a cancelled run
      # and then fails at its gate, so after a cancelled verification its
      # failure is that gate's and the run counts as `cancelled`, which
      # the composite files as an infrastructure failure. After a
      # successful verification the scan job's own result counts; any
      # other result is `failure`.
      - name: combine the job results
        id: combined
        env:
          VERIFY_RESULT: ${{ needs.trufflehog-verify.result }}
          SCAN_RESULT: ${{ needs.trufflehog.result }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          result='failure'
          if [[ ${VERIFY_RESULT} == 'cancelled' ]]; then
            result='cancelled'
          elif [[ ${VERIFY_RESULT} == 'success' ]]; then
            case "${SCAN_RESULT}" in
            success | cancelled) result="${SCAN_RESULT}" ;;
            esac
          fi
          printf 'result=%s\n' "${result}" >> "${GITHUB_OUTPUT}"
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/notify-workflow-result # zizmor: ignore[self-repository]
        with:
          # A pull request run's failure shows on the pull request itself.
          result: ${{ steps.combined.outputs.result }}
          label: trufflehog-failure
          title: "trufflehog: secret detected, or the scan could not run"
          label-description: trufflehog found a secret outside a pull request, or the trufflehog scan could not run
          body: |
            The `trufflehog` workflow did not pass on a
            `${{ github.event_name }}` run: trufflehog reported a secret
            in the repository history that it either confirmed live or
            could not verify, a step (the release download or
            verification and the scan itself included) failed, or a job
            was cancelled. The run page and job logs say which.

            Run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            A finding is a security incident whether or not it verified:
            rotate the credential first, then purge it from history, as the TruffleHog section
            of docs/security/verification.md describes. This issue
            auto-closes on the next clean run.
          github-token: ${{ secrets.GITHUB_TOKEN }}
