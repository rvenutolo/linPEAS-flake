name: trufflehog

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "50 6 * * 5" # Friday 06:50 UTC (after gitleaks; complementary detector set)
  workflow_dispatch:

permissions: {}

concurrency:
  group: trufflehog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: trufflehog
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # TODO: restore egress-policy block once block mode stops dropping allowed hosts on
          # westus2 runners: https://github.com/step-security/harden-runner/issues/708
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            ghcr.io:443
            github.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          extra_args: --only-verified

  notify:
    name: notify
    needs: trufflehog
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      issues: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # TODO: restore egress-policy block once block mode stops dropping allowed hosts on
          # westus2 runners: https://github.com/step-security/harden-runner/issues/708
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/notify-workflow-result # zizmor: ignore[self-repository]
        with:
          # Raw job result: the composite files cancelled runs as
          # infrastructure failures and is inert on skipped. A pull
          # request run's failure shows on the pull request itself.
          result: ${{ needs.trufflehog.result }}
          label: trufflehog-failure
          title: "trufflehog: verified secret detected, or the scan could not run"
          label-description: trufflehog found a verified secret outside a pull request, or the scan could not run
          body: |
            The `trufflehog` workflow did not pass on a
            `${{ github.event_name }}` run: trufflehog reported a verified
            secret (one it confirmed live against its provider) in the
            repository history, or a step (the trufflehog image pull and
            the scan itself included) failed or was cancelled. The job log
            says which.

            Run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            A finding is a live credential and a security incident: rotate
            it first, then purge it from history, as the TruffleHog section
            of docs/security/verification.md describes. This issue
            auto-closes on the next clean run.
          github-token: ${{ secrets.GITHUB_TOKEN }}
