name: trufflehog

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "50 6 * * 5" # Friday 06:50 UTC (after gitleaks; complementary detector set)
  workflow_dispatch:

permissions: {}

concurrency:
  group: trufflehog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: trufflehog
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            ghcr.io:443
            github.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@c85580b712841eda4c53bc28fc6ace6100e8c16c # v3.99.4
        with:
          # The action runs `docker run "${IMAGE}:${VERSION}"` and defaults
          # VERSION to `latest`; tag+digest pins the image to the same
          # release as the action (lint: trufflehog-image-pin).
          version: 3.99.4@sha256:bf9238f5bdf26ac28230d4b0bae5162a752b151bf10bea612dad7a62da938731
          # Egress is blocked, so only GitHub credentials can verify; any
          # other provider's finding is `unknown`, and must still fail.
          extra_args: --results=verified,unknown

  notify:
    name: notify
    needs: trufflehog
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      issues: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/notify-workflow-result # zizmor: ignore[self-repository]
        with:
          # Raw job result: the composite files cancelled runs as
          # infrastructure failures and is inert on skipped. A pull
          # request run's failure shows on the pull request itself.
          result: ${{ needs.trufflehog.result }}
          label: trufflehog-failure
          title: "trufflehog: secret detected, or the scan could not run"
          label-description: trufflehog found a secret outside a pull request, or the trufflehog scan could not run
          body: |
            The `trufflehog` workflow did not pass on a
            `${{ github.event_name }}` run: trufflehog reported a secret
            in the repository history that it either confirmed live or
            could not verify, a step (the trufflehog image pull and the
            scan itself included) failed, or the job was cancelled. The
            run page and job log say which.

            Run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            A finding is a security incident whether or not it verified:
            rotate the credential first, then purge it from history, as the TruffleHog section
            of docs/security/verification.md describes. This issue
            auto-closes on the next clean run.
          github-token: ${{ secrets.GITHUB_TOKEN }}
