name: release-on-bump

on:
  push:
    branches: [main]
    paths:
      - linpeas-pin.json
  workflow_dispatch:
    inputs:
      force-republish:
        description: |
          Republish images + manifest for the version currently in
          linpeas-pin.json, even if the GitHub release already exists.
          The `release` job remains gated by `tag-exists`,
          so existing release assets are preserved. Used to recover from
          registry-side artifact loss
          (e.g. Docker Hub repo wiped, missing per-arch tags).
        required: false
        default: false
        type: boolean
      backfill-tag:
        description: |
          Tag of an existing release to backfill with missing
          .sigstore + .intoto.jsonl sidecars and (if absent) per-arch
          CycloneDX SBOMs. Mutually exclusive with force-republish.
          Skips image build/push, manifest re-creation is idempotent
          and leaves :latest alone unless this is the newest release,
          changelog job is skipped. Used to bring historic releases up
          to current sidecar coverage (Scorecard Signed-Releases). See
          docs/runbooks/scorecard-signed-releases-backfill.md.
        required: false
        default: ""
        type: string

# Workflow default = empty. Each job declares the exact scopes it
# needs, so contents:write / id-token:write / attestations:write /
# packages:write are not silently available to unrelated steps.
permissions: {}

concurrency:
  # Serialize on `main` rather than per-SHA so back-to-back pin bumps queue
  # through the release pipeline sequentially. Avoids parallel-runs racing
  # the `gh release create` step on the same upstream tag.
  group: release-on-bump-main
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'rvenutolo/linPEAS-flake'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # gh release create + upload
      id-token: write # attest-build-provenance OIDC
      attestations: write # attest-build-provenance write
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag-exists: ${{ steps.exists.outputs.exists }}
      write-latest: ${{ steps.latest.outputs.write-latest }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            cache.nixos.org:443
            codeload.github.com:443
            fulcio.sigstore.dev:443
            github.com:443
            objects.githubusercontent.com:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            tarballs.nixos.org:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: validate backfill inputs
        env:
          GH_TOKEN: ${{ github.token }}
          BACKFILL_TAG: ${{ inputs.backfill-tag }}
          FORCE_REPUBLISH: ${{ inputs.force-republish }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          if [[ -n "${BACKFILL_TAG}" && "${FORCE_REPUBLISH}" == "true" ]]; then
            printf 'refusing to run: backfill-tag and force-republish are mutually exclusive\n' >&2
            exit 1
          fi
          if [[ -n "${BACKFILL_TAG}" ]]; then
            if ! gh release view "${BACKFILL_TAG}" >/dev/null 2>&1; then
              printf 'refusing to backfill: release tag %q does not exist\n' "${BACKFILL_TAG}" >&2
              exit 1
            fi
          fi

      - name: read effective version
        id: read
        env:
          BACKFILL_TAG: ${{ inputs.backfill-tag }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          if [[ -n "${BACKFILL_TAG}" ]]; then
            version="${BACKFILL_TAG}"
          else
            version="$(jq --raw-output .version linpeas-pin.json)"
          fi
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"

      - name: decide whether :latest follows this run
        id: latest
        # `:latest` tracks the newest GitHub release, not whichever tag
        # this run happens to process. A push or force-republish always
        # publishes the current pin, so `:latest` follows it. A backfill
        # re-processes an existing tag: `:latest` follows only when that
        # tag is the newest release (`gh release view` with no tag argument
        # resolves the same way verify-latest-release.yml reads it), so
        # backfilling a historic tag leaves `:latest` on the current
        # image instead of repointing it at the old one.
        env:
          GH_TOKEN: ${{ github.token }}
          BACKFILL_TAG: ${{ inputs.backfill-tag }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          if [[ -z "${BACKFILL_TAG}" ]]; then
            printf 'write-latest=true\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          newest="$(gh release view --json tagName --jq .tagName)"
          if [[ "${BACKFILL_TAG}" == "${newest}" ]]; then
            printf 'write-latest=true\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'backfill of %s leaves :latest on newest release %s\n' \
              "${BACKFILL_TAG}" "${newest}"
            printf 'write-latest=false\n' >> "${GITHUB_OUTPUT}"
          fi

      - name: download existing pin asset (backfill mode)
        if: inputs.backfill-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          rm -f linpeas-pin.json
          gh release download "${VERSION}" --pattern linpeas-pin.json
          if [[ ! -s linpeas-pin.json ]]; then
            printf 'release %q has no linpeas-pin.json asset to backfill\n' "${VERSION}" >&2
            exit 1
          fi

      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: check tag exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            printf 'exists=true\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'exists=false\n' >> "${GITHUB_OUTPUT}"
          fi

      - name: create release
        if: steps.exists.outputs.exists == 'false' && inputs.backfill-tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          # Defensive shape-check: refuse to publish a release whose version
          # does not match the canonical peass-ng pin shape
          # (YYYYMMDD-<7..40 hex>). Same regex enforced at
          # `bump-linpeas.sh`, `flake.nix` eval, `stale-pin-check.yml`, and
          # `gen-dashboard-data.sh`. Cross-layer pin-shape parity.
          if [[ ! "${VERSION}" =~ ^[0-9]{8}-[0-9a-f]{7,40}$ ]]; then
            printf 'refusing to release with non-conformant version: %q\n' "${VERSION}" >&2
            exit 1
          fi
          # Pin --target to the triggering
          # commit SHA, not the symbolic "main". Without this, if a
          # second push lands on main between this job's checkout and
          # this step, gh release create resolves "main" to the NEWER
          # commit — tag points at SHA-B while attestation records
          # SHA-A. The concurrency: group only serializes runs; it
          # does not freeze main during the window. SHA pinning closes
          # the TOCTOU.
          #
          # Ordering contract: this tag must be created BEFORE the
          # changelog job commits its section, and on a commit that is
          # an ancestor of that changelog commit.
          # scripts/check-changelog-fresh.sh compares a release tag only
          # when the tag is an ancestor of the newest CHANGELOG.md
          # commit; that is what keeps the changelog PR's own merge ref
          # fully compared. Tagging after the changelog commit would make
          # the tag a non-ancestor, and the freshness guard would then
          # exclude — and stop guarding — the case it exists to catch,
          # silently and on every release. See docs/development/changelog.md.
          gh release create "${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "${VERSION}" \
            --notes "Tracks upstream [peass-ng/PEASS-ng@${VERSION}](https://github.com/peass-ng/PEASS-ng/releases/tag/${VERSION})."

      - name: attest provenance for pin file
        id: attest-pin
        if: steps.exists.outputs.exists == 'false' || inputs.backfill-tag != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: linpeas-pin.json

      - name: attach pin file to release
        # The scheduled verify (verify-latest-release.yml) downloads this asset.
        if: steps.exists.outputs.exists == 'false' && inputs.backfill-tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          gh release upload "${VERSION}" linpeas-pin.json --clobber

      - name: sign pin file (cosign sign-blob, keyless)
        # Produces a .sigstore bundle (signature + Fulcio cert + Rekor
        # entry in one container) as a sibling
        # release asset. Scorecard Signed-Releases recognises
        # .sigstore as a signature artifact, closing the gap reported
        # for older releases that only had attest-build-provenance
        # attestations (which live in the GitHub Attestations API and
        # are NOT scanned as release-asset sidecars).
        #
        # Runs on force-republish as well: signs the local checked-in
        # linpeas-pin.json (byte-identical to the release asset since
        # the release was published from this same commit) and
        # --clobber uploads the bundle. Allows recovery from missing
        # sidecar without waiting for the next pin bump.
        env:
          COSIGN_YES: "true"
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          nix shell .#cosign --command cosign sign-blob \
            --bundle linpeas-pin.json.sigstore \
            linpeas-pin.json
          gh release upload "${VERSION}" linpeas-pin.json.sigstore --clobber

      - name: upload pin provenance sidecar
        # Materialises the attest-build-provenance bundle as a
        # release-asset sidecar. Scorecard releasesHaveProvenance
        # probe matches `.intoto.jsonl` suffix on release assets; it
        # does NOT query the GitHub Attestations API. Without this
        # sidecar, Scorecard Signed-Releases caps at 8/release.
        if: steps.exists.outputs.exists == 'false' || inputs.backfill-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.read.outputs.version }}
          BUNDLE_PATH: ${{ steps.attest-pin.outputs.bundle-path }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          cp "${BUNDLE_PATH}" linpeas-pin.json.intoto.jsonl
          gh release upload "${VERSION}" linpeas-pin.json.intoto.jsonl --clobber

  preflight:
    # Backfill-only image-presence probe and single source of truth
    # for image gating and for the historic per-arch digests. On a
    # normal push / force-republish (backfill-tag == '') it emits
    # image-mode=full immediately with no registry probe, so the hot
    # release path pays nothing. In backfill mode it anonymously
    # inspects the four per-arch tags plus the `:<tag>` multi-arch
    # index on each registry, and classifies the release as `full`
    # (complete set -> run the image/manifest jobs) or `none`
    # (image-less -> skip them, backfill pin sidecars only, finish
    # green). A partial mix fails loudly.
    #
    # On `full` it also emits the per-arch digests the index records.
    # Those digests are what the image jobs pull by: the index is the
    # authoritative record of which bytes the release shipped, and an
    # arch tag repointed since the original publish would otherwise
    # receive fresh attestations and a fresh cosign signature over
    # substituted content.
    if: github.repository == 'rvenutolo/linPEAS-flake'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout the classifier script
    outputs:
      image-mode: ${{ steps.classify.outputs.image-mode }}
      # Empty unless image-mode is `full`; the image jobs that consume
      # them do not run in any other mode.
      amd64-ghcr-digest: ${{ steps.classify.outputs.amd64-ghcr-digest }}
      amd64-hub-digest: ${{ steps.classify.outputs.amd64-hub-digest }}
      arm64-ghcr-digest: ${{ steps.classify.outputs.arm64-ghcr-digest }}
      arm64-hub-digest: ${{ steps.classify.outputs.arm64-hub-digest }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          # Anonymous registry reads only: no cosign (no sigstore
          # hosts), no Nix, no docker login. buildx imagetools inspect
          # reads a public manifest via the registry + its CDN/auth.
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            auth.docker.io:443
            codeload.github.com:443
            ghcr.io:443
            github.com:443
            index.docker.io:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: classify image presence
        id: classify
        env:
          BACKFILL_TAG: ${{ inputs.backfill-tag }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          # Normal push / force-republish: images are (re)built
          # unconditionally, so no probe is needed.
          if [[ -z "${BACKFILL_TAG}" ]]; then
            printf 'image-mode=full\n' >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          # Probe one public per-arch tag. Echo present|absent, or
          # return non-zero on an ambiguous (non-404) error so a
          # transient registry blip never misclassifies an existing
          # image as absent (which would silently skip image backfill).
          probe() {
            local ref="$1" out attempt
            for attempt in 1 2 3; do
              if out="$(docker buildx imagetools inspect "${ref}" 2>&1)"; then
                printf 'present'
                return 0
              fi
              if grep --quiet --ignore-case --extended-regexp \
                'not found|manifest unknown|no such manifest|manifest_unknown|\b404\b' \
                <<<"${out}"; then
                printf 'absent'
                return 0
              fi
              printf 'preflight: registry probe attempt %d/3 failed for %s, retrying\n' \
                "${attempt}" "${ref}" >&2
              sleep 3
            done
            printf 'preflight: ambiguous registry error probing %s:\n%s\n' \
              "${ref}" "${out}" >&2
            return 1
          }
          # Read the digest a `:<tag>` OCI index records for one
          # platform. Attestation manifests that
          # attest-build-provenance attaches sit in the same index with
          # platform unknown/unknown, so the selection is on the
          # linux/<arch> pair rather than on position. Anything other
          # than exactly one match is a malformed index: refuse it
          # rather than pick one and bless the wrong bytes.
          index_digest() {
            local ref="$1" arch="$2" raw count digest
            # shellcheck disable=SC2016 # $arch is a jq variable, bound below
            local -r filter='
              [ .manifests[]
                | select(.platform.os == "linux"
                    and .platform.architecture == $arch)
                | .digest ]
              | unique'
            if ! raw="$(docker buildx imagetools inspect --raw "${ref}")"; then
              printf 'preflight: could not read index %s\n' "${ref}" >&2
              return 1
            fi
            count="$(jq --arg arch "${arch}" "${filter} | length" <<<"${raw}")"
            if [[ ${count} != '1' ]]; then
              printf 'preflight: index %s records %s linux/%s manifest(s), want exactly 1\n' \
                "${ref}" "${count}" "${arch}" >&2
              return 1
            fi
            digest="$(jq --raw-output --arg arch "${arch}" \
              "${filter} | .[0]" <<<"${raw}")"
            if [[ ${digest} != sha256:* ]]; then
              printf 'preflight: index %s gave a malformed linux/%s digest: %s\n' \
                "${ref}" "${arch}" "${digest}" >&2
              return 1
            fi
            printf '%s' "${digest}"
          }
          amd64_ghcr="$(probe "ghcr.io/rvenutolo/linpeas:${BACKFILL_TAG}-amd64")"
          amd64_hub="$(probe "docker.io/rvenutolo/linpeas:${BACKFILL_TAG}-amd64")"
          arm64_ghcr="$(probe "ghcr.io/rvenutolo/linpeas:${BACKFILL_TAG}-arm64")"
          arm64_hub="$(probe "docker.io/rvenutolo/linpeas:${BACKFILL_TAG}-arm64")"
          index_ghcr="$(probe "ghcr.io/rvenutolo/linpeas:${BACKFILL_TAG}")"
          index_hub="$(probe "docker.io/rvenutolo/linpeas:${BACKFILL_TAG}")"
          mode="$(bash scripts/classify-backfill-image-mode.sh \
            "${amd64_ghcr}" "${amd64_hub}" "${arm64_ghcr}" "${arm64_hub}" \
            "${index_ghcr}" "${index_hub}")"
          printf 'image-mode=%s\n' "${mode}" >>"${GITHUB_OUTPUT}"
          # `none` skips the image jobs outright, so there is nothing to
          # resolve a digest for. Each digest is captured into its own
          # variable first: a command substitution that failed inside a
          # printf argument list would leave the output empty and the
          # step green.
          [[ ${mode} == 'full' ]] || exit 0
          for arch in amd64 arm64; do
            ghcr_digest="$(index_digest "ghcr.io/rvenutolo/linpeas:${BACKFILL_TAG}" "${arch}")"
            hub_digest="$(index_digest "docker.io/rvenutolo/linpeas:${BACKFILL_TAG}" "${arch}")"
            printf '%s-ghcr-digest=%s\n' "${arch}" "${ghcr_digest}" >>"${GITHUB_OUTPUT}"
            printf '%s-hub-digest=%s\n' "${arch}" "${hub_digest}" >>"${GITHUB_OUTPUT}"
          done

  image-amd64:
    needs: [release, preflight]
    if: (needs.release.outputs.tag-exists == 'false' || inputs.force-republish || (inputs.backfill-tag != '' && needs.preflight.outputs.image-mode == 'full')) && github.repository == 'rvenutolo/linPEAS-flake'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # gh release upload (sbom asset)
      packages: write # ghcr docker push
      id-token: write # attest-build-provenance OIDC
      attestations: write # attest-build-provenance write
    outputs:
      ghcr_digest: ${{ steps.push.outputs.ghcr_digest || steps.pull.outputs.ghcr_digest }}
      hub_digest: ${{ steps.push.outputs.hub_digest || steps.pull.outputs.hub_digest }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            auth.docker.io:443
            cache.nixos.org:443
            codeload.github.com:443
            fulcio.sigstore.dev:443
            get.anchore.io:443
            ghcr.io:443
            github.com:443
            hub.docker.com:443
            index.docker.io:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            tarballs.nixos.org:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: build OCI image (amd64)
        if: inputs.backfill-tag == ''
        run: nix build .#linpeas-image --print-build-logs

      - name: login to ghcr
        env:
          GH_TOKEN_INLINE: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          printf '%s' "${GH_TOKEN_INLINE}" \
            | docker login ghcr.io --username "${GH_ACTOR}" --password-stdin

      - name: login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN_RW }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          printf '%s' "${DOCKERHUB_TOKEN}" \
            | docker login docker.io --username "${DOCKERHUB_USERNAME}" --password-stdin

      - name: pull existing image by digest (backfill mode)
        # Source the historic bytes by digest, never by the mutable
        # `<version>-<arch>` tag. The digests come from the `:<version>`
        # OCI index the release published, which is the only in-registry
        # record of what it shipped. Pulling the arch tag instead would
        # hand fresh SLSA attestations and a fresh cosign signature to
        # whatever that tag points at today, and the manifest job would
        # then rebuild and re-sign the index over the substitution — the
        # exact defect scripts/check-manifest-digest-pinned.sh polices
        # everywhere else in the tree.
        id: pull
        if: inputs.backfill-tag != ''
        env:
          VERSION: ${{ needs.release.outputs.version }}
          ARCH: amd64
          GHCR_DIGEST: ${{ needs.preflight.outputs.amd64-ghcr-digest }}
          HUB_DIGEST: ${{ needs.preflight.outputs.amd64-hub-digest }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          # preflight emits these only on image-mode=full, and this step
          # runs only when the image jobs do. An empty or malformed value
          # here means the gate and the digest source disagree, which is
          # a bug to surface, not a case to fall back from.
          if [[ ${GHCR_DIGEST} != sha256:* ]]; then
            printf 'preflight supplied no ghcr digest for %s: %q\n' "${ARCH}" "${GHCR_DIGEST}" >&2
            exit 1
          fi
          if [[ ${HUB_DIGEST} != sha256:* ]]; then
            printf 'preflight supplied no docker hub digest for %s: %q\n' "${ARCH}" "${HUB_DIGEST}" >&2
            exit 1
          fi
          docker pull "docker.io/rvenutolo/linpeas@${HUB_DIGEST}"
          docker pull "ghcr.io/rvenutolo/linpeas@${GHCR_DIGEST}"
          # The syft SBOM step below addresses the image by its arch tag.
          # Recreating that tag locally, over bytes the daemon already
          # verified against the digest, keeps that step unchanged
          # without reading a tag from a registry.
          docker tag "docker.io/rvenutolo/linpeas@${HUB_DIGEST}" \
            "rvenutolo/linpeas:${VERSION}-${ARCH}"
          # No re-derivation from `docker inspect`: `docker pull` by
          # digest is digest-verified by the daemon, so these are already
          # the digests of the bytes on disk.
          printf 'ghcr_digest=%s\n' "${GHCR_DIGEST}" >>"${GITHUB_OUTPUT}"
          printf 'hub_digest=%s\n' "${HUB_DIGEST}" >>"${GITHUB_OUTPUT}"

      - name: load, tag, push arch image, and capture digests
        # Push the per-arch image to both registries under arch-suffixed
        # tags. The unsuffixed {version} and :latest tags are created later
        # by the `manifest` job via `docker buildx imagetools create`.
        #
        # docker.io is pushed first, ghcr.io second. docker.io has
        # historically lower availability than ghcr.io; by putting the
        # flakier registry first, a docker.io push failure aborts
        # before ghcr.io is touched, preventing a half-published state
        # where ghcr has the arch tag but docker.io does not. The
        # remaining failure mode (ghcr.io push fails after docker.io
        # succeeded) is less likely and the recovery procedure in the
        # notify body covers it.
        if: inputs.backfill-tag == ''
        id: push
        env:
          VERSION: ${{ needs.release.outputs.version }}
          ARCH: amd64
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          docker load --input result
          for reg in docker.io ghcr.io; do
            docker tag "rvenutolo/linpeas:${VERSION}" "${reg}/rvenutolo/linpeas:${VERSION}-${ARCH}"
            docker push "${reg}/rvenutolo/linpeas:${VERSION}-${ARCH}"
          done
          # Deterministic digest selection via `jq` against the
          # JSON output of `docker inspect`. The prior `grep | head -n1`
          # pipeline silently picked the first matching line; if RepoDigests
          # ever contains more than one entry (e.g. multiple aliases), the
          # ordering is non-deterministic. Selecting by repository prefix
          # with `jq` and asserting the resulting digest starts with
          # `sha256:` gives a hard fail rather than a misleading
          # attestation-verify pass against the wrong image.
          ghcr_digest="$(
            docker inspect "ghcr.io/rvenutolo/linpeas:${VERSION}-${ARCH}" \
              | jq --raw-output \
                  '.[0].RepoDigests[] | select(startswith("ghcr.io/rvenutolo/linpeas@"))' \
              | head -n1
          )"
          hub_digest="$(
            docker inspect "docker.io/rvenutolo/linpeas:${VERSION}-${ARCH}" \
              | jq --raw-output \
                  '.[0].RepoDigests[]
                    | select(startswith("rvenutolo/linpeas@")
                          or startswith("docker.io/rvenutolo/linpeas@"))' \
              | head -n1
          )"
          ghcr_digest="${ghcr_digest#*@}"
          hub_digest="${hub_digest#*@}"
          if [[ "${ghcr_digest}" != sha256:* ]]; then
            printf 'unexpected ghcr digest for %s: %s\n' "${ARCH}" "${ghcr_digest}" >&2
            exit 1
          fi
          if [[ "${hub_digest}" != sha256:* ]]; then
            printf 'unexpected docker hub digest for %s: %s\n' "${ARCH}" "${hub_digest}" >&2
            exit 1
          fi
          printf 'ghcr_digest=%s\n' "${ghcr_digest}" >> "${GITHUB_OUTPUT}"
          printf 'hub_digest=%s\n' "${hub_digest}" >> "${GITHUB_OUTPUT}"

      - name: attest provenance for ghcr image (amd64)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/rvenutolo/linpeas
          subject-digest: ${{ steps.push.outputs.ghcr_digest || steps.pull.outputs.ghcr_digest }}
          push-to-registry: true

      - name: attest provenance for Docker Hub image (amd64)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/rvenutolo/linpeas
          subject-digest: ${{ steps.push.outputs.hub_digest || steps.pull.outputs.hub_digest }}
          push-to-registry: true

      - name: generate SBOM for OCI image (amd64)
        # CycloneDX-JSON SBOM for the amd64 image. CycloneDX chosen for
        # native dependency-graph edges, VEX readiness, and consumer
        # alignment (Grype, Trivy, cosign, Dependency-Track default).
        # upload-release-assets here is a no-op (the action only
        # uploads on release-typed events; this workflow runs on push
        # and workflow_dispatch). The explicit gh release upload in
        # the sign-blob step below is the release-asset path.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: rvenutolo/linpeas:${{ needs.release.outputs.version }}-amd64
          format: cyclonedx-json
          output-file: linpeas-image-amd64.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: attest provenance for SBOM bytes (amd64)
        # Separate from the existing attest-sbom step (which binds the
        # SBOM to the image digest). This attestation's subject is the
        # SBOM file bytes themselves; its bundle becomes the
        # .intoto.jsonl release-asset sidecar consumed by Scorecard.
        id: attest-sbom-amd64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: linpeas-image-amd64.cdx.json

      - name: sign SBOM blob (amd64, cosign sign-blob, keyless)
        # Sibling .sigstore bundle for the CycloneDX SBOM release
        # asset. Same trust root as the existing per-image cosign
        # signatures (Fulcio cert minted against this workflow's
        # OIDC token, Rekor transparency entry). Verified at release
        # time by the verify job and weekly by verify-latest-release.yml.
        # Also uploads the SBOM file itself to the release here, since
        # anchore/sbom-action's upload-release-assets does nothing on
        # push / workflow_dispatch triggers.
        env:
          COSIGN_YES: "true"
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          nix shell .#cosign --command cosign sign-blob \
            --bundle linpeas-image-amd64.cdx.json.sigstore \
            linpeas-image-amd64.cdx.json
          gh release upload "${VERSION}" \
            linpeas-image-amd64.cdx.json \
            linpeas-image-amd64.cdx.json.sigstore \
            --clobber

      - name: upload amd64 SBOM provenance sidecar
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          BUNDLE_PATH: ${{ steps.attest-sbom-amd64.outputs.bundle-path }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          cp "${BUNDLE_PATH}" linpeas-image-amd64.cdx.json.intoto.jsonl
          gh release upload "${VERSION}" \
            linpeas-image-amd64.cdx.json.intoto.jsonl --clobber

      - name: attest SBOM for ghcr image (amd64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/rvenutolo/linpeas
          subject-digest: ${{ steps.push.outputs.ghcr_digest || steps.pull.outputs.ghcr_digest }}
          sbom-path: linpeas-image-amd64.cdx.json
          push-to-registry: true

      - name: attest SBOM for Docker Hub image (amd64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: docker.io/rvenutolo/linpeas
          subject-digest: ${{ steps.push.outputs.hub_digest || steps.pull.outputs.hub_digest }}
          sbom-path: linpeas-image-amd64.cdx.json
          push-to-registry: true

      - name: cosign sign per-arch images (amd64, keyless)
        # cosign sign writes a `.sig` tag next to each image in each
        # registry. Signed against the immutable digest captured by the
        # `push` step, NOT the mutable `<tag>-amd64` reference — the
        # signature follows the digest even if a tag is later repointed.
        # Both registries must be reachable; cosign exits non-zero on
        # the first push failure.
        env:
          COSIGN_YES: "true"
          GHCR_DIGEST: ${{ steps.push.outputs.ghcr_digest || steps.pull.outputs.ghcr_digest }}
          HUB_DIGEST: ${{ steps.push.outputs.hub_digest || steps.pull.outputs.hub_digest }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          nix shell .#cosign --command cosign sign \
            "ghcr.io/rvenutolo/linpeas@${GHCR_DIGEST}"
          nix shell .#cosign --command cosign sign \
            "docker.io/rvenutolo/linpeas@${HUB_DIGEST}"

      - name: docker logout
        # Drop registry credentials from ~/.docker/config.json once the
        # push + attest steps are done. The ubuntu-latest runner is
        # ephemeral, but `if: always()` ensures the logout runs even if an
        # intervening step fails — narrows the window for any later-step
        # compromise (e.g. a future SHA-pinned action) to read the creds.
        # Mirrors the docker logout already present in the verify-latest-
        # release.yml cron.
        if: always()
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          docker logout ghcr.io || true
          docker logout docker.io || true

  image-arm64:
    needs: [release, preflight]
    if: (needs.release.outputs.tag-exists == 'false' || inputs.force-republish || (inputs.backfill-tag != '' && needs.preflight.outputs.image-mode == 'full')) && github.repository == 'rvenutolo/linPEAS-flake'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: write # gh release upload (sbom asset)
      packages: write # ghcr docker push
      id-token: write # attest-build-provenance OIDC
      attestations: write # attest-build-provenance write
    outputs:
      ghcr_digest: ${{ steps.push.outputs.ghcr_digest || steps.pull.outputs.ghcr_digest }}
      hub_digest: ${{ steps.push.outputs.hub_digest || steps.pull.outputs.hub_digest }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            auth.docker.io:443
            cache.nixos.org:443
            codeload.github.com:443
            fulcio.sigstore.dev:443
            get.anchore.io:443
            ghcr.io:443
            github.com:443
            hub.docker.com:443
            index.docker.io:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            tarballs.nixos.org:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: build OCI image (arm64)
        if: inputs.backfill-tag == ''
        run: nix build .#linpeas-image --print-build-logs

      - name: login to ghcr
        env:
          GH_TOKEN_INLINE: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          printf '%s' "${GH_TOKEN_INLINE}" \
            | docker login ghcr.io --username "${GH_ACTOR}" --password-stdin

      - name: login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN_RW }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          printf '%s' "${DOCKERHUB_TOKEN}" \
            | docker login docker.io --username "${DOCKERHUB_USERNAME}" --password-stdin

      - name: pull existing image by digest (backfill mode)
        # Source the historic bytes by digest, never by the mutable
        # `<version>-<arch>` tag. The digests come from the `:<version>`
        # OCI index the release published, which is the only in-registry
        # record of what it shipped. Pulling the arch tag instead would
        # hand fresh SLSA attestations and a fresh cosign signature to
        # whatever that tag points at today, and the manifest job would
        # then rebuild and re-sign the index over the substitution — the
        # exact defect scripts/check-manifest-digest-pinned.sh polices
        # everywhere else in the tree.
        id: pull
        if: inputs.backfill-tag != ''
        env:
          VERSION: ${{ needs.release.outputs.version }}
          ARCH: arm64
          GHCR_DIGEST: ${{ needs.preflight.outputs.arm64-ghcr-digest }}
          HUB_DIGEST: ${{ needs.preflight.outputs.arm64-hub-digest }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          # preflight emits these only on image-mode=full, and this step
          # runs only when the image jobs do. An empty or malformed value
          # here means the gate and the digest source disagree, which is
          # a bug to surface, not a case to fall back from.
          if [[ ${GHCR_DIGEST} != sha256:* ]]; then
            printf 'preflight supplied no ghcr digest for %s: %q\n' "${ARCH}" "${GHCR_DIGEST}" >&2
            exit 1
          fi
          if [[ ${HUB_DIGEST} != sha256:* ]]; then
            printf 'preflight supplied no docker hub digest for %s: %q\n' "${ARCH}" "${HUB_DIGEST}" >&2
            exit 1
          fi
          docker pull "docker.io/rvenutolo/linpeas@${HUB_DIGEST}"
          docker pull "ghcr.io/rvenutolo/linpeas@${GHCR_DIGEST}"
          # The syft SBOM step below addresses the image by its arch tag.
          # Recreating that tag locally, over bytes the daemon already
          # verified against the digest, keeps that step unchanged
          # without reading a tag from a registry.
          docker tag "docker.io/rvenutolo/linpeas@${HUB_DIGEST}" \
            "rvenutolo/linpeas:${VERSION}-${ARCH}"
          # No re-derivation from `docker inspect`: `docker pull` by
          # digest is digest-verified by the daemon, so these are already
          # the digests of the bytes on disk.
          printf 'ghcr_digest=%s\n' "${GHCR_DIGEST}" >>"${GITHUB_OUTPUT}"
          printf 'hub_digest=%s\n' "${HUB_DIGEST}" >>"${GITHUB_OUTPUT}"

      - name: load, tag, push arch image, and capture digests
        # See comment on the amd64 job: docker.io is pushed first to
        # keep the flakier registry in the "all or nothing" position.
        if: inputs.backfill-tag == ''
        id: push
        env:
          VERSION: ${{ needs.release.outputs.version }}
          ARCH: arm64
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          docker load --input result
          for reg in docker.io ghcr.io; do
            docker tag "rvenutolo/linpeas:${VERSION}" "${reg}/rvenutolo/linpeas:${VERSION}-${ARCH}"
            docker push "${reg}/rvenutolo/linpeas:${VERSION}-${ARCH}"
          done
          # See amd64 job for rationale.
          ghcr_digest="$(
            docker inspect "ghcr.io/rvenutolo/linpeas:${VERSION}-${ARCH}" \
              | jq --raw-output \
                  '.[0].RepoDigests[] | select(startswith("ghcr.io/rvenutolo/linpeas@"))' \
              | head -n1
          )"
          hub_digest="$(
            docker inspect "docker.io/rvenutolo/linpeas:${VERSION}-${ARCH}" \
              | jq --raw-output \
                  '.[0].RepoDigests[]
                    | select(startswith("rvenutolo/linpeas@")
                          or startswith("docker.io/rvenutolo/linpeas@"))' \
              | head -n1
          )"
          ghcr_digest="${ghcr_digest#*@}"
          hub_digest="${hub_digest#*@}"
          if [[ "${ghcr_digest}" != sha256:* ]]; then
            printf 'unexpected ghcr digest for %s: %s\n' "${ARCH}" "${ghcr_digest}" >&2
            exit 1
          fi
          if [[ "${hub_digest}" != sha256:* ]]; then
            printf 'unexpected docker hub digest for %s: %s\n' "${ARCH}" "${hub_digest}" >&2
            exit 1
          fi
          printf 'ghcr_digest=%s\n' "${ghcr_digest}" >> "${GITHUB_OUTPUT}"
          printf 'hub_digest=%s\n' "${hub_digest}" >> "${GITHUB_OUTPUT}"

      - name: attest provenance for ghcr image (arm64)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/rvenutolo/linpeas
          subject-digest: ${{ steps.push.outputs.ghcr_digest || steps.pull.outputs.ghcr_digest }}
          push-to-registry: true

      - name: attest provenance for Docker Hub image (arm64)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/rvenutolo/linpeas
          subject-digest: ${{ steps.push.outputs.hub_digest || steps.pull.outputs.hub_digest }}
          push-to-registry: true

      - name: generate SBOM for OCI image (arm64)
        # CycloneDX-JSON SBOM for the arm64 image. Mirrors amd64 step;
        # see that step for format + upload rationale.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: rvenutolo/linpeas:${{ needs.release.outputs.version }}-arm64
          format: cyclonedx-json
          output-file: linpeas-image-arm64.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: attest provenance for SBOM bytes (arm64)
        # See amd64 job for rationale.
        id: attest-sbom-arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: linpeas-image-arm64.cdx.json

      - name: sign SBOM blob (arm64, cosign sign-blob, keyless)
        # See amd64 job for rationale.
        env:
          COSIGN_YES: "true"
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          nix shell .#cosign --command cosign sign-blob \
            --bundle linpeas-image-arm64.cdx.json.sigstore \
            linpeas-image-arm64.cdx.json
          gh release upload "${VERSION}" \
            linpeas-image-arm64.cdx.json \
            linpeas-image-arm64.cdx.json.sigstore \
            --clobber

      - name: upload arm64 SBOM provenance sidecar
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          BUNDLE_PATH: ${{ steps.attest-sbom-arm64.outputs.bundle-path }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          cp "${BUNDLE_PATH}" linpeas-image-arm64.cdx.json.intoto.jsonl
          gh release upload "${VERSION}" \
            linpeas-image-arm64.cdx.json.intoto.jsonl --clobber

      - name: attest SBOM for ghcr image (arm64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/rvenutolo/linpeas
          subject-digest: ${{ steps.push.outputs.ghcr_digest || steps.pull.outputs.ghcr_digest }}
          sbom-path: linpeas-image-arm64.cdx.json
          push-to-registry: true

      - name: attest SBOM for Docker Hub image (arm64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: docker.io/rvenutolo/linpeas
          subject-digest: ${{ steps.push.outputs.hub_digest || steps.pull.outputs.hub_digest }}
          sbom-path: linpeas-image-arm64.cdx.json
          push-to-registry: true

      - name: cosign sign per-arch images (arm64, keyless)
        # See amd64 job for rationale.
        env:
          COSIGN_YES: "true"
          GHCR_DIGEST: ${{ steps.push.outputs.ghcr_digest || steps.pull.outputs.ghcr_digest }}
          HUB_DIGEST: ${{ steps.push.outputs.hub_digest || steps.pull.outputs.hub_digest }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          nix shell .#cosign --command cosign sign \
            "ghcr.io/rvenutolo/linpeas@${GHCR_DIGEST}"
          nix shell .#cosign --command cosign sign \
            "docker.io/rvenutolo/linpeas@${HUB_DIGEST}"

      - name: docker logout
        # See amd64 job for rationale.
        if: always()
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          docker logout ghcr.io || true
          docker logout docker.io || true

  manifest:
    needs: [release, image-amd64, image-arm64, preflight]
    if: (needs.release.outputs.tag-exists == 'false' || inputs.force-republish || (inputs.backfill-tag != '' && needs.preflight.outputs.image-mode == 'full')) && github.repository == 'rvenutolo/linPEAS-flake'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write # ghcr manifest push
      id-token: write # cosign keyless OIDC for multi-arch index signing
    outputs:
      ghcr_index_digest: ${{ steps.create.outputs.ghcr_index_digest }}
      hub_index_digest: ${{ steps.create.outputs.hub_index_digest }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            auth.docker.io:443
            cache.nixos.org:443
            codeload.github.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            hub.docker.com:443
            index.docker.io:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            tarballs.nixos.org:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: login to ghcr
        env:
          GH_TOKEN_INLINE: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          printf '%s' "${GH_TOKEN_INLINE}" \
            | docker login ghcr.io --username "${GH_ACTOR}" --password-stdin

      - name: login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN_RW }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          printf '%s' "${DOCKERHUB_TOKEN}" \
            | docker login docker.io --username "${DOCKERHUB_USERNAME}" --password-stdin

      - name: create + push multi-arch manifests
        # `docker buildx imagetools create` is the modern multi-arch
        # manifest tool — supersedes `docker manifest create` and works
        # cleanly against per-arch refs that already exist in the registry.
        # Each create makes one OCI index tag pointing at both arch digests.
        #
        # Source refs are the immutable `@sha256:` digests
        # captured by the per-arch `image-*` jobs at push time, NOT the
        # mutable `${VERSION}-amd64` / `${VERSION}-arm64` tags. Tags can
        # be rewritten between the per-arch push and this step (registry
        # incident, credential compromise, manual re-run race); digests
        # cannot. Using digests guarantees the manifest references the
        # exact bytes that the `attest-build-provenance` step attested.
        #
        # In backfill mode the per-arch digests are read from the
        # registry rather than from a fresh push, so the index
        # rebuilt here is byte-identical to the one originally
        # published. cosign sign on the same index digest is
        # idempotent (Rekor accepts the new entry; verification
        # passes against either).
        id: create
        env:
          VERSION: ${{ needs.release.outputs.version }}
          WRITE_LATEST: ${{ needs.release.outputs.write-latest }}
          GHCR_AMD64_DIGEST: ${{ needs.image-amd64.outputs.ghcr_digest }}
          GHCR_ARM64_DIGEST: ${{ needs.image-arm64.outputs.ghcr_digest }}
          HUB_AMD64_DIGEST: ${{ needs.image-amd64.outputs.hub_digest }}
          HUB_ARM64_DIGEST: ${{ needs.image-arm64.outputs.hub_digest }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          # `:latest` is written only when the release job decided this
          # run's tag is the newest release; a historic backfill leaves it
          # untouched.
          dsts=("${VERSION}")
          if [[ "${WRITE_LATEST}" == "true" ]]; then
            dsts+=(latest)
          fi
          for dst in "${dsts[@]}"; do
            docker buildx imagetools create \
              --tag "ghcr.io/rvenutolo/linpeas:${dst}" \
              "ghcr.io/rvenutolo/linpeas@${GHCR_AMD64_DIGEST}" \
              "ghcr.io/rvenutolo/linpeas@${GHCR_ARM64_DIGEST}"
            docker buildx imagetools create \
              --tag "docker.io/rvenutolo/linpeas:${dst}" \
              "docker.io/rvenutolo/linpeas@${HUB_AMD64_DIGEST}" \
              "docker.io/rvenutolo/linpeas@${HUB_ARM64_DIGEST}"
          done
          # Capture the OCI index digest of `:VERSION` on each registry.
          # When `:latest` is written it resolves to the same bytes as
          # `:VERSION` (created from the same source refs), so a single
          # signature per registry covers both — the signature is bound to
          # the index digest, not the tag.
          ghcr_index_digest="$(
            docker buildx imagetools inspect --raw \
              "ghcr.io/rvenutolo/linpeas:${VERSION}" \
              | sha256sum \
              | awk '{print "sha256:" $1}'
          )"
          hub_index_digest="$(
            docker buildx imagetools inspect --raw \
              "docker.io/rvenutolo/linpeas:${VERSION}" \
              | sha256sum \
              | awk '{print "sha256:" $1}'
          )"
          if [[ "${ghcr_index_digest}" != sha256:* ]]; then
            printf 'unexpected ghcr index digest: %s\n' "${ghcr_index_digest}" >&2
            exit 1
          fi
          if [[ "${hub_index_digest}" != sha256:* ]]; then
            printf 'unexpected docker hub index digest: %s\n' "${hub_index_digest}" >&2
            exit 1
          fi
          printf 'ghcr_index_digest=%s\n' "${ghcr_index_digest}" >> "${GITHUB_OUTPUT}"
          printf 'hub_index_digest=%s\n' "${hub_index_digest}" >> "${GITHUB_OUTPUT}"

      - name: cosign sign multi-arch index (keyless)
        # Signs the OCI index digest on each registry. cosign writes a
        # `.sig` tag at `<digest>` so that `cosign verify` against
        # `:VERSION` — and `:latest`, whenever it resolves to the same
        # digest — succeeds. Index-level signing complements the per-arch
        # signatures from the image-* jobs.
        env:
          COSIGN_YES: "true"
          GHCR_INDEX_DIGEST: ${{ steps.create.outputs.ghcr_index_digest }}
          HUB_INDEX_DIGEST: ${{ steps.create.outputs.hub_index_digest }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          nix shell .#cosign --command cosign sign \
            "ghcr.io/rvenutolo/linpeas@${GHCR_INDEX_DIGEST}"
          nix shell .#cosign --command cosign sign \
            "docker.io/rvenutolo/linpeas@${HUB_INDEX_DIGEST}"

      - name: docker logout
        # See image-amd64 job for rationale. The manifest job
        # also logs in to both registries and `imagetools create` is the
        # last credential-requiring step.
        if: always()
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          docker logout ghcr.io || true
          docker logout docker.io || true

  changelog:
    # Decoupled from manifest and gated on release success (not the tag-exists
    # first-publish edge alone) so a re-run recovers a changelog that never
    # landed: the release job creates the tag early, so a plain
    # tag-exists == 'false' gate skips the job on every recovery path. Runs on
    # first publish or force-republish; the regen step is idempotent, so a
    # re-run where the changelog is already current is a clean no-op.
    needs: [release]
    if: >-
      !cancelled()
      && needs.release.result == 'success'
      && (needs.release.outputs.tag-exists == 'false' || inputs.force-republish)
      && github.repository == 'rvenutolo/linPEAS-flake'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            cache.nixos.org:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.BUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}
          # Least-privilege scope: PUT /contents on a feature branch
          # (contents:write) plus open/auto-merge the changelog PR
          # (pull-requests:write). protect-main bypass_actors == [] so
          # direct-to-main commits are blocked; PR + auto-merge is the
          # only path that satisfies the pull_request rule.
          permission-contents: write
          permission-pull-requests: write

      - name: re-validate pin version shape
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          # Defense-in-depth at the credential boundary. Mirrors the release
          # job's shape-check and the canonical pin regex enforced across
          # bump-linpeas.sh, flake.nix, stale-pin-check.yml, cliff.toml,
          # and gen-dashboard-data.sh.
          if [[ ! "${VERSION}" =~ ^[0-9]{8}-[0-9a-f]{7,40}$ ]]; then
            printf 'refusing to update changelog with non-conformant version: %q\n' "${VERSION}" >&2
            exit 1
          fi

      - name: regenerate CHANGELOG.md
        id: regen
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          nix shell .#git-cliff --command git-cliff \
            --config cliff.toml \
            --output CHANGELOG.md
          # Idempotent: no diff means the committed changelog already covers
          # this release (a recovery re-run, or the changelog already landed),
          # so there is nothing to open a PR for. A recovery re-run has to
          # reach the jobs downstream of this one, so an empty diff is a
          # clean no-op rather than an abort.
          if git diff --quiet CHANGELOG.md; then
            printf 'CHANGELOG.md already current; no changelog PR needed\n'
            printf 'changed=false\n' >>"${GITHUB_OUTPUT}"
          else
            printf 'changed=true\n' >>"${GITHUB_OUTPUT}"
          fi

      - name: render latest section for release body
        if: steps.regen.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          nix shell .#git-cliff --command git-cliff \
            --config cliff.toml \
            --latest \
            --strip header > .release-notes.md

      - name: commit CHANGELOG.md via PR + auto-merge
        if: steps.regen.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          # protect-main ruleset has pull_request rule + bypass_actors == [].
          # Direct PUT /contents to branch=main returns HTTP 409
          # "Changes must be made through a pull request." Mirror the
          # update-linpeas.yml push-and-merge pattern: PUT to feature
          # branch, open PR, auto-merge once required checks pass.
          branch="chore/changelog-${VERSION}"
          api_header="X-GitHub-Api-Version: 2022-11-28"

          # Idempotency gate. The branch is version-based, so a re-run for
          # the same release targets the same branch. `gh pr view` returns
          # PRs in any state, so inspect state explicitly before touching
          # the ref.
          pr_state="$(gh pr view "${branch}" --json state --jq .state 2>/dev/null || true)"
          case "${pr_state}" in
          OPEN)
            # Reuse the existing PR; its ref is rebased to main HEAD below
            # (strict required-status policy needs the branch current).
            open_pr=true
            ;;
          CLOSED|MERGED)
            # PR already closed (declined) or merged (shipped). Recreating
            # would overwrite that outcome. Fail loudly so notify files an
            # issue.
            printf 'PR for %s already in state %s - aborting\n' "${branch}" "${pr_state}" >&2
            exit 1
            ;;
          '')
            open_pr=false
            ;;
          *)
            printf 'unexpected PR state %q for %s\n' "${pr_state}" "${branch}" >&2
            exit 1
            ;;
          esac

          # Cut from main, never from the release tag. The tag must stay
          # an ancestor of the changelog commit produced here, because
          # scripts/check-changelog-fresh.sh compares a release tag only
          # while that holds. Branching from the tag instead would make
          # every release's own changelog PR exempt from the freshness
          # guard. See docs/development/changelog.md.
          base_sha="$(gh api "repos/${REPO}/git/refs/heads/main" \
            --jq .object.sha --header "${api_header}")"

          if [[ "${open_pr}" == true ]]; then
            # Rebase the open PR's branch onto main HEAD. protect-main sets
            # strict_required_status_checks_policy: true, so the PR cannot
            # merge while behind. PATCH /refs with force=true rewrites the
            # branch tip without closing the PR.
            printf 'rebasing open PR for %s onto main HEAD %s\n' "${branch}" "${base_sha}"
            gh api --method PATCH "repos/${REPO}/git/refs/heads/${branch}" \
              --raw-field sha="${base_sha}" \
              --field force=true \
              --header "${api_header}" >/dev/null
          else
            # Delete stale orphan branch ref (no PR attached) if a prior
            # failed run left one behind. Safe: the PR-state gate above
            # already rejected the case where a PR — open or closed —
            # references this ref.
            if gh api "repos/${REPO}/git/refs/heads/${branch}" \
              --header "${api_header}" >/dev/null 2>&1; then
              gh api --method DELETE "repos/${REPO}/git/refs/heads/${branch}" \
                --header "${api_header}"
            fi
            gh api --method POST "repos/${REPO}/git/refs" \
              --field ref="refs/heads/${branch}" \
              --field sha="${base_sha}" \
              --header "${api_header}" >/dev/null
          fi

          changelog_b64="$(base64 --wrap=0 CHANGELOG.md)"
          put_args=(
            --method PUT "repos/${REPO}/contents/CHANGELOG.md"
            --field message="docs: update changelog for ${VERSION}"
            --field content="${changelog_b64}"
            --field branch="${branch}"
            --header "${api_header}"
          )
          if blob_sha="$(gh api "repos/${REPO}/contents/CHANGELOG.md?ref=${branch}" \
            --header "${api_header}" --jq .sha 2>/dev/null)"; then
            put_args+=(--field sha="${blob_sha}")
          fi
          gh api "${put_args[@]}" >/dev/null

          if [[ "${open_pr}" == false ]]; then
            pr_body="$(printf 'Auto-generated changelog refresh for release %s.\n\nGenerator-owned: regenerated by git-cliff in the release-on-bump.yml changelog job.\n' "${VERSION}")"
            gh pr create \
              --base main \
              --head "${branch}" \
              --title "docs: update changelog for ${VERSION}" \
              --body "${pr_body}"
          fi

          # Arm auto-merge, then block until it lands rather than firing and
          # forgetting: `gh pr merge --auto` returns 0 as soon as auto-merge
          # is armed, so without this poll the job reported success while the
          # changelog PR sat open (and, once tag-exists flipped true, could
          # never re-run to rebase it). Fail on a closed PR or a stall so the
          # notify job surfaces it; a re-run (force-republish) then recovers.
          # `gh pr view` by number still resolves after --delete-branch.
          pr_number="$(gh pr view "${branch}" --json number --jq .number)"
          gh pr merge "${pr_number}" --auto --merge --delete-branch
          deadline=$(($(date +%s) + 720))
          while :; do
            state="$(gh pr view "${pr_number}" --json state --jq .state)"
            if [[ "${state}" == MERGED ]]; then
              printf 'changelog PR #%s merged\n' "${pr_number}"
              break
            fi
            if [[ "${state}" == CLOSED ]]; then
              printf 'changelog PR #%s was closed without merging\n' "${pr_number}" >&2
              exit 1
            fi
            if (($(date +%s) > deadline)); then
              printf 'changelog PR #%s did not merge within 12m; auto-merge armed but required checks may be stuck or conflicting\n' "${pr_number}" >&2
              exit 1
            fi
            sleep 20
          done

      - name: patch release body with changelog section
        if: steps.regen.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          {
            cat .release-notes.md
            printf '\n\n---\n\nTracks upstream [peass-ng/PEASS-ng@%s](https://github.com/peass-ng/PEASS-ng/releases/tag/%s).\n' \
              "${VERSION}" "${VERSION}"
          } > .release-body.md
          gh release edit "${VERSION}" --notes-file .release-body.md

  verify:
    # Synchronous verification of the just-published image and pin
    # attestations. Runs after the image jobs. Failure = release workflow
    # goes red so broken-at-creation attestations surface immediately.
    needs: [release, image-amd64, image-arm64, manifest, preflight]
    if: >-
      !cancelled()
      && needs.release.result == 'success'
      && (needs.release.outputs.tag-exists == 'false' || inputs.force-republish || inputs.backfill-tag != '')
      && github.repository == 'rvenutolo/linPEAS-flake'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
      packages: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          # No timestamp.sigstore.dev: this job only verifies (cosign
          # verify / verify-blob), and the TSA is signing-only.
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            auth.docker.io:443
            cache.nixos.org:443
            codeload.github.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            hub.docker.com:443
            index.docker.io:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            tarballs.nixos.org:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: verify per-arch attestations
        if: needs.preflight.outputs.image-mode == 'full'
        # `gh attestation verify` reads attestations from the Sigstore
        # transparency log + the GitHub API; it does NOT require docker
        # registry credentials. Dropping the docker login pair here
        # shrinks the blast radius of any compromised step inside the
        # verify job — neither DOCKERHUB_TOKEN_RW nor a long-lived
        # ghcr token enters this job's env.
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_AMD64_DIGEST: ${{ needs.image-amd64.outputs.ghcr_digest }}
          HUB_AMD64_DIGEST: ${{ needs.image-amd64.outputs.hub_digest }}
          GHCR_ARM64_DIGEST: ${{ needs.image-arm64.outputs.ghcr_digest }}
          HUB_ARM64_DIGEST: ${{ needs.image-arm64.outputs.hub_digest }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          for ref in \
            "oci://ghcr.io/rvenutolo/linpeas@${GHCR_AMD64_DIGEST}" \
            "oci://docker.io/rvenutolo/linpeas@${HUB_AMD64_DIGEST}" \
            "oci://ghcr.io/rvenutolo/linpeas@${GHCR_ARM64_DIGEST}" \
            "oci://docker.io/rvenutolo/linpeas@${HUB_ARM64_DIGEST}"; do
            gh attestation verify "${ref}" --repo rvenutolo/linPEAS-flake
          done

      - name: cosign verify per-arch + multi-arch images (keyless)
        if: needs.preflight.outputs.image-mode == 'full'
        # Same identity pinning as the `verify per-arch attestations` step
        # above. Covers all four per-arch digests (signed by image-amd64 /
        # image-arm64) plus both multi-arch index digests (signed by the
        # manifest job). Anonymous registry reads only — no docker login
        # here, matching the existing `verify per-arch attestations` step's
        # rationale.
        env:
          COSIGN_IDENTITY: https://github.com/rvenutolo/linPEAS-flake/.github/workflows/release-on-bump.yml@refs/heads/main
          COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com
          GHCR_AMD64_DIGEST: ${{ needs.image-amd64.outputs.ghcr_digest }}
          HUB_AMD64_DIGEST: ${{ needs.image-amd64.outputs.hub_digest }}
          GHCR_ARM64_DIGEST: ${{ needs.image-arm64.outputs.ghcr_digest }}
          HUB_ARM64_DIGEST: ${{ needs.image-arm64.outputs.hub_digest }}
          GHCR_INDEX_DIGEST: ${{ needs.manifest.outputs.ghcr_index_digest }}
          HUB_INDEX_DIGEST: ${{ needs.manifest.outputs.hub_index_digest }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          for ref in \
            "ghcr.io/rvenutolo/linpeas@${GHCR_AMD64_DIGEST}" \
            "docker.io/rvenutolo/linpeas@${HUB_AMD64_DIGEST}" \
            "ghcr.io/rvenutolo/linpeas@${GHCR_ARM64_DIGEST}" \
            "docker.io/rvenutolo/linpeas@${HUB_ARM64_DIGEST}" \
            "ghcr.io/rvenutolo/linpeas@${GHCR_INDEX_DIGEST}" \
            "docker.io/rvenutolo/linpeas@${HUB_INDEX_DIGEST}"; do
            nix shell .#cosign --command cosign verify \
              --certificate-identity "${COSIGN_IDENTITY}" \
              --certificate-oidc-issuer "${COSIGN_OIDC_ISSUER}" \
              "${ref}" > /dev/null
            printf 'cosign verified: %s\n' "${ref}"
          done

      - name: verify pin file attestation
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          # Re-fetch the pin file from the release (avoids any chance of
          # local checkout drift altering the bytes).
          gh release download "${VERSION}" --pattern linpeas-pin.json --clobber
          gh attestation verify linpeas-pin.json --repo rvenutolo/linPEAS-flake

      - name: cosign verify-blob for release-asset sidecars
        # Re-fetch each release asset + .sigstore sidecar from the
        # release rather than relying on the local checkout copy.
        # Matches the rationale of `verify pin file attestation`
        # above: eliminates any chance of local-checkout drift
        # shifting the bytes between sign + verify. Identity pin is
        # the same trust root used by the existing image cosign
        # verify step; check-cosign-identity-pinned.sh enforces the
        # two flags repo-wide so this step is caught by the lint.
        env:
          COSIGN_IDENTITY: https://github.com/rvenutolo/linPEAS-flake/.github/workflows/release-on-bump.yml@refs/heads/main
          COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          IMAGE_MODE: ${{ needs.preflight.outputs.image-mode }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          # Image SBOM sidecars only exist when the release has images.
          # In image-less backfill (image-mode == none) verify only the
          # pin sidecar; the .cdx.json assets are absent by design.
          assets=(linpeas-pin.json)
          if [[ "${IMAGE_MODE}" == full ]]; then
            assets+=(
              linpeas-image-amd64.cdx.json
              linpeas-image-arm64.cdx.json
            )
          fi
          for asset in "${assets[@]}"; do
            gh release download "${VERSION}" \
              --pattern "${asset}" \
              --pattern "${asset}.sigstore" \
              --clobber
            nix shell .#cosign --command cosign verify-blob \
              --certificate-identity "${COSIGN_IDENTITY}" \
              --certificate-oidc-issuer "${COSIGN_OIDC_ISSUER}" \
              --bundle "${asset}.sigstore" \
              "${asset}" >/dev/null
            printf 'cosign verify-blob ok: %s\n' "${asset}"
          done

      - name: verify manifest tags resolve to attested per-arch digests
        if: needs.preflight.outputs.image-mode == 'full'
        # The steps above re-validate the per-arch digests
        # captured at push time, but never confirm the published
        # `:VERSION` / `:latest` manifest tags still point at those exact
        # digests. A registry-side rewrite between the per-arch push and
        # this verify step (push race, credential compromise, manual
        # re-run of just the `manifest` job) would otherwise go undetected.
        # We re-fetch each manifest tag's raw OCI index and assert that
        # each `manifests[].digest` matches the attested per-arch digest.
        env:
          VERSION: ${{ needs.release.outputs.version }}
          WRITE_LATEST: ${{ needs.release.outputs.write-latest }}
          GHCR_AMD64_DIGEST: ${{ needs.image-amd64.outputs.ghcr_digest }}
          HUB_AMD64_DIGEST: ${{ needs.image-amd64.outputs.hub_digest }}
          GHCR_ARM64_DIGEST: ${{ needs.image-arm64.outputs.ghcr_digest }}
          HUB_ARM64_DIGEST: ${{ needs.image-arm64.outputs.hub_digest }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          check() {
            local ref="$1" expected_amd64="$2" expected_arm64="$3"
            local manifest got
            manifest="$(docker buildx imagetools inspect --raw "${ref}")"
            for pair in "amd64:${expected_amd64}" "arm64:${expected_arm64}"; do
              local arch="${pair%%:*}" want="${pair#*:}"
              got="$(printf '%s' "${manifest}" \
                | jq --raw-output --arg a "${arch}" \
                    '.manifests[] | select(.platform.architecture==$a) | .digest')"
              if [[ "${got}" != "${want}" ]]; then
                printf 'manifest drift on %s: want %s for %s, got %s\n' \
                  "${ref}" "${want}" "${arch}" "${got}" >&2
                exit 1
              fi
            done
            printf 'manifest tag %s resolves to attested per-arch digests\n' "${ref}"
          }
          check "ghcr.io/rvenutolo/linpeas:${VERSION}" \
            "${GHCR_AMD64_DIGEST}" "${GHCR_ARM64_DIGEST}"
          check "docker.io/rvenutolo/linpeas:${VERSION}" \
            "${HUB_AMD64_DIGEST}" "${HUB_ARM64_DIGEST}"
          # `:latest` was written by the manifest job only when this run's
          # tag is the newest release; on a historic backfill it still
          # points at the current image, so this run's digests are not
          # what it should resolve to.
          if [[ "${WRITE_LATEST}" == "true" ]]; then
            check "ghcr.io/rvenutolo/linpeas:latest" \
              "${GHCR_AMD64_DIGEST}" "${GHCR_ARM64_DIGEST}"
            check "docker.io/rvenutolo/linpeas:latest" \
              "${HUB_AMD64_DIGEST}" "${HUB_ARM64_DIGEST}"
          else
            printf ':latest not written by this run (historic backfill); parity not asserted\n'
          fi

  notify:
    name: notify
    needs:
      [
        release,
        preflight,
        image-amd64,
        image-arm64,
        manifest,
        changelog,
        verify,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Common Docker Hub causes — parity with dockerhub-sync.yml; keep wording in sync.
      - uses: ./.github/actions/notify-workflow-result
        with:
          # image/verify are gated on `tag-exists == 'false'` so
          # `skipped` is the normal value when the tag already exists.
          # Treat that path as success. A cancelled job anywhere in the
          # pipeline (e.g. timeout) outranks success — the composite
          # files it as an infrastructure failure.
          result: ${{ (needs.release.result == 'failure' || needs.preflight.result == 'failure' || needs.image-amd64.result == 'failure' || needs.image-arm64.result == 'failure' || needs.manifest.result == 'failure' || needs.changelog.result == 'failure' || needs.verify.result == 'failure') && 'failure' || (needs.release.result == 'cancelled' || needs.preflight.result == 'cancelled' || needs.image-amd64.result == 'cancelled' || needs.image-arm64.result == 'cancelled' || needs.manifest.result == 'cancelled' || needs.changelog.result == 'cancelled' || needs.verify.result == 'cancelled') && 'cancelled' || (needs.release.result == 'success') && 'success' || 'skipped' }}
          label: release-on-bump-failure
          title: "release-on-bump: release pipeline failed"
          body: |
            The `release-on-bump` workflow failed.

            - Trigger: `${{ github.event_name }}`
            - release:     `${{ needs.release.result }}`
            - preflight:   `${{ needs.preflight.result }}`
            - image-amd64: `${{ needs.image-amd64.result }}`
            - image-arm64: `${{ needs.image-arm64.result }}`
            - manifest:    `${{ needs.manifest.result }}`
            - changelog:   `${{ needs.changelog.result }}`
            - verify:      `${{ needs.verify.result }}`

            Investigate the failing job's logs. The just-published release may need to be deleted and recut once the underlying bug is fixed.

            ## Half-published image recovery

            If `image-amd64` or `image-arm64` failed, the per-arch job may have left a partially-published state (orphan arch-suffixed tag on one registry, missing on the other). The push loop is ordered `docker.io` then `ghcr.io`, so today the typical orphan is a docker.io `{version}-{arch}` tag with no matching ghcr.io tag.

            Full step-by-step recovery — including the quote-safe Docker Hub API snippets and the `DOCKERHUB_TOKEN_DELETE` scope requirement — lives in [`docs/runbooks/dockerhub-recovery.md`](https://github.com/rvenutolo/linPEAS-flake/blob/main/docs/runbooks/dockerhub-recovery.md). Follow it end-to-end before closing this issue.

            ## Common Docker Hub causes

            If `image-amd64`, `image-arm64`, or `manifest` failed and Docker Hub is
            the suspected culprit:

            - `DOCKERHUB_TOKEN_RW` expired or revoked → rotate at
              <https://hub.docker.com/settings/security> and
              `gh secret set DOCKERHUB_TOKEN_RW`.
            - `DOCKERHUB_USERNAME` mismatch with the `rvenutolo/linpeas` repo owner.
            - Docker Hub partial outage; manual re-run via `workflow_dispatch` is
              often enough.
          label-description: release-on-bump workflow failure
          github-token: ${{ secrets.GITHUB_TOKEN }}
