name: release-on-bump

on:
  push:
    branches: [main]
    paths:
      - linpeas-pin.json

# Workflow default = read-only. Each job declares the writes it actually
# needs, so contents:write / id-token:write / attestations:write /
# packages:write are not silently available to unrelated steps.
permissions:
  contents: read

concurrency:
  # Serialize on `main` rather than per-SHA so back-to-back pin bumps queue
  # through the release pipeline sequentially. Avoids parallel-runs racing
  # the `gh release create` step on the same upstream tag.
  group: release-on-bump-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create + upload
      id-token: write # attest-build-provenance OIDC
      attestations: write # attest-build-provenance write
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag-exists: ${{ steps.exists.outputs.exists }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (D2)
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: read pin version
        id: read
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          printf 'version=%s\n' "$(jq --raw-output .version linpeas-pin.json)" >> "${GITHUB_OUTPUT}"

      - name: check tag exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            printf 'exists=true\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'exists=false\n' >> "${GITHUB_OUTPUT}"
          fi

      - name: create release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          # Defensive shape-check: refuse to publish a release whose version
          # does not match the canonical peass-ng pin shape
          # (YYYYMMDD-<7..40 hex>). Tightened from the prior
          # `^[A-Za-z0-9._/-]+$` allowlist to the same regex enforced at
          # `bump-linpeas.sh`, `flake.nix` eval, `stale-pin-check.yml`, and
          # `gen-dashboard-data.sh`. Closes the NX-PD-1 cross-layer-parity
          # tail item deferred from PR #16 to avoid conflict with PRs
          # #17/#18 on this same workflow.
          if [[ ! "${VERSION}" =~ ^[0-9]{8}-[0-9a-f]{7,40}$ ]]; then
            printf 'refusing to release with non-conformant version: %q\n' "${VERSION}" >&2
            exit 1
          fi
          # GAP-7 (P2.2, 2026-05-17): pin --target to the triggering
          # commit SHA, not the symbolic "main". Without this, if a
          # second push lands on main between this job's checkout and
          # this step, gh release create resolves "main" to the NEWER
          # commit — tag points at SHA-B while attestation records
          # SHA-A. The concurrency: group only serializes runs; it
          # does not freeze main during the window. SHA pinning closes
          # the TOCTOU.
          gh release create "${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "${VERSION}" \
            --notes "Tracks upstream [peass-ng/PEASS-ng@${VERSION}](https://github.com/peass-ng/PEASS-ng/releases/tag/${VERSION})."

      - name: attest provenance for pin file
        if: steps.exists.outputs.exists == 'false'
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2 (D2)
        with:
          subject-path: linpeas-pin.json

      - name: attach pin file to release
        # D12 scheduled verify (verify-latest-release.yml) downloads this asset.
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          gh release upload "${VERSION}" linpeas-pin.json --clobber

  bundle:
    # Per D1: single arch-agnostic asset (`linpeas-bundle.sh`). Built once on Linux.
    needs: release
    if: needs.release.outputs.tag-exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload
      id-token: write # attest-build-provenance OIDC
      attestations: write # attest-build-provenance write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (D2)
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31 (D2)
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install # renovate: datasource=github-releases depName=nix packageName=NixOS/nix
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v3 (D4)

      - name: build bundle
        run: nix build .#linpeas-bundle --print-build-logs

      - name: stage artifact
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          cp -- result/linpeas-bundle.sh linpeas-bundle.sh

      - name: upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          gh release upload "${VERSION}" linpeas-bundle.sh --clobber

      - name: attest provenance for bundle
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2 (D2)
        with:
          subject-path: linpeas-bundle.sh

      - name: generate SBOM for bundle
        # P4.2 / GAP-12: SPDX-JSON SBOM for the arch-agnostic bundle.
        # upload-artifact and upload-release-assets are false; we attach
        # to the release manually below and attest via actions/attest-sbom.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0 (D2)
        with:
          file: linpeas-bundle.sh
          format: spdx-json
          output-file: linpeas-bundle.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: attach SBOM to release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          gh release upload "${VERSION}" linpeas-bundle.sbom.spdx.json --clobber

      - name: attest SBOM for bundle
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0 (D2)
        with:
          subject-path: linpeas-bundle.sh
          sbom-path: linpeas-bundle.sbom.spdx.json

  image-amd64:
    needs: release
    if: needs.release.outputs.tag-exists == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write # ghcr docker push
      id-token: write # attest-build-provenance OIDC
      attestations: write # attest-build-provenance write
    outputs:
      ghcr_digest: ${{ steps.push.outputs.ghcr_digest }}
      hub_digest: ${{ steps.push.outputs.hub_digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (D2)
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31 (D2)
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install # renovate: datasource=github-releases depName=nix packageName=NixOS/nix
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v3 (D4)

      - name: build OCI image (amd64)
        run: nix build .#linpeas-image --print-build-logs

      - name: login to ghcr
        env:
          GH_TOKEN_INLINE: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          printf '%s' "${GH_TOKEN_INLINE}" \
            | docker login ghcr.io --username "${GH_ACTOR}" --password-stdin

      - name: login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          printf '%s' "${DOCKERHUB_TOKEN}" \
            | docker login docker.io --username "${DOCKERHUB_USERNAME}" --password-stdin

      - name: load, tag, push arch image, and capture digests
        # Push the per-arch image to both registries under arch-suffixed
        # tags. The unsuffixed {version} and :latest tags are created later
        # by the `manifest` job via `docker buildx imagetools create`.
        #
        # DH-2 (2026-05-17): docker.io is pushed first, ghcr.io second.
        # docker.io has historically lower availability than ghcr.io; by
        # putting the flakier registry first, a docker.io push failure
        # aborts before ghcr.io is touched, preventing a half-published
        # state where ghcr has the arch tag but docker.io does not. The
        # remaining failure mode (ghcr.io push fails after docker.io
        # succeeded) is less likely and the recovery procedure in the
        # notify body covers it.
        id: push
        env:
          VERSION: ${{ needs.release.outputs.version }}
          ARCH: amd64
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          docker load --input result
          for reg in docker.io ghcr.io; do
            docker tag "rvenutolo/linpeas:${VERSION}" "${reg}/rvenutolo/linpeas:${VERSION}-${ARCH}"
            docker push "${reg}/rvenutolo/linpeas:${VERSION}-${ARCH}"
          done
          # SC-POST-6: deterministic digest selection via `jq` against the
          # JSON output of `docker inspect`. The prior `grep | head -n1`
          # pipeline silently picked the first matching line; if RepoDigests
          # ever contains more than one entry (e.g. multiple aliases), the
          # ordering is non-deterministic. Selecting by repository prefix
          # with `jq` and asserting the resulting digest starts with
          # `sha256:` gives a hard fail rather than a misleading
          # attestation-verify pass against the wrong image.
          ghcr_digest="$(
            docker inspect "ghcr.io/rvenutolo/linpeas:${VERSION}-${ARCH}" \
              | jq --raw-output \
                  '.[0].RepoDigests[] | select(startswith("ghcr.io/rvenutolo/linpeas@"))' \
              | head -n1
          )"
          hub_digest="$(
            docker inspect "docker.io/rvenutolo/linpeas:${VERSION}-${ARCH}" \
              | jq --raw-output \
                  '.[0].RepoDigests[]
                    | select(startswith("rvenutolo/linpeas@")
                          or startswith("docker.io/rvenutolo/linpeas@"))' \
              | head -n1
          )"
          ghcr_digest="${ghcr_digest#*@}"
          hub_digest="${hub_digest#*@}"
          if [[ "${ghcr_digest}" != sha256:* ]]; then
            printf 'unexpected ghcr digest for %s: %s\n' "${ARCH}" "${ghcr_digest}" >&2
            exit 1
          fi
          if [[ "${hub_digest}" != sha256:* ]]; then
            printf 'unexpected docker hub digest for %s: %s\n' "${ARCH}" "${hub_digest}" >&2
            exit 1
          fi
          printf 'ghcr_digest=%s\n' "${ghcr_digest}" >> "${GITHUB_OUTPUT}"
          printf 'hub_digest=%s\n' "${hub_digest}" >> "${GITHUB_OUTPUT}"

      - name: attest provenance for ghcr image (amd64)
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2 (D2)
        with:
          subject-name: ghcr.io/rvenutolo/linpeas
          subject-digest: ${{ steps.push.outputs.ghcr_digest }}
          push-to-registry: true

      - name: attest provenance for Docker Hub image (amd64)
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2 (D2)
        with:
          subject-name: docker.io/rvenutolo/linpeas
          subject-digest: ${{ steps.push.outputs.hub_digest }}
          push-to-registry: true

      - name: generate SBOM for OCI image (amd64)
        # P4.2 / GAP-12: SPDX-JSON SBOM for the amd64 image.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0 (D2)
        with:
          image: rvenutolo/linpeas:${{ needs.release.outputs.version }}-amd64
          format: spdx-json
          output-file: linpeas-image-amd64.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: attest SBOM for ghcr image (amd64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0 (D2)
        with:
          subject-name: ghcr.io/rvenutolo/linpeas
          subject-digest: ${{ steps.push.outputs.ghcr_digest }}
          sbom-path: linpeas-image-amd64.sbom.spdx.json
          push-to-registry: true

      - name: attest SBOM for Docker Hub image (amd64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0 (D2)
        with:
          subject-name: docker.io/rvenutolo/linpeas
          subject-digest: ${{ steps.push.outputs.hub_digest }}
          sbom-path: linpeas-image-amd64.sbom.spdx.json
          push-to-registry: true

      - name: docker logout
        # SC-POST-5: drop registry credentials from ~/.docker/config.json
        # once the push + attest steps are done. The ubuntu-latest runner is
        # ephemeral, but `if: always()` ensures the logout runs even if an
        # intervening step fails — narrows the window for any later-step
        # compromise (e.g. a future SHA-pinned action) to read the creds.
        # Mirrors the docker logout already present in the verify-latest-
        # release.yml cron (SC-POST-1 patch in PR #18).
        if: always()
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          docker logout ghcr.io || true
          docker logout docker.io || true

  image-arm64:
    needs: release
    if: needs.release.outputs.tag-exists == 'false'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      packages: write
      id-token: write
      attestations: write
    outputs:
      ghcr_digest: ${{ steps.push.outputs.ghcr_digest }}
      hub_digest: ${{ steps.push.outputs.hub_digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (D2)
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31 (D2)
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install # renovate: datasource=github-releases depName=nix packageName=NixOS/nix
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v3 (D4)

      - name: build OCI image (arm64)
        run: nix build .#linpeas-image --print-build-logs

      - name: login to ghcr
        env:
          GH_TOKEN_INLINE: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          printf '%s' "${GH_TOKEN_INLINE}" \
            | docker login ghcr.io --username "${GH_ACTOR}" --password-stdin

      - name: login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          printf '%s' "${DOCKERHUB_TOKEN}" \
            | docker login docker.io --username "${DOCKERHUB_USERNAME}" --password-stdin

      - name: load, tag, push arch image, and capture digests
        # See DH-2 comment on the amd64 job: docker.io is pushed first to
        # keep the flakier registry in the "all or nothing" position.
        id: push
        env:
          VERSION: ${{ needs.release.outputs.version }}
          ARCH: arm64
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          docker load --input result
          for reg in docker.io ghcr.io; do
            docker tag "rvenutolo/linpeas:${VERSION}" "${reg}/rvenutolo/linpeas:${VERSION}-${ARCH}"
            docker push "${reg}/rvenutolo/linpeas:${VERSION}-${ARCH}"
          done
          # SC-POST-6: see amd64 job for rationale.
          ghcr_digest="$(
            docker inspect "ghcr.io/rvenutolo/linpeas:${VERSION}-${ARCH}" \
              | jq --raw-output \
                  '.[0].RepoDigests[] | select(startswith("ghcr.io/rvenutolo/linpeas@"))' \
              | head -n1
          )"
          hub_digest="$(
            docker inspect "docker.io/rvenutolo/linpeas:${VERSION}-${ARCH}" \
              | jq --raw-output \
                  '.[0].RepoDigests[]
                    | select(startswith("rvenutolo/linpeas@")
                          or startswith("docker.io/rvenutolo/linpeas@"))' \
              | head -n1
          )"
          ghcr_digest="${ghcr_digest#*@}"
          hub_digest="${hub_digest#*@}"
          if [[ "${ghcr_digest}" != sha256:* ]]; then
            printf 'unexpected ghcr digest for %s: %s\n' "${ARCH}" "${ghcr_digest}" >&2
            exit 1
          fi
          if [[ "${hub_digest}" != sha256:* ]]; then
            printf 'unexpected docker hub digest for %s: %s\n' "${ARCH}" "${hub_digest}" >&2
            exit 1
          fi
          printf 'ghcr_digest=%s\n' "${ghcr_digest}" >> "${GITHUB_OUTPUT}"
          printf 'hub_digest=%s\n' "${hub_digest}" >> "${GITHUB_OUTPUT}"

      - name: attest provenance for ghcr image (arm64)
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2 (D2)
        with:
          subject-name: ghcr.io/rvenutolo/linpeas
          subject-digest: ${{ steps.push.outputs.ghcr_digest }}
          push-to-registry: true

      - name: attest provenance for Docker Hub image (arm64)
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2 (D2)
        with:
          subject-name: docker.io/rvenutolo/linpeas
          subject-digest: ${{ steps.push.outputs.hub_digest }}
          push-to-registry: true

      - name: generate SBOM for OCI image (arm64)
        # P4.2 / GAP-12: SPDX-JSON SBOM for the arm64 image.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0 (D2)
        with:
          image: rvenutolo/linpeas:${{ needs.release.outputs.version }}-arm64
          format: spdx-json
          output-file: linpeas-image-arm64.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: attest SBOM for ghcr image (arm64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0 (D2)
        with:
          subject-name: ghcr.io/rvenutolo/linpeas
          subject-digest: ${{ steps.push.outputs.ghcr_digest }}
          sbom-path: linpeas-image-arm64.sbom.spdx.json
          push-to-registry: true

      - name: attest SBOM for Docker Hub image (arm64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0 (D2)
        with:
          subject-name: docker.io/rvenutolo/linpeas
          subject-digest: ${{ steps.push.outputs.hub_digest }}
          sbom-path: linpeas-image-arm64.sbom.spdx.json
          push-to-registry: true

      - name: docker logout
        # SC-POST-5: see amd64 job for rationale.
        if: always()
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          docker logout ghcr.io || true
          docker logout docker.io || true

  manifest:
    needs: [release, image-amd64, image-arm64]
    if: needs.release.outputs.tag-exists == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write # ghcr manifest push
    steps:
      - name: login to ghcr
        env:
          GH_TOKEN_INLINE: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          printf '%s' "${GH_TOKEN_INLINE}" \
            | docker login ghcr.io --username "${GH_ACTOR}" --password-stdin

      - name: login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          printf '%s' "${DOCKERHUB_TOKEN}" \
            | docker login docker.io --username "${DOCKERHUB_USERNAME}" --password-stdin

      - name: create + push multi-arch manifests
        # `docker buildx imagetools create` is the modern multi-arch
        # manifest tool — supersedes `docker manifest create` and works
        # cleanly against per-arch refs that already exist in the registry.
        # Each create makes one OCI index tag pointing at both arch digests.
        #
        # SC-POST-3: Source refs are the immutable `@sha256:` digests
        # captured by the per-arch `image-*` jobs at push time, NOT the
        # mutable `${VERSION}-amd64` / `${VERSION}-arm64` tags. Tags can
        # be rewritten between the per-arch push and this step (registry
        # incident, credential compromise, manual re-run race); digests
        # cannot. Using digests guarantees the manifest references the
        # exact bytes that the `attest-build-provenance` step attested.
        env:
          VERSION: ${{ needs.release.outputs.version }}
          GHCR_AMD64_DIGEST: ${{ needs.image-amd64.outputs.ghcr_digest }}
          GHCR_ARM64_DIGEST: ${{ needs.image-arm64.outputs.ghcr_digest }}
          HUB_AMD64_DIGEST: ${{ needs.image-amd64.outputs.hub_digest }}
          HUB_ARM64_DIGEST: ${{ needs.image-arm64.outputs.hub_digest }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          for dst in "${VERSION}" latest; do
            docker buildx imagetools create \
              --tag "ghcr.io/rvenutolo/linpeas:${dst}" \
              "ghcr.io/rvenutolo/linpeas@${GHCR_AMD64_DIGEST}" \
              "ghcr.io/rvenutolo/linpeas@${GHCR_ARM64_DIGEST}"
            docker buildx imagetools create \
              --tag "docker.io/rvenutolo/linpeas:${dst}" \
              "docker.io/rvenutolo/linpeas@${HUB_AMD64_DIGEST}" \
              "docker.io/rvenutolo/linpeas@${HUB_ARM64_DIGEST}"
          done

      - name: docker logout
        # SC-POST-5: see image-amd64 job for rationale. The manifest job
        # also logs in to both registries and `imagetools create` is the
        # last credential-requiring step.
        if: always()
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          docker logout ghcr.io || true
          docker logout docker.io || true

  verify:
    # D12 (synchronous): verify the just-published bundle, image, and pin
    # attestations. Runs after both bundle + image jobs. Failure = release
    # workflow goes red so we see broken-at-creation attestations immediately.
    needs: [release, bundle, image-amd64, image-arm64, manifest]
    if: needs.release.outputs.tag-exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
      packages: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (D2)
        with:
          persist-credentials: false

      - name: download bundle from release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        # Release-asset writes are eventually consistent; poll up to 30s for
        # the just-uploaded bundle to become visible before failing.
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          for i in 1 2 3 4 5 6; do
            if gh release download "${VERSION}" --pattern linpeas-bundle.sh; then
              break
            fi
            printf 'asset not yet visible, retry %d/6\n' "${i}" >&2
            sleep 5
          done
          [[ -f linpeas-bundle.sh ]] || { printf 'bundle asset never appeared\n' >&2; exit 1; }

      - name: verify bundle attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          gh attestation verify linpeas-bundle.sh --repo rvenutolo/linPEAS-flake

      - name: verify per-arch attestations
        env:
          GH_TOKEN: ${{ github.token }}
          GH_TOKEN_INLINE: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_AMD64_DIGEST: ${{ needs.image-amd64.outputs.ghcr_digest }}
          HUB_AMD64_DIGEST: ${{ needs.image-amd64.outputs.hub_digest }}
          GHCR_ARM64_DIGEST: ${{ needs.image-arm64.outputs.ghcr_digest }}
          HUB_ARM64_DIGEST: ${{ needs.image-arm64.outputs.hub_digest }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          printf '%s' "${GH_TOKEN_INLINE}" \
            | docker login ghcr.io --username "${GH_ACTOR}" --password-stdin
          printf '%s' "${DOCKERHUB_TOKEN}" \
            | docker login docker.io --username "${DOCKERHUB_USERNAME}" --password-stdin
          for ref in \
            "oci://ghcr.io/rvenutolo/linpeas@${GHCR_AMD64_DIGEST}" \
            "oci://docker.io/rvenutolo/linpeas@${HUB_AMD64_DIGEST}" \
            "oci://ghcr.io/rvenutolo/linpeas@${GHCR_ARM64_DIGEST}" \
            "oci://docker.io/rvenutolo/linpeas@${HUB_ARM64_DIGEST}"; do
            gh attestation verify "${ref}" --repo rvenutolo/linPEAS-flake
          done

      - name: verify pin file attestation
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          # Re-fetch the pin file from the release (avoids any chance of
          # local checkout drift altering the bytes).
          gh release download "${VERSION}" --pattern linpeas-pin.json --clobber
          gh attestation verify linpeas-pin.json --repo rvenutolo/linPEAS-flake

      - name: verify manifest tags resolve to attested per-arch digests
        # SC-POST-2: the steps above re-validate the per-arch digests
        # captured at push time, but never confirm the published
        # `:VERSION` / `:latest` manifest tags still point at those exact
        # digests. A registry-side rewrite between the per-arch push and
        # this verify step (push race, credential compromise, manual
        # re-run of just the `manifest` job) would otherwise go undetected.
        # We re-fetch each manifest tag's raw OCI index and assert that
        # each `manifests[].digest` matches the attested per-arch digest.
        env:
          VERSION: ${{ needs.release.outputs.version }}
          GHCR_AMD64_DIGEST: ${{ needs.image-amd64.outputs.ghcr_digest }}
          HUB_AMD64_DIGEST: ${{ needs.image-amd64.outputs.hub_digest }}
          GHCR_ARM64_DIGEST: ${{ needs.image-arm64.outputs.ghcr_digest }}
          HUB_ARM64_DIGEST: ${{ needs.image-arm64.outputs.hub_digest }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          check() {
            local ref="$1" expected_amd64="$2" expected_arm64="$3"
            local manifest got
            manifest="$(docker buildx imagetools inspect --raw "${ref}")"
            for pair in "amd64:${expected_amd64}" "arm64:${expected_arm64}"; do
              local arch="${pair%%:*}" want="${pair#*:}"
              got="$(printf '%s' "${manifest}" \
                | jq --raw-output --arg a "${arch}" \
                    '.manifests[] | select(.platform.architecture==$a) | .digest')"
              if [[ "${got}" != "${want}" ]]; then
                printf 'manifest drift on %s: want %s for %s, got %s\n' \
                  "${ref}" "${want}" "${arch}" "${got}" >&2
                exit 1
              fi
            done
            printf 'manifest tag %s resolves to attested per-arch digests\n' "${ref}"
          }
          check "ghcr.io/rvenutolo/linpeas:${VERSION}" \
            "${GHCR_AMD64_DIGEST}" "${GHCR_ARM64_DIGEST}"
          check "ghcr.io/rvenutolo/linpeas:latest" \
            "${GHCR_AMD64_DIGEST}" "${GHCR_ARM64_DIGEST}"
          check "docker.io/rvenutolo/linpeas:${VERSION}" \
            "${HUB_AMD64_DIGEST}" "${HUB_ARM64_DIGEST}"
          check "docker.io/rvenutolo/linpeas:latest" \
            "${HUB_AMD64_DIGEST}" "${HUB_ARM64_DIGEST}"

      - name: docker logout
        # SC-POST-5: drop docker registry credentials at the end of the
        # verify job. The `verify per-arch attestations` step logs in to
        # both registries; the subsequent `verify manifest tags` step uses
        # `docker buildx imagetools inspect` which also reads those creds.
        # Logout once both have completed.
        if: always()
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          docker logout ghcr.io || true
          docker logout docker.io || true

  notify:
    name: notify
    needs: [release, bundle, image-amd64, image-arm64, manifest, verify]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (D2)
        with:
          persist-credentials: false
      # Common Docker Hub causes — parity with dockerhub-sync.yml; keep wording in sync.
      - uses: ./.github/actions/notify-workflow-result
        with:
          # bundle/image/verify are gated on `tag-exists == 'false'` so
          # `skipped` is the normal value when the tag already exists.
          # Treat that path as success.
          result: ${{ (needs.release.result == 'failure' || needs.bundle.result == 'failure' || needs.image-amd64.result == 'failure' || needs.image-arm64.result == 'failure' || needs.manifest.result == 'failure' || needs.verify.result == 'failure') && 'failure' || (needs.release.result == 'success') && 'success' || 'skipped' }}
          label: release-on-bump-failure
          title: "release-on-bump: release pipeline failed"
          body: |
            The `release-on-bump` workflow failed.

            - Trigger: `${{ github.event_name }}`
            - release:     `${{ needs.release.result }}`
            - bundle:      `${{ needs.bundle.result }}`
            - image-amd64: `${{ needs.image-amd64.result }}`
            - image-arm64: `${{ needs.image-arm64.result }}`
            - manifest:    `${{ needs.manifest.result }}`
            - verify:      `${{ needs.verify.result }}`

            Investigate the failing job's logs. The just-published release may need to be deleted and recut once the underlying bug is fixed.

            ## Half-published image recovery (DH-2)

            If `image-amd64` or `image-arm64` failed, the per-arch job may have left a partially-published state. The push loop is ordered `docker.io` then `ghcr.io`, so:

            - **docker.io push failed**: nothing was pushed to either registry for that arch. No cleanup needed beyond the release-delete/recut below.
            - **ghcr.io push failed (docker.io succeeded)**: docker.io has the arch-suffixed tag for that arch but ghcr.io does not. The `manifest` job is skipped, so neither registry has the unsuffixed `{version}` or `:latest` tags. Recovery requires deleting the orphan docker.io arch tag before retrying.

            Recovery procedure:

            1. Identify the failing arch (`amd64` or `arm64`) and the release `VERSION` (the pin version, e.g. `20260516-deadbee`).
            2. Delete the GitHub release and tag to keep release-creation idempotent on retry:
               ```bash
               gh release delete "${VERSION}" --repo rvenutolo/linPEAS-flake --cleanup-tag --yes
               ```
            3. Delete orphan arch-suffixed tags so the next run starts from a clean state:
               - **ghcr.io** (if ghcr push succeeded but docker.io failed — does not apply with current push order, but kept for completeness):
                 ```bash
                 gh api -X DELETE \
                   "/user/packages/container/linpeas/versions" \
                   --jq '.[] | select(.metadata.container.tags[]? == "'"${VERSION}-${ARCH}"'") | .id' \
                   | xargs -I{} gh api -X DELETE "/user/packages/container/linpeas/versions/{}"
                 ```
               - **docker.io** (if docker.io push succeeded but ghcr.io failed):
                 ```bash
                 TOKEN=$(curl -fsS -u "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
                   -H 'Content-Type: application/json' \
                   -X POST 'https://hub.docker.com/v2/users/login' \
                   -d '{"username":"'"${DOCKERHUB_USERNAME}"'","password":"'"${DOCKERHUB_TOKEN}"'"}' \
                   | jq --raw-output .token)
                 curl -fsS -X DELETE \
                   -H "Authorization: JWT ${TOKEN}" \
                   "https://hub.docker.com/v2/repositories/rvenutolo/linpeas/tags/${VERSION}-${ARCH}/"
                 ```
                 (Tag delete on Docker Hub requires the `Delete` scope on `DOCKERHUB_TOKEN`. If the rotated token is `Read, Write` only, do this from the maintainer's Docker Hub UI instead.)
            4. Re-trigger the release pipeline by re-pushing the same `linpeas-pin.json` commit (no-op edit + `chore: retrigger release` commit), or by re-running this workflow from the Actions UI if the pin commit is still HEAD.
            5. Confirm the next run goes green end-to-end before closing this issue.

            ## Common Docker Hub causes

            If `image-amd64`, `image-arm64`, or `manifest` failed and Docker Hub is
            the suspected culprit:

            - `DOCKERHUB_TOKEN` expired or revoked → rotate at
              <https://hub.docker.com/settings/security> and
              `gh secret set DOCKERHUB_TOKEN`.
            - `DOCKERHUB_USERNAME` mismatch with the `rvenutolo/linpeas` repo owner.
            - Docker Hub partial outage; manual re-run via `workflow_dispatch` is
              often enough.
          label-description: release-on-bump workflow failure
          github-token: ${{ secrets.GITHUB_TOKEN }}
