name: release-on-bump

on:
  push:
    branches: [main]
    paths:
      - linpeas-pin.json
  workflow_dispatch:
    inputs:
      force-republish:
        description: |
          Republish images + manifest for the version currently in
          linpeas-pin.json, even if the GitHub release already exists.
          The `release` job remains gated by `tag-exists`,
          so existing release assets are preserved. Used to recover from
          registry-side artifact loss
          (e.g. Docker Hub repo wiped, missing per-arch tags).
        required: false
        default: false
        type: boolean

# Workflow default = empty. Each job declares the exact scopes it
# needs, so contents:write / id-token:write / attestations:write /
# packages:write are not silently available to unrelated steps.
permissions: {}

concurrency:
  # Serialize on `main` rather than per-SHA so back-to-back pin bumps queue
  # through the release pipeline sequentially. Avoids parallel-runs racing
  # the `gh release create` step on the same upstream tag.
  group: release-on-bump-main
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'rvenutolo/linPEAS-flake'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # gh release create + upload
      id-token: write # attest-build-provenance OIDC
      attestations: write # attest-build-provenance write
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag-exists: ${{ steps.exists.outputs.exists }}
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: read pin version
        id: read
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          printf 'version=%s\n' "$(jq --raw-output .version linpeas-pin.json)" >> "${GITHUB_OUTPUT}"

      - name: check tag exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            printf 'exists=true\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'exists=false\n' >> "${GITHUB_OUTPUT}"
          fi

      - name: create release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          # Defensive shape-check: refuse to publish a release whose version
          # does not match the canonical peass-ng pin shape
          # (YYYYMMDD-<7..40 hex>). Same regex enforced at
          # `bump-linpeas.sh`, `flake.nix` eval, `stale-pin-check.yml`, and
          # `gen-dashboard-data.sh`. Cross-layer pin-shape parity.
          if [[ ! "${VERSION}" =~ ^[0-9]{8}-[0-9a-f]{7,40}$ ]]; then
            printf 'refusing to release with non-conformant version: %q\n' "${VERSION}" >&2
            exit 1
          fi
          # Pin --target to the triggering
          # commit SHA, not the symbolic "main". Without this, if a
          # second push lands on main between this job's checkout and
          # this step, gh release create resolves "main" to the NEWER
          # commit — tag points at SHA-B while attestation records
          # SHA-A. The concurrency: group only serializes runs; it
          # does not freeze main during the window. SHA pinning closes
          # the TOCTOU.
          gh release create "${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "${VERSION}" \
            --notes "Tracks upstream [peass-ng/PEASS-ng@${VERSION}](https://github.com/peass-ng/PEASS-ng/releases/tag/${VERSION})."

      - name: attest provenance for pin file
        if: steps.exists.outputs.exists == 'false'
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: linpeas-pin.json

      - name: attach pin file to release
        # The scheduled verify (verify-latest-release.yml) downloads this asset.
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          gh release upload "${VERSION}" linpeas-pin.json --clobber

  image-amd64:
    needs: release
    if: (needs.release.outputs.tag-exists == 'false' || inputs.force-republish) && github.repository == 'rvenutolo/linPEAS-flake'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write # ghcr docker push
      id-token: write # attest-build-provenance OIDC
      attestations: write # attest-build-provenance write
    outputs:
      ghcr_digest: ${{ steps.push.outputs.ghcr_digest }}
      hub_digest: ${{ steps.push.outputs.hub_digest }}
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v3

      - name: build OCI image (amd64)
        run: nix build .#linpeas-image --print-build-logs

      - name: login to ghcr
        env:
          GH_TOKEN_INLINE: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          printf '%s' "${GH_TOKEN_INLINE}" \
            | docker login ghcr.io --username "${GH_ACTOR}" --password-stdin

      - name: login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN_RW }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          printf '%s' "${DOCKERHUB_TOKEN}" \
            | docker login docker.io --username "${DOCKERHUB_USERNAME}" --password-stdin

      - name: load, tag, push arch image, and capture digests
        # Push the per-arch image to both registries under arch-suffixed
        # tags. The unsuffixed {version} and :latest tags are created later
        # by the `manifest` job via `docker buildx imagetools create`.
        #
        # docker.io is pushed first, ghcr.io second. docker.io has
        # historically lower availability than ghcr.io; by putting the
        # flakier registry first, a docker.io push failure aborts
        # before ghcr.io is touched, preventing a half-published state
        # where ghcr has the arch tag but docker.io does not. The
        # remaining failure mode (ghcr.io push fails after docker.io
        # succeeded) is less likely and the recovery procedure in the
        # notify body covers it.
        id: push
        env:
          VERSION: ${{ needs.release.outputs.version }}
          ARCH: amd64
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          docker load --input result
          for reg in docker.io ghcr.io; do
            docker tag "rvenutolo/linpeas:${VERSION}" "${reg}/rvenutolo/linpeas:${VERSION}-${ARCH}"
            docker push "${reg}/rvenutolo/linpeas:${VERSION}-${ARCH}"
          done
          # Deterministic digest selection via `jq` against the
          # JSON output of `docker inspect`. The prior `grep | head -n1`
          # pipeline silently picked the first matching line; if RepoDigests
          # ever contains more than one entry (e.g. multiple aliases), the
          # ordering is non-deterministic. Selecting by repository prefix
          # with `jq` and asserting the resulting digest starts with
          # `sha256:` gives a hard fail rather than a misleading
          # attestation-verify pass against the wrong image.
          ghcr_digest="$(
            docker inspect "ghcr.io/rvenutolo/linpeas:${VERSION}-${ARCH}" \
              | jq --raw-output \
                  '.[0].RepoDigests[] | select(startswith("ghcr.io/rvenutolo/linpeas@"))' \
              | head -n1
          )"
          hub_digest="$(
            docker inspect "docker.io/rvenutolo/linpeas:${VERSION}-${ARCH}" \
              | jq --raw-output \
                  '.[0].RepoDigests[]
                    | select(startswith("rvenutolo/linpeas@")
                          or startswith("docker.io/rvenutolo/linpeas@"))' \
              | head -n1
          )"
          ghcr_digest="${ghcr_digest#*@}"
          hub_digest="${hub_digest#*@}"
          if [[ "${ghcr_digest}" != sha256:* ]]; then
            printf 'unexpected ghcr digest for %s: %s\n' "${ARCH}" "${ghcr_digest}" >&2
            exit 1
          fi
          if [[ "${hub_digest}" != sha256:* ]]; then
            printf 'unexpected docker hub digest for %s: %s\n' "${ARCH}" "${hub_digest}" >&2
            exit 1
          fi
          printf 'ghcr_digest=%s\n' "${ghcr_digest}" >> "${GITHUB_OUTPUT}"
          printf 'hub_digest=%s\n' "${hub_digest}" >> "${GITHUB_OUTPUT}"

      - name: attest provenance for ghcr image (amd64)
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ghcr.io/rvenutolo/linpeas
          subject-digest: ${{ steps.push.outputs.ghcr_digest }}
          push-to-registry: true

      - name: attest provenance for Docker Hub image (amd64)
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: docker.io/rvenutolo/linpeas
          subject-digest: ${{ steps.push.outputs.hub_digest }}
          push-to-registry: true

      - name: generate SBOM for OCI image (amd64)
        # SPDX-JSON SBOM for the amd64 image.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: rvenutolo/linpeas:${{ needs.release.outputs.version }}-amd64
          format: spdx-json
          output-file: linpeas-image-amd64.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: attest SBOM for ghcr image (amd64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/rvenutolo/linpeas
          subject-digest: ${{ steps.push.outputs.ghcr_digest }}
          sbom-path: linpeas-image-amd64.sbom.spdx.json
          push-to-registry: true

      - name: attest SBOM for Docker Hub image (amd64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: docker.io/rvenutolo/linpeas
          subject-digest: ${{ steps.push.outputs.hub_digest }}
          sbom-path: linpeas-image-amd64.sbom.spdx.json
          push-to-registry: true

      - name: cosign sign per-arch images (amd64, keyless)
        # cosign sign writes a `.sig` tag next to each image in each
        # registry. Signed against the immutable digest captured by the
        # `push` step, NOT the mutable `<tag>-amd64` reference — the
        # signature follows the digest even if a tag is later repointed.
        # Both registries must be reachable; cosign exits non-zero on
        # the first push failure.
        env:
          COSIGN_YES: "true"
          GHCR_DIGEST: ${{ steps.push.outputs.ghcr_digest }}
          HUB_DIGEST: ${{ steps.push.outputs.hub_digest }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          nix shell .#cosign --command cosign sign \
            "ghcr.io/rvenutolo/linpeas@${GHCR_DIGEST}"
          nix shell .#cosign --command cosign sign \
            "docker.io/rvenutolo/linpeas@${HUB_DIGEST}"

      - name: docker logout
        # Drop registry credentials from ~/.docker/config.json once the
        # push + attest steps are done. The ubuntu-latest runner is
        # ephemeral, but `if: always()` ensures the logout runs even if an
        # intervening step fails — narrows the window for any later-step
        # compromise (e.g. a future SHA-pinned action) to read the creds.
        # Mirrors the docker logout already present in the verify-latest-
        # release.yml cron.
        if: always()
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          docker logout ghcr.io || true
          docker logout docker.io || true

  image-arm64:
    needs: release
    if: (needs.release.outputs.tag-exists == 'false' || inputs.force-republish) && github.repository == 'rvenutolo/linPEAS-flake'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      packages: write
      id-token: write
      attestations: write
    outputs:
      ghcr_digest: ${{ steps.push.outputs.ghcr_digest }}
      hub_digest: ${{ steps.push.outputs.hub_digest }}
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v3

      - name: build OCI image (arm64)
        run: nix build .#linpeas-image --print-build-logs

      - name: login to ghcr
        env:
          GH_TOKEN_INLINE: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          printf '%s' "${GH_TOKEN_INLINE}" \
            | docker login ghcr.io --username "${GH_ACTOR}" --password-stdin

      - name: login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN_RW }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          printf '%s' "${DOCKERHUB_TOKEN}" \
            | docker login docker.io --username "${DOCKERHUB_USERNAME}" --password-stdin

      - name: load, tag, push arch image, and capture digests
        # See comment on the amd64 job: docker.io is pushed first to
        # keep the flakier registry in the "all or nothing" position.
        id: push
        env:
          VERSION: ${{ needs.release.outputs.version }}
          ARCH: arm64
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          docker load --input result
          for reg in docker.io ghcr.io; do
            docker tag "rvenutolo/linpeas:${VERSION}" "${reg}/rvenutolo/linpeas:${VERSION}-${ARCH}"
            docker push "${reg}/rvenutolo/linpeas:${VERSION}-${ARCH}"
          done
          # See amd64 job for rationale.
          ghcr_digest="$(
            docker inspect "ghcr.io/rvenutolo/linpeas:${VERSION}-${ARCH}" \
              | jq --raw-output \
                  '.[0].RepoDigests[] | select(startswith("ghcr.io/rvenutolo/linpeas@"))' \
              | head -n1
          )"
          hub_digest="$(
            docker inspect "docker.io/rvenutolo/linpeas:${VERSION}-${ARCH}" \
              | jq --raw-output \
                  '.[0].RepoDigests[]
                    | select(startswith("rvenutolo/linpeas@")
                          or startswith("docker.io/rvenutolo/linpeas@"))' \
              | head -n1
          )"
          ghcr_digest="${ghcr_digest#*@}"
          hub_digest="${hub_digest#*@}"
          if [[ "${ghcr_digest}" != sha256:* ]]; then
            printf 'unexpected ghcr digest for %s: %s\n' "${ARCH}" "${ghcr_digest}" >&2
            exit 1
          fi
          if [[ "${hub_digest}" != sha256:* ]]; then
            printf 'unexpected docker hub digest for %s: %s\n' "${ARCH}" "${hub_digest}" >&2
            exit 1
          fi
          printf 'ghcr_digest=%s\n' "${ghcr_digest}" >> "${GITHUB_OUTPUT}"
          printf 'hub_digest=%s\n' "${hub_digest}" >> "${GITHUB_OUTPUT}"

      - name: attest provenance for ghcr image (arm64)
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ghcr.io/rvenutolo/linpeas
          subject-digest: ${{ steps.push.outputs.ghcr_digest }}
          push-to-registry: true

      - name: attest provenance for Docker Hub image (arm64)
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: docker.io/rvenutolo/linpeas
          subject-digest: ${{ steps.push.outputs.hub_digest }}
          push-to-registry: true

      - name: generate SBOM for OCI image (arm64)
        # SPDX-JSON SBOM for the arm64 image.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: rvenutolo/linpeas:${{ needs.release.outputs.version }}-arm64
          format: spdx-json
          output-file: linpeas-image-arm64.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: attest SBOM for ghcr image (arm64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/rvenutolo/linpeas
          subject-digest: ${{ steps.push.outputs.ghcr_digest }}
          sbom-path: linpeas-image-arm64.sbom.spdx.json
          push-to-registry: true

      - name: attest SBOM for Docker Hub image (arm64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: docker.io/rvenutolo/linpeas
          subject-digest: ${{ steps.push.outputs.hub_digest }}
          sbom-path: linpeas-image-arm64.sbom.spdx.json
          push-to-registry: true

      - name: cosign sign per-arch images (arm64, keyless)
        # See amd64 job for rationale.
        env:
          COSIGN_YES: "true"
          GHCR_DIGEST: ${{ steps.push.outputs.ghcr_digest }}
          HUB_DIGEST: ${{ steps.push.outputs.hub_digest }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          nix shell .#cosign --command cosign sign \
            "ghcr.io/rvenutolo/linpeas@${GHCR_DIGEST}"
          nix shell .#cosign --command cosign sign \
            "docker.io/rvenutolo/linpeas@${HUB_DIGEST}"

      - name: docker logout
        # See amd64 job for rationale.
        if: always()
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          docker logout ghcr.io || true
          docker logout docker.io || true

  manifest:
    needs: [release, image-amd64, image-arm64]
    if: (needs.release.outputs.tag-exists == 'false' || inputs.force-republish) && github.repository == 'rvenutolo/linPEAS-flake'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write # ghcr manifest push
      id-token: write # cosign keyless OIDC for multi-arch index signing
    outputs:
      ghcr_index_digest: ${{ steps.create.outputs.ghcr_index_digest }}
      hub_index_digest: ${{ steps.create.outputs.hub_index_digest }}
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v3
      - name: login to ghcr
        env:
          GH_TOKEN_INLINE: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          printf '%s' "${GH_TOKEN_INLINE}" \
            | docker login ghcr.io --username "${GH_ACTOR}" --password-stdin

      - name: login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN_RW }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          printf '%s' "${DOCKERHUB_TOKEN}" \
            | docker login docker.io --username "${DOCKERHUB_USERNAME}" --password-stdin

      - name: create + push multi-arch manifests
        # `docker buildx imagetools create` is the modern multi-arch
        # manifest tool — supersedes `docker manifest create` and works
        # cleanly against per-arch refs that already exist in the registry.
        # Each create makes one OCI index tag pointing at both arch digests.
        #
        # Source refs are the immutable `@sha256:` digests
        # captured by the per-arch `image-*` jobs at push time, NOT the
        # mutable `${VERSION}-amd64` / `${VERSION}-arm64` tags. Tags can
        # be rewritten between the per-arch push and this step (registry
        # incident, credential compromise, manual re-run race); digests
        # cannot. Using digests guarantees the manifest references the
        # exact bytes that the `attest-build-provenance` step attested.
        id: create
        env:
          VERSION: ${{ needs.release.outputs.version }}
          GHCR_AMD64_DIGEST: ${{ needs.image-amd64.outputs.ghcr_digest }}
          GHCR_ARM64_DIGEST: ${{ needs.image-arm64.outputs.ghcr_digest }}
          HUB_AMD64_DIGEST: ${{ needs.image-amd64.outputs.hub_digest }}
          HUB_ARM64_DIGEST: ${{ needs.image-arm64.outputs.hub_digest }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          for dst in "${VERSION}" latest; do
            docker buildx imagetools create \
              --tag "ghcr.io/rvenutolo/linpeas:${dst}" \
              "ghcr.io/rvenutolo/linpeas@${GHCR_AMD64_DIGEST}" \
              "ghcr.io/rvenutolo/linpeas@${GHCR_ARM64_DIGEST}"
            docker buildx imagetools create \
              --tag "docker.io/rvenutolo/linpeas:${dst}" \
              "docker.io/rvenutolo/linpeas@${HUB_AMD64_DIGEST}" \
              "docker.io/rvenutolo/linpeas@${HUB_ARM64_DIGEST}"
          done
          # Capture the OCI index digest of `:VERSION` on each registry.
          # The `:latest` and `:VERSION` tags resolve to identical bytes
          # (created from the same source refs), so a single signature per
          # registry covers both — the signature is bound to the index
          # digest, not the tag.
          ghcr_index_digest="$(
            docker buildx imagetools inspect --raw \
              "ghcr.io/rvenutolo/linpeas:${VERSION}" \
              | sha256sum \
              | awk '{print "sha256:" $1}'
          )"
          hub_index_digest="$(
            docker buildx imagetools inspect --raw \
              "docker.io/rvenutolo/linpeas:${VERSION}" \
              | sha256sum \
              | awk '{print "sha256:" $1}'
          )"
          if [[ "${ghcr_index_digest}" != sha256:* ]]; then
            printf 'unexpected ghcr index digest: %s\n' "${ghcr_index_digest}" >&2
            exit 1
          fi
          if [[ "${hub_index_digest}" != sha256:* ]]; then
            printf 'unexpected docker hub index digest: %s\n' "${hub_index_digest}" >&2
            exit 1
          fi
          printf 'ghcr_index_digest=%s\n' "${ghcr_index_digest}" >> "${GITHUB_OUTPUT}"
          printf 'hub_index_digest=%s\n' "${hub_index_digest}" >> "${GITHUB_OUTPUT}"

      - name: cosign sign multi-arch index (keyless)
        # Signs the OCI index digest on each registry. cosign writes a
        # `.sig` tag at `<digest>` so that `cosign verify` against either
        # `:VERSION` or `:latest` (which resolve to the same digest)
        # succeeds. Index-level signing complements the per-arch
        # signatures from the image-* jobs.
        env:
          COSIGN_YES: "true"
          GHCR_INDEX_DIGEST: ${{ steps.create.outputs.ghcr_index_digest }}
          HUB_INDEX_DIGEST: ${{ steps.create.outputs.hub_index_digest }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          nix shell .#cosign --command cosign sign \
            "ghcr.io/rvenutolo/linpeas@${GHCR_INDEX_DIGEST}"
          nix shell .#cosign --command cosign sign \
            "docker.io/rvenutolo/linpeas@${HUB_INDEX_DIGEST}"

      - name: docker logout
        # See image-amd64 job for rationale. The manifest job
        # also logs in to both registries and `imagetools create` is the
        # last credential-requiring step.
        if: always()
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          docker logout ghcr.io || true
          docker logout docker.io || true

  changelog:
    needs: [release, manifest]
    if: needs.release.outputs.tag-exists == 'false' && github.repository == 'rvenutolo/linPEAS-flake'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.BUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: re-validate pin version shape
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          # Defense-in-depth at the credential boundary. Mirrors the release
          # job's shape-check and the canonical pin regex enforced across
          # bump-linpeas.sh, flake.nix, stale-pin-check.yml, cliff.toml,
          # and gen-dashboard-data.sh.
          if [[ ! "${VERSION}" =~ ^[0-9]{8}-[0-9a-f]{7,40}$ ]]; then
            printf 'refusing to update changelog with non-conformant version: %q\n' "${VERSION}" >&2
            exit 1
          fi

      - name: regenerate CHANGELOG.md
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          nix shell .#git-cliff --command git-cliff \
            --config cliff.toml \
            --output CHANGELOG.md
          if git diff --quiet CHANGELOG.md; then
            printf 'git-cliff produced no diff - aborting\n' >&2
            exit 1
          fi

      - name: render latest section for release body
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          nix shell .#git-cliff --command git-cliff \
            --config cliff.toml \
            --latest \
            --strip header > .release-notes.md

      - name: commit CHANGELOG.md via web-flow App identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          api_header="X-GitHub-Api-Version: 2022-11-28"
          changelog_b64="$(base64 --wrap=0 CHANGELOG.md)"
          if blob_sha="$(gh api "repos/${REPO}/contents/CHANGELOG.md" \
                --header "${api_header}" --jq .sha 2>/dev/null)"; then
            gh api --method PUT "repos/${REPO}/contents/CHANGELOG.md" \
              --field message="docs: update changelog for ${VERSION}" \
              --field content="${changelog_b64}" \
              --field sha="${blob_sha}" \
              --field branch="main" \
              --header "${api_header}" >/dev/null
          else
            gh api --method PUT "repos/${REPO}/contents/CHANGELOG.md" \
              --field message="docs: update changelog for ${VERSION}" \
              --field content="${changelog_b64}" \
              --field branch="main" \
              --header "${api_header}" >/dev/null
          fi

      - name: patch release body with changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          {
            cat .release-notes.md
            printf '\n\n---\n\nTracks upstream [peass-ng/PEASS-ng@%s](https://github.com/peass-ng/PEASS-ng/releases/tag/%s).\n' \
              "${VERSION}" "${VERSION}"
          } > .release-body.md
          gh release edit "${VERSION}" --notes-file .release-body.md

  verify:
    # Synchronous verification of the just-published image and pin
    # attestations. Runs after the image jobs. Failure = release workflow
    # goes red so broken-at-creation attestations surface immediately.
    needs: [release, image-amd64, image-arm64, manifest]
    if: (needs.release.outputs.tag-exists == 'false' || inputs.force-republish) && github.repository == 'rvenutolo/linPEAS-flake'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
      packages: read
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v3
      - name: verify per-arch attestations
        # `gh attestation verify` reads attestations from the Sigstore
        # transparency log + the GitHub API; it does NOT require docker
        # registry credentials. Dropping the docker login pair here
        # shrinks the blast radius of any compromised step inside the
        # verify job — neither DOCKERHUB_TOKEN_RW nor a long-lived
        # ghcr token enters this job's env.
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_AMD64_DIGEST: ${{ needs.image-amd64.outputs.ghcr_digest }}
          HUB_AMD64_DIGEST: ${{ needs.image-amd64.outputs.hub_digest }}
          GHCR_ARM64_DIGEST: ${{ needs.image-arm64.outputs.ghcr_digest }}
          HUB_ARM64_DIGEST: ${{ needs.image-arm64.outputs.hub_digest }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          for ref in \
            "oci://ghcr.io/rvenutolo/linpeas@${GHCR_AMD64_DIGEST}" \
            "oci://docker.io/rvenutolo/linpeas@${HUB_AMD64_DIGEST}" \
            "oci://ghcr.io/rvenutolo/linpeas@${GHCR_ARM64_DIGEST}" \
            "oci://docker.io/rvenutolo/linpeas@${HUB_ARM64_DIGEST}"; do
            gh attestation verify "${ref}" --repo rvenutolo/linPEAS-flake
          done

      - name: cosign verify per-arch + multi-arch images (keyless)
        # Same identity pinning as the `verify per-arch attestations` step
        # above. Covers all four per-arch digests (signed by image-amd64 /
        # image-arm64) plus both multi-arch index digests (signed by the
        # manifest job). Anonymous registry reads only — no docker login
        # here, matching the existing `verify per-arch attestations` step's
        # rationale.
        env:
          COSIGN_IDENTITY: https://github.com/rvenutolo/linPEAS-flake/.github/workflows/release-on-bump.yml@refs/heads/main
          COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com
          GHCR_AMD64_DIGEST: ${{ needs.image-amd64.outputs.ghcr_digest }}
          HUB_AMD64_DIGEST: ${{ needs.image-amd64.outputs.hub_digest }}
          GHCR_ARM64_DIGEST: ${{ needs.image-arm64.outputs.ghcr_digest }}
          HUB_ARM64_DIGEST: ${{ needs.image-arm64.outputs.hub_digest }}
          GHCR_INDEX_DIGEST: ${{ needs.manifest.outputs.ghcr_index_digest }}
          HUB_INDEX_DIGEST: ${{ needs.manifest.outputs.hub_index_digest }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          for ref in \
            "ghcr.io/rvenutolo/linpeas@${GHCR_AMD64_DIGEST}" \
            "docker.io/rvenutolo/linpeas@${HUB_AMD64_DIGEST}" \
            "ghcr.io/rvenutolo/linpeas@${GHCR_ARM64_DIGEST}" \
            "docker.io/rvenutolo/linpeas@${HUB_ARM64_DIGEST}" \
            "ghcr.io/rvenutolo/linpeas@${GHCR_INDEX_DIGEST}" \
            "docker.io/rvenutolo/linpeas@${HUB_INDEX_DIGEST}"; do
            nix shell .#cosign --command cosign verify \
              --certificate-identity "${COSIGN_IDENTITY}" \
              --certificate-oidc-issuer "${COSIGN_OIDC_ISSUER}" \
              "${ref}" > /dev/null
            printf 'cosign verified: %s\n' "${ref}"
          done

      - name: verify pin file attestation
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          # Re-fetch the pin file from the release (avoids any chance of
          # local checkout drift altering the bytes).
          gh release download "${VERSION}" --pattern linpeas-pin.json --clobber
          gh attestation verify linpeas-pin.json --repo rvenutolo/linPEAS-flake

      - name: verify manifest tags resolve to attested per-arch digests
        # The steps above re-validate the per-arch digests
        # captured at push time, but never confirm the published
        # `:VERSION` / `:latest` manifest tags still point at those exact
        # digests. A registry-side rewrite between the per-arch push and
        # this verify step (push race, credential compromise, manual
        # re-run of just the `manifest` job) would otherwise go undetected.
        # We re-fetch each manifest tag's raw OCI index and assert that
        # each `manifests[].digest` matches the attested per-arch digest.
        env:
          VERSION: ${{ needs.release.outputs.version }}
          GHCR_AMD64_DIGEST: ${{ needs.image-amd64.outputs.ghcr_digest }}
          HUB_AMD64_DIGEST: ${{ needs.image-amd64.outputs.hub_digest }}
          GHCR_ARM64_DIGEST: ${{ needs.image-arm64.outputs.ghcr_digest }}
          HUB_ARM64_DIGEST: ${{ needs.image-arm64.outputs.hub_digest }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          check() {
            local ref="$1" expected_amd64="$2" expected_arm64="$3"
            local manifest got
            manifest="$(docker buildx imagetools inspect --raw "${ref}")"
            for pair in "amd64:${expected_amd64}" "arm64:${expected_arm64}"; do
              local arch="${pair%%:*}" want="${pair#*:}"
              got="$(printf '%s' "${manifest}" \
                | jq --raw-output --arg a "${arch}" \
                    '.manifests[] | select(.platform.architecture==$a) | .digest')"
              if [[ "${got}" != "${want}" ]]; then
                printf 'manifest drift on %s: want %s for %s, got %s\n' \
                  "${ref}" "${want}" "${arch}" "${got}" >&2
                exit 1
              fi
            done
            printf 'manifest tag %s resolves to attested per-arch digests\n' "${ref}"
          }
          check "ghcr.io/rvenutolo/linpeas:${VERSION}" \
            "${GHCR_AMD64_DIGEST}" "${GHCR_ARM64_DIGEST}"
          check "ghcr.io/rvenutolo/linpeas:latest" \
            "${GHCR_AMD64_DIGEST}" "${GHCR_ARM64_DIGEST}"
          check "docker.io/rvenutolo/linpeas:${VERSION}" \
            "${HUB_AMD64_DIGEST}" "${HUB_ARM64_DIGEST}"
          check "docker.io/rvenutolo/linpeas:latest" \
            "${HUB_AMD64_DIGEST}" "${HUB_ARM64_DIGEST}"

  notify:
    name: notify
    needs: [release, image-amd64, image-arm64, manifest, changelog, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # Common Docker Hub causes — parity with dockerhub-sync.yml; keep wording in sync.
      - uses: ./.github/actions/notify-workflow-result
        with:
          # image/verify are gated on `tag-exists == 'false'` so
          # `skipped` is the normal value when the tag already exists.
          # Treat that path as success.
          result: ${{ (needs.release.result == 'failure' || needs.image-amd64.result == 'failure' || needs.image-arm64.result == 'failure' || needs.manifest.result == 'failure' || needs.changelog.result == 'failure' || needs.verify.result == 'failure') && 'failure' || (needs.release.result == 'success') && 'success' || 'skipped' }}
          label: release-on-bump-failure
          title: "release-on-bump: release pipeline failed"
          body: |
            The `release-on-bump` workflow failed.

            - Trigger: `${{ github.event_name }}`
            - release:     `${{ needs.release.result }}`
            - image-amd64: `${{ needs.image-amd64.result }}`
            - image-arm64: `${{ needs.image-arm64.result }}`
            - manifest:    `${{ needs.manifest.result }}`
            - changelog:   `${{ needs.changelog.result }}`
            - verify:      `${{ needs.verify.result }}`

            Investigate the failing job's logs. The just-published release may need to be deleted and recut once the underlying bug is fixed.

            ## Half-published image recovery

            If `image-amd64` or `image-arm64` failed, the per-arch job may have left a partially-published state (orphan arch-suffixed tag on one registry, missing on the other). The push loop is ordered `docker.io` then `ghcr.io`, so today the typical orphan is a docker.io `{version}-{arch}` tag with no matching ghcr.io tag.

            Full step-by-step recovery — including the quote-safe Docker Hub API snippets and the `DOCKERHUB_TOKEN_DELETE` scope requirement — lives in [`docs/runbooks/dockerhub-recovery.md`](https://github.com/rvenutolo/linPEAS-flake/blob/main/docs/runbooks/dockerhub-recovery.md). Follow it end-to-end before closing this issue.

            ## Common Docker Hub causes

            If `image-amd64`, `image-arm64`, or `manifest` failed and Docker Hub is
            the suspected culprit:

            - `DOCKERHUB_TOKEN_RW` expired or revoked → rotate at
              <https://hub.docker.com/settings/security> and
              `gh secret set DOCKERHUB_TOKEN_RW`.
            - `DOCKERHUB_USERNAME` mismatch with the `rvenutolo/linpeas` repo owner.
            - Docker Hub partial outage; manual re-run via `workflow_dispatch` is
              often enough.
          label-description: release-on-bump workflow failure
          github-token: ${{ secrets.GITHUB_TOKEN }}
