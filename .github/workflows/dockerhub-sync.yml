name: dockerhub-sync

on:
  workflow_run:
    workflows: ["release-on-bump"]
    types: [completed]
  # Allow manual re-sync after a token rotation or Docker Hub blip.
  workflow_dispatch:

permissions: {}

concurrency:
  group: dockerhub-sync-main
  cancel-in-progress: true

jobs:
  sync:
    # Gate on parent workflow_run success.
    # Manual dispatch always runs.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      result: ${{ steps.outcome.outputs.result }}
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: push README to Docker Hub
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN_DELETE }}
          repository: rvenutolo/linpeas
          readme-filepath: README.md
          short-description: "Nix flake wrapping peass-ng linpeas.sh with SLSA build provenance and pinned, auditable releases."

      - name: record outcome
        id: outcome
        if: always()
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          printf 'result=%s\n' "${{ job.status }}" >> "${GITHUB_OUTPUT}"

  notify:
    name: notify
    needs: sync
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/notify-workflow-result
        with:
          result: ${{ needs.sync.result }}
          label: dockerhub-sync-failure
          title: "dockerhub-sync: README sync to Docker Hub failed"
          body: |
            The `dockerhub-sync` workflow failed.

            - Trigger: `${{ github.event_name }}`
            - sync: `${{ needs.sync.result }}`

            Common causes:
            - `DOCKERHUB_TOKEN_DELETE` expired or revoked → rotate at <https://hub.docker.com/settings/security> and `gh secret set DOCKERHUB_TOKEN_DELETE`.
            - `DOCKERHUB_USERNAME` mismatch with the `rvenutolo/linpeas` repo owner.
            - Docker Hub partial outage; manual re-run via `workflow_dispatch` is often enough.
            - Parent `release-on-bump` finished green but as a no-op (existing tag, `force-republish` not set). The sync still ran but there is nothing fresh to publish. Verify the latest release was actually re-cut; if not, dispatch the `release-on-bump` workflow with `force-republish: true` and let this sync re-fire on its `workflow_run` completion.
          label-description: dockerhub-sync workflow failure
          github-token: ${{ secrets.GITHUB_TOKEN }}
