name: update-linpeas

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-linpeas
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (D2)
        with:
          # The `bump` job invokes `git push --set-upstream origin <branch>`
          # in-line below; it relies on the BUMP_PAT being persisted into
          # .git/config by checkout. Declaring this explicitly silences
          # zizmor's `artipacked` audit (intent is to persist) rather than
          # suppressing it.
          persist-credentials: true
          token: ${{ secrets.BUMP_PAT }}

      - uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31 (D2)
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install # renovate: datasource=github-releases depName=nix packageName=NixOS/nix
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v3 (D4)

      - name: configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: bump pin
        id: bump
        env:
          GH_TOKEN: ${{ secrets.BUMP_PAT }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          before="$(jq --raw-output .version linpeas-pin.json)"
          ./scripts/bump-linpeas.sh
          after="$(jq --raw-output .version linpeas-pin.json)"
          if [[ "${before}" == "${after}" ]]; then
            printf 'changed=false\n' >> "${GITHUB_OUTPUT}"
          else
            {
              printf 'changed=true\n'
              printf 'old=%s\n' "${before}"
              printf 'new=%s\n' "${after}"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: refresh README flake-show block
        if: steps.bump.outputs.changed == 'true'
        run: ./scripts/refresh-flake-show.sh

      - name: create branch and PR
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BUMP_PAT }}
          NEW: ${{ steps.bump.outputs.new }}
          OLD: ${{ steps.bump.outputs.old }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          branch="chore/bump-linpeas-${NEW}"

          # Reuse branch if a prior failed run left one behind.
          git fetch origin "${branch}" 2>/dev/null || true
          git checkout -B "${branch}"

          git add linpeas-pin.json README.md
          git commit --message "chore: bump linpeas to ${NEW}"

          # --force-with-lease requires a remote ref to lease against. On a
          # brand-new branch (typical first bump path) there is none, and
          # git 2.30+ refuses. Branch only forces when it already exists
          # remotely (retry of failed prior run).
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            git push --force-with-lease --set-upstream origin "${branch}"
          else
            git push --set-upstream origin "${branch}"
          fi

          # Open PR only if one does not already exist for this branch.
          # Build the body in a temp file so YAML block-scalar indentation
          # rules do not chop the multi-line content.
          if ! gh pr view "${branch}" >/dev/null 2>&1; then
            body="$(mktemp)"
            printf "Auto-generated bump from \`%s\` to \`%s\`.\n\nUpstream release: https://github.com/peass-ng/PEASS-ng/releases/tag/%s\n" \
              "${OLD}" "${NEW}" "${NEW}" > "${body}"
            gh pr create \
              --base main \
              --head "${branch}" \
              --title "chore: bump linpeas to ${NEW}" \
              --body-file "${body}"
          fi

          gh pr merge "${branch}" --auto --squash
