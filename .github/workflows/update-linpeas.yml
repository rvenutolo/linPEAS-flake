name: update-linpeas

on:
  schedule:
    - cron: "5 8 * * *" # daily 08:05 UTC (early in the window so the bump PR's CI + auto-merge land before the dashboard render)
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-linpeas
  cancel-in-progress: false

jobs:
  # This job runs untrusted Nix-evaluating actions with
  # ZERO write credentials. The `BUMP_APP_PRIVATE_KEY` secret is not
  # present in env or on disk here. Compromise of any third-party action
  # SHA below cannot mint an App installation token — the key lives only
  # in the `push-and-merge` job below.
  compute-pin:
    if: github.repository == 'rvenutolo/linPEAS-flake'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
      old: ${{ steps.bump.outputs.old }}
      new: ${{ steps.bump.outputs.new }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # TODO: restore egress-policy block once block mode stops dropping allowed hosts on
          # westus2 runners: https://github.com/step-security/harden-runner/issues/708
          egress-policy: audit
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            cache.nixos.org:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository]
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: bump pin
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          before="$(jq --raw-output .version linpeas-pin.json)"
          ./scripts/bump-linpeas.sh
          after="$(jq --raw-output .version linpeas-pin.json)"
          if [[ "${before}" == "${after}" ]]; then
            printf 'changed=false\n' >> "${GITHUB_OUTPUT}"
          else
            {
              printf 'changed=true\n'
              printf 'old=%s\n' "${before}"
              printf 'new=%s\n' "${after}"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: refresh flake-show block
        if: steps.bump.outputs.changed == 'true'
        run: ./scripts/refresh-flake-show.sh

      - name: upload pin artifact
        if: steps.bump.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bump-result
          path: |
            linpeas-pin.json
            docs/reference/flake-outputs.md
          retention-days: 1
          if-no-files-found: error

  # Bump credentials live here only. The job authenticates
  # to the GitHub API as the `linpeas-flake-bumper` GitHub App via a
  # short-lived installation token minted by `actions/create-github-app-token`
  # (Client ID = `vars.BUMP_APP_CLIENT_ID`; private key =
  # `secrets.BUMP_APP_PRIVATE_KEY`).
  # The token lasts one hour and is automatically revoked at the end of
  # the job. Commits land on the bump branch via REST `PUT /contents`,
  # which GitHub web-flow-signs when the request is authenticated by an
  # App installation token (verified empirically). No
  # `git push` happens.
  push-and-merge:
    needs: compute-pin
    if: needs.compute-pin.outputs.changed == 'true' && github.repository == 'rvenutolo/linPEAS-flake'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # TODO: restore egress-policy block once block mode stops dropping allowed hosts on
          # westus2 runners: https://github.com/step-security/harden-runner/issues/708
          egress-policy: audit
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      # No checkout: nothing in this job reads the repository tree, and a
      # tree with `.git/` in it is somewhere git could be pointed at. The
      # artifact goes to the runner's temp directory and is read by
      # absolute path.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bump-result
          path: ${{ runner.temp }}/bump-result

      # download-artifact's own path-traversal protection keeps entries
      # inside the target directory; this checks the target itself sits
      # outside the workspace, where the steps below run.
      - name: assert the artifact sits outside the workspace
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/bump-result
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          workspace="$(realpath -- "${GITHUB_WORKSPACE}")"
          artifact="$(realpath -- "${ARTIFACT_DIR}")"
          if [[ "${artifact}/" == "${workspace}/"* ]]; then
            printf 'artifact directory %s is inside the workspace - aborting\n' "${artifact}" >&2
            exit 1
          fi

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.BUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}
          # Least-privilege scope: token only needs to write file contents
          # (PUT /contents for linpeas-pin.json and flake-outputs.md) and
          # open/merge the bump PR. No other installation scopes are needed.
          permission-contents: write
          permission-pull-requests: write

      - name: sanity check artifact
        # Defense-in-depth. compute-pin's bump-linpeas.sh
        # already validates pin shape + URL prefix + .digest cross-check;
        # this step re-validates the artifact inside the credential-
        # holding job so a compromised compute-pin cannot ship a malformed
        # pin past the boundary. Mirrors flake.nix's eager invariant asserts.
        # The pin-differs-from-main check is in the commit step, which
        # reads main's blob over the API.
        working-directory: ${{ runner.temp }}/bump-result
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          # Re-validate pin invariants (mirrors flake.nix assertions).
          pin_version="$(jq --raw-output .version linpeas-pin.json)"
          pin_url="$(jq --raw-output .url linpeas-pin.json)"
          pin_hash="$(jq --raw-output .hash linpeas-pin.json)"
          if [[ ! "${pin_version}" =~ ^[0-9]{8}-[0-9a-f]{7,40}$ ]]; then
            printf 'pin.version shape invalid: %q\n' "${pin_version}" >&2
            exit 1
          fi
          if [[ "${pin_url}" != https://github.com/peass-ng/PEASS-ng/releases/download/* ]]; then
            printf 'pin.url outside peass-ng prefix: %q\n' "${pin_url}" >&2
            exit 1
          fi
          if [[ "${pin_hash}" != sha256-* ]]; then
            printf 'pin.hash not SRI sha256-: %q\n' "${pin_hash}" >&2
            exit 1
          fi
          printf 'pin re-validated: version=%s, url=%s, hash=%s\n' \
            "${pin_version}" "${pin_url}" "${pin_hash}"

      - name: open PR with signed commits via REST PUT /contents
        env:
          BUMP_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Pins gh's repository context, so an `{owner}`-style placeholder
          # in an endpoint resolves from this variable and never from
          # `git remote`.
          GH_REPO: ${{ github.repository }}
          # `gh pr create` and `gh pr merge` run git themselves (remote and
          # branch lookups) even with GH_REPO set. A GIT_DIR that does not
          # exist makes each of those calls fail without reading any
          # repository, wherever the step's working directory is.
          GIT_DIR: /nonexistent
          ARTIFACT_DIR: ${{ runner.temp }}/bump-result
          NEW: ${{ needs.compute-pin.outputs.new }}
          OLD: ${{ needs.compute-pin.outputs.old }}
          REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'

          branch="chore/bump-linpeas-${NEW}"
          api_header="X-GitHub-Api-Version: 2022-11-28"

          # Idempotency gate. If a PR already exists for this branch
          # (same upstream version recurring across cron runs), branch
          # state from the prior run is authoritative.
          # `gh pr view` returns PRs in any state, so inspect state
          # explicitly before deciding.
          pr_state="$(gh pr view "${branch}" --json state --jq .state 2>/dev/null || true)"
          case "${pr_state}" in
            OPEN)
              # Reuse the existing PR. To clear strict-required-status
              # branch-up-to-date enforcement, its branch is rebuilt on
              # main HEAD below before auto-merge picks it up again.
              open_pr=true
              ;;
            CLOSED|MERGED)
              # Same-version PR was already closed (declined) or merged
              # (shipped). Recreating would overwrite that outcome, so
              # fail loudly and let notify file an issue. The one
              # exception is a PR this App closed itself: GitHub closes
              # a PR whose head is force-moved onto its base, and no
              # human decided anything, so the bump is opened afresh.
              closed_by=""
              if [[ "${pr_state}" == CLOSED ]]; then
                # A failed lookup leaves closed_by empty, which aborts.
                pr_number="$(gh pr view "${branch}" --json number --jq .number 2>/dev/null || true)"
                if [[ "${pr_number}" =~ ^[0-9]+$ ]]; then
                  # shellcheck disable=SC2016 # $owner etc. are GraphQL variables, bound below
                  closed_by="$(gh api graphql \
                    --raw-field query='query($owner: String!, $name: String!, $number: Int!) {
                      repository(owner: $owner, name: $name) {
                        pullRequest(number: $number) {
                          timelineItems(itemTypes: CLOSED_EVENT, last: 1) {
                            nodes { ... on ClosedEvent { actor { __typename login } } }
                          }
                        }
                      }
                    }' \
                    --raw-field owner="${REPO%%/*}" \
                    --raw-field name="${REPO#*/}" \
                    --field number="${pr_number}" \
                    --jq '.data.repository.pullRequest.timelineItems.nodes[0].actor // {} | "\(.__typename)/\(.login)"' \
                    2>/dev/null)" || closed_by=""
                fi
              fi
              if [[ -n "${BUMP_APP_SLUG}" && "${closed_by}" == "Bot/${BUMP_APP_SLUG}" ]]; then
                printf 'PR for %s was closed by %s itself - opening a new one\n' "${branch}" "${BUMP_APP_SLUG}"
                open_pr=false
              else
                if [[ "${pr_state}" == CLOSED ]]; then
                  printf 'PR for %s was closed by %s\n' "${branch}" "${closed_by:-unknown}" >&2
                fi
                printf 'PR for %s already in state %s - aborting\n' "${branch}" "${pr_state}" >&2
                exit 1
              fi
              ;;
            '')
              open_pr=false
              ;;
            *)
              printf 'unexpected PR state %q for %s\n' "${pr_state}" "${branch}" >&2
              exit 1
              ;;
          esac

          # Resolve main HEAD sha. Both base blob SHAs below are read at
          # this commit, the one the work branch is created from, so each
          # PUT names the blob it replaces on that branch.
          base_sha="$(gh api "repos/${REPO}/git/refs/heads/main" \
            --jq .object.sha --header "${api_header}")"
          if [[ ! "${base_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'unexpected main HEAD sha %q - aborting\n' "${base_sha}" >&2
            exit 1
          fi

          # The git blob SHA the contents API reports, computed without
          # git: git run against the artifact would read a `.git/config`
          # and `.gitattributes` it carries, and a configured clean filter
          # would run as a command while GH_TOKEN is in the environment.
          # Only a regular file whose resolved path is exactly the
          # expected one is hashed, so a symlink anywhere on the path, which
          # would read and then commit content from outside the artifact,
          # aborts. Called inside `$(...)`, where errexit is off, so each
          # failure returns explicitly and the caller's assignment aborts.
          artifact="$(realpath -- "${ARTIFACT_DIR}")"
          function artifact_blob_sha() {
            local file="${artifact}/$1" size
            if [[ ! -f "${file}" || -L "${file}" ]] ||
              [[ "$(realpath -- "${file}")" != "${file}" ]]; then
              printf '%s is not a regular file in the artifact - aborting\n' "$1" >&2
              return 1
            fi
            size="$(stat --format=%s -- "${file}")" || return 1
            { printf 'blob %d\0' "${size}"; cat -- "${file}"; } | sha1sum | cut --delimiter=' ' --fields=1
          }

          # Both files are checked before the work branch exists, so a
          # refused file aborts with nothing pushed.
          pin_sha="$(artifact_blob_sha linpeas-pin.json)"
          artifact_blob_sha docs/reference/flake-outputs.md >/dev/null
          pin_blob_sha="$(gh api "repos/${REPO}/contents/linpeas-pin.json?ref=${base_sha}" \
            --jq .sha --header "${api_header}")"
          flake_outputs_blob_sha="$(gh api "repos/${REPO}/contents/docs/reference/flake-outputs.md?ref=${base_sha}" \
            --jq .sha --header "${api_header}")"
          if [[ "${pin_sha}" == "${pin_blob_sha}" ]]; then
            printf 'artifact linpeas-pin.json is identical to main - aborting\n' >&2
            exit 1
          fi

          # The commits are written to work_branch, created fresh from
          # main HEAD. For a new PR that is the bump branch itself. An
          # open PR has to be rebased onto main HEAD, because the
          # `protect-main` ruleset sets
          # strict_required_status_checks_policy: true and a PR cannot
          # merge while behind. Its branch must never point at main HEAD
          # itself: GitHub closes a PR the moment its head has no commits
          # beyond its base. So the commits go to a staging branch, and
          # the PR branch then moves straight to the finished tip.
          if [[ "${open_pr}" == true ]]; then
            work_branch="${branch}-staging"
          else
            work_branch="${branch}"
          fi

          # Delete a stale work_branch ref if a prior failed run left one
          # behind. Safe: the PR-state gate above already rejected every
          # case where a PR a human closed, or a merged PR, references
          # the bump branch, and nothing references the staging branch.
          if gh api "repos/${REPO}/git/refs/heads/${work_branch}" \
              --header "${api_header}" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${REPO}/git/refs/heads/${work_branch}" \
              --header "${api_header}"
          fi
          gh api --method POST "repos/${REPO}/git/refs" \
            --field ref="refs/heads/${work_branch}" \
            --field sha="${base_sha}" \
            --header "${api_header}" >/dev/null

          # Commit 1: linpeas-pin.json. Web-flow signs this commit.
          pin_b64="$(base64 --wrap=0 -- "${artifact}/linpeas-pin.json")"
          gh api --method PUT "repos/${REPO}/contents/linpeas-pin.json" \
            --field message="chore: bump linpeas to ${NEW}" \
            --field content="${pin_b64}" \
            --field sha="${pin_blob_sha}" \
            --field branch="${work_branch}" \
            --header "${api_header}" >/dev/null

          # Commit 2: docs/reference/flake-outputs.md (flake-show block refresh).
          # The doc's blob SHA on the bump branch still equals main's (only
          # linpeas-pin changed in commit 1), so reuse flake_outputs_blob_sha.
          flake_outputs_b64="$(base64 --wrap=0 -- "${artifact}/docs/reference/flake-outputs.md")"
          tip_sha="$(gh api --method PUT "repos/${REPO}/contents/docs/reference/flake-outputs.md" \
            --field message="chore: refresh flake-show for linpeas ${NEW}" \
            --field content="${flake_outputs_b64}" \
            --field sha="${flake_outputs_blob_sha}" \
            --field branch="${work_branch}" \
            --jq .commit.sha \
            --header "${api_header}")"

          if [[ "${open_pr}" == true ]]; then
            printf 'rebasing open PR for %s onto main HEAD %s (new tip %s)\n' \
              "${branch}" "${base_sha}" "${tip_sha}"
            gh api --method PATCH "repos/${REPO}/git/refs/heads/${branch}" \
              --raw-field sha="${tip_sha}" \
              --field force=true \
              --header "${api_header}" >/dev/null
            gh api --method DELETE "repos/${REPO}/git/refs/heads/${work_branch}" \
              --header "${api_header}"
          fi

          if [[ "${open_pr}" == false ]]; then
            body="$(mktemp)"
            trap 'rm --force -- "${body}"' EXIT
            printf "Auto-generated bump from \`%s\` to \`%s\`.\n\nUpstream release: https://github.com/peass-ng/PEASS-ng/releases/tag/%s\n" \
              "${OLD}" "${NEW}" "${NEW}" > "${body}"
            # Merge by URL: a recovered bump branch also carries the
            # closed PR, so the branch name alone is ambiguous.
            pr_ref="$(gh pr create \
              --base main \
              --head "${branch}" \
              --title "chore: bump linpeas to ${NEW}" \
              --body-file "${body}")"
          else
            pr_ref="${branch}"
          fi

          gh pr merge "${pr_ref}" --auto --merge

  notify:
    name: notify
    needs: [compute-pin, push-and-merge]
    # Always-runs so we both file on failure and auto-close on next green run.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      issues: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # TODO: restore egress-policy block once block mode stops dropping allowed hosts on
          # westus2 runners: https://github.com/step-security/harden-runner/issues/708
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/notify-workflow-result # zizmor: ignore[self-repository]
        with:
          # Collapse "compute-pin success + push-and-merge skipped"
          # (no-op cron day) to overall success.
          result: ${{ needs.push-and-merge.result == 'skipped' && needs.compute-pin.result || needs.push-and-merge.result }}
          label: update-linpeas-failure
          title: "update-linpeas: cron failed"
          body: |
            The daily `update-linpeas` cron failed before opening / merging a pin-bump PR.

            - Trigger: `${{ github.event_name }}`
            - compute-pin conclusion: `${{ needs.compute-pin.result }}`
            - push-and-merge conclusion: `${{ needs.push-and-merge.result }}`

            Investigate the failing job's logs. Common causes:
            - Upstream PEASS-ng API rate-limit
            - `BUMP_APP_PRIVATE_KEY` invalid or App uninstalled (affects push-and-merge only)
            - Asset-URL prefix check tripped (peass-ng moved their release host)
            - `digest` field missing or non-`sha256:` from upstream
            - Artifact upload/download failure (between compute-pin and push-and-merge)
          label-description: update-linpeas workflow failure
          github-token: ${{ secrets.GITHUB_TOKEN }}
