name: update-linpeas

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-linpeas
  cancel-in-progress: false

jobs:
  # AU-P-1 Phase 1: this job runs untrusted Nix-evaluating actions with
  # ZERO write credentials. BUMP_PAT is not present in env or on disk here.
  # Compromise of any third-party action SHA below cannot exfiltrate the
  # PAT — it lives only in the `push-and-merge` job below.
  compute-pin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
      old: ${{ steps.bump.outputs.old }}
      new: ${{ steps.bump.outputs.new }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (D2)
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31 (D2)
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install # renovate: datasource=github-releases depName=nix packageName=NixOS/nix
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v3 (D4)

      - name: bump pin
        id: bump
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          before="$(jq --raw-output .version linpeas-pin.json)"
          ./scripts/bump-linpeas.sh
          after="$(jq --raw-output .version linpeas-pin.json)"
          if [[ "${before}" == "${after}" ]]; then
            printf 'changed=false\n' >> "${GITHUB_OUTPUT}"
          else
            {
              printf 'changed=true\n'
              printf 'old=%s\n' "${before}"
              printf 'new=%s\n' "${after}"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: refresh README flake-show block
        if: steps.bump.outputs.changed == 'true'
        run: ./scripts/refresh-flake-show.sh

      - name: upload pin artifact
        if: steps.bump.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (D2)
        with:
          name: bump-result
          path: |
            linpeas-pin.json
            README.md
          retention-days: 1
          if-no-files-found: error

  # AU-P-1 Phase 1: BUMP_PAT lives here, scoped to two run-step envs only.
  # Action set restricted to GitHub-owned SHAs (actions/checkout +
  # actions/download-artifact). persist-credentials: false means the PAT
  # never enters .git/config — pushes use an inline http.extraheader.
  push-and-merge:
    needs: compute-pin
    if: needs.compute-pin.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (D2)
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8 (D2)
        with:
          name: bump-result

      - name: sanity check artifact
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          if git diff --quiet linpeas-pin.json; then
            printf 'artifact produced no diff in linpeas-pin.json — aborting\n' >&2
            exit 1
          fi

      - name: configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: commit and push branch
        env:
          BUMP_PAT: ${{ secrets.BUMP_PAT }}
          NEW: ${{ needs.compute-pin.outputs.new }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          branch="chore/bump-linpeas-${NEW}"

          # Reuse branch if a prior failed run left one behind.
          git fetch origin "${branch}" 2>/dev/null || true
          git checkout -B "${branch}"

          git add linpeas-pin.json README.md
          git commit --message "chore: bump linpeas to ${NEW}"

          # Push via inline http.extraheader; PAT never touches .git/config.
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            git -c http.extraheader="Authorization: token ${BUMP_PAT}" \
              push --force-with-lease --set-upstream origin "${branch}"
          else
            git -c http.extraheader="Authorization: token ${BUMP_PAT}" \
              push --set-upstream origin "${branch}"
          fi

      - name: create and auto-merge PR
        env:
          GH_TOKEN: ${{ secrets.BUMP_PAT }}
          NEW: ${{ needs.compute-pin.outputs.new }}
          OLD: ${{ needs.compute-pin.outputs.old }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          branch="chore/bump-linpeas-${NEW}"

          # Open PR only if one does not already exist for this branch.
          if ! gh pr view "${branch}" >/dev/null 2>&1; then
            body="$(mktemp)"
            trap 'rm --force -- "${body}"' EXIT
            printf "Auto-generated bump from \`%s\` to \`%s\`.\n\nUpstream release: https://github.com/peass-ng/PEASS-ng/releases/tag/%s\n" \
              "${OLD}" "${NEW}" "${NEW}" > "${body}"
            gh pr create \
              --base main \
              --head "${branch}" \
              --title "chore: bump linpeas to ${NEW}" \
              --body-file "${body}"
          fi

          gh pr merge "${branch}" --auto --squash

  notify:
    name: notify
    needs: [compute-pin, push-and-merge]
    # Always-runs so we both file on failure and auto-close on next green run.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (D2)
        with:
          persist-credentials: false
      - uses: ./.github/actions/notify-workflow-result
        with:
          # AU-P-1: collapse "compute-pin success + push-and-merge skipped"
          # (no-op cron day) to overall success. See spec §Error handling.
          result: ${{ needs.push-and-merge.result == 'skipped' && needs.compute-pin.result || needs.push-and-merge.result }}
          label: update-linpeas-failure
          title: "update-linpeas: cron failed"
          body: |
            The daily `update-linpeas` cron failed before opening / merging a pin-bump PR.

            - Trigger: `${{ github.event_name }}`
            - compute-pin conclusion: `${{ needs.compute-pin.result }}`
            - push-and-merge conclusion: `${{ needs.push-and-merge.result }}`

            Investigate the failing job's logs. Common causes:
            - Upstream PEASS-ng API rate-limit
            - `BUMP_PAT` expired (affects push-and-merge only)
            - Asset-URL prefix check tripped (peass-ng moved their release host)
            - `digest` field missing or non-`sha256:` from upstream
            - Artifact upload/download failure (between compute-pin and push-and-merge)
          label-description: update-linpeas workflow failure
          github-token: ${{ secrets.GITHUB_TOKEN }}
