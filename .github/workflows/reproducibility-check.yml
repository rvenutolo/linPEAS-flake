---
name: reproducibility-check

on:
  schedule:
    - cron: "10 5 * * 5" # Friday 05:10 UTC (after update-flake-lock opens the weekly window)
  workflow_dispatch:
    inputs:
      # This input widens the `if:` on the diagnostic steps only — the
      # diffoscope run and its artifact upload. `fail job (on mismatch)`
      # keeps the nonzero-result condition, so a forced run can add
      # execution but can never fabricate or suppress the reproducibility
      # signal.
      force_diffoscope:
        description: "Run the mismatch diagnostic steps even when the builds match, to prove the diffoscope path still works."
        type: boolean
        default: false

permissions: {}

concurrency:
  group: reproducibility-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-a:
    name: build (runner A)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            cache.nixos.org:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository]
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: build linpeas + image
        run: |
          set -Eeuo pipefail
          nix build .#linpeas --print-build-logs --out-link result-linpeas
          nix build .#linpeas-image --print-build-logs --out-link result-image
          # Tarball linpeas so it can be uploaded as artifact and diffoscoped
          linpeas_real="$(readlink -f result-linpeas)"
          tar --create --gzip --file=linpeas.tar.gz --directory="$(dirname "${linpeas_real}")" "$(basename "${linpeas_real}")"
      - name: measure hashes
        id: measure
        run: |
          set -Eeuo pipefail
          linpeas_path="$(readlink -f result-linpeas)"
          image_path="$(readlink -f result-image)"
          # --exit-status so a `nix path-info --json` shape change fails
          # here rather than emitting the string "null" into build.json,
          # where both builds would carry it and compare as a match.
          linpeas_nar_hash="$(nix path-info --json "${linpeas_path}" | jq --exit-status --raw-output '.[].narHash')"
          image_tar_sha256="$(sha256sum "${image_path}" | awk '{print $1}')"
          case "$(file --brief --mime-type "${image_path}")" in
            application/gzip | application/x-gzip)
              image_manifest_digest="$(gunzip -c "${image_path}" | tar -xO manifest.json | sha256sum | awk '{print "sha256:" $1}')"
              ;;
            application/x-tar)
              image_manifest_digest="$(tar -xOf "${image_path}" manifest.json | sha256sum | awk '{print "sha256:" $1}')"
              ;;
            *)
              printf 'ERROR: unexpected image artifact type: %s\n' "$(file --brief "${image_path}")" >&2
              exit 1
              ;;
          esac
          jq -n \
            --arg linpeas_store_path "${linpeas_path}" \
            --arg linpeas_nar_hash "${linpeas_nar_hash}" \
            --arg image_store_path "${image_path}" \
            --arg image_tar_sha256 "${image_tar_sha256}" \
            --arg image_manifest_digest "${image_manifest_digest}" \
            '{linpeas_store_path: $linpeas_store_path, linpeas_nar_hash: $linpeas_nar_hash, image_store_path: $image_store_path, image_tar_sha256: $image_tar_sha256, image_manifest_digest: $image_manifest_digest}' \
            > build.json
          cat build.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-build-a
          path: |
            build.json
            result-image
            linpeas.tar.gz
          retention-days: 7
          if-no-files-found: error

  build-b:
    name: build (runner B)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            cache.nixos.org:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository]
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: build linpeas + image
        run: |
          set -Eeuo pipefail
          nix build .#linpeas --print-build-logs --out-link result-linpeas
          nix build .#linpeas-image --print-build-logs --out-link result-image
          # Tarball linpeas so it can be uploaded as artifact and diffoscoped
          linpeas_real="$(readlink -f result-linpeas)"
          tar --create --gzip --file=linpeas.tar.gz --directory="$(dirname "${linpeas_real}")" "$(basename "${linpeas_real}")"
      - name: measure hashes
        id: measure
        run: |
          set -Eeuo pipefail
          linpeas_path="$(readlink -f result-linpeas)"
          image_path="$(readlink -f result-image)"
          # --exit-status so a `nix path-info --json` shape change fails
          # here rather than emitting the string "null" into build.json,
          # where both builds would carry it and compare as a match.
          linpeas_nar_hash="$(nix path-info --json "${linpeas_path}" | jq --exit-status --raw-output '.[].narHash')"
          image_tar_sha256="$(sha256sum "${image_path}" | awk '{print $1}')"
          case "$(file --brief --mime-type "${image_path}")" in
            application/gzip | application/x-gzip)
              image_manifest_digest="$(gunzip -c "${image_path}" | tar -xO manifest.json | sha256sum | awk '{print "sha256:" $1}')"
              ;;
            application/x-tar)
              image_manifest_digest="$(tar -xOf "${image_path}" manifest.json | sha256sum | awk '{print "sha256:" $1}')"
              ;;
            *)
              printf 'ERROR: unexpected image artifact type: %s\n' "$(file --brief "${image_path}")" >&2
              exit 1
              ;;
          esac
          jq -n \
            --arg linpeas_store_path "${linpeas_path}" \
            --arg linpeas_nar_hash "${linpeas_nar_hash}" \
            --arg image_store_path "${image_path}" \
            --arg image_tar_sha256 "${image_tar_sha256}" \
            --arg image_manifest_digest "${image_manifest_digest}" \
            '{linpeas_store_path: $linpeas_store_path, linpeas_nar_hash: $linpeas_nar_hash, image_store_path: $image_store_path, image_tar_sha256: $image_tar_sha256, image_manifest_digest: $image_manifest_digest}' \
            > build.json
          cat build.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-build-b
          path: |
            build.json
            result-image
            linpeas.tar.gz
          retention-days: 7
          if-no-files-found: error

  compare:
    name: compare
    needs: [build-a, build-b]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    # `continue-on-error` reports this job as succeeded even when a step
    # fails, so `notify` reads `completed` instead: only the last step
    # sets it, and every failure, a mismatch included, stops the job
    # before it.
    outputs:
      completed: ${{ steps.completed.outputs.completed }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            cache.nixos.org:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repro-build-a
          path: build-a
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repro-build-b
          path: build-b
      # Unconditional, even though only the mismatch path uses nix: an
      # allowlist gap then fails on every scheduled run instead of staying
      # latent until the day a build stops being reproducible, which is the
      # one day the diagnostic has to work.
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository]
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: compare hashes
        id: compare
        run: |
          set -Eeuo pipefail
          compare_exit=0
          ./scripts/compare-repro.sh build-a/build.json build-b/build.json || compare_exit=$?
          echo "exit_code=${compare_exit}" >> "${GITHUB_OUTPUT}"
          if [[ ${compare_exit} -eq 0 ]]; then
            echo 'reproducibility check passed.'
          else
            echo 'reproducibility check failed; diffoscope step will run.'
          fi
      - name: run diffoscope on image tars (on mismatch)
        if: steps.compare.outputs.exit_code != '0' || inputs.force_diffoscope
        run: |
          set -Eeuo pipefail
          mkdir -p diffoscope-out
          # Always diff both pairs on any mismatch — the divergence may be in either or both.
          # A non-zero status is the normal report-produced outcome and is
          # captured rather than tolerated silently, so the summary below
          # can say what happened instead of leaving it in the step log.
          image_status=0
          timeout 20m nix shell .#diffoscopeMinimal --command diffoscope \
            --html diffoscope-out/image.html \
            --text diffoscope-out/image.txt \
            build-a/result-image \
            build-b/result-image \
            || image_status=$?
          linpeas_status=0
          timeout 20m nix shell .#diffoscopeMinimal --command diffoscope \
            --html diffoscope-out/linpeas.html \
            --text diffoscope-out/linpeas.txt \
            build-a/linpeas.tar.gz \
            build-b/linpeas.tar.gz \
            || linpeas_status=$?
          # diffoscope writes no report at all when its two inputs are
          # identical, so an exercise of this path on a reproducible tree
          # leaves the output directory empty and the upload's
          # `if-no-files-found: error` fails on a healthy run. This summary
          # is written unconditionally, which keeps that guard meaning
          # "the step did not run" rather than "the builds matched" — and
          # it is the first thing a reader of a real mismatch wants: which
          # pair diverged, and whether a report came out for it.
          image_report=none
          if [[ -s diffoscope-out/image.txt ]]; then image_report=written; fi
          linpeas_report=none
          if [[ -s diffoscope-out/linpeas.txt ]]; then linpeas_report=written; fi
          {
            printf 'image: diffoscope exit %d, report %s\n' "${image_status}" "${image_report}"
            printf 'linpeas: diffoscope exit %d, report %s\n' "${linpeas_status}" "${linpeas_report}"
          } >diffoscope-out/summary.txt
          cat diffoscope-out/summary.txt
      - name: upload diffoscope artifact (on mismatch)
        if: steps.compare.outputs.exit_code != '0' || inputs.force_diffoscope
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-diff
          path: diffoscope-out
          retention-days: 30
          if-no-files-found: error
      - name: fail job (on mismatch)
        if: steps.compare.outputs.exit_code != '0'
        run: |
          set -Eeuo pipefail
          echo 'Reproducibility mismatch detected. continue-on-error keeps workflow green during burn-in.'
          exit 1
      - name: mark completed
        id: completed
        run: echo 'completed=true' >> "${GITHUB_OUTPUT}"

  notify:
    name: notify
    needs: [build-a, build-b, compare]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      issues: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/notify-workflow-result # zizmor: ignore[self-repository]
        with:
          # A failed or cancelled build is the run's result. Otherwise
          # `compare` decides, read through its `completed` output because
          # `continue-on-error` hides its failure from its own result.
          result: ${{ (needs.build-a.result == 'failure' || needs.build-b.result == 'failure') && 'failure' || (needs.build-a.result == 'cancelled' || needs.build-b.result == 'cancelled' || needs.compare.result == 'cancelled') && 'cancelled' || needs.compare.result == 'skipped' && 'skipped' || needs.compare.outputs.completed == 'true' && 'success' || 'failure' }}
          # `compare`'s job-level continue-on-error lets the run conclude
          # `success` with `compare` failed, and the CI watchdog selects only
          # failed or cancelled runs, so a held-off failure would never be
          # re-run or filed.
          hold-off: "false"
          label: reproducibility
          title: "reproducibility-check: builds differ, or the check could not run"
          label-description: two independent builds of linpeas or the image differ, or the check could not run
          body: |
            The reproducibility check failed: the hashes of the two
            builds differ, or a build or the comparison failed before it
            could measure them. The job summary of the run holds a
            `Result: MISMATCH` line when the hashes differ; otherwise the
            failing step's log holds the error.

            Run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            On a mismatch the run carries the `repro-diff` artifact
            (30-day retention): `summary.txt` plus the `image.html` /
            `image.txt` and `linpeas.html` / `linpeas.txt` reports
            diffoscope wrote.

            Investigate per the runbook,
            [docs/runbooks/reproducibility-check.md](https://github.com/${{ github.repository }}/blob/main/docs/runbooks/reproducibility-check.md).
            This issue auto-closes on the next run whose builds match.
          github-token: ${{ secrets.GITHUB_TOKEN }}
