---
name: reproducibility-check

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: reproducibility-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-a:
    name: build (runner A)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v3
      - name: build linpeas + image
        run: |
          set -Eeuo pipefail
          nix build .#linpeas --print-build-logs --out-link result-linpeas
          nix build .#linpeas-image --print-build-logs --out-link result-image
      - name: measure hashes
        id: measure
        run: |
          set -Eeuo pipefail
          linpeas_path="$(readlink -f result-linpeas)"
          image_path="$(readlink -f result-image)"
          linpeas_nar_hash="$(nix path-info --json "${linpeas_path}" | jq -r '.[].narHash')"
          image_tar_sha256="$(sha256sum "${image_path}" | awk '{print $1}')"
          image_manifest_digest="$(tar -xOf "${image_path}" manifest.json | sha256sum | awk '{print "sha256:" $1}')"
          jq -n \
            --arg linpeas_store_path "${linpeas_path}" \
            --arg linpeas_nar_hash "${linpeas_nar_hash}" \
            --arg image_store_path "${image_path}" \
            --arg image_tar_sha256 "${image_tar_sha256}" \
            --arg image_manifest_digest "${image_manifest_digest}" \
            '{linpeas_store_path: $linpeas_store_path, linpeas_nar_hash: $linpeas_nar_hash, image_store_path: $image_store_path, image_tar_sha256: $image_tar_sha256, image_manifest_digest: $image_manifest_digest}' \
            > build.json
          cat build.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repro-build-a
          path: |
            build.json
            result-image
          retention-days: 7
          if-no-files-found: error

  build-b:
    name: build (runner B)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v3
      - name: build linpeas + image
        run: |
          set -Eeuo pipefail
          nix build .#linpeas --print-build-logs --out-link result-linpeas
          nix build .#linpeas-image --print-build-logs --out-link result-image
      - name: measure hashes
        id: measure
        run: |
          set -Eeuo pipefail
          linpeas_path="$(readlink -f result-linpeas)"
          image_path="$(readlink -f result-image)"
          linpeas_nar_hash="$(nix path-info --json "${linpeas_path}" | jq -r '.[].narHash')"
          image_tar_sha256="$(sha256sum "${image_path}" | awk '{print $1}')"
          image_manifest_digest="$(tar -xOf "${image_path}" manifest.json | sha256sum | awk '{print "sha256:" $1}')"
          jq -n \
            --arg linpeas_store_path "${linpeas_path}" \
            --arg linpeas_nar_hash "${linpeas_nar_hash}" \
            --arg image_store_path "${image_path}" \
            --arg image_tar_sha256 "${image_tar_sha256}" \
            --arg image_manifest_digest "${image_manifest_digest}" \
            '{linpeas_store_path: $linpeas_store_path, linpeas_nar_hash: $linpeas_nar_hash, image_store_path: $image_store_path, image_tar_sha256: $image_tar_sha256, image_manifest_digest: $image_manifest_digest}' \
            > build.json
          cat build.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repro-build-b
          path: |
            build.json
            result-image
          retention-days: 7
          if-no-files-found: error

  compare:
    name: compare
    needs: [build-a, build-b]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: repro-build-a
          path: build-a
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: repro-build-b
          path: build-b
      - name: compare hashes
        id: compare
        run: |
          set -Eeuo pipefail
          compare_exit=0
          ./scripts/compare-repro.sh build-a/build.json build-b/build.json || compare_exit=$?
          echo "exit_code=${compare_exit}" >> "${GITHUB_OUTPUT}"
          if [[ ${compare_exit} -eq 0 ]]; then
            echo 'reproducibility check passed.'
          else
            echo 'reproducibility check failed; diffoscope step will run.'
          fi
      - name: install diffoscope (on mismatch)
        if: steps.compare.outputs.exit_code != '0'
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --yes diffoscope
      - name: run diffoscope on image tars (on mismatch)
        if: steps.compare.outputs.exit_code != '0'
        run: |
          set -Eeuo pipefail
          mkdir -p diffoscope-out
          timeout 20m diffoscope \
            --html diffoscope-out/diffoscope.html \
            --text diffoscope-out/diffoscope.txt \
            build-a/result-image \
            build-b/result-image \
            || echo 'diffoscope exited non-zero (expected on differences or timeout)'
      - name: upload diffoscope artifact (on mismatch)
        if: steps.compare.outputs.exit_code != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repro-diff
          path: diffoscope-out
          retention-days: 30
          if-no-files-found: error
      - name: open issue (on mismatch)
        if: steps.compare.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          today="$(date -u +%Y-%m-%d)"
          body="$(cat <<EOF
          The weekly reproducibility check detected a mismatch.

          - Run: ${run_url}
          - Diffoscope artifact: \`repro-diff\` (30-day retention)
          - Runbook: [docs/runbooks/reproducibility-check.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/runbooks/reproducibility-check.md)

          Investigate per the runbook; do not close until root cause is fixed or the workflow has been demoted per runbook criteria.
          EOF
          )"
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "repro mismatch: ${today}" \
            --label reproducibility \
            --body "${body}" \
            || echo 'WARN: gh issue create failed; signal is still visible via job status + artifact.'
      - name: fail job (on mismatch)
        if: steps.compare.outputs.exit_code != '0'
        run: |
          set -Eeuo pipefail
          echo 'Reproducibility mismatch detected. continue-on-error keeps workflow green during burn-in.'
          exit 1
