name: pr-title-lint

# Enforces Conventional Commits on PR titles. The repo's merge-commit
# subject is the PR title (`merge_commit_title=PR_TITLE`) with
# " (#<number>)" appended, so that composed string is what lands on `main`
# and must satisfy the same `commitlint` rules as branch commits. The job
# lints the title with the suffix attached, which is the only form the
# header-length rule can be checked against before the merge happens.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

permissions: {}

concurrency:
  group: pr-title-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            cache.nixos.org:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            tarballs.nixos.org:443
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          # commitlint resolves via flake.lock-pinned nixpkgs-unstable
          # — same binary the local pre-commit `commitlint` hook uses.
          # Replaces npm install of unpinned @commitlint/cli +
          # @commitlint/config-conventional, which scorecard's
          # Pinned-Dependencies check flagged as npmCommand not pinned
          # by hash (drift run 2026-05-28, issue #261).
          # GitHub appends " (#<number>)" to the PR title when it composes
          # the merge-commit subject, so the title alone is not the string
          # that lands. Linting the title bare leaves a window where a title
          # under the header limit produces a merge subject over it — a
          # failure that only appears on `main`, on a commit no longer
          # amendable. Lint the composed subject instead.
          printf '%s (#%s)\n' "${PR_TITLE}" "${PR_NUMBER}" |
            nix develop --command commitlint --config .commitlintrc.yml
