name: pr-title-lint

# Enforces Conventional Commits and spelling on PR titles. The repo's
# merge-commit subject is the PR title (`merge_commit_title=PR_TITLE`) with
# " (#<number>)" appended, so that composed string is what lands on `main`
# and must satisfy the same `commitlint` rules as branch commits. The job
# lints the title with the suffix attached, which is the only form the
# header-length rule can be checked against before the merge happens. That
# same composed string is also what `git-cliff` renders into the
# changelog, so the job spell-checks it too.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

permissions: {}

concurrency:
  group: pr-title-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            cache.nixos.org:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            tarballs.nixos.org:443
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          # commitlint resolves via flake.lock-pinned nixpkgs-unstable
          # — same binary the local pre-commit `commitlint` hook uses.
          # An npm install of @commitlint/cli +
          # @commitlint/config-conventional would not be pinned by hash,
          # which is what scorecard's Pinned-Dependencies check scores.
          # Resolving through the lock keeps that check at 10.
          # GitHub appends " (#<number>)" to the PR title when it composes
          # the merge-commit subject, so the title alone is not the string
          # that lands. Linting the title bare leaves a window where a title
          # under the header limit produces a merge subject over it — a
          # failure that only appears on `main`, on a commit no longer
          # amendable. Lint the composed subject instead.
          printf '%s (#%s)\n' "${PR_TITLE}" "${PR_NUMBER}" |
            nix develop --command commitlint --config .commitlintrc.yml
          # The title is also the text git-cliff renders into the changelog,
          # where a typo is frozen: correcting it there needs a render-time
          # rewrite in cliff.toml, because the subject itself is immutable
          # signed history. Spell-check it while it is still editable.
          # typos exits 2 on a finding. That collides with this repo's
          # exit-2 = could-not-run convention but does not mean it; only
          # the non-zero status matters here.
          printf '%s (#%s)\n' "${PR_TITLE}" "${PR_NUMBER}" |
            nix develop --command typos -
