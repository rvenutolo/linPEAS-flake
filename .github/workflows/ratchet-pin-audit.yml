name: ratchet-pin-audit

# Daily audit: detects the silent-regression case where an action
# publisher force-moves a tag to a different SHA after we pinned to
# it. `check-uses-sha-pinned.sh` enforces that every non-local `uses:`
# is a full SHA; Renovate keeps SHAs aligned with canonical release tags;
# neither catches the tag-vs-pin drift attack. `ratchet lint` is a
# local pin-shape tripwire (in ratchet 0.11.4; `check` is an alias);
# the per-ref `gh api` re-derivation below is the drift detector.
# Drift → deduped umbrella issue (`ratchet-drift` label)
# opened, commented on, or closed by the notify-workflow-result composite,
# mirroring stale-pin-check.

on:
  schedule:
    - cron: "15 9 * * *" # daily 09:15 UTC (opens the drift-check cluster, ahead of the dashboard render)
  workflow_dispatch:

permissions: {}

concurrency:
  group: ratchet-pin-audit
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      result: ${{ steps.audit.outputs.result }}
      reason: ${{ steps.audit.outputs.reason }}
      drifted_refs: ${{ steps.audit.outputs.drifted_refs }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            api.github.com:443
            cache.nixos.org:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            releases.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: audit pins
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'

          # Helper: emit result/reason/drifted_refs to $GITHUB_OUTPUT and exit 0
          # so the notify job can attribute the failure correctly. Mirrors the
          # emit_failure pattern in stale-pin-check.yml.
          # @arg $1 result token  (success | failure)
          # @arg $2 reason token  (none | drift-detected | upstream-api-failure | ratchet-tool-failure)
          # @arg $3 drifted_refs payload (empty unless drift-detected)
          emit_result() {
            local -r result="$1" reason="$2" refs="${3:-}"
            {
              printf 'result=%s\n'  "${result}"
              printf 'reason=%s\n'  "${reason}"
              # Use heredoc-style delimiter for the (possibly multi-line) refs payload.
              printf 'drifted_refs<<__EOF__\n%s\n__EOF__\n' "${refs}"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          }

          # Collect workflow files. Failing closed (treating an empty glob as a
          # tool failure) prevents a silent no-op if a future refactor moves
          # workflows out from under us.
          shopt -s nullglob
          mapfile -t files < <(printf '%s\n' .github/workflows/*.yml .github/workflows/*.yaml)
          shopt -u nullglob
          if (( ${#files[@]} == 0 )); then
            printf 'no workflow files matched .github/workflows/*.{yml,yaml}\n' >&2
            emit_result failure ratchet-tool-failure ''
          fi

          # Run ratchet to assert every `uses:` is SHA-pinned. Note: as of
          # ratchet 0.11.4, `check`/`lint` is a *local* pin-shape check — it
          # does NOT contact upstream APIs to detect tag-vs-SHA drift. The
          # canonical-tag drift comparison below (via `gh api`) is what
          # actually detects the silent-regression attack this workflow
          # exists to catch. Ratchet here is the unpinned-ref tripwire.
          set +e
          combined="$(nix develop --command ratchet lint "${files[@]}" 2>&1)"
          rc=$?
          set -e

          # If ratchet itself failed, classify before re-deriving drift.
          # rc != 0 here means either unpinned refs exist (an invariant
          # already guarded by check-uses-sha-pinned.sh, so reaching this
          # branch indicates the guard was bypassed) or ratchet erred. In
          # both cases the audit can't proceed safely.
          if (( rc != 0 )); then
            if grep -Eqi 'rate.?limit|API error|HTTP 5[0-9]{2}|network|timeout|tls handshake' <<<"${combined}"; then
              printf 'upstream API failure suspected; ratchet output:\n%s\n' "${combined}" >&2
              emit_result failure upstream-api-failure ''
            fi
            printf 'ratchet exit %d; raw output:\n%s\n' "${rc}" "${combined}" >&2
            emit_result failure ratchet-tool-failure ''
          fi

          # Drift detection via `gh api`. We re-derive the canonical SHA per
          # ref so we don't depend on ratchet's stdout shape — that gives us
          # a stable contract we can shape-validate against the regex below.
          #
          # Strategy:
          #   1) extract `owner/repo@SHA # tag` triples from every `uses:`
          #      line in the audited workflows;
          #   2) for each triple, query the canonical SHA for that tag;
          #   3) if pinned != canonical, emit a drift line.
          drift_lines=""
          # Pattern: `uses: owner/repo@<sha> # <tag>` (canonical pin shape in this repo)
          while IFS= read -r line; do
            # line format from grep -h: `      - uses: owner/repo@SHA # vX.Y.Z`
            if [[ "${line}" =~ uses:[[:space:]]+([A-Za-z0-9._/-]+)@([0-9a-f]{7,40})[[:space:]]*#[[:space:]]*([A-Za-z0-9._/-]+) ]]; then
              repo="${BASH_REMATCH[1]}"
              pinned="${BASH_REMATCH[2]}"
              tag="${BASH_REMATCH[3]}"
              # Skip local actions (./.github/actions/foo); they have no upstream.
              [[ "${repo}" == .* ]] && continue
              # Strip monorepo subpaths: github/codeql-action/upload-sarif → github/codeql-action.
              # GitHub's "owner/repo" is always exactly two slash-separated segments;
              # anything after is an in-repo path. The API only accepts the top-level repo.
              IFS=/ read -ra _parts <<<"${repo}"
              repo_root="${_parts[0]}/${_parts[1]}"
              # Skip self-references: `uses: <this-repo>/.github/actions/<name>@<sha>` is
              # functionally a local action invocation via absolute slug. The SHA is the
              # repo's own main-branch HEAD as Renovate maintains it; no canonical tag
              # exists to compare against.
              self_repo="${GITHUB_REPOSITORY:-rvenutolo/linPEAS-flake}"
              if [[ "${repo_root}" == "${self_repo}" ]]; then
                continue
              fi
              # Floating-major tags (vN) retarget on every release; the
              # audit cannot distinguish a benign move from an attack.
              # Skip before any API call to avoid wasted requests and a
              # spurious upstream-api-failure on a ref we exclude anyway.
              # Same rule as scripts/classify-pin-ref.sh.
              if [[ "${tag}" =~ ^v[0-9]+$ ]]; then
                printf 'excluded (floating major): %s@%s — integrity via immutable digest pin + Renovate + PR-time digest-provenance gate\n' \
                  "${repo}" "${tag}" >&2
                continue
              fi
              ref_info=""
              if ! ref_info="$(gh api \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "repos/${repo_root}/git/refs/tags/${tag}" \
                --jq '{sha: .object.sha, type: .object.type}' 2>/dev/null)" || [[ -z "${ref_info}" ]]; then
                printf 'API lookup failed for %s@%s\n' "${repo_root}" "${tag}" >&2
                emit_result failure upstream-api-failure ''
              fi
              # A malformed payload can make jq exit non-zero; without this
              # guard, errexit would abort the step before emit_result, so the
              # notify job would report reason=unknown instead of a typed
              # reason. Route jq failure to upstream-api-failure — the payload
              # came from the GitHub API.
              if ! ref_object_sha="$(jq -r '.sha // ""' <<<"${ref_info}")" \
                || ! tag_type="$(jq -r '.type // ""' <<<"${ref_info}")"; then
                printf 'jq parse failed for %s@%s: %s\n' "${repo_root}" "${tag}" "${ref_info}" >&2
                emit_result failure upstream-api-failure ''
              fi
              if [[ -z "${ref_object_sha}" || -z "${tag_type}" ]]; then
                printf 'malformed ref payload for %s@%s: %s\n' "${repo_root}" "${tag}" "${ref_info}" >&2
                emit_result failure upstream-api-failure ''
              fi

              # Dereference annotated tags to their commit. Keep BOTH the
              # tag-object SHA and the commit: a pin may legitimately be
              # either (docs/architecture/pin-convention.md), and the
              # classifier accepts both.
              deref_commit_sha=""
              if [[ "${tag_type}" == "tag" ]]; then
                if ! deref_commit_sha="$(gh api \
                  --header 'X-GitHub-Api-Version: 2022-11-28' \
                  "repos/${repo_root}/git/tags/${ref_object_sha}" \
                  --jq '.object.sha' 2>/dev/null)" || [[ -z "${deref_commit_sha}" ]]; then
                  printf 'API lookup failed (annotated tag deref) for %s@%s\n' "${repo_root}" "${tag}" >&2
                  emit_result failure upstream-api-failure ''
                fi
              fi

              verdict=""
              if ! verdict="$(bash scripts/classify-pin-ref.sh \
                "${tag}" "${pinned}" "${ref_object_sha}" "${tag_type}" "${deref_commit_sha}")"; then
                printf 'classify-pin-ref failed for %s@%s\n' "${repo_root}" "${tag}" >&2
                emit_result failure ratchet-tool-failure ''
              fi

              case "${verdict}" in
                current) ;;
                drift)
                  # canonical = where the tag now resolves (the commit
                  # for an annotated tag, else the ref object itself).
                  canonical="${deref_commit_sha:-${ref_object_sha}}"
                  # Use original `repo` (full subpath) so operators see the literal pinned ref.
                  drift_line="${repo}@${tag} pinned=${pinned} canonical=${canonical}"
                  # Shape-validate before letting it reach $GITHUB_OUTPUT.
                  if [[ ! "${drift_line}" =~ ^[A-Za-z0-9._/-]+@[A-Za-z0-9._/-]+\ pinned=[0-9a-f]{7,40}\ canonical=[0-9a-f]{7,40}$ ]]; then
                    printf 'malformed drift line rejected: %q\n' "${drift_line}" >&2
                    emit_result failure ratchet-tool-failure ''
                  fi
                  drift_lines+="${drift_line}"$'\n'
                  ;;
                skip-floating-major) ;;
                *)
                  printf 'unexpected classifier verdict %q for %s@%s\n' "${verdict}" "${repo_root}" "${tag}" >&2
                  emit_result failure ratchet-tool-failure ''
                  ;;
              esac
            fi
          done < <(grep -hE '^\s*-?\s*uses:\s+[A-Za-z0-9._/-]+@[0-9a-f]{7,40}' "${files[@]}" || true)

          if [[ -z "${drift_lines}" ]]; then
            emit_result success none ''
          fi

          emit_result failure drift-detected "${drift_lines%$'\n'}"

  notify:
    name: notify
    needs: check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/notify-workflow-result
        with:
          # Logical result computed by `check` wins; if the job died
          # before producing one, fall back to its raw result so the
          # composite files failed/cancelled runs and stays inert on
          # skipped.
          result: ${{ needs.check.outputs.result || needs.check.result }}
          label: ratchet-drift
          label-description: action pin SHA drift, or the ratchet audit could not run
          title: "ratchet-pin-audit: action pin drift detected, or the audit could not run"
          body: |
            The daily `ratchet-pin-audit` workflow flagged a failure.

            - Reason: `${{ needs.check.outputs.reason || 'unknown' }}`
            - Drifted refs (one per line):

            ```
            ${{ needs.check.outputs.drifted_refs }}
            ```

            Runbook: <https://rvenutolo.github.io/linPEAS-flake/runbooks/ratchet-pin-audit/>

            Reason values and what they mean:

            - `drift-detected` — at least one pinned action SHA no longer
              matches the canonical SHA its tag now resolves to. The
              publisher force-moved the tag. Compare the canonical SHA
              against upstream release notes; if the re-tag is legitimate,
              replace each `pinned` SHA with the corresponding `canonical`
              SHA in the affected workflow files and composite actions,
              review the diff, and open a PR. That PR fails the required
              `lint-doc-invariants` job by design (a SHA moving under an
              unchanged version comment is the digest-repoint class
              `check-pin-digest-provenance.sh` hard-fails): move the
              version label with the SHA, or update the pin to the
              corrected upstream release — the runbook links the
              documented unblock. A Renovate digest-only bump for the
              same ref hits the same gate. If the release notes do
              **not** describe the SHA change, treat this as a potential
              supply-chain event and escalate — do **not** auto-update.
              See the runbook for the exact remediation command.
            - `upstream-api-failure` — the per-ref canonical-SHA
              re-derivation (`gh api`) failed or rate-limited, or
              ratchet's own output matched the upstream-failure
              heuristic. The `github.token` is capped at 1,000
              requests/hr per repository; transient 5xx is also possible.
              Re-run the workflow once before investigating ratchet
              itself.
            - `ratchet-tool-failure` — ratchet exited non-zero (the
              re-derivation is skipped in that case), OR
              `classify-pin-ref.sh` failed or returned an unrecognized
              verdict, OR a drift line failed shape validation, OR the
              workflow glob matched zero files. Check first for an
              unpinned `uses:` finding — the PR gate should have caught
              it, so one here means the gate was bypassed. If ratchet
              instead started failing a workflow set it accepted before
              (typically after a ratchet upgrade — one that has already
              landed via a `nixpkgs-unstable` lock bump whose PR carried
              the matching `ratchet <X.Y.Z>` literals), read the
              `ratchet exit N; raw output:` block: a rule the new
              ratchet enforces means fixing the workflows; a ratchet
              regression means waiting for a later `nixpkgs-unstable`
              move that ships a fixed ratchet. There is no in-tree way
              to hold ratchet back.
            - `unknown` — the `check` job produced no `reason` output:
              the audit step hit an unhandled error, a step before it
              failed, or the run was cancelled (a banner above, or the
              run's comment, says so). Inspect the run log directly.

            This issue auto-closes once the next daily run sees a clean
            audit (`result=success`, `reason=none`).
          github-token: ${{ secrets.GITHUB_TOKEN }}
