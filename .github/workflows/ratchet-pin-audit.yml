name: ratchet-pin-audit

# Daily audit: detects the silent-regression case where an action
# publisher force-moves a tag to a different SHA after we pinned to
# it. `check-uses-sha-pinned.sh` enforces that every `uses:` is a
# SHA; Renovate keeps SHAs aligned with canonical release tags;
# neither catches the tag-vs-pin drift attack. `ratchet check` is
# the canonical detector. Drift → deduped umbrella issue
# (`ratchet-drift` label) opened/edited/closed by the
# notify-workflow-result composite, mirroring stale-pin-check.

on:
  schedule:
    - cron: "0 11 * * *" # daily 11:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: ratchet-pin-audit
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      result: ${{ steps.audit.outputs.result }}
      reason: ${{ steps.audit.outputs.reason }}
      drifted_refs: ${{ steps.audit.outputs.drifted_refs }}
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: audit pins
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          # Placeholder — real classification logic lands in Task 3.
          {
            printf 'result=success\n'
            printf 'reason=none\n'
            printf 'drifted_refs=\n'
          } >> "${GITHUB_OUTPUT}"

  notify:
    name: notify
    needs: check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/notify-workflow-result
        with:
          result: ${{ needs.check.outputs.result || (needs.check.result == 'failure' && 'failure' || 'skipped') }}
          label: ratchet-drift
          title: "ratchet-pin-audit: action pin drift detected"
          body: |
            Placeholder body — real per-reason content lands in Task 4.

            Reasons covered: drift-detected, upstream-api-failure, ratchet-tool-failure, unknown.
          github-token: ${{ secrets.GITHUB_TOKEN }}
