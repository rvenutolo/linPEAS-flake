name: actions-cache-prune

on:
  schedule:
    - cron: "0 8 * * *" # daily 08:00 UTC (leads the daily window; prune before the bump pipeline runs)
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    types: [closed]

permissions: {}

concurrency:
  group: actions-cache-prune-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  prune-stale:
    if: |
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && github.repository == 'rvenutolo/linPEAS-flake'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # TODO: restore egress-policy block once block mode stops dropping allowed hosts on
          # westus2 runners: https://github.com/step-security/harden-runner/issues/708
          egress-policy: audit
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443

      - name: prune caches older than 7 days
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          threshold="$(date --utc --iso-8601=seconds --date='7 days ago')"
          # Captured before the loop rather than process-substituted into
          # it: a substitution's exit status never reaches errexit, so a
          # failed listing would read as "nothing to prune" and the run
          # would go green.
          ids="$(
            gh api --paginate \
              "repos/${REPO}/actions/caches?per_page=100" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --jq ".actions_caches[] | select(.last_accessed_at < \"${threshold}\") | .id"
          )"
          deleted=0
          while read -r id; do
            [[ -z "${id}" ]] && continue
            gh api --method DELETE \
              "repos/${REPO}/actions/caches/${id}" \
              --header "X-GitHub-Api-Version: 2022-11-28" >/dev/null
            deleted=$((deleted + 1))
          done <<< "${ids}"
          printf 'pruned %d age-stale cache entries\n' "${deleted}"

      - name: prune caches whose ref is a deleted branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          branches="$(
            gh api --paginate \
              "repos/${REPO}/branches?per_page=100" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --jq '.[].name'
          )"
          open_pulls="$(
            gh api --paginate \
              "repos/${REPO}/pulls?state=open&per_page=100" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --jq '.[].number'
          )"
          live=""
          while read -r b; do
            [[ -n "${b}" ]] && live+="refs/heads/${b}"$'\n'
          done <<< "${branches}"
          while read -r n; do
            [[ -n "${n}" ]] && live+="refs/pull/${n}/merge"$'\n'
          done <<< "${open_pulls}"
          # Captured before the loop so errexit sees a failed listing.
          caches="$(
            gh api --paginate \
              "repos/${REPO}/actions/caches?per_page=100" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --jq '.actions_caches[] | [.id, .ref] | @tsv'
          )"
          deleted=0
          while IFS=$'\t' read -r id ref; do
            [[ -z "${id}" ]] && continue
            if ! grep --line-regexp --fixed-strings --quiet "${ref}" <<< "${live}"; then
              gh api --method DELETE \
                "repos/${REPO}/actions/caches/${id}" \
                --header "X-GitHub-Api-Version: 2022-11-28" >/dev/null
              deleted=$((deleted + 1))
            fi
          done <<< "${caches}"
          printf 'pruned %d orphan-ref cache entries\n' "${deleted}"

  prune-on-pr-close:
    if: |
      github.event_name == 'pull_request'
      && github.repository == 'rvenutolo/linPEAS-flake'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # TODO: restore egress-policy block once block mode stops dropping allowed hosts on
          # westus2 runners: https://github.com/step-security/harden-runner/issues/708
          egress-policy: audit
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443

      # The default branch, not the event's ref: GitHub deletes
      # refs/pull/<n>/merge when a PR closes, so the event's ref may no
      # longer resolve when this job runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: prune caches scoped to closed PR
        env:
          GH_TOKEN: ${{ github.token }}
          # Set so `gh api` never fills a `{owner}`, `{repo}` or `{branch}`
          # placeholder from the checkout's git remote.
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          # The helper drops a head ref that could change the listing query.
          refs="$(bash scripts/classify-pr-cache-refs.sh "${PR_NUMBER}" "${HEAD_REF}")"
          mapfile -t targets <<< "${refs}"
          deleted=0
          for ref in "${targets[@]}"; do
            # Captured before the loop so errexit sees a failed listing.
            # Query fields, not a hand-built query string, so gh
            # URL-encodes the ref.
            ids="$(
              gh api --method GET --paginate \
                "repos/${REPO}/actions/caches" \
                --raw-field per_page=100 \
                --raw-field ref="${ref}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --jq '.actions_caches[].id'
            )"
            while read -r id; do
              [[ -z "${id}" ]] && continue
              gh api --method DELETE \
                "repos/${REPO}/actions/caches/${id}" \
                --header "X-GitHub-Api-Version: 2022-11-28" >/dev/null
              deleted=$((deleted + 1))
            done <<< "${ids}"
          done
          printf 'pruned %d cache entries for PR #%s\n' "${deleted}" "${PR_NUMBER}"

  notify:
    name: notify
    needs: [prune-stale, prune-on-pr-close]
    if: always() && github.repository == 'rvenutolo/linPEAS-flake'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      issues: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # TODO: restore egress-policy block once block mode stops dropping allowed hosts on
          # westus2 runners: https://github.com/step-security/harden-runner/issues/708
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/notify-workflow-result # zizmor: ignore[self-repository]
        with:
          # The two prune jobs run on disjoint events, so exactly one of
          # them runs and the other is skipped; its raw result is the run's.
          result: ${{ needs.prune-stale.result == 'skipped' && needs.prune-on-pr-close.result || needs.prune-stale.result }}
          label: actions-cache-prune-failure
          title: "actions-cache-prune: cache pruning failed"
          label-description: actions-cache-prune could not prune the Actions cache
          body: |
            The `actions-cache-prune` workflow failed on a
            `${{ github.event_name }}` run, so stale or orphaned Actions
            cache entries were not deleted. A missed prune costs only
            cache space, but a cache entry left behind outlives the window
            this workflow bounds it to.

            Run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            To resolve: read the failing step's log, then dispatch the
            daily sweep again (`gh workflow run actions-cache-prune.yml`).
            A sweep's orphan-ref pass picks up a failed PR-close prune:
            it evicts the merge ref's cache, and the head ref's once the
            branch is deleted. See
            docs/development/cache-cleanup.md. This issue auto-closes on
            the next clean run.
          github-token: ${{ secrets.GITHUB_TOKEN }}
