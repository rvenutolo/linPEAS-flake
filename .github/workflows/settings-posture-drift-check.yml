name: settings-posture-drift-check

# Asserts the live repo settings match docs/security/settings-posture.md.
# Closes the gap where settings-posture was the source of truth for
# binding repo flags (default_workflow_permissions, secret-scanning,
# allow_squash_merge, etc.) but had no CI drift check — a single UI
# flip could silently invalidate other defense-in-depth controls
# until the next manual review.
#
# Schedule + dispatch only (no PR/push trigger). The settings endpoints
# this script probes (/repos/X, /repos/X/actions/permissions,
# /repos/X/actions/permissions/workflow, /repos/X/environments/...)
# require *administration* scope, which the default `github.token`
# never receives. Auth is done via a dedicated read-only GitHub App
# (settings-drift-checker; Permissions: Administration:Read,
# Metadata:Read) whose installation token is minted per run by
# actions/create-github-app-token.
#
# Setup: see docs/runbooks/settings-drift-app.md.
#
# On failure, opens a deduped `settings-drift` issue. Auto-closes on
# the next clean run.

on:
  schedule:
    - cron: "25 9 * * *" # daily 09:25 UTC (after ratchet-pin-audit in the drift-check cluster)
  workflow_dispatch:

permissions: {}

concurrency:
  group: settings-posture-drift-check
  cancel-in-progress: false

jobs:
  drift-check:
    runs-on: ubuntu-latest
    if: github.repository == 'rvenutolo/linPEAS-flake'
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      result: ${{ steps.probe.outcome }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            api.github.com:443
            cache.nixos.org:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: harness passes against fixtures
        run: nix develop --command bash tests/check-settings-posture.test.sh

      # Mint a short-lived installation token for the settings-drift-checker
      # App (Permissions: Administration:Read, Metadata:Read).
      # Lives only for this job; auto-revoked on job end.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.SETTINGS_DRIFT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SETTINGS_DRIFT_APP_PRIVATE_KEY }}
          # Least-privilege scope: read-only administration access to probe
          # repo settings. No write permissions needed.
          permission-administration: read

      - name: probe live repo settings match desired posture
        id: probe
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: nix develop --command ./scripts/check-settings-posture.sh

  notify:
    name: notify
    needs: drift-check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/notify-workflow-result
        with:
          # Raw job result: the composite files cancelled runs as
          # infrastructure failures and is inert on skipped.
          result: ${{ needs.drift-check.result }}
          label: settings-drift
          title: "settings-posture-drift-check: live repo settings have drifted"
          body: |
            The daily `settings-posture-drift-check` watchdog detected
            that the live `rvenutolo/linPEAS-flake` repository settings
            no longer match `docs/security/settings-posture.md`.

            See the failing job logs for the specific drift line(s);
            every mismatched setting is reported in one run.

            Remediation: reconcile by either
            - reverting the UI change so live matches the doc, or
            - updating `docs/security/settings-posture.md` AND any
              dependent enforcement to reflect the new intended posture
              (treat this as a security review).

            This issue auto-closes once the next watchdog run sees the
            settings reconciled.
          label-description: live repo settings drifted from settings-posture.md
          github-token: ${{ secrets.GITHUB_TOKEN }}
