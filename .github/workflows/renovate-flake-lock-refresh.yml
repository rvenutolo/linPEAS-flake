name: renovate-flake-lock-refresh

# Auto-refreshes `flake.lock` on Renovate PRs that bump a flake input
# URL fragment (currently `cachix/git-hooks.nix` SHA and the
# `NixOS/nixpkgs` branch name). Renovate's hosted SaaS cannot run
# `nix flake update --update-input <name>` itself (no Nix on the
# runner, no `postUpgradeTasks` allowlist), so Renovate ships a PR with
# `flake.nix` ahead of `flake.lock`. CI's `flake-check` job fails on
# that PR until a maintainer runs the lock-refresh by hand, per the
# `docs/architecture/flake-input-bumps.md` runbook.
#
# This workflow closes that gap automatically:
#
#   1. `identify` — fires off the `ci` workflow's completion on a
#      `renovate/*` branch; finds the matching open PR, verifies its
#      author is the `renovate[bot]` App, confirms it touches
#      `flake.nix`, and maps the PR title to a flake input name.
#   2. `compute-refresh` — checks out the PR branch, runs
#      `nix flake update --update-input <name>`, uploads the resulting
#      `flake.lock` as a job-scoped artifact. No write credentials.
#   3. `push-refresh` — downloads the artifact, mints an App
#      installation token (`linpeas-flake-bumper` GitHub App), and
#      commits the refreshed `flake.lock` to the PR branch via
#      REST `PUT /contents`. GitHub web-flow-signs the commit because
#      the request is authenticated by an App installation token, so
#      `required_signatures` on `protect-main` is satisfied if the PR
#      later merges.
#   4. `notify` — files / closes a deduped issue under
#      `renovate-flake-lock-refresh-failure`.
#
# Loop-breaker: when this workflow's commit lands on the PR branch,
# `ci` re-runs, which re-triggers this workflow. The second pass'
# `compute-refresh` produces no diff (lockfile already in sync) and
# the `push-refresh` job is skipped via `needs.compute-refresh.outputs.changed`.
#
# Renovate rebase safety: Renovate considers a branch "modified
# externally" when any commit on it carries a git-author that differs
# from its configured `gitAuthor`. Our App-signed commits are authored
# as `linpeas-flake-bumper[bot]`, distinct from Renovate's identity,
# so Renovate leaves the branch alone instead of rebasing our commit
# away.
#
# Credential split: mirrors `update-flake-lock.yml`. `compute-refresh`
# runs untrusted Nix-evaluating actions with `contents: read` and no
# App-key reference. `push-refresh` holds the App private key only.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions: {}

concurrency:
  # Branch-scoped: unrelated Renovate PRs can refresh in parallel,
  # repeated `ci` runs on the same branch queue cleanly.
  group: renovate-flake-lock-refresh-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  identify:
    # Defense-in-depth gate. Today's load-bearing trust is the
    # `author.login == renovate[bot]` check in the detect step below — a
    # fork PR cannot impersonate that App identity. The
    # `head_repository.full_name` check here closes a future-regression
    # gap: if GitHub ever changes how `author.login` is computed for
    # workflow_run-triggered events (or how PRs from forks declare their
    # author), this top-level gate ensures we only act on PRs whose
    # branch lives in the same repo, per GitHub's documented
    # workflow_run hardening pattern.
    if: |
      github.repository == 'rvenutolo/linPEAS-flake' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_refresh: ${{ steps.detect.outputs.should_refresh }}
      pr_number: ${{ steps.detect.outputs.pr_number }}
      head_branch: ${{ steps.detect.outputs.head_branch }}
      input_name: ${{ steps.detect.outputs.input_name }}
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - name: identify Renovate PR + bumped input
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'

          # Find the open PR for this head branch.
          pr_number=$(gh pr list \
            --repo "${REPO}" \
            --head "${HEAD_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [[ -z "${pr_number}" || "${pr_number}" == "null" ]]; then
            printf 'no open PR for %s; skip\n' "${HEAD_BRANCH}"
            printf 'should_refresh=false\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Pull author + changed files + title in one round-trip.
          pr_json=$(gh pr view "${pr_number}" \
            --repo "${REPO}" \
            --json author,files,title)

          author=$(printf '%s' "${pr_json}" | jq -r '.author.login')
          # Hosted Renovate App installs as `renovate[bot]`. Self-hosted
          # legacy installs may show as `renovate`. Accept both.
          if [[ "${author}" != "renovate" && "${author}" != "renovate[bot]" ]]; then
            printf 'PR author %s is not Renovate; skip\n' "${author}"
            printf 'should_refresh=false\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # PR must touch flake.nix; otherwise nothing for us to refresh.
          touches_flake=$(printf '%s' "${pr_json}" \
            | jq -r '[.files[].path] | index("flake.nix")')
          if [[ "${touches_flake}" == "null" ]]; then
            printf 'PR does not touch flake.nix; skip\n'
            printf 'should_refresh=false\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Map PR title to flake input name. Renovate's hosted SaaS
          # uses dep names from the custom-managers in renovate.json:
          # `cachix/git-hooks.nix`       -> input `pre-commit-hooks`
          # `NixOS/nixpkgs-unstable`     -> input `nixpkgs-unstable`
          # `NixOS/nixpkgs`              -> input `nixpkgs`
          # Title shapes observed in past Renovate PRs:
          #   "Update cachix/git-hooks.nix digest to <sha>"
          #   "Update NixOS/nixpkgs-unstable to <version>"
          #   "Update NixOS/nixpkgs to <version>"
          title=$(printf '%s' "${pr_json}" | jq -r '.title')
          input_name=""
          # Map PR title to flake input name. nixpkgs-unstable arm MUST precede
          # the nixpkgs arm — the latter is a substring of the former, so case
          # ordering decides the match.
          case "${title}" in
            *"cachix/git-hooks.nix"*)
              input_name="pre-commit-hooks"
              ;;
            *"NixOS/nixpkgs-unstable"*)
              input_name="nixpkgs-unstable"
              ;;
            *"NixOS/nixpkgs"*)
              input_name="nixpkgs"
              ;;
            *)
              printf 'title %q does not match a known flake input; skip\n' \
                "${title}"
              printf 'should_refresh=false\n' >> "${GITHUB_OUTPUT}"
              exit 0
              ;;
          esac

          printf 'will refresh %s on PR #%s (%s)\n' \
            "${input_name}" "${pr_number}" "${HEAD_BRANCH}"
          {
            printf 'should_refresh=true\n'
            printf 'pr_number=%s\n' "${pr_number}"
            printf 'head_branch=%s\n' "${HEAD_BRANCH}"
            printf 'input_name=%s\n' "${input_name}"
          } >> "${GITHUB_OUTPUT}"

  compute-refresh:
    needs: identify
    if: needs.identify.outputs.should_refresh == 'true' && github.repository == 'rvenutolo/linPEAS-flake'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.identify.outputs.head_branch }}
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: refresh flake.lock for the bumped input
        env:
          INPUT_NAME: ${{ needs.identify.outputs.input_name }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          cp flake.lock flake.lock.before
          # --commit-lock-file=false is unsupported on nix 2.34.x; use plain
          # update --update-input which writes flake.lock in place.
          nix flake update --update-input "${INPUT_NAME}"
      - name: detect change
        id: diff
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          if cmp --silent flake.lock flake.lock.before; then
            printf 'changed=false\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'changed=true\n' >> "${GITHUB_OUTPUT}"
          fi
      - name: upload refreshed lock
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flake-lock-refreshed
          path: flake.lock
          retention-days: 1
          if-no-files-found: error

  push-refresh:
    needs: [identify, compute-refresh]
    if: needs.compute-refresh.outputs.changed == 'true' && github.repository == 'rvenutolo/linPEAS-flake'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: flake-lock-refreshed
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.BUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}
          # Least-privilege scope: token only needs to write file contents
          # (PUT /contents for flake.lock on the Renovate PR branch).
          # No other installation scopes are needed.
          permission-contents: write
      - name: sanity-check artifact
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          # Defense-in-depth vs a compromised compute-refresh emitting
          # garbage in place of valid Nix lockfile JSON.
          jq -e '.nodes | type == "object"' flake.lock >/dev/null
      - name: commit refreshed flake.lock to PR branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ needs.identify.outputs.head_branch }}
          INPUT_NAME: ${{ needs.identify.outputs.input_name }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          api_header="X-GitHub-Api-Version: 2022-11-28"

          # Fetch the current flake.lock blob SHA on the PR branch.
          branch_lock_sha=$(gh api \
            --header "${api_header}" \
            "repos/${REPO}/contents/flake.lock?ref=${HEAD_BRANCH}" \
            --jq .sha)

          # Loop-breaker idempotency: compute the git blob SHA of our
          # refreshed flake.lock and compare. If equal, the branch
          # already carries the same lockfile - bail without committing
          # to avoid a churn loop with the second ci pass.
          our_lock_sha=$(git hash-object flake.lock)
          if [[ "${our_lock_sha}" == "${branch_lock_sha}" ]]; then
            printf 'flake.lock on %s already matches refreshed copy; nothing to commit\n' \
              "${HEAD_BRANCH}"
            exit 0
          fi

          lock_b64=$(base64 --wrap=0 flake.lock)

          # Commit. Authenticated as the linpeas-flake-bumper App, so
          # GitHub web-flow-signs the resulting commit.
          gh api --method PUT \
            --header "${api_header}" \
            "repos/${REPO}/contents/flake.lock" \
            --field message="chore(flake): refresh flake.lock for ${INPUT_NAME}" \
            --field content="${lock_b64}" \
            --field sha="${branch_lock_sha}" \
            --field branch="${HEAD_BRANCH}" >/dev/null

          printf 'committed flake.lock refresh to %s\n' "${HEAD_BRANCH}"

  notify:
    name: notify
    needs: [identify, compute-refresh, push-refresh]
    # Only post if we actually attempted a refresh. An identify-stage
    # skip means the workflow_run was not a Renovate flake bump; that
    # is the steady-state for >99% of ci completions and must stay
    # silent.
    if: always() && needs.identify.outputs.should_refresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/notify-workflow-result
        with:
          # Success: compute-refresh produced no diff (push-refresh
          # skipped) OR push-refresh completed cleanly.
          # Failure: any failure in identify / compute-refresh / push-refresh.
          result: ${{ (needs.identify.result == 'success' && needs.compute-refresh.result == 'success' && (needs.push-refresh.result == 'success' || needs.push-refresh.result == 'skipped')) && 'success' || 'failure' }}
          label: renovate-flake-lock-refresh-failure
          title: "renovate-flake-lock-refresh: auto-refresh failed"
          body: |
            The `renovate-flake-lock-refresh` workflow failed.

            - PR: #${{ needs.identify.outputs.pr_number }}
            - Input: `${{ needs.identify.outputs.input_name }}`
            - identify: `${{ needs.identify.result }}`
            - compute-refresh: `${{ needs.compute-refresh.result }}`
            - push-refresh: `${{ needs.push-refresh.result }}`

            Manual fallback runbook: `docs/architecture/flake-input-bumps.md`
            steps 1-3 (checkout PR, `nix flake update --update-input <name>`,
            `nix fmt`).
          label-description: renovate-flake-lock-refresh workflow failure
          github-token: ${{ secrets.GITHUB_TOKEN }}
