name: renovate-flake-lock-refresh

# Completes two kinds of Renovate PR that hosted Renovate cannot finish
# itself. Renovate's hosted SaaS cannot run commands (no Nix on the
# runner, no `postUpgradeTasks` allowlist), so:
#
#   - A flake-input bump (currently the `cachix/git-hooks.nix` SHA and
#     the `NixOS/nixpkgs` branch name) ships with `flake.nix` ahead of
#     `flake.lock`, and CI's `flake-check` job fails until the lock is
#     refreshed with `nix flake update <name>`.
#   - A workflow bump can change a job's `runs-on:` label, which the
#     runner cells of `docs/architecture/ci.md` and `docs/install/nix.md`
#     name; the required `doc-freshness` check fails until
#     `scripts/refresh-runner-labels.sh` rewrites them.
#
# The manual fallback for both is the
# `docs/architecture/flake-input-bumps.md` runbook. A PR can need both
# refreshes; they run in the one `compute-refresh` job and land through
# the one push loop.
#
# This workflow closes that gap automatically:
#
#   1. `identify` — fires off the `ci` workflow's completion on a
#      `renovate/*` branch; finds the matching open PR, verifies its
#      author is the Renovate App via
#      `scripts/classify-renovate-pr-author.sh`, and reads its changed
#      files. A `flake.nix` touch maps the PR title to a flake input
#      name; a `.github/workflows/` touch selects the runner-label
#      refresh.
#   2. `compute-refresh` — checks out the PR branch, runs
#      `nix flake update <name>` and regenerates the docs that lock
#      derives (flake path), runs `scripts/refresh-runner-labels.sh`
#      (runner path), asserts nothing outside `COMMITTABLE_PATHS` was
#      written, and uploads the result as a job-scoped artifact.
#      No write credentials.
#   3. `push-refresh` — downloads the artifact, mints an App installation
#      token (`linpeas-flake-bumper` GitHub App), checks each runner doc
#      against its branch copy with `scripts/check-runner-doc-diff.sh`
#      from the default branch, and then commits each changed
#      committable path to the PR branch via REST `PUT /contents`.
#      GitHub web-flow-signs the commits because the request is
#      authenticated by an App installation token, so
#      `required_signatures` on `protect-main` is satisfied if the PR
#      later merges.
#   4. `notify` — runs whenever `identify` ran, asks
#      `scripts/classify-refresh-notify-result.sh` what the run amounts
#      to, and files / closes a deduped issue under
#      `renovate-flake-lock-refresh-failure`. The classifier decides,
#      rather than a job gate, because a gate reading `identify`'s
#      outputs is blind to an `identify` that failed and set none.
#
# Loop-breaker: when this workflow's commit lands on the PR branch,
# `ci` re-runs, which re-triggers this workflow. The second pass'
# `compute-refresh` produces no diff (lockfile and runner docs already
# in sync) and the `push-refresh` job is skipped via
# `needs.compute-refresh.outputs.changed`. The runner path runs on every
# Renovate PR that touches a workflow, and most of those change no
# runner label, so the same no-diff skip is its common case.
#
# Renovate rebase safety: Renovate considers a branch "modified
# externally" when any commit on it carries a git-author that differs
# from its configured `gitAuthor`. Our App-signed commits are authored
# as `linpeas-flake-bumper[bot]`, distinct from Renovate's identity,
# so Renovate leaves the branch alone instead of rebasing our commit
# away.
#
# Credential split: mirrors `update-flake-lock.yml`. `compute-refresh`
# runs untrusted Nix-evaluating actions and the branch's own generators
# with `contents: read` and no App-key reference. `push-refresh` holds
# the App private key only, and runs no code from the PR branch.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions: {}

# Docs this repo generates from evaluated flake state: a lock refresh
# can make them stale without touching any other tracked file, so the
# refresh regenerates them alongside the lock it writes. The set is
# asserted against the freshness hooks that declare `flake.lock` a
# trigger by scripts/check-lock-derived-docs.sh.
env:
  LOCK_DERIVED_GENERATORS: |
    scripts/refresh-flake-show.sh
    scripts/refresh-treefmt-config.sh
  # Generators whose docs derive from .github/workflows/ci.yml rather
  # than from the lock. scripts/check-lock-derived-docs.sh binds their
  # declared outputs into COMMITTABLE_PATHS too, and requires each to be
  # run by a freshness hook that names ci.yml. push-refresh commits a
  # runner doc only past its content floor and refuses a changed path
  # it has no floor class for, so a new entry here also needs a class
  # there.
  WORKFLOW_DERIVED_GENERATORS: |
    scripts/refresh-runner-labels.sh
  # Every path push-refresh is allowed to commit. compute-refresh holds
  # no write credential, so this list — not the artifact it uploads — is
  # what bounds the file set a refresh can land on the PR branch.
  COMMITTABLE_PATHS: |
    flake.lock
    docs/reference/flake-outputs.md
    docs/reference/treefmt-config.md
    docs/architecture/ci.md
    docs/install/nix.md

concurrency:
  # Branch-scoped: unrelated Renovate PRs can refresh in parallel,
  # repeated `ci` runs on the same branch queue cleanly.
  group: renovate-flake-lock-refresh-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  identify:
    # Defense-in-depth gate. Today's load-bearing trust is the
    # author check in the detect step below — a fork PR cannot
    # impersonate that App identity. The
    # `head_repository.full_name` check here closes a future-regression
    # gap: if GitHub ever changes how `author.login` is computed for
    # workflow_run-triggered events (or how PRs from forks declare their
    # author), this top-level gate ensures we only act on PRs whose
    # branch lives in the same repo, per GitHub's documented
    # workflow_run hardening pattern.
    if: |
      github.repository == 'rvenutolo/linPEAS-flake' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_refresh: ${{ steps.detect.outputs.should_refresh }}
      pr_number: ${{ steps.detect.outputs.pr_number }}
      head_branch: ${{ steps.detect.outputs.head_branch }}
      input_name: ${{ steps.detect.outputs.input_name }}
      runner_docs: ${{ steps.detect.outputs.runner_docs }}
      unmapped: ${{ steps.detect.outputs.unmapped }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
      # Checks out this workflow's own ref — the default branch — and
      # NOT the Renovate branch whose `ci` run triggered us.
      # classify-renovate-flake-input.sh names the flake input that a
      # later job refreshes while holding an App installation token, so
      # it has to come from trusted content; resolving it from the head
      # under test would let a branch choose the classifier that judges
      # it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: identify Renovate PR + refreshes it needs
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
          LC_ALL: C
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'

          # The head branch reaches push-refresh, where it lands inside
          # `gh api` endpoints that run with the App token. gh expands
          # `{owner}`, `{repo}` and `{branch}` placeholders anywhere in an
          # endpoint, query string included, so only a branch name made of
          # letters, digits, `.`, `_`, `/` and `-` goes further. Like an
          # unexpected author, any other shape is an anomaly on a
          # `renovate/` branch, so it fails the job and reaches `notify`
          # rather than skipping. The bracket class is ASCII only under
          # LC_ALL=C, set in this step's env.
          if [[ ! "${HEAD_BRANCH}" =~ ^renovate/[A-Za-z0-9._/-]+$ ]]; then
            printf 'head branch %q is not a plain renovate/ branch name - aborting\n' \
              "${HEAD_BRANCH}" >&2
            exit 1
          fi

          # Find the open PR for this head branch.
          pr_number=$(gh pr list \
            --repo "${REPO}" \
            --head "${HEAD_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [[ -z "${pr_number}" || "${pr_number}" == "null" ]]; then
            printf 'no open PR for %s; skip\n' "${HEAD_BRANCH}"
            printf 'should_refresh=false\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Pull author + changed files + title in one round-trip.
          pr_json=$(gh pr view "${pr_number}" \
            --repo "${REPO}" \
            --json author,files,title)

          # The author gate lives in
          # scripts/classify-renovate-pr-author.sh so it can be exercised
          # against the logins GitHub really returns by
          # tests/classify-renovate-pr-author.test.sh; inline here it was
          # unreachable by any test and drifted out of step with them.
          # `gh pr view --json author` renders an App as `app/<slug>`,
          # which an inline two-spelling comparison read as "not
          # Renovate" and skipped, silently, on every PR.
          #
          # Exit 3 is "some other author". Reaching it is an anomaly, not
          # a routine no-op: this job only runs for a PR whose branch is
          # under `renovate/`, so an author Renovate does not own means
          # either somebody pushed such a branch by hand or the login
          # shape moved again. Both are worth surfacing, and the silent
          # `should_refresh=false` this replaces is what let the last
          # shape change sit undetected. Failing here reaches `notify`,
          # which classifies an `identify` that failed and files an
          # issue.
          author=$(printf '%s' "${pr_json}" | jq -r '.author.login')
          author_rc=0
          ./scripts/classify-renovate-pr-author.sh "${author}" >/dev/null ||
            author_rc=$?
          if [[ ${author_rc} -ne 0 ]]; then
            printf 'PR #%s on %s has author %q, which is not Renovate\n' \
              "${pr_number}" "${HEAD_BRANCH}" "${author}" >&2
            exit "${author_rc}"
          fi

          # `--json files` lists at most the first 100 changed files. A
          # Renovate PR is far under that, grouped github-actions PRs
          # included. A larger one could hide a workflow touch, and then
          # no runner refresh runs and the required `doc-freshness` check
          # stays red on the PR: a stall, never a wrong push.
          runner_docs=$(printf '%s' "${pr_json}" \
            | jq -r 'any(.files[].path; startswith(".github/workflows/"))')
          touches_flake=$(printf '%s' "${pr_json}" \
            | jq -r 'any(.files[].path; . == "flake.nix")')
          if [[ "${runner_docs}" != 'true' && "${runner_docs}" != 'false' ]] ||
            [[ "${touches_flake}" != 'true' && "${touches_flake}" != 'false' ]]; then
            printf 'could not read the changed-file list of PR #%s\n' "${pr_number}" >&2
            exit 2
          fi
          if [[ "${touches_flake}" == 'false' && "${runner_docs}" == 'false' ]]; then
            printf 'PR touches neither flake.nix nor a workflow; skip\n'
            printf 'should_refresh=false\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Map the PR title to a flake input. The mapping lives in
          # scripts/classify-renovate-flake-input.sh so it can be
          # exercised against real Renovate titles by
          # tests/classify-renovate-flake-input.test.sh; inline here it
          # was unreachable by any test and drifted out of step with the
          # titles Renovate actually opens.
          #
          # Exit 3 is "no flake input maps to this title", which is
          # distinct from a broken invocation (exit 2). Every PR that
          # reaches the classifier is a Renovate PR that edits flake.nix,
          # so each one should map; one that does not means the title
          # shape moved again, and that is reported rather than skipped.
          # It is reported without any refresh even when the PR also
          # touches a workflow: the PR needs a person either way, and the
          # report is the signal.
          #
          # A runner-only PR skips the classifier: its title (for example
          # `chore(deps): update dependency ubuntu to v26`) names no flake
          # input, and `input_name` stays empty.
          input_name=''
          if [[ "${touches_flake}" == 'true' ]]; then
            title=$(printf '%s' "${pr_json}" | jq -r '.title')
            classify_rc=0
            input_name=$(./scripts/classify-renovate-flake-input.sh "${title}") ||
              classify_rc=$?
            if [[ ${classify_rc} -eq 3 ]]; then
              printf 'title %q maps to no flake input, but the PR edits flake.nix\n' \
                "${title}"
              {
                printf 'should_refresh=false\n'
                printf 'unmapped=true\n'
                printf 'pr_number=%s\n' "${pr_number}"
                printf 'head_branch=%s\n' "${HEAD_BRANCH}"
                printf 'runner_docs=%s\n' "${runner_docs}"
              } >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            if [[ ${classify_rc} -ne 0 ]]; then
              printf 'classify-renovate-flake-input failed (exit %d)\n' \
                "${classify_rc}" >&2
              exit "${classify_rc}"
            fi
          fi

          printf 'will refresh on PR #%s (%s): input %q, runner docs %s\n' \
            "${pr_number}" "${HEAD_BRANCH}" "${input_name}" "${runner_docs}"
          {
            printf 'should_refresh=true\n'
            printf 'pr_number=%s\n' "${pr_number}"
            printf 'head_branch=%s\n' "${HEAD_BRANCH}"
            printf 'input_name=%s\n' "${input_name}"
            printf 'runner_docs=%s\n' "${runner_docs}"
          } >> "${GITHUB_OUTPUT}"

  compute-refresh:
    needs: identify
    if: needs.identify.outputs.should_refresh == 'true' && github.repository == 'rvenutolo/linPEAS-flake'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            cache.nixos.org:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identify.outputs.head_branch }}
          persist-credentials: false
      # This job checks out the Renovate branch head, not this workflow's
      # commit, so `./` reads the setup-nix composite from that branch's tree
      # rather than from the running commit. `$/` would resolve it at the
      # running commit, but it is not adoptable while no released actionlint
      # parses it. What a modified composite can reach here is bounded: the job
      # holds `permissions: contents: read` and passes only that GITHUB_TOKEN,
      # carries no App key, checks out with `persist-credentials: false`, and
      # runs under a harden-runner `egress-policy: block` allowlist. A
      # SHA-pinned self-reference, as pages.yml uses for its notify step,
      # closes the gap without waiting on actionlint.
      - uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository]
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: refresh flake.lock for the bumped input
        id: lock
        if: needs.identify.outputs.input_name != ''
        env:
          INPUT_NAME: ${{ needs.identify.outputs.input_name }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          cp flake.lock "${RUNNER_TEMP}/flake.lock.before"
          # --commit-lock-file=false is unsupported on nix 2.34.x; plain
          # update writes flake.lock in place, which is what we want.
          nix flake update "${INPUT_NAME}"
          if cmp --silent flake.lock "${RUNNER_TEMP}/flake.lock.before"; then
            printf 'changed=false\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'changed=true\n' >> "${GITHUB_OUTPUT}"
          fi
      # An unchanged lock leaves the lock-derived docs as they were, so
      # they are regenerated only when the lock moved.
      - name: regenerate lock-derived docs
        if: steps.lock.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          while IFS= read -r gen; do
            [[ -n "${gen}" ]] || continue
            printf 'running %s\n' "${gen}"
            nix develop --command bash "${gen}"
          done <<< "${LOCK_DERIVED_GENERATORS}"
      # Runs on every Renovate PR that touches a workflow, whether or not
      # a runner label moved; an unchanged label leaves both docs
      # byte-identical. The generators come from the PR branch, like
      # everything else in this job, so push-refresh does not trust their
      # output: it holds each runner doc to scripts/check-runner-doc-diff.sh
      # from the default branch before committing it.
      - name: regenerate workflow-derived docs
        if: needs.identify.outputs.runner_docs == 'true'
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          while IFS= read -r gen; do
            [[ -n "${gen}" ]] || continue
            printf 'running %s\n' "${gen}"
            nix develop --command bash "${gen}"
          done <<< "${WORKFLOW_DERIVED_GENERATORS}"
      - name: detect change
        id: diff
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          paths=()
          while IFS= read -r path; do
            [[ -n "${path}" ]] && paths+=("${path}")
          done <<< "${COMMITTABLE_PATHS}"
          # 1 is "differs"; anything above it is git failing, which must
          # not read as either answer.
          rc=0
          git diff --quiet -- "${paths[@]}" || rc=$?
          case "${rc}" in
            0) printf 'changed=false\n' >> "${GITHUB_OUTPUT}" ;;
            1) printf 'changed=true\n' >> "${GITHUB_OUTPUT}" ;;
            *)
              printf 'git diff failed (exit %d)\n' "${rc}" >&2
              exit "${rc}"
              ;;
          esac
      # Runs whether or not a committable path changed: a write outside
      # the set is a fault even when the set itself came out unchanged.
      - name: assert writes stay inside the committable set
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          allowed="$(mktemp)"
          changed="$(mktemp)"
          trap 'rm --force -- "${allowed}" "${changed}"' EXIT
          printf '%s' "${COMMITTABLE_PATHS}" | grep --invert-match '^$' | sort > "${allowed}"
          # Captured to a file rather than piped or process-substituted in:
          # a redirection from a substitution runs the producer in its own
          # subshell, so a `git diff` that failed would hand the loop empty
          # output to score as "nothing written outside the allowlist" —
          # the one answer this assertion must never give for free.
          git diff --name-only > "${changed}"
          status=0
          while IFS= read -r path; do
            [[ -n "${path}" ]] || continue
            if ! grep --quiet --line-regexp --fixed-strings -- "${path}" "${allowed}"; then
              printf 'generator wrote %s, which is not in COMMITTABLE_PATHS\n' "${path}" >&2
              status=1
            fi
          done < "${changed}"
          exit "${status}"
      # Every committable path exists in a checkout, so the artifact
      # always holds all of them, changed or not, and a missing one is an
      # error. push-refresh's per-path hash check skips the unchanged.
      # The path list is written out rather than read from `env` because
      # octoscan flags any `env.*` expression in a `with:` value;
      # scripts/check-lock-derived-docs.sh requires it to equal
      # COMMITTABLE_PATHS as a set.
      - name: upload refreshed files
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-lock-refreshed
          path: |
            flake.lock
            docs/reference/flake-outputs.md
            docs/reference/treefmt-config.md
            docs/architecture/ci.md
            docs/install/nix.md
          retention-days: 1
          if-no-files-found: error

  push-refresh:
    needs: [identify, compute-refresh]
    if: needs.compute-refresh.outputs.changed == 'true' && github.repository == 'rvenutolo/linPEAS-flake'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
      # Checks out this workflow's own ref — the default branch — and NOT
      # the Renovate branch, for scripts/check-runner-doc-diff.sh below.
      # That floor polices output from the PR branch's generators while
      # this job holds a write token, so it has to come from trusted
      # content; resolving it from the head under test would let a branch
      # choose the rule that judges it. No PR-derived code runs in any
      # step that holds the token, and no PUT precedes the floor.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Hashes the floor's closure — scripts/check-runner-doc-diff.sh and
      # every file it sources, transitively — before any untrusted byte
      # reaches this runner. The list is read from the scripts' own
      # `source` lines, so a new library cannot drop out of it; a `source`
      # or `.` anywhere on a line in any other shape fails the step rather
      # than going unhashed.
      # The manifest goes to a step output, not a file: nothing a later
      # step writes to the workspace or runner.temp can reach it.
      - name: hash the content floor and the files it sources
        id: floor-manifest
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          # The path class below is ASCII only in the C locale.
          export LC_ALL=C
          floor="${GITHUB_WORKSPACE}/scripts/check-runner-doc-diff.sh"
          safe_rel='^source "\$\{(_lib_dir|_lib_self_dir)\}/([A-Za-z0-9_][A-Za-z0-9_./-]*\.sh)"$'
          queue=("${floor}")
          closure=()
          while ((${#queue[@]} > 0)); do
            file="${queue[0]}"
            queue=("${queue[@]:1}")
            if [[ ! -f "${file}" ]]; then
              printf 'floor closure file %s is missing - aborting\n' "${file}" >&2
              exit 1
            fi
            seen=0
            for done_file in "${closure[@]}"; do
              [[ "${done_file}" == "${file}" ]] && seen=1
            done
            ((seen == 0)) || continue
            closure+=("${file}")
            # Any `source` or `.` command word, wherever it sits on the
            # line (`cond && source …` included), not only at its start.
            # Whole-line comments are skipped; every other match must be
            # exactly the safe shape or the step fails.
            lines="$(grep --extended-regexp -- '(^|[;&|[:space:](])(source|\.)[[:space:]]' "${file}" |
              grep --invert-match --extended-regexp -- '^[[:space:]]*#' || true)"
            while IFS= read -r line; do
              [[ -n "${line}" ]] || continue
              if [[ ! "${line}" =~ ${safe_rel} ]] || [[ "${BASH_REMATCH[2]}" == *..* ]]; then
                printf 'cannot resolve source line in %s: %s - aborting\n' "${file}" "${line}" >&2
                exit 1
              fi
              queue+=("${file%/*}/${BASH_REMATCH[2]}")
            done <<< "${lines}"
          done
          manifest="$(sha256sum -- "${closure[@]}")"
          printf '%s\n' "${manifest}"
          {
            printf 'manifest<<FLOOR_MANIFEST_EOF\n'
            printf '%s\n' "${manifest}"
            printf 'FLOOR_MANIFEST_EOF\n'
          } >> "${GITHUB_OUTPUT}"
      # Into the runner's temp directory, outside the checkout. Over the
      # checkout, a path the artifact lacked would be read from the default
      # branch's copy and pushed to the PR branch. Inside it, the trusted
      # floor would sit one `../` away from an archive that PR-branch code
      # built: compute-refresh runs that code before its upload step, so
      # the archive's entry names are untrusted. download-artifact's own
      # path-traversal protection is what keeps them inside the target;
      # the manifest check before the commit step catches a floor file
      # that changed anyway.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flake-lock-refreshed
          path: ${{ runner.temp }}/refreshed
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.BUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}
          # Least-privilege scope: token only needs to write file contents
          # (PUT /contents for flake.lock and derived docs on the Renovate
          # PR branch). No other installation scopes are needed.
          permission-contents: write
      - name: sanity-check artifact
        working-directory: ${{ runner.temp }}/refreshed
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          # Defense-in-depth vs a compromised compute-refresh emitting
          # garbage in place of valid Nix lockfile JSON. The artifact
          # always carries flake.lock, refreshed or not, so this always
          # runs.
          jq -e '.nodes | type == "object"' flake.lock >/dev/null
          # A generated doc that arrives without its managed-block markers
          # is garbage from a broken generator. Reject it before anything
          # is pushed, rather than committing a doc that the freshness
          # gate will then fail on inside the PR.
          for doc in docs/reference/flake-outputs.md docs/reference/treefmt-config.md; do
            if ! grep --quiet -- '<!-- BEGIN ' "${doc}"; then
              printf '%s has no managed-block BEGIN marker - aborting\n' "${doc}" >&2
              exit 1
            fi
            if ! grep --quiet -- '<!-- END ' "${doc}"; then
              printf '%s has no managed-block END marker - aborting\n' "${doc}" >&2
              exit 1
            fi
          done
          # The runner docs carry no markers; each must still hold the
          # header row its generator locates the table by. The content
          # floor in the commit step is the real check; this one fails
          # fast on a doc whose table is gone.
          ws='[[:space:]]*'
          ci_header="^\\|${ws}Job${ws}\\|${ws}Runner${ws}\\|${ws}What it tests${ws}\\|${ws}\$"
          nix_header="^\\|${ws}System${ws}\\|${ws}Flake builds${ws}\\|${ws}CI tested${ws}\\|${ws}\$"
          if ! grep --quiet --extended-regexp -- "${ci_header}" docs/architecture/ci.md; then
            printf 'docs/architecture/ci.md has no functional-gates header row - aborting\n' >&2
            exit 1
          fi
          if ! grep --quiet --extended-regexp -- "${nix_header}" docs/install/nix.md; then
            printf 'docs/install/nix.md has no platform-support header row - aborting\n' >&2
            exit 1
          fi
      # What push-refresh relies on in the checkout is the floor and the
      # files it sources, and nothing else. download-artifact's own
      # path-traversal protection is the primary control keeping the
      # artifact out of the checkout. This step adds two checks that do
      # not trust it or anything else in the checkout: the artifact
      # directory resolves outside the workspace, and every file in the
      # floor's closure is byte-identical to the manifest hashed straight
      # after the checkout. It runs no git, because a write that reached
      # the checkout could reach `.git/` too, and git state there (an
      # index entry, a config hook) can hide a change or run code.
      # download-artifact's traversal protection is also all that guards
      # runner.temp's file-command files (GITHUB_ENV, GITHUB_PATH) and so
      # the step environment; the manifest does not cover those.
      - name: verify the floor against its manifest
        env:
          REFRESHED_DIR: ${{ runner.temp }}/refreshed
          FLOOR_MANIFEST: ${{ steps.floor-manifest.outputs.manifest }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          workspace="$(realpath -- "${GITHUB_WORKSPACE}")"
          refreshed="$(realpath -- "${REFRESHED_DIR}")"
          if [[ "${refreshed}/" == "${workspace}/"* ]]; then
            printf 'artifact directory %s is inside the checkout - aborting\n' "${refreshed}" >&2
            exit 1
          fi
          floor="${GITHUB_WORKSPACE}/scripts/check-runner-doc-diff.sh"
          if ! grep --quiet --fixed-strings -- "  ${floor}" <<< "${FLOOR_MANIFEST}"; then
            printf 'floor manifest does not cover %s - aborting\n' "${floor}" >&2
            exit 1
          fi
          if ! sha256sum --check --strict --quiet <<< "${FLOOR_MANIFEST}"; then
            printf 'the floor or a file it sources changed since checkout - aborting\n' >&2
            exit 1
          fi
      - name: commit refreshed lock and derived docs to PR branch
        working-directory: ${{ runner.temp }}/refreshed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Pins gh's repository context, so an `{owner}`-style
          # placeholder in an endpoint resolves from this variable and
          # never from `git remote` in the working directory.
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ needs.identify.outputs.head_branch }}
          INPUT_NAME: ${{ needs.identify.outputs.input_name }}
          RUNNER_DOCS: ${{ needs.identify.outputs.runner_docs }}
          FLOOR: ${{ github.workspace }}/scripts/check-runner-doc-diff.sh
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          api_header="X-GitHub-Api-Version: 2022-11-28"
          old_dir="$(mktemp --directory)"
          trap 'rm --recursive --force -- "${old_dir}"' EXIT

          # The git blob SHA the contents API reports, computed without
          # git. This step's working directory is the untrusted artifact,
          # and git run there would read a `.git/config` and
          # `.gitattributes` the artifact carries, so a configured filter
          # would run as a command while GH_TOKEN is in the environment.
          # This job runs no git at all, on two conditions. `gh api`
          # expands `{owner}`, `{repo}` and `{branch}` placeholders
          # anywhere in an endpoint, the `?ref=` query included, and
          # without GH_REPO it resolves them by running `git remote` in
          # the working directory; GH_REPO is set in this step's env, so
          # `{owner}` and `{repo}` resolve from it and `{branch}` fails
          # with no git run. And no placeholder gets in: `identify`
          # refuses a head branch holding a character outside
          # `[A-Za-z0-9._/-]`, REPO is this repository's literal name,
          # and the paths are the literal COMMITTABLE_PATHS list.
          #
          # Only a regular file that is not a symlink is hashed.
          # Called inside `$(...)`, where errexit is off, so each failure
          # returns explicitly; the caller's assignment then aborts.
          function blob_sha() {
            local size
            if [[ ! -f "$1" || -L "$1" ]]; then
              printf '%s is not a regular file - aborting\n' "$1" >&2
              return 1
            fi
            size="$(stat --format=%s -- "$1")" || return 1
            { printf 'blob %d\0' "${size}"; cat -- "$1"; } | sha1sum | cut --delimiter=' ' --fields=1
          }

          # The artifact's entries are untrusted, and a symlink anywhere
          # on a path, the file or any parent directory, would read and
          # then commit content from outside the artifact directory. So an
          # artifact path is hashed only when its resolved path is exactly
          # the expected one under the artifact directory, resolved once
          # here from this step's working directory.
          artifact="$(realpath -- .)"
          function artifact_blob_sha() {
            local file="${artifact}/$1"
            if [[ "$(realpath -- "${file}")" != "${file}" ]]; then
              printf '%s resolves outside the artifact directory - aborting\n' "$1" >&2
              return 1
            fi
            blob_sha "${file}"
          }

          # Two passes, so a refused path aborts the job before ANY PUT,
          # not only before its own: a half-pushed refresh is the worse
          # outcome. Pass one decides each committable path; pass two
          # commits the ones that changed.
          #
          # Each path is first compared with its blob SHA on the PR
          # branch. Loop-breaker idempotency: when the branch already
          # carries byte-identical content, committing again would churn
          # against the second ci pass. This job's checkout is the default
          # branch, so the branch SHA comes from the contents API rather
          # than from a local ref.
          #
          # A path that changed must belong to a refresh that ran: the
          # lock and its derived docs to a mapped input, a runner doc to
          # a workflow touch. A change outside that is a fault in
          # compute-refresh or a branch that moved under it, and pushing
          # it would revert the branch, so it aborts. A runner doc must
          # also pass scripts/check-runner-doc-diff.sh against the
          # branch's copy: only its runner cells may differ.
          to_commit=()
          to_sha=()
          while IFS= read -r path; do
            [[ -n "${path}" ]] || continue
            if [[ ! -f "${path}" ]]; then
              printf '%s is missing from the artifact - aborting\n' "${path}" >&2
              exit 1
            fi
            branch_sha="$(gh api \
              --header "${api_header}" \
              "repos/${REPO}/contents/${path}?ref=${HEAD_BRANCH}" \
              --jq .sha)"
            local_sha="$(artifact_blob_sha "${path}")"
            if [[ "${local_sha}" == "${branch_sha}" ]]; then
              printf 'skipping %s: already current on %s\n' "${path}" "${HEAD_BRANCH}"
              continue
            fi
            case "${path}" in
              docs/architecture/ci.md | docs/install/nix.md)
                if [[ "${RUNNER_DOCS}" != 'true' ]]; then
                  printf '%s differs, but this PR touches no workflow - aborting\n' "${path}" >&2
                  exit 1
                fi
                old="${old_dir}/${path//\//_}"
                gh api \
                  --header "${api_header}" \
                  --header 'Accept: application/vnd.github.raw' \
                  "repos/${REPO}/contents/${path}?ref=${HEAD_BRANCH}" > "${old}"
                # Binds the copy the floor judges to the SHA the PUT will
                # name: a branch that moved between the two reads aborts
                # here instead of being judged against one blob and
                # committed over another.
                old_sha="$(blob_sha "${old}")"
                if [[ "${old_sha}" != "${branch_sha}" ]]; then
                  printf '%s changed on %s while it was read - aborting\n' \
                    "${path}" "${HEAD_BRANCH}" >&2
                  exit 1
                fi
                floor_rc=0
                # Run by `bash` on the hashed path, with BASH_ENV and ENV
                # cleared so no startup file runs ahead of it: its `source`
                # lines resolve from that path's own directory, which is
                # what the manifest covers.
                env --unset=BASH_ENV --unset=ENV bash -- "${FLOOR}" "${path}" "${old}" "${path}" ||
                  floor_rc=$?
                if [[ ${floor_rc} -ne 0 ]]; then
                  printf 'content floor refused %s (exit %d) - aborting before any commit\n' \
                    "${path}" "${floor_rc}" >&2
                  exit 1
                fi
                ;;
              flake.lock | docs/reference/flake-outputs.md | docs/reference/treefmt-config.md)
                if [[ -z "${INPUT_NAME}" ]]; then
                  printf '%s differs, but no flake input was refreshed - aborting\n' "${path}" >&2
                  exit 1
                fi
                ;;
              *)
                printf '%s differs and has no floor class here - aborting\n' "${path}" >&2
                exit 1
                ;;
            esac
            to_commit+=("${path}")
            to_sha+=("${branch_sha}")
          done <<< "${COMMITTABLE_PATHS}"

          # One signed commit per changed path, authenticated as the
          # linpeas-flake-bumper App so GitHub web-flow-signs each one.
          # Each PUT names the blob SHA pass one read, so a branch that
          # moved since is a rejected PUT, not an overwrite. flake.lock
          # goes first, so a partial failure leaves the lock without its
          # docs — which the freshness gate then reports — rather than
          # docs describing an absent lock.
          for i in "${!to_commit[@]}"; do
            path="${to_commit[i]}"
            case "${path}" in
              flake.lock) msg="chore(flake): refresh flake.lock for ${INPUT_NAME}" ;;
              docs/architecture/ci.md | docs/install/nix.md)
                msg="chore(ci): refresh runner labels in ${path}"
                ;;
              *) msg="chore(flake): update ${path} for ${INPUT_NAME} lock refresh" ;;
            esac
            content_b64="$(base64 --wrap=0 "${path}")"
            gh api --method PUT \
              --header "${api_header}" \
              "repos/${REPO}/contents/${path}" \
              --field message="${msg}" \
              --field content="${content_b64}" \
              --field sha="${to_sha[i]}" \
              --field branch="${HEAD_BRANCH}" >/dev/null
            printf 'committed %s to %s\n' "${path}" "${HEAD_BRANCH}"
          done

          # Zero commits is the steady state of the second ci pass and of a
          # concurrent run that already pushed, so it is a clean exit rather
          # than the abort the weekly bumper uses — that one has proven its
          # lock differs from the base branch before it reaches this point.
          if ((${#to_commit[@]} == 0)); then
            printf 'nothing to commit: %s already carries the refreshed lock and docs\n' \
              "${HEAD_BRANCH}"
          fi

  notify:
    name: notify
    needs: [identify, compute-refresh, push-refresh]
    # Runs whenever `identify` ran at all, and decides what to report in
    # a step rather than here. A gate keyed on `identify`'s outputs
    # cannot see a failed `identify` — a job that fails sets no outputs
    # — and that is the stage whose failure is least likely to be
    # noticed, since this workflow reacts to someone else's PR and
    # nobody is watching the Actions tab when it goes red.
    #
    # `identify` itself is gated on a `renovate/*` head branch in this
    # repo, so a `skipped` result here means the ci completion was never
    # a candidate: no runner is spent on it. Every completion that does
    # reach `identify` gets classified, and the steady-state verdict is
    # `skipped`, which is inert in the composite.
    if: always() && needs.identify.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      issues: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One verdict, computed in a script the harness can drive with
      # every job-result combination. Splitting it between this job's
      # gate and the composite's `result:` input is what let the two
      # disagree about whether a failed identify is reportable.
      - name: classify what to report
        id: classify
        env:
          IDENTIFY_RESULT: ${{ needs.identify.result }}
          COMPUTE_RESULT: ${{ needs.compute-refresh.result }}
          PUSH_RESULT: ${{ needs.push-refresh.result }}
          SHOULD_REFRESH: ${{ needs.identify.outputs.should_refresh }}
          UNMAPPED: ${{ needs.identify.outputs.unmapped }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          verdict="$(./scripts/classify-refresh-notify-result.sh \
            "${IDENTIFY_RESULT}" \
            "${COMPUTE_RESULT}" \
            "${PUSH_RESULT}" \
            "${SHOULD_REFRESH}" \
            "${UNMAPPED}")"
          printf 'reporting %s\n' "${verdict}"
          printf 'result=%s\n' "${verdict}" >> "${GITHUB_OUTPUT}"
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/notify-workflow-result # zizmor: ignore[self-repository]
        with:
          # `skipped` is inert in the composite, so the steady-state
          # verdict files and closes nothing.
          result: ${{ steps.classify.outputs.result }}
          label: renovate-flake-lock-refresh-failure
          title: "renovate-flake-lock-refresh: auto-refresh failed"
          body: |
            ${{ needs.identify.outputs.unmapped == 'true' && 'This PR edits `flake.nix`, but its title maps to no known flake input, so no refresh was attempted. Renovate has changed the title shape: teach `scripts/classify-renovate-flake-input.sh` the new one and add it to `tests/classify-renovate-flake-input.test.sh` as an observed title.' || 'The `renovate-flake-lock-refresh` workflow failed.' }}

            - PR: ${{ needs.identify.outputs.pr_number && format('#{0}', needs.identify.outputs.pr_number) || '(unknown — identify set no outputs)' }}
            - Input: `${{ needs.identify.outputs.input_name || '(none)' }}`
            - Runner-label refresh: `${{ needs.identify.outputs.runner_docs || '(unknown)' }}`
            - identify: `${{ needs.identify.result }}`
            - compute-refresh: `${{ needs.compute-refresh.result }}`
            - push-refresh: `${{ needs.push-refresh.result }}`

            Manual fallback runbook: `docs/architecture/flake-input-bumps.md`
            steps 1-4 (checkout PR, `nix flake update <name>`, `nix fmt`,
            regenerate the docs named in this workflow's
            `LOCK_DERIVED_GENERATORS`), committing the regenerated docs
            alongside the lock, or run `scripts/refresh-runner-labels.sh`
            for a runner-label refresh.
          label-description: renovate-flake-lock-refresh workflow failure
          github-token: ${{ secrets.GITHUB_TOKEN }}
