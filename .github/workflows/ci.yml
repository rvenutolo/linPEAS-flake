          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            cache.nixos.org:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            tarballs.nixos.org:443
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: run doc-freshness regenerate-and-diff harnesses
        run: nix develop --command bash scripts/run-doc-freshness.sh

  harness-group:
    # Batched setup-tax failure-mode harnesses. Realizes the devShell
    # once and runs each harness via scripts/run-harness-group.sh,
    # printing a per-harness pass/fail table. ratchet-pin-audit also
    # runs its live enforce script; the allowed-actions-api and
    # settings-posture live probes need admin-scoped App tokens and run
    # schedule-only in their own drift-check workflows. Required status
    # context; see docs/security/required-checks.md.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
