        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: build linpeas (aarch64)
        run: nix build .#linpeas --print-build-logs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linpeas-result-arm64
          path: result/bin/linpeas
          retention-days: 1
          if-no-files-found: error

  smoke-test-arm64:
    needs: build-linpeas-arm64
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # TODO: restore egress-policy block once block mode stops dropping allowed hosts on
          # westus2 runners: https://github.com/step-security/harden-runner/issues/708
          egress-policy: audit
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            cache.nixos.org:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository]
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: smoke test linpeas -h (aarch64)
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          nix build .#linpeas
          # `sed -n '1,20p'` (vs `head -20`) reads its entire stdin instead of
