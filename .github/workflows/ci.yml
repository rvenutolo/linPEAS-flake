        with:
          persist-credentials: false
      - name: fetch base ref for provenance diffs
        # check-flake-lock-provenance.sh and check-pin-digest-provenance.sh
        # (both in this group) read `git show`/`git ls-tree` against
        # origin/main; actions/checkout does not create
        # refs/remotes/origin/main on its own. Dropping this step makes
        # both checks exit 2 (loud red), never a silent pass.
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository]
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: run doc-invariant lints
        env:
          # check-pin-digest-provenance.sh and check-flake-lock-provenance.sh
          # (both in this group) probe the GitHub API only when the diff
          # moves a floating-major pin digest or a flake input's rev;
          # unauthenticated calls rate-limit at 60/hr.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix develop --command bash scripts/run-lint-group.sh lint-doc-invariants

