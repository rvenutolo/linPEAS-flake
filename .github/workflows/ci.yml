          ./result/bin/linpeas -h | sed -n '1,20p'
          ./result/bin/linpeas -h >/dev/null

  # image-smoke required job ------------------------------------------

  image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # TODO: restore egress-policy block once block mode stops dropping allowed hosts on
          # westus2 runners: https://github.com/step-security/harden-runner/issues/708
          egress-policy: audit
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            auth.docker.io:443
            cache.nixos.org:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository]
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: build, load, run image
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          # Build linpeas package first so a regression in the plain package
          # surfaces here distinctly from the image build/load/run path.
          nix build .#linpeas --print-build-logs
          nix build .#linpeas-image --print-build-logs
          docker load --input result
          # Image tag matches pin version. Resolve from passthru.pin.
          tag="$(nix eval --raw .#linpeas.passthru.pin.version)"
          echo "IMAGE_TAG=${tag}" >>"${GITHUB_ENV}"
          docker run --rm "rvenutolo/linpeas:${tag}" -h | sed -n '1,20p'
          docker run --rm "rvenutolo/linpeas:${tag}" -h >/dev/null
      - name: verify external tools present in image
        # Guards against regression on the deliberate inclusion of
        # gnugrep/gnused/gawk/findutils/procps. Without these, linpeas
        # checks emit "command not found" noise and produce useless reports.
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          for tool in grep sed awk find ps; do
            if ! docker run --rm --entrypoint /bin/sh \
                "rvenutolo/linpeas:${IMAGE_TAG}" \
                -c "command -v ${tool} >/dev/null"; then
              echo "FAIL: ${tool} missing from image"
              exit 1
            fi
          done
      - name: smoke a real linpeas check against a separate target container
        # Behavioral test: linpeas runs in its own container, joins a
        # separate ubuntu target's PID namespace + volumes, and runs an
        # actual check. Fails on any shell "not found" line in the
        # output, which would indicate the image is missing a helper
        # linpeas needs at runtime. Joining namespaces does not share the
        # target's root filesystem; the folder-sweep step below covers the
        # filesystem path. The host is never the audit target.
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          docker run --detach --name linpeas-target --rm \
            ubuntu:24.04 sleep 300 >/dev/null
          trap 'docker rm --force linpeas-target >/dev/null 2>&1 || true' EXIT
          out="$(docker run --rm \
            --pid=container:linpeas-target \
            --volumes-from linpeas-target \
            "rvenutolo/linpeas:${IMAGE_TAG}" \
            -o system_information 2>&1)"
          echo "${out}" | sed -n '1,40p'
          # The shell names a missing external helper as
          # "<script>: <line>: <cmd>: not found" (dash, which runs linpeas)
          # or "<script>: line <line>: <cmd>: command not found" (bash).
          # Anchor on the script path and line number so linpeas's own
          # "... not found" report lines do not match.
          missing_re='/bin/linpeas: (line )?[0-9]+: [^:]+: (command )?not found$'
          if grep --quiet --extended-regexp "${missing_re}" <<<"${out}"; then
            echo "FAIL: linpeas reported missing commands:"
            echo "${out}" | grep --extended-regexp "${missing_re}"
            exit 1
          fi
      - name: sweep a bind-mounted tree with -f
        # Behavioral test: the documented host sweep. `-f` caches its
        # find results under /tmp and enables the regex searches, so this
        # fails if the image lacks a writable /tmp or the script hits a
        # shell incompatibility. A missing /etc/passwd shows up as
        # "cannot find name for user ID" noise in the report.
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          fixture="$(mktemp --directory)"
          trap 'rm --recursive --force -- "${fixture}"' EXIT
          mkdir --parents "${fixture}/etc"
          echo '* * * * * root echo FIXTURE_CRON' >"${fixture}/etc/crontab"
          status=0
          out="$(docker run --rm \
            --volume "${fixture}:/host:ro" \
            "rvenutolo/linpeas:${IMAGE_TAG}" \
            -n -N -q -f /host 2>&1)" || status=$?
          echo "${out}" | tail --lines=20
          if [ "${status}" -ne 0 ]; then
            echo "FAIL: linpeas -f exited ${status}"
            exit 1
          fi
          for bad in 'mktemp: failed' 'value too great for base' 'cannot find name for user ID'; do
            if grep --quiet --fixed-strings "${bad}" <<<"${out}"; then
              echo "FAIL: report contains '${bad}'"
              exit 1
            fi
          done
          if ! grep --quiet --fixed-strings '/host/etc/crontab' <<<"${out}"; then
            echo "FAIL: report does not mention the fixture crontab"
            exit 1
          fi

