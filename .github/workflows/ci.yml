  protect-main-drift-check:
    # Asserts the live `protect-main` branch ruleset matches the in-tree
    # mirror at .github/rulesets/protect-main.json AND that key invariants
    # (merge-commit-only, signed commits required, no bypass actors, etc.)
    # hold. Closes the asymmetry where tag-protection-drift-check was the
    # only ruleset with a CI drift lint.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            cache.nixos.org:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            tarballs.nixos.org:443
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: harness passes
        run: nix develop --command bash tests/check-protect-main.test.sh
      - name: enforce protect-main posture and in-tree mirror parity
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop --command ./scripts/check-protect-main.sh

