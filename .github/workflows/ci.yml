name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Required jobs (stable names, non-matrix) -----------------------

  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install # renovate: datasource=github-releases depName=nix packageName=NixOS/nix
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v3
      - name: flake check
        run: nix flake check --print-build-logs

  build-linpeas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install # renovate: datasource=github-releases depName=nix packageName=NixOS/nix
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v3
      - name: build linpeas
        run: nix build .#linpeas --print-build-logs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linpeas-result
          path: result/bin/linpeas
          retention-days: 1
          if-no-files-found: error

  smoke-test:
    needs: build-linpeas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install # renovate: datasource=github-releases depName=nix packageName=NixOS/nix
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v3
      - name: smoke test linpeas -h
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          nix build .#linpeas
          # `sed -n '1,20p'` (vs `head -20`) reads its entire stdin instead of
          # closing early, avoiding SIGPIPE on linpeas under `set -o pipefail`
          # if upstream -h output ever exceeds 20 lines.
          ./result/bin/linpeas -h | sed -n '1,20p'
          ./result/bin/linpeas -h >/dev/null

  # aarch64-linux required jobs ---------------------------------------

  build-linpeas-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install # renovate: datasource=github-releases depName=nix packageName=NixOS/nix
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v3
      - name: build linpeas (aarch64)
        run: nix build .#linpeas --print-build-logs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linpeas-result-arm64
          path: result/bin/linpeas
          retention-days: 1
          if-no-files-found: error

  smoke-test-arm64:
    needs: build-linpeas-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install # renovate: datasource=github-releases depName=nix packageName=NixOS/nix
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v3
      - name: smoke test linpeas -h (aarch64)
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          nix build .#linpeas
          # `sed -n '1,20p'` (vs `head -20`) reads its entire stdin instead of
          # closing early, avoiding SIGPIPE on linpeas under `set -o pipefail`
          # if upstream -h output ever exceeds 20 lines.
          ./result/bin/linpeas -h | sed -n '1,20p'
          ./result/bin/linpeas -h >/dev/null

  # image-smoke required job ------------------------------------------

  image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install # renovate: datasource=github-releases depName=nix packageName=NixOS/nix
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v3
      - name: build, load, run image
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          # Build linpeas package first so a regression in the plain package
          # surfaces here distinctly from the image build/load/run path.
          nix build .#linpeas --print-build-logs
          nix build .#linpeas-image --print-build-logs
          docker load --input result
          # Image tag matches pin version. Resolve from passthru.pin.
          tag="$(nix eval --raw .#linpeas.passthru.pin.version)"
          echo "IMAGE_TAG=${tag}" >>"${GITHUB_ENV}"
          docker run --rm "rvenutolo/linpeas:${tag}" -h | sed -n '1,20p'
          docker run --rm "rvenutolo/linpeas:${tag}" -h >/dev/null
      - name: verify external tools present in image
        # Guards against regression on the deliberate inclusion of
        # gnugrep/gnused/gawk/findutils/procps. Without these, linpeas
        # checks emit "command not found" noise and produce useless reports.
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          for tool in grep sed awk find ps; do
            if ! docker run --rm --entrypoint /bin/sh \
                "rvenutolo/linpeas:${IMAGE_TAG}" \
                -c "command -v ${tool} >/dev/null"; then
              echo "FAIL: ${tool} missing from image"
              exit 1
            fi
          done
      - name: smoke a real linpeas check against a separate target container
        # Behavioral test: documented "container audit" use case. Linpeas
        # runs in its own container, joins a separate ubuntu target's PID
        # namespace + volumes, and runs an actual check. Fails on any
        # "command not found" line in the output, which would indicate the
        # image is missing a helper linpeas needs at runtime.
        # The host is never the audit target — the linpeas container only
        # sees the target container's namespaces, not the runner's.
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          docker run --detach --name linpeas-target --rm \
            ubuntu:24.04 sleep 300 >/dev/null
          trap 'docker rm --force linpeas-target >/dev/null 2>&1 || true' EXIT
          out="$(docker run --rm \
            --pid=container:linpeas-target \
            --volumes-from linpeas-target \
            "rvenutolo/linpeas:${IMAGE_TAG}" \
            -o system_information 2>&1)"
          echo "${out}" | sed -n '1,40p'
          # Bash emits "<cmd>: command not found" when an external helper is
          # missing. Anchor on the ": command not found" suffix to avoid
          # matching benign output that happens to contain the phrase.
          if echo "${out}" | grep --quiet --extended-regexp ': command not found'; then
            echo "FAIL: linpeas reported missing commands:"
            echo "${out}" | grep ': command not found'
            exit 1
          fi

  image-smoke-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install # renovate: datasource=github-releases depName=nix packageName=NixOS/nix
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v3
      - name: build, load, run image (aarch64)
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          # Build linpeas package first so a regression in the plain package
          # surfaces here distinctly from the image build/load/run path.
          nix build .#linpeas --print-build-logs
          nix build .#linpeas-image --print-build-logs
          docker load --input result
          # Image tag matches pin version. Resolve from passthru.pin.
          tag="$(nix eval --raw .#linpeas.passthru.pin.version)"
          echo "IMAGE_TAG=${tag}" >>"${GITHUB_ENV}"
          docker run --rm "rvenutolo/linpeas:${tag}" -h | sed -n '1,20p'
          docker run --rm "rvenutolo/linpeas:${tag}" -h >/dev/null
      - name: verify external tools present in image (aarch64)
        # Guards against regression on the deliberate inclusion of
        # gnugrep/gnused/gawk/findutils/procps. Without these, linpeas
        # checks emit "command not found" noise and produce useless reports.
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          for tool in grep sed awk find ps; do
            if ! docker run --rm --entrypoint /bin/sh \
                "rvenutolo/linpeas:${IMAGE_TAG}" \
                -c "command -v ${tool} >/dev/null"; then
              echo "FAIL: ${tool} missing from image"
              exit 1
            fi
          done
      - name: smoke a real linpeas check against a separate target container (aarch64)
        # Behavioral test: documented "container audit" use case. Linpeas
        # runs in its own container, joins a separate ubuntu target's PID
        # namespace + volumes, and runs an actual check. Fails on any
        # "command not found" line in the output, which would indicate the
        # image is missing a helper linpeas needs at runtime.
        # The host is never the audit target — the linpeas container only
        # sees the target container's namespaces, not the runner's.
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          docker run --detach --name linpeas-target --rm \
            ubuntu:24.04 sleep 300 >/dev/null
          trap 'docker rm --force linpeas-target >/dev/null 2>&1 || true' EXIT
          out="$(docker run --rm \
            --pid=container:linpeas-target \
            --volumes-from linpeas-target \
            "rvenutolo/linpeas:${IMAGE_TAG}" \
            -o system_information 2>&1)"
          echo "${out}" | sed -n '1,40p'
          # Bash emits "<cmd>: command not found" when an external helper is
          # missing. Anchor on the ": command not found" suffix to avoid
          # matching benign output that happens to contain the phrase.
          if echo "${out}" | grep --quiet --extended-regexp ': command not found'; then
            echo "FAIL: linpeas reported missing commands:"
            echo "${out}" | grep ': command not found'
            exit 1
          fi

  # image-cve-scan (advisory) ---------------------------------------------

  image-cve-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Not in branch protection; prevention path is the nixpkgs auto-bump
    # via update-flake-lock. SARIF uploads to the Security tab for the
    # full CRITICAL+HIGH set; the job itself fails (and emits a notify
    # issue on push) only when one or more CRITICAL findings are
    # reported.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install # renovate: datasource=github-releases depName=nix packageName=NixOS/nix
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v3
      - name: build OCI image tarball
        run: nix build .#linpeas-image --print-build-logs
      - name: scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: result
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # Job-level failure is decided by the "fail on CRITICAL"
          # step below; keep Trivy's own exit code at 0 here so the
          # SARIF upload always runs.
          exit-code: "0"
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@458d36d7d4f47d0dd16ca424c1d3cda0060f1360 # v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-cve
      - name: count CRITICAL findings
        id: cve-count
        run: |
          set -euo pipefail
          # SARIF security-severity is a CVSS-style numeric string;
          # GitHub's mapping of CRITICAL is >= 9.0. The `tonumber? // 0`
          # form drops non-numeric severities (e.g. textual "high"
          # emitted by some SARIF producers) from the CRITICAL count
          # rather than erroring `set -euo pipefail` out — safe fallback
          # is to under-count, not to misclassify the job as failed
          # for a parse error.
          count=$(jq '[.runs[].results[]
            | select(((.properties["security-severity"] // "0") | tonumber? // 0) >= 9.0)]
            | length' trivy-results.sarif)
          printf 'CRITICAL findings: %s\n' "${count}"
          printf 'critical_count=%s\n' "${count}" >> "${GITHUB_OUTPUT}"
      - name: fail on CRITICAL findings
        if: steps.cve-count.outputs.critical_count != '0'
        env:
          CRITICAL_COUNT: ${{ steps.cve-count.outputs.critical_count }}
        run: |
          set -euo pipefail
          printf '::error::Trivy reported %s CRITICAL CVE(s) in the OCI image\n' "${CRITICAL_COUNT}"
          exit 1

  image-cve-scan-notify:
    # Open / update a deduped issue when image-cve-scan fails on a CRITICAL
    # CVE during a push to main. PR runs are intentionally excluded —
    # the failed check on the PR itself is the maintainer-facing signal.
    needs: image-cve-scan
    if: always() && github.event_name == 'push' && needs.image-cve-scan.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/notify-workflow-result
        with:
          result: failure
          label: image-cve-critical
          title: "image-cve-scan: CRITICAL CVE in OCI image"
          body: |
            `image-cve-scan` failed on one or more CRITICAL CVEs in the OCI image.

            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Code Scanning tab: ${{ github.server_url }}/${{ github.repository }}/security/code-scanning?query=tool%3ATrivy

            Remediation: bump `nixpkgs` via the `update-flake-lock` workflow, then rebuild the OCI image.
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # gen-dashboard-data security-guard regression tests ---------------------

  dashboard-data-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install # renovate: datasource=github-releases depName=nix packageName=NixOS/nix
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v3
      - name: run gen-dashboard-data failure-mode harness
        run: nix develop --command bash tests/gen-dashboard-data.test.sh

  required-checks-no-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install # renovate: datasource=github-releases depName=nix packageName=NixOS/nix
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v3
      - name: enforce required-checks-no-paths invariant
        run: nix develop --command ./scripts/check-required-checks-no-paths.sh
      - name: enforce harness passes
        run: nix develop --command bash tests/check-required-checks-no-paths.test.sh

  pr-workflows-no-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
