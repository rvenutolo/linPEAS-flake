        with:
          persist-credentials: false
      - name: fetch base ref for flake.lock provenance diff
        # check-flake-lock-provenance.sh (in this group) reads
        # `git show origin/main:flake.lock`; actions/checkout does not
        # create refs/remotes/origin/main on its own. Dropping this step
        # makes the check exit 2 (loud red), never a silent pass.
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: run doc-invariant lints
        run: nix develop --command bash scripts/run-lint-group.sh lint-doc-invariants

  doc-freshness:
    # Batched doc-freshness regenerate-and-diff harnesses. Realizes the
    # devShell once and runs every tests/refresh-*.test.sh via
    # scripts/run-doc-freshness.sh, printing a per-generator pass/fail
    # table. Required status context; see docs/security/required-checks.md.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
