name: pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (D2)

      - uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31 (D2)
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install # renovate: datasource=github-releases depName=nix packageName=NixOS/nix
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v3 (D4)

      - name: generate dashboard data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          ./scripts/gen-dashboard-data.sh
          test -s docs/_data/dashboard.yml

      - name: build site
        run: nix build "path:$(pwd)#site"

      - name: smoke test
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          test -s ./result/share/site/index.html
          test -s ./result/share/site/dashboard/index.html
          # Catch macros that were not expanded.
          ! grep --quiet '{{' ./result/share/site/dashboard/index.html

      - name: stage site as pages artifact
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          mkdir -p _site
          # ./result is a Nix-store symlink; deref into a real dir so
          # upload-pages-artifact can tarball it without symlink confusion.
          cp --recursive --no-preserve=mode,ownership ./result/share/site/. _site/

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1 (D2)
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5 (D2)

  notify-failure:
    name: notify-on-failure
    needs: [build, deploy]
    if: always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: open or comment on issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0 (D2)
        with:
          script: |
            const label = 'pages-build-failure';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'pages.yml: build/deploy failed';
            const body = [
              `The \`pages.yml\` workflow failed.`,
              ``,
              `- Run: ${runUrl}`,
              `- Trigger: \`${context.eventName}\``,
              `- Build conclusion: \`${{ needs.build.result }}\``,
              `- Deploy conclusion: \`${{ needs.deploy.result }}\``,
              ``,
              `Investigate logs, fix forward, and close this issue once the next \`pages.yml\` run succeeds.`,
            ].join('\n');

            // De-dup: look for an open issue with the label.
            const existing = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: label,
                per_page: 100,
              },
            );

            if (existing.length > 0) {
              const issue = existing[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `New failure: ${runUrl}`,
              });
              core.notice(`Appended comment to existing issue #${issue.number}`);
              return;
            }

            // Ensure the label exists. createLabel is idempotent enough if we
            // catch the "already exists" 422.
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'b60205',
                description: 'pages.yml workflow failure',
              });
            } catch (err) {
              if (err.status !== 422) {
                throw err;
              }
            }

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: [label],
            });
            core.notice(`Opened issue #${created.data.number}`);
