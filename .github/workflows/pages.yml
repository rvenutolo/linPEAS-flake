name: pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  schedule:
    # Last daily slot — after update-linpeas and the drift-check
    # cluster. Push-trigger and release-trigger refresh the site
    # within minutes of any bump merge, so the daily cron is a
    # no-bump-today floor; the bump pipeline typically lands well
    # inside the slack before the floor reads `linpeas-pin.json`.
    # See docs/architecture/ci.md.
    - cron: "55 9 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # TODO: restore egress-policy block once block mode stops dropping allowed hosts on
          # westus2 runners: https://github.com/step-security/harden-runner/issues/708
          egress-policy: audit
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            api.github.com:443
            cache.nixos.org:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository]
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: generate dashboard data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          ./scripts/gen-dashboard-data.sh
          test -s docs/_data/dashboard.yml

      - name: build site
        run: nix build "path:$(pwd)#site"

      - name: smoke test
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          test -s ./result/share/site/index.html
          test -s ./result/share/site/dashboard/index.html
          # Catch macros that were not expanded.
          ! grep --quiet '{{' ./result/share/site/dashboard/index.html

      - name: stage site as pages artifact
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          mkdir -p _site
          # ./result is a Nix-store symlink; deref into a real dir so
          # upload-pages-artifact can tarball it without symlink confusion.
          cp --recursive --no-preserve=mode,ownership ./result/share/site/. _site/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    if: github.event_name != 'pull_request' && github.repository == 'rvenutolo/linPEAS-flake'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # TODO: restore egress-policy block once block mode stops dropping allowed hosts on
          # westus2 runners: https://github.com/step-security/harden-runner/issues/708
          egress-policy: audit
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  notify:
    name: notify
    needs: [build, deploy]
    # Always run so we can both auto-file on failure AND auto-close on
    # the next green run. Skipped on PR events because we don't want
    # noise from contributors' branches and the deploy job is gated to
    # non-PR events anyway.
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # the composite fetches this run's jobs to classify a failure
      checks: read # and their check-run annotations
      issues: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # TODO: restore egress-policy block once block mode stops dropping allowed hosts on
          # westus2 runners: https://github.com/step-security/harden-runner/issues/708
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The local path runs the checked-out copy of the composite. This job
      # never runs on `pull_request` (see its `if:`), so that copy is never
      # a pull request branch's.
      - uses: ./.github/actions/notify-workflow-result # zizmor: ignore[self-repository]
        with:
          # Aggregate: failure wins, then cancelled (the composite files a
          # job-level cancel and flags it as not a finding); success only
          # when both legs green; otherwise no-op (skipped).
          result: ${{ (needs.build.result == 'failure' || needs.deploy.result == 'failure') && 'failure' || (needs.build.result == 'cancelled' || needs.deploy.result == 'cancelled') && 'cancelled' || (needs.build.result == 'success' && needs.deploy.result == 'success') && 'success' || 'skipped' }}
          label: pages-build-failure
          title: "pages.yml: build/deploy failed"
          body: |
            The `pages.yml` workflow failed.

            - Trigger: `${{ github.event_name }}`
            - Build conclusion: `${{ needs.build.result }}`
            - Deploy conclusion: `${{ needs.deploy.result }}`

            Investigate logs and fix forward. The next green `pages.yml` run will auto-close this issue.
          label-description: pages.yml workflow failure
          github-token: ${{ secrets.GITHUB_TOKEN }}
