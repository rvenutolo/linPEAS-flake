name: pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (D2)
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31 (D2)
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install # renovate: datasource=github-releases depName=nix packageName=NixOS/nix
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v3 (D4)

      - name: generate dashboard data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          ./scripts/gen-dashboard-data.sh
          test -s docs/_data/dashboard.yml

      - name: build site
        run: nix build "path:$(pwd)#site"

      - name: smoke test
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          test -s ./result/share/site/index.html
          test -s ./result/share/site/dashboard/index.html
          # Catch macros that were not expanded.
          ! grep --quiet '{{' ./result/share/site/dashboard/index.html

      - name: stage site as pages artifact
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          mkdir -p _site
          # ./result is a Nix-store symlink; deref into a real dir so
          # upload-pages-artifact can tarball it without symlink confusion.
          cp --recursive --no-preserve=mode,ownership ./result/share/site/. _site/

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1 (D2)
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5 (D2)

  notify:
    name: notify
    needs: [build, deploy]
    # Always run so we can both auto-file on failure AND auto-close on
    # the next green run. Skipped on PR events because we don't want
    # noise from contributors' branches and the deploy job is gated to
    # non-PR events anyway.
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (D2)
        with:
          persist-credentials: false
      - uses: ./.github/actions/notify-workflow-result
        with:
          # Aggregate: failure wins; success only when both legs green;
          # otherwise no-op (cancelled / skipped).
          result: ${{ (needs.build.result == 'failure' || needs.deploy.result == 'failure') && 'failure' || (needs.build.result == 'success' && needs.deploy.result == 'success') && 'success' || 'skipped' }}
          label: pages-build-failure
          title: "pages.yml: build/deploy failed"
          body: |
            The `pages.yml` workflow failed.

            - Trigger: `${{ github.event_name }}`
            - Build conclusion: `${{ needs.build.result }}`
            - Deploy conclusion: `${{ needs.deploy.result }}`

            Investigate logs and fix forward. The next green `pages.yml` run will auto-close this issue.
          label-description: pages.yml workflow failure
          github-token: ${{ secrets.GITHUB_TOKEN }}
