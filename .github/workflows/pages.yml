name: pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  schedule:
    # 14:00 UTC — sits after update-linpeas (09:00), stale-pin-check
    # (10:30), and verify-latest-release (12:00). Push-trigger and
    # release-trigger refresh the site within minutes of any bump
    # merge, so the daily cron is a no-bump-today floor; 14:00 gives
    # the bump pipeline ample slack to land before the floor reads
    # `linpeas-pin.json`. See docs/architecture/ci.md.
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeterminateSystems/flakehub-cache-action@c01e819d047464c3edf6ba778f075952af5a3aa7 # v3

      - name: generate dashboard data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          ./scripts/gen-dashboard-data.sh
          test -s docs/_data/dashboard.yml

      - name: build site
        run: nix build "path:$(pwd)#site"

      - name: smoke test
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          test -s ./result/share/site/index.html
          test -s ./result/share/site/dashboard/index.html
          # Catch macros that were not expanded.
          ! grep --quiet '{{' ./result/share/site/dashboard/index.html

      - name: stage site as pages artifact
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          mkdir -p _site
          # ./result is a Nix-store symlink; deref into a real dir so
          # upload-pages-artifact can tarball it without symlink confusion.
          cp --recursive --no-preserve=mode,ownership ./result/share/site/. _site/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    if: github.event_name != 'pull_request' && github.repository == 'rvenutolo/linPEAS-flake'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  notify:
    name: notify
    needs: [build, deploy]
    # Always run so we can both auto-file on failure AND auto-close on
    # the next green run. Skipped on PR events because we don't want
    # noise from contributors' branches and the deploy job is gated to
    # non-PR events anyway.
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # Self-reference pinned by SHA: path-relative `uses: ./` would
      # resolve to the PR branch's copy on `pull_request` events; SHA pin
      # forces the composite to come from main regardless of the checked-out
      # ref. Renovate's pinDigests rule updates this on the daily Friday run;
      # if Renovate ever stops tracking self-references, bump manually via:
      #   git rev-parse origin/main
      - uses: rvenutolo/linPEAS-flake/.github/actions/notify-workflow-result@ffc97d8b617b52890430629d6bd15cec9bc71f53 # self-reference; Renovate pinDigests bumps SHA
        with:
          # Aggregate: failure wins; success only when both legs green;
          # otherwise no-op (cancelled / skipped).
          result: ${{ (needs.build.result == 'failure' || needs.deploy.result == 'failure') && 'failure' || (needs.build.result == 'success' && needs.deploy.result == 'success') && 'success' || 'skipped' }}
          label: pages-build-failure
          title: "pages.yml: build/deploy failed"
          body: |
            The `pages.yml` workflow failed.

            - Trigger: `${{ github.event_name }}`
            - Build conclusion: `${{ needs.build.result }}`
            - Deploy conclusion: `${{ needs.deploy.result }}`

            Investigate logs and fix forward. The next green `pages.yml` run will auto-close this issue.
          label-description: pages.yml workflow failure
          github-token: ${{ secrets.GITHUB_TOKEN }}
