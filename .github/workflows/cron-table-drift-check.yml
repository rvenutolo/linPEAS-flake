name: cron-table-drift-check

# Push-triggered drift check for the cron schedule table in
# docs/architecture/ci.md. Fails if the table or its ordering
# paragraph drifts from cron lines under .github/workflows/. The push
# paths filter covers the `.yml` workflows, the table and the script —
# the files that introduce a desync in practice — so no scheduled
# re-check is needed. Same source of truth as the local
# pre-commit hook (scripts/check-cron-table.sh).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**.yml"
      - "docs/architecture/ci.md"
      - "scripts/check-cron-table.sh"

permissions: {}

concurrency:
  group: cron-table-drift-check
  cancel-in-progress: false

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      result: ${{ steps.probe.outcome }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: scripts/check-cron-table.sh
        id: probe
        run: bash scripts/check-cron-table.sh

  notify:
    name: notify
    needs: drift-check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/notify-workflow-result
        with:
          # Raw job result: the composite files cancelled runs as
          # infrastructure failures and is inert on skipped.
          result: ${{ needs.drift-check.result }}
          label: cron-table-drift
          title: "cron-table-drift-check: docs/architecture/ci.md drifted from .github/workflows/, or the check could not run"
          body: |
            The `cron-table-drift-check` watchdog failed: either it
            detected drift between the cron schedule table (or its
            ordering paragraph) in `docs/architecture/ci.md` and the
            `cron:` lines under `.github/workflows/`, or the check could
            not run — a step before it (harden-runner, checkout)
            failed, or `scripts/check-cron-table.sh` exited 2 on a
            missing or unparsable input, or on a workflow declaring
            more than one `cron:` line. The job log says which.

            Run `bash scripts/check-cron-table.sh` locally to see the
            specific mismatch.
          github-token: ${{ secrets.GITHUB_TOKEN }}
