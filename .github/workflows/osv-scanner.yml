name: osv-scanner

# Scans flake.lock (and any future lockfiles) against the OSV database
# on push to main, pull request to main, and weekly cron. Closes a
# coverage gap: Trivy only scans the OCI image, but flake.lock pulls
# nix transitive deps that need their own CVE coverage.
#
# Not in branch protection; failure of this workflow does NOT block
# merge. The pipeline is two actions: `osv-scanner-action` produces
# JSON, then `osv-reporter-action` converts to SARIF and fails the
# job on any vulnerability (`--fail-on-vuln=true`). On push to main
# or on
# the weekly cron, `notify-finding` opens a deduped issue via
# `notify-workflow-result`. If the job fails before the scan runs
# (e.g. checkout failure), `notify-infra` opens a separate, less
# alarming issue so transient infrastructure flakes do not page as
# CVE findings. Classification is driven by
# `needs.scan.outputs.has-finding`. SARIF is uploaded to the Security
# tab on every run (even when the scan step failed). See SECURITY.md
# "Supply-chain posture monitoring".
#
# We deliberately call the docker-based sub-path action
# (`google/osv-scanner-action/osv-scanner-action@<sha>`) instead of
# the upstream reusable workflow: the reusable workflow is a job-level
# `uses:` reference with no `steps:` block, which would fail the
# `harden-runner-first` lint (the eBPF monitor must install before any
# I/O in every job).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # Monday 09:00 UTC (1h after codeql)
  workflow_dispatch:

permissions: {}

concurrency:
  group: osv-scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: scan (flake.lock)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload-sarif
      actions: read # required by upload-sarif when used with `category:`
    # `has-finding` is `'true'` only when the `scan` step itself ran
    # and failed (i.e. osv-scanner reported a vulnerability). Any
    # earlier failure (checkout, harden-runner) leaves the `scan` step
    # `skipped`, which evaluates to `'false'` and is classified as an
    # infra failure by the notify jobs below.
    outputs:
      has-finding: ${{ steps.report.outcome == 'failure' }}
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: scan
        id: scan
        # Produces JSON only; osv-scanner-action cannot emit SARIF
        # directly. SARIF is generated by osv-reporter-action below
        # (matches upstream reusable workflow architecture). Auto-
        # discovery via `-r ./` picks up flake.lock at the repo root
        # and any future lockfiles without us having to maintain a
        # per-lockfile list.
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        continue-on-error: true
        with:
          scan-args: |-
            --output=results.json
            --format=json
            -r
            ./

      - name: report
        id: report
        # Converts the scanner's JSON into SARIF and decides whether
        # to fail the job (`--fail-on-vuln=true`). Skipped if scan
        # produced no JSON (infra failure routes to notify-infra).
        if: always() && hashFiles('results.json') != ''
        uses: google/osv-scanner-action/osv-reporter-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --output=results.sarif
            --new=results.json
            --gh-annotations=false
            --fail-on-vuln=true

      - name: upload SARIF
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@458d36d7d4f47d0dd16ca424c1d3cda0060f1360 # v3
        with:
          sarif_file: results.sarif
          category: osv-scanner

  # Real CVE finding: scan ran and failed.
  notify-finding:
    name: notify (finding)
    needs: scan
    if: always() && (github.event_name == 'push' || github.event_name == 'schedule') && needs.scan.result == 'failure' && needs.scan.outputs.has-finding == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/notify-workflow-result
        with:
          result: failure
          label: osv-finding
          title: "osv-scanner: vulnerability in flake.lock"
          body: |
            `osv-scanner / scan` reported a vulnerability in `flake.lock`.

            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Code Scanning tab: ${{ github.server_url }}/${{ github.repository }}/security/code-scanning?query=tool%3AOSV-Scanner

            Remediation: review the finding in the Security tab. Most
            cases are resolved by `nix flake update` (or a targeted
            `nix flake lock --update-input <input>`) followed by a fresh
            build + smoke check.
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Infrastructure failure: scan never ran (checkout/harden-runner failed).
  # Filed under a distinct label so transient runner / network / token
  # issues are not paged as CVE findings.
  notify-infra:
    name: notify (infra)
    needs: scan
    if: always() && (github.event_name == 'push' || github.event_name == 'schedule') && needs.scan.result == 'failure' && needs.scan.outputs.has-finding != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/notify-workflow-result
        with:
          result: failure
          label: osv-infra
          label-color: fbca04
          label-description: osv-scanner workflow infrastructure failure (no CVE finding)
          title: "osv-scanner: infrastructure failure (scan did not run)"
          body: |
            `osv-scanner / scan` failed before the `scan` step executed
            (e.g. checkout or harden-runner). No CVE finding was
            reported — the SARIF was never produced.

            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Remediation: inspect the failing step in the run log. If
            the cause is transient (auth, network), close the issue
            once the next scheduled / push run is green. If the cause
            is persistent (action breakage, permissions drift), fix or
            pin accordingly.
          github-token: ${{ secrets.GITHUB_TOKEN }}
