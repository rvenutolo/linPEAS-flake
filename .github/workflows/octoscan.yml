name: octoscan

# Statically analyses GitHub Actions workflow definitions with
# synacktiv/octoscan's 14-rule scanner. Complements the `zizmor`
# pre-commit hook and CodeQL Actions analysis by triangulating
# expression-injection / unsafe-input findings and adding unique
# coverage for `repo-jacking` (action owner renamed/deleted) and
# `known-vulnerability` (CVE match against pinned action versions).
#
# Not in branch protection; failure of this workflow does NOT block
# merge. `scripts/octoscan-scan.sh` distinguishes octoscan's per-file
# exit codes (`0` = clean, `2` = findings, `1` = fatal scanner
# error) and surfaces the distinction through the
# `has-finding` job output: on push, cron and dispatch runs, real
# findings page `notify-finding`, scanner / runner breakage pages
# `notify-infra`, under separate issue labels. There is no severity
# flag — every finding fails the job — and the full SARIF still
# uploads to the Security tab under the distinct `octoscan`
# category, from a separate `upload-sarif` job: the job that runs the
# scanner holds only `contents: read`. See SECURITY.md "Supply-chain posture
# monitoring".

on:
  pull_request:
    branches: [main]
    # scripts/octoscan-scan.sh scans .github/workflows/*.{yml,yaml}
    # only (composite actions under .github/actions/ are not scan
    # targets); skip PRs that touch nothing it reads. Safe because
    # this workflow is not a required check
    # (`required-checks-no-paths` forbids paths filters on required
    # workflows — do not promote this one without removing the
    # filter). The weekly cron still sweeps everything. A flake.lock
    # or nix/packages.nix change can swap the octoscan binary itself,
    # so a nixpkgs bump scans with the new version on its own PR. The
    # scripts/lib files are the libraries the scan script sources;
    # tests/octoscan-scan.test.sh fails if one is missing here.
    paths:
      - ".github/workflows/**"
      - "flake.lock"
      - "nix/packages.nix"
      - "scripts/lib/repo.sh"
      - "scripts/lib/temp.sh"
      - "scripts/octoscan-scan.sh"
  push:
    branches: [main]
  schedule:
    - cron: "10 6 * * 5" # Friday 06:10 UTC (after codeql in the scanner cluster)
  workflow_dispatch:

permissions: {}

concurrency:
  group: octoscan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The scanner's job holds no write scope: the SARIF goes to the
    # `upload-sarif` job as an artifact.
    permissions:
      contents: read
    # `has-finding` is `'true'` only when the `scan` step ran and
    # octoscan exited `2` (findings present). Any other failure
    # (exit `1` from octoscan, Nix setup or substitution failure,
    # checkout failure) leaves `has-finding=false` and is classified as an
    # infra failure by the notify jobs below.
    # `sarif-artifact` is 'true' only when the SARIF report was saved as
    # an artifact; `upload-sarif` runs only then, so a scan that died
    # before writing a report pages once, through `notify-infra`.
    outputs:
      has-finding: ${{ steps.scan.outputs.has-finding }}
      sarif-artifact: ${{ steps.sarif-artifact.outcome == 'success' }}
      sarif-artifact-id: ${{ steps.sarif-artifact.outputs.artifact-id }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            cache.nixos.org:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository]
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: octoscan scan
        id: scan
        # The scanner is the flake.lock-pinned nixpkgs build exposed as
        # `.#octoscan`, the same binary the pre-commit hook runs. It runs
        # as a native process in this job, so it can reach what any step
        # here can: the workspace, sudo (the Nix installer needs it, so
        # it cannot be disabled here), and this job's GITHUB_TOKEN
        # (setup-nix writes it into nix.conf as a github.com access
        # token). That token is `contents: read` only and reads nothing
        # a public clone does not. A compromised build can forge or
        # suppress its own SARIF, which `upload-sarif` publishes, but
        # reaches no other code-scanning alerts. The scanner's trust root
        # is the nixpkgs source build pinned by flake.lock; see
        # docs/security/workflow-scanners.md.
        run: |
          set -Eeuo pipefail
          rc=0
          # Script prints `has-finding=true|false` to stdout exactly
          # once and writes the SARIF report to the path passed via
          # `--sarif`. Capture stdout to forward `has-finding` to
          # GITHUB_OUTPUT; rc=0 clean, rc=1 = findings present, the
          # scanner ran and errored, or a runner-label suppression is
          # stale, rc=2 = the scan could not proceed
          # (octoscan or jq absent, or a per-file temp file could not be
          # created); notify jobs branch on has-finding. The captured
          # text is printed to the step log too, because the
          # `classification=` line the notify-infra body sends a reader
          # to is on stdout.
          stdout="$(nix shell .#octoscan --command scripts/octoscan-scan.sh --sarif octoscan.sarif)" || rc=$?
          printf '%s\n' "${stdout}"
          has_finding="$(printf '%s\n' "${stdout}" | grep -E '^has-finding=' | tail -n1 || true)"
          [[ -n "${has_finding}" ]] || has_finding="has-finding=false"
          echo "${has_finding}" >> "$GITHUB_OUTPUT"
          exit "${rc}"

      # Runs on a findings failure too, so findings still reach the
      # Security tab. A scanner error leaves no report, and the missing
      # file fails this step.
      - name: save SARIF artifact
        id: sarif-artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: octoscan-sarif
          path: octoscan.sarif
          if-no-files-found: error
          retention-days: 1

  # Publishes the scan job's SARIF. This job holds the
  # `security-events: write` scope and runs neither octoscan nor Nix,
  # so the scanner never shares a job with that scope. The checkout is
  # for upload-sarif's fingerprints: it hashes each result's source
  # file, and a missing file leaves the result unfingerprinted, so
  # alerts duplicate when lines move. The artifact is taken by the ID
  # the scan job reported, never by name, so no other upload in the
  # run can stand in for it.
  upload-sarif:
    name: upload SARIF
    needs: scan
    if: always() && needs.scan.outputs.sarif-artifact == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.scan.outputs.sarif-artifact-id }}
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: octoscan.sarif
          category: octoscan

  # Real finding: scan ran and octoscan exit-coded `2`. PR runs are
  # excluded — the failed check on the PR itself is the
  # maintainer-facing signal there; push, cron, and dispatch runs
  # have no PR surface, so they page via the deduped issue.
  notify-finding:
    name: notify (finding)
    needs: [scan, upload-sarif]
    if: always() && github.event_name != 'pull_request' && needs.scan.result == 'failure' && needs.scan.outputs.has-finding == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      issues: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/notify-workflow-result # zizmor: ignore[self-repository]
        with:
          result: failure
          label: octoscan-finding
          title: "octoscan: finding(s) in workflow analysis"
          body: |
            `octoscan / scan` failed because octoscan reported one or <!-- notify-arms: octoscan.yml/notify-finding = finding non-pr -->
            more findings against `.github/workflows/`.

            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Code Scanning tab: ${{ github.server_url }}/${{ github.repository }}/security/code-scanning?query=tool%3Aoctoscan

            Remediation: review the finding in the Security tab under
            the `octoscan` tool group and apply the suggested fix to
            the offending workflow file. If the finding is a known
            false positive, add a targeted pattern to `IGNORE_PATTERN`,
            the rule to `DISABLE_RULES`, or a runner label to
            `RUNNER_LABEL_SUPPRESSIONS` in scripts/octoscan-scan.sh
            and document it in that script's Suppressions header.
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Infrastructure failure: the job failed without a complete findings
  # result (e.g. Nix setup or substitution failure, checkout /
  # harden-runner failure,
  # octoscan exit `1` from an internal scanner error, a missing SARIF
  # report) or was cancelled — no runner, or its
  # timeout. Filed under a distinct label so transient breakage is
  # not paged as a security finding. PR runs are excluded — the
  # failed check on the PR itself is the maintainer-facing signal
  # there.
  notify-infra:
    name: notify (infra)
    needs: [scan, upload-sarif]
    if: always() && github.event_name != 'pull_request' && (needs.scan.result == 'cancelled' || (needs.scan.result == 'failure' && needs.scan.outputs.has-finding != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      issues: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/notify-workflow-result # zizmor: ignore[self-repository]
        with:
          # Raw result: 'failure' or 'cancelled' (the job's `if:` gate
          # admits nothing else); the composite annotates cancelled
          # runs as infrastructure failures.
          result: ${{ needs.scan.result }}
          label: octoscan-infra
          label-color: fbca04
          label-description: octoscan workflow infrastructure failure (scan or SARIF upload incomplete; findings may exist)
          title: "octoscan: infrastructure failure (scan did not complete)"
          body: |
            `octoscan / scan` failed without a complete findings <!-- notify-arms: octoscan.yml/notify-infra = failure cancelled non-pr -->
            result (e.g. Nix setup or substitution failure, checkout /
            harden-runner failure, octoscan exit `1` from an internal scanner error,
            or no SARIF report to save). On a
            scanner error no SARIF was uploaded — the script drops a
            partial one. If the log's `classification=` line reads
            `infra-failure (findings recorded but incomplete)`, real
            findings exist beside an unanalyzed file — triage both. If
            it reads `stale-suppression`, the scan was clean but
            octoscan now accepts a runner label listed in
            `RUNNER_LABEL_SUPPRESSIONS` (scripts/octoscan-scan.sh);
            remove the label named in the log.

            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Remediation: inspect the failing step in the run log. If
            the cause is transient (Nix cache, network), close
            this issue once the next run is green.
            If persistent (an octoscan regression in the locked
            nixpkgs), hold the flake.lock bump that brought it or open
            an upstream issue.
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # A failed or cancelled SARIF upload, after a scan that saved its
  # report. Filed under `octoscan-infra`, the same deduped issue as
  # `notify-infra`; it waits on `notify-infra` only so that when both
  # file in one run the second comments on the issue the first opened.
  # PR runs are excluded, as for the other arms.
  notify-upload-sarif:
    name: notify (SARIF upload)
    needs: [scan, upload-sarif, notify-infra]
    if: always() && github.event_name != 'pull_request' && (needs.upload-sarif.result == 'failure' || needs.upload-sarif.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      issues: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/notify-workflow-result # zizmor: ignore[self-repository]
        with:
          # Raw result: 'failure' or 'cancelled' (the job's `if:` gate
          # admits nothing else); the composite annotates cancelled
          # runs as infrastructure failures.
          result: ${{ needs.upload-sarif.result }}
          label: octoscan-infra
          label-color: fbca04
          label-description: octoscan workflow infrastructure failure (scan or SARIF upload incomplete; findings may exist)
          title: "octoscan: infrastructure failure (SARIF upload did not complete)"
          body: |
            `octoscan / upload SARIF` failed or was cancelled after the <!-- notify-arms: octoscan.yml/notify-upload-sarif = failure cancelled non-pr -->
            scan saved its SARIF report, so this run's results may be
            missing from the Security tab. The scan's own outcome is
            reported separately (`octoscan-finding`, or this label).

            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Remediation: inspect the download or upload step in the
            run log. If the cause is transient (artifact service,
            code-scanning API, network), close this issue once the next
            run is green. If persistent (a rejected SARIF, a blocked
            egress endpoint, a missing token scope), fix the
            `upload-sarif` job.
          github-token: ${{ secrets.GITHUB_TOKEN }}
