name: octoscan

# Statically analyses GitHub Actions workflow definitions with
# synacktiv/octoscan's 14-rule scanner. Complements the `zizmor`
# pre-commit hook and CodeQL Actions analysis by triangulating
# expression-injection / unsafe-input findings and adding unique
# coverage for `repo-jacking` (action owner renamed/deleted) and
# `known-vulnerability` (CVE match against pinned action versions).
#
# Not in branch protection; failure of this workflow does NOT block
# merge. `scripts/octoscan-scan.sh` distinguishes octoscan's per-file
# exit codes (`0` = clean, `2` = findings, `1` = fatal scanner
# error) and surfaces the distinction through the
# `has-finding` job output: on push, cron and dispatch runs, real
# findings page `notify-finding`, scanner / runner breakage pages
# `notify-infra`, under separate issue labels. There is no severity
# flag — every finding fails the job — and the full SARIF still
# uploads to the Security tab under the distinct `octoscan`
# category. See SECURITY.md "Supply-chain posture
# monitoring".

on:
  pull_request:
    branches: [main]
    # scripts/octoscan-scan.sh scans .github/workflows/*.{yml,yaml}
    # only (composite actions under .github/actions/ are not scan
    # targets); skip PRs that touch nothing it reads. Safe because
    # this workflow is not a required check
    # (`required-checks-no-paths` forbids paths filters on required
    # workflows — do not promote this one without removing the
    # filter). The weekly cron still sweeps everything.
    paths:
      - ".github/workflows/**"
      - "scripts/octoscan-scan.sh"
  push:
    branches: [main]
  schedule:
    - cron: "10 6 * * 5" # Friday 06:10 UTC (after codeql in the scanner cluster)
  workflow_dispatch:

permissions: {}

concurrency:
  group: octoscan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload-sarif
      actions: read # read other workflows in repo
    # `has-finding` is `'true'` only when the `scan` step ran and
    # octoscan exited `2` (findings present). Any other failure
    # (exit `1` from octoscan, docker pull failure, checkout
    # failure) leaves `has-finding=false` and is classified as an
    # infra failure by the notify jobs below.
    outputs:
      has-finding: ${{ steps.scan.outputs.has-finding }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            ghcr.io:443
            github.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: octoscan scan
        id: scan
        # Single source of truth for the pinned ghcr image digest +
        # OCTOSCAN_VERSION lives in scripts/octoscan-scan.sh.
        # Renovate's customManager is scoped to that script.
        run: |
          set -Eeuo pipefail
          rc=0
          # Script prints `has-finding=true|false` to stdout exactly
          # once and writes the SARIF report to the path passed via
          # `--sarif`. Capture stdout to forward `has-finding` to
          # GITHUB_OUTPUT; rc=0 clean, rc=1 = findings present, the
          # scanner ran and errored, or a runner-label suppression is
          # stale, rc=2 = the scan could not proceed
          # (docker or jq absent, or a per-file temp file could not be
          # created); notify jobs branch on has-finding. The captured
          # text is printed to the step log too, because the
          # `classification=` line the notify-infra body sends a reader
          # to is on stdout.
          stdout="$(scripts/octoscan-scan.sh --sarif octoscan.sarif)" || rc=$?
          printf '%s\n' "${stdout}"
          has_finding="$(printf '%s\n' "${stdout}" | grep -E '^has-finding=' | tail -n1 || true)"
          [[ -n "${has_finding}" ]] || has_finding="has-finding=false"
          echo "${has_finding}" >> "$GITHUB_OUTPUT"
          exit "${rc}"

      - name: upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: octoscan.sarif
          category: octoscan

  # Real finding: scan ran and octoscan exit-coded `2`. PR runs are
  # excluded — the failed check on the PR itself is the
  # maintainer-facing signal there; push, cron, and dispatch runs
  # have no PR surface, so they page via the deduped issue.
  notify-finding:
    name: notify (finding)
    needs: scan
    if: always() && github.event_name != 'pull_request' && needs.scan.result == 'failure' && needs.scan.outputs.has-finding == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      issues: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/notify-workflow-result # zizmor: ignore[self-repository]
        with:
          result: failure
          label: octoscan-finding
          title: "octoscan: finding(s) in workflow analysis"
          body: |
            `octoscan / scan` failed because octoscan reported one or <!-- notify-arms: octoscan.yml/notify-finding = finding non-pr -->
            more findings against `.github/workflows/`.

            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Code Scanning tab: ${{ github.server_url }}/${{ github.repository }}/security/code-scanning?query=tool%3Aoctoscan

            Remediation: review the finding in the Security tab under
            the `octoscan` tool group and apply the suggested fix to
            the offending workflow file. If the finding is a known
            false positive, add a targeted pattern to `IGNORE_PATTERN`,
            the rule to `DISABLE_RULES`, or a runner label to
            `RUNNER_LABEL_SUPPRESSIONS` in scripts/octoscan-scan.sh
            and document it in that script's Suppressions header.
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Infrastructure failure: the job failed without a complete findings
  # result (e.g. docker pull failure, checkout / harden-runner failure,
  # octoscan exit `1` from an internal scanner error, a SARIF upload
  # failure after a clean scan) or was cancelled — no runner, or its
  # timeout. Filed under a distinct label so transient breakage is
  # not paged as a security finding. PR runs are excluded — the
  # failed check on the PR itself is the maintainer-facing signal
  # there.
  notify-infra:
    name: notify (infra)
    needs: scan
    if: always() && github.event_name != 'pull_request' && (needs.scan.result == 'cancelled' || (needs.scan.result == 'failure' && needs.scan.outputs.has-finding != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      issues: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/notify-workflow-result # zizmor: ignore[self-repository]
        with:
          # Raw result: 'failure' or 'cancelled' (the job's `if:` gate
          # admits nothing else); the composite annotates cancelled
          # runs as infrastructure failures.
          result: ${{ needs.scan.result }}
          label: octoscan-infra
          label-color: fbca04
          label-description: octoscan workflow infrastructure failure (no complete findings result; findings may exist)
          title: "octoscan: infrastructure failure (scan did not complete)"
          body: |
            `octoscan / scan` failed without a complete findings <!-- notify-arms: octoscan.yml/notify-infra = failure cancelled non-pr -->
            result (e.g. docker pull failure, checkout / harden-runner
            failure, octoscan exit `1` from an internal scanner error,
            or the SARIF upload step failing after a clean scan). On a
            scanner error no SARIF was uploaded — the script drops a
            partial one. If the log's `classification=` line reads
            `infra-failure (findings recorded but incomplete)`, real
            findings exist beside an unanalyzed file — triage both. If
            it reads `stale-suppression`, the scan was clean but
            octoscan now accepts a runner label listed in
            `RUNNER_LABEL_SUPPRESSIONS` (scripts/octoscan-scan.sh);
            remove the label named in the log.

            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Remediation: inspect the failing step in the run log. If
            the cause is transient (registry auth, network), close
            this issue once the next run is green.
            If persistent (image breakage, octoscan regression),
            re-pin the digest or open an upstream issue.
          github-token: ${{ secrets.GITHUB_TOKEN }}
