name: octoscan

# Statically analyses GitHub Actions workflow definitions with
# synacktiv/octoscan's 14-rule scanner. Complements the `zizmor`
# pre-commit hook and CodeQL Actions analysis by triangulating
# expression-injection / unsafe-input findings and adding unique
# coverage for `repo-jacking` (action owner renamed/deleted) and
# `known-vulnerability` (CVE match against pinned action versions).
#
# Not in branch protection; failure of this workflow does NOT block
# merge. The `scan` step distinguishes octoscan's three documented
# exit codes (`0` = clean, `2` = findings, `1` = fatal scanner
# error) and surfaces the distinction through the
# `has-finding` job output: on push to main, real findings page
# `notify-finding`, scanner / runner breakage pages `notify-infra`,
# under separate issue labels. Findings below the fail threshold
# (there is no severity flag — every finding fails the job) and the
# full SARIF still upload to the Security tab under the distinct
# `octoscan` category. See SECURITY.md "Supply-chain posture
# monitoring".

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1" # Monday 08:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: octoscan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload-sarif
      actions: read # read other workflows in repo
    # `has-finding` is `'true'` only when the `scan` step ran and
    # octoscan exited `2` (findings present). Any other failure
    # (exit `1` from octoscan, docker pull failure, checkout
    # failure) leaves `has-finding=false` and is classified as an
    # infra failure by the notify jobs below.
    outputs:
      has-finding: ${{ steps.scan.outputs.has-finding }}
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: octoscan scan
        id: scan
        # Single source of truth for the pinned ghcr image digest +
        # OCTOSCAN_VERSION lives in scripts/octoscan-scan.sh.
        # Renovate's customManager is scoped to that script.
        run: |
          set -Eeuo pipefail
          rc=0
          # Script prints `has-finding=true|false` to stdout exactly
          # once and writes the SARIF report to the path passed via
          # `--sarif`. Capture stdout to forward `has-finding` to
          # GITHUB_OUTPUT; rc=0 clean, rc=1 = findings present OR
          # real error (notify jobs branch on has-finding).
          stdout="$(scripts/octoscan-scan.sh --sarif octoscan.sarif)" || rc=$?
          has_finding="$(printf '%s\n' "${stdout}" | grep -E '^has-finding=' | tail -n1 || true)"
          [[ -n "${has_finding}" ]] || has_finding="has-finding=false"
          echo "${has_finding}" >> "$GITHUB_OUTPUT"
          exit "${rc}"

      - name: upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3.36.0
        with:
          sarif_file: octoscan.sarif
          category: octoscan

  # Real finding: scan ran and octoscan exit-coded `2`.
  notify-finding:
    name: notify (finding)
    needs: scan
    if: always() && github.event_name == 'push' && needs.scan.result == 'failure' && needs.scan.outputs.has-finding == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/notify-workflow-result
        with:
          result: failure
          label: octoscan-finding
          title: "octoscan: finding(s) in workflow analysis"
          body: |
            `octoscan / scan` failed because octoscan reported one or
            more findings against `.github/workflows/`.

            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Code Scanning tab: ${{ github.server_url }}/${{ github.repository }}/security/code-scanning?query=tool%3Aoctoscan

            Remediation: review the finding in the Security tab under
            the `octoscan` tool group and apply the suggested fix to
            the offending workflow file. If the finding is a known
            false positive, add a targeted `--ignore` pattern (or
            disable the rule via `--disable-rules`) on the `scan`
            step.
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Infrastructure failure: scan never produced a findings result
  # (e.g. docker pull failure, checkout / harden-runner failure,
  # octoscan exit `1` from an internal parse error). Filed under a
  # distinct label so transient breakage is not paged as a security
  # finding.
  notify-infra:
    name: notify (infra)
    needs: scan
    if: always() && github.event_name == 'push' && needs.scan.result == 'failure' && needs.scan.outputs.has-finding != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/notify-workflow-result
        with:
          result: failure
          label: octoscan-infra
          label-color: fbca04
          label-description: octoscan workflow infrastructure failure (no security finding)
          title: "octoscan: infrastructure failure (scan did not run / scan crashed)"
          body: |
            `octoscan / scan` failed without producing a findings
            result (e.g. docker pull failure, checkout / harden-runner
            failure, or octoscan exit `1` from an internal scanner
            error). No SARIF finding was reported — the SARIF may be
            partial or absent.

            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Remediation: inspect the failing step in the run log. If
            the cause is transient (registry auth, network), close
            this issue once the next scheduled / push run is green.
            If persistent (image breakage, octoscan regression),
            re-pin the digest or open an upstream issue.
          github-token: ${{ secrets.GITHUB_TOKEN }}
