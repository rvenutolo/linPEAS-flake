name: zizmor-drift-check

# Weekly drift detection for zizmor findings on .github/workflows/**.
#
# zizmor runs as a pre-commit hook (--min-severity=low) — prevention at
# commit time — and the required flake-check job re-runs that hook on
# every PR and push through `nix flake check`, so a hook bypass is
# caught before merge. This watchdog runs the same lock-pinned binary
# against main on a schedule: a finding here is a workflow file on
# main that fails the current pinned binary — a file pre-commit's
# matching does not select, typically surfaced when a flake.lock bump
# changes the rules the bump PR's flake-check applied to selected files.
#
# The step below passes the .github/workflows/ directory straight to
# zizmor. The hook instead scans whatever pre-commit's `files` and
# `types` matching hands it, and pre-commit reports a hook it selected
# no files for as a skip rather than a failure — so a file that
# matching stops selecting is scanned here and nowhere else. Keep the
# directory argument: rewriting this step to invoke the hook would
# collapse the two paths into one and cost that coverage.
#
# On a failed or cancelled run — a finding, or a scan that could not
# start — opens (or leaves) a deduped `zizmor-drift` tracking
# issue via the notify-workflow-result composite. On the next clean
# run, the composite closes any open `zizmor-drift` issue(s).
#
# Version pin: zizmor is consumed via `nix develop` so it tracks
# `pkgs-unstable.zizmor` in flake.lock — same binary the pre-commit
# hook uses. One source of truth.

on:
  schedule:
    - cron: "30 6 * * 5" # Friday 06:30 UTC (after scorecard-drift-check in the scanner cluster)
  workflow_dispatch:

permissions: {}

concurrency:
  group: zizmor-drift-check
  cancel-in-progress: false

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      result: ${{ steps.probe.outcome }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            api.github.com:443
            cache.nixos.org:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: zizmor --min-severity=low .github/workflows/
        id: probe
        run: nix develop --command zizmor --min-severity=low .github/workflows/

  notify:
    name: notify
    needs: drift-check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/notify-workflow-result
        with:
          # Raw job result: the composite files cancelled runs as
          # infrastructure failures and is inert on skipped.
          result: ${{ needs.drift-check.result }}
          label: zizmor-drift
          title: "zizmor-drift-check: workflow file(s) fail zizmor --min-severity=low, or the scan could not run"
          body: |
            The weekly `zizmor-drift-check` watchdog failed: either it
            detected one or more findings in `.github/workflows/**` at or
            above `--min-severity=low`, or the scan could not run — a
            step before the scan (harden-runner, checkout, setup-nix) or
            `nix develop` itself failed before zizmor started.
            The job log says which: a finding is reported by zizmor
            itself, with the workflow file and rule named.

            On findings, a workflow file on `main` now fails the same
            lock-pinned `zizmor` binary the pre-commit hook and the
            required `flake-check` job run on every PR and push — this
            run hands it the `.github/workflows/` directory, whereas the
            hook path scans only the files pre-commit's matching
            selects. Start triage by comparing this run
            against the last `flake-check` run on `main`; a `flake.lock`
            bump is what changes the zizmor binary.

            See the failing job logs for the specific finding(s):
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Run pinned at commit `${{ github.sha }}`.

            To resolve: run
            `nix develop --command zizmor --min-severity=low .github/workflows/`
            locally (the hook path, `pre-commit run zizmor --all-files`,
            covers only the files pre-commit's matching selects), fix the
            reported findings, and push. This issue auto-closes on the
            next clean run.
          label-description: workflow file(s) drifted past zizmor --min-severity=low, or the zizmor scan could not run
          github-token: ${{ secrets.GITHUB_TOKEN }}
