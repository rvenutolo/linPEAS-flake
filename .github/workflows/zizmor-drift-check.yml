name: zizmor-drift-check

# Weekly drift detection for zizmor findings on .github/workflows/**.
#
# zizmor runs as a pre-commit hook today (--min-severity=low) — that
# is prevention at commit time. This watchdog covers the gaps:
#   - commits made with --no-verify
#   - edits authored outside the pre-commit environment (web UI, gh
#     CLI, dependabot/renovate auto-edits before hook re-run)
#   - upstream zizmor rule changes after a file merged green
#
# On findings: opens (or leaves) a deduped `zizmor-drift` tracking
# issue via the notify-workflow-result composite. On the next clean
# run, the composite closes any open `zizmor-drift` issue(s).
#
# Version pin: zizmor is consumed via `nix develop` so it tracks
# `pkgs-unstable.zizmor` in flake.lock — same binary the pre-commit
# hook uses. One source of truth.

on:
  schedule:
    - cron: "30 6 * * 5" # Friday 06:30 UTC (after scorecard-drift-check in the scanner cluster)
  workflow_dispatch:

permissions: {}

concurrency:
  group: zizmor-drift-check
  cancel-in-progress: false

jobs:
  drift-check:
    runs-on: ubuntu-latest
    # Budget covers the flakehub-cache-action post-step retrying uploads
    # against a degraded cache service, not just the check itself.
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      result: ${{ steps.probe.outcome }}
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            api.github.com:443
            cache.nixos.org:443
            codeload.github.com:443
            github.com:443
            install.determinate.systems:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            tarballs.nixos.org:443
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/flakehub-cache-action@c01e819d047464c3edf6ba778f075952af5a3aa7 # v3.21.0
      - name: zizmor --min-severity=low .github/workflows/
        id: probe
        run: nix develop --command zizmor --min-severity=low .github/workflows/

  notify:
    name: notify
    needs: drift-check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            api.github.com:443
            cache.nixos.org:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            releases.nixos.org:443
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/notify-workflow-result
        with:
          # Raw job result: the composite files cancelled runs as
          # infrastructure failures and is inert on skipped.
          result: ${{ needs.drift-check.result }}
          label: zizmor-drift
          title: "zizmor-drift-check: workflow file(s) fail zizmor --min-severity=low"
          body: |
            The weekly `zizmor-drift-check` watchdog detected one or
            more findings in `.github/workflows/**` at or above
            `--min-severity=low`.

            This means a workflow file landed on `main` that the
            pre-commit `zizmor` hook would have caught — likely via
            `--no-verify`, an edit made outside the pre-commit
            environment (web UI, `gh` CLI, bot auto-edit), or an
            upstream zizmor rule that tightened after the file
            merged green.

            See the failing job logs for the specific finding(s):
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Run pinned at commit `${{ github.sha }}`.

            To resolve: run `nix develop --command pre-commit run zizmor --all-files`
            locally, fix the reported findings, and push. This issue
            auto-closes on the next clean scheduled run.
          label-description: workflow file(s) drifted past zizmor --min-severity=low
          github-token: ${{ secrets.GITHUB_TOKEN }}
