name: links

# Weekly Markdown link checker. Cron-only — intentionally NOT in the
# required-check set, since transient network failures should never block
# PRs. Manual `workflow_dispatch` allows on-demand verification.

on:
  schedule:
    - cron: "50 5 * * 5" # Friday 05:50 UTC (after verify-latest-release, before the scanner cluster)
  workflow_dispatch:

permissions: {}

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            git-cliff.org:443
            github.blog:443
            github.com:443
            hub.docker.com:443
            img.shields.io:443
            keepachangelog.com:443
            nix.dev:443
            nixos.org:443
            nixos.wiki:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            rvenutolo.github.io:443
            www.conventionalcommits.org:443
            www.githubstatus.com:443
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress --verbose './**/*.md'
          fail: true
