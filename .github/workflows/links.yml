name: links

# Weekly Markdown link checker. Cron-only — intentionally NOT in the
# required-check set, since transient network failures should never block
# PRs. Manual `workflow_dispatch` allows on-demand verification.

on:
  schedule:
    - cron: "50 5 * * 5" # Friday 05:50 UTC (after verify-latest-release, before the scanner cluster)
  workflow_dispatch:

permissions: {}

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            cache.nixos.org:443
            git-cliff.org:443
            github.blog:443
            github.com:443
            hub.docker.com:443
            img.shields.io:443
            keepachangelog.com:443
            nixos.wiki:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            rvenutolo.github.io:443
            www.conventionalcommits.org:443
            www.githubstatus.com:443
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: --config lychee.toml --no-progress --verbose './**/*.md'
          fail: true
