cache = true
max_cache_age = "7d"
no_progress = true
include_verbatim = false
accept = [200, 204, 206, 302]

exclude_loopback = true

# Jinja2-templated URLs (e.g. `.../releases/tag/{{ dashboard.pin.version }}`)
# render to bare `/tag/` in raw markdown, which lychee sees as a 404. The
# MkDocs site renders them correctly; lychee should not lint them.
exclude = [
  "https://github\\.com/peass-ng/PEASS-ng/releases/tag/?$",
  "https://github\\.com/rvenutolo/linPEAS-flake/releases/tag/?$",
  # docker.com / github.com /settings/* paths require auth — anonymous GETs
  # 302-redirect to a login page, which is the documented expectation.
  "https://hub\\.docker\\.com/settings/",
  "https://github\\.com/settings/",
  # The Docker status page redirect-chains through several status-host
  # domains; it is an operational pointer, not a doc-correctness link.
  "https://status\\.docker\\.com",
]

exclude_path = [
  # Entries are REGULAR EXPRESSIONS, matched against each input path as it
  # was passed to lychee — an absolute path when the caller passes one. So an
  # entry naming a bare directory also matches any file whose path merely
  # contains that text, and an unescaped dot is a wildcard. Every directory
  # entry therefore carries a trailing slash, and ".git" a leading one too: a
  # bare ".git" takes docs/development/git.md, and a bare "result" takes the
  # tuning-results.md page under the audit skill's evals tree. Both are
  # maintained docs, and a swallowed file is dropped from the sweep with no
  # diagnostic — it simply stops being link-checked. A directory name that
  # also appears in the checkout's own parent path would swallow the whole
  # tree the same way.
  "/.git/",
  ".direnv/",
  "result/",
  "result-image/",
  "docs/_data/",
  "site/",
  # Negative-test fixtures contain intentionally-broken relative links
  # that drive check-orphan-invariants and refresh-enforcement-matrix;
  # they are not real docs and must not be link-checked.
  "tests/fixtures/",
  # Untracked working notes. Part of the Claude tooling tree IS tracked — the
  # docs-correctness-audit and multi-agent-review skills and their slash
  # commands — and those are maintained docs whose links belong in scope, so
  # the entries below name the untracked areas rather than the whole tree.
  # They bite only because the lint recipe names the dotted trees as inputs:
  # a plain `./**/*.md` glob never descends into a dotted directory, so
  # nothing under one reaches lychee through it and no exclusion here could
  # add or remove them. A scratch area missing from this list costs local
  # noise, never a red job — a clean checkout holds only the tracked half.
  ".claude/CLAUDE.md",
  ".claude/plans/",
  ".claude/reports/",
  ".claude/scratch/",
  ".claude/sdd/",
  # Seeded-defect fixtures are the recall harness's own fixtures, not repo
  # documentation — sample audit reports score.sh grades against a manifest,
  # and a seed set plant.sh is tested against.
  ".claude/skills/docs-correctness-audit/evals/seeded-defects/fixtures/",
  ".claude/skills/docs-correctness-audit-workspace/",
  ".claude/specs/",
  ".claude/worktrees/",
]
