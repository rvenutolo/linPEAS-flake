# context -> category for the README Continuous integration summary.
# Source of truth for grouping; every required context in
# docs/security/required-checks.md MUST appear here, and vice versa.
# scripts/refresh-ci-summary.sh fails if the two sets diverge.
#
# Category names must be chosen so that LC_ALL=C string sort produces
# the desired display order in the README. The generator sorts
# categories by the byte value of their name — there is no separate
# display-order key. Current categories (Build + smoke / Conventional
# Commits / Doc quality / Security/invariant lints) sort naturally;
# introducing a new category whose name starts with a letter that
# breaks the display sequence requires renaming so the alphabetical
# order matches intent.
build-linpeas-arm64: Build + smoke
build-linpeas: Build + smoke
flake-check: Build + smoke
image-smoke-arm64: Build + smoke
image-smoke: Build + smoke
smoke-test-arm64: Build + smoke
smoke-test: Build + smoke
commitlint: Conventional Commits
lint-pr-title: Conventional Commits
editorconfig: Doc quality
markdownlint: Doc quality
refresh-ci-dag-test: Doc quality
refresh-ci-summary-test: Doc quality
refresh-enforcement-matrix-test: Doc quality
refresh-just-recipes-test: Doc quality
refresh-precommit-table-test: Doc quality
refresh-scripts-reference-test: Doc quality
refresh-treefmt-config-test: Doc quality
