name: bad-array
on: push
permissions: {}
jobs:
  put:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: put
        run: |
          set -Eeuo pipefail
          notes_b64="$(base64 --wrap=0 notes.md)"
          put_args=(
            --method PUT "repos/${REPO}/contents/notes.md"
            --field message="docs: update notes"
            --field content="${notes_b64}"
          )
          put_args+=(--field sha="${blob_sha}")
          gh api "${put_args[@]}"
