name: bad-inline-base64
on: push
permissions: {}
jobs:
  put:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: put
        run: |
          set -Eeuo pipefail
          gh api --method PUT "repos/${REPO}/contents/notes.md" \
            --field message="docs: update notes" \
            --field content="$(base64 --wrap=0 notes.md)"
