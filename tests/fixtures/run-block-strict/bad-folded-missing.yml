name: bad-folded-missing
on: push
permissions: {}
concurrency:
  group: bad-folded-missing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: folded scalar missing strict
        run: >-
          echo one ;
          echo two ;
          echo three
