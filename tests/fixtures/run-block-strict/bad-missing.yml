concurrency:
  group: bad-missing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: multi-line missing strict
        run: |
          echo one
          echo two
