name: bad-mutable-tag
jobs:
  manifest:
    steps:
      - name: create index
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/rvenutolo/linpeas:${VERSION}" \
            "ghcr.io/rvenutolo/linpeas:${VERSION}-amd64" \
            "ghcr.io/rvenutolo/linpeas:${VERSION}-arm64"
