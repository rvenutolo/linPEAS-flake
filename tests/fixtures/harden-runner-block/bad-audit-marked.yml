name: bad-audit-marked
on:
  workflow_dispatch: {}
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          # TODO: restore egress-policy block once block mode stops dropping allowed hosts on
          # westus2 runners: https://github.com/step-security/harden-runner/issues/708
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
