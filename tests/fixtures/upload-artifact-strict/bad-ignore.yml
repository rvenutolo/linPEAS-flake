name: bad-ignore
on: push
permissions: {}
concurrency:
  group: bad-ignore-${{ github.ref }}
  cancel-in-progress: true
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foo
          path: out/
          if-no-files-found: ignore
