name: bad-dockerhub-missing-registry
on:
  workflow_dispatch: {}
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            github.com:443
            production.cloudfront.docker.com:443
      - name: pull image
        run: docker pull rvenutolo/linpeas:latest
