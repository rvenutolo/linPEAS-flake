name: bad-scorecard-missing-scorecards-api
on:
  workflow_dispatch: {}
jobs:
  scorecard:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.deps.dev:443
            api.github.com:443
            api.osv.dev:443
      - name: scorecard
        run: |
          nix develop --command scorecard --repo=github.com/example/repo
