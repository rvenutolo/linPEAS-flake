name: bad-verify-carries-timestamp
on:
  workflow_dispatch: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
      - name: verify
        run: nix shell .#cosign --command cosign verify-blob foo
