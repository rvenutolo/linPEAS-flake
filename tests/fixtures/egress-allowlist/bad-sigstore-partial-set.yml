name: bad-sigstore-partial-set
on:
  workflow_dispatch: {}
jobs:
  # Models the manifest-job bug: no cosign invocation is visible in this
  # workflow file (it is reached indirectly, e.g. via a script), yet the
  # allowlist carries a partial sigstore host set. Assertion 4 must fire
  # on the host set alone, with zero cosign detection.
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            rekor.sigstore.dev:443
      - name: build multi-arch index
        run: scripts/build-index.sh
