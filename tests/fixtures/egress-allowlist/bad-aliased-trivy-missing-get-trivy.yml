name: bad-aliased-trivy-missing-get-trivy
on:
  workflow_dispatch: {}
x-trivy: &trivy aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            ghcr.io:443
            github.com:443
            mirror.gcr.io:443
            pkg-containers.githubusercontent.com:443
      - uses: *trivy
