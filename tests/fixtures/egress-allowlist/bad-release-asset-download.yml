name: bad-release-asset-download
on:
  workflow_dispatch: {}
jobs:
  release-download:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - name: download release asset
        run: |
          curl --location --fail --output foo \
            https://github.com/rvenutolo/linPEAS-flake/releases/download/v1.0.0/foo
