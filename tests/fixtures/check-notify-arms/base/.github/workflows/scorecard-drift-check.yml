name: scorecard-drift-check
on: push
jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - run: "true"
  notify:
    needs: drift-check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/notify-workflow-result
        with:
          # A head comment, which yq prints as a line of its own.
          result: ${{ needs.drift-check.result }}
          label: scorecard-drift-check
          title: "scorecard-drift-check: failed"
          body: |
            The watchdog failed. <!-- notify-arms: scorecard-drift-check.yml/notify = failure cancelled -->
