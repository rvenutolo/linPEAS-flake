name: other
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: "true"
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: "true"
  # Outside the gate grammar, and named by no marker, so never derived.
  notify:
    needs: [build, deploy]
    if: always() && contains(github.ref, 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/notify-workflow-result
        with:
          result: ${{ (needs.build.result == 'failure' || needs.deploy.result == 'failure') && 'failure' || 'success' }}
          label: other
          title: "other: failed"
          body: |
            Failed.
  # The composite at a pinned remote revision, named by no marker.
  remote-notify:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: rvenutolo/linPEAS-flake/.github/actions/notify-workflow-result@0000000000000000000000000000000000000000
        with:
          result: ${{ needs.build.result }}
          label: other-remote
          title: "other: failed"
          body: |
            Failed.
