name: zizmor-drift-check
on: push
jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - run: "true"
  notify:
    needs: drift-check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@0000000000000000000000000000000000000000
      - uses: actions/checkout@0000000000000000000000000000000000000000
      - uses: ./.github/actions/notify-workflow-result
        with:
          # A head comment, which yq prints as a line of its own.
          result: ${{ needs.drift-check.result }}
          label: zizmor-drift-check
          title: "zizmor-drift-check: failed"
          body: |
            The watchdog failed. <!-- notify-arms: zizmor-drift-check.yml/notify = failure cancelled -->
