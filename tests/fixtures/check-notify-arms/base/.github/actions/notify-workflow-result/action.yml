name: notify-workflow-result
description: "Open/update a deduped issue on workflow failure or cancellation; close it on next success."

# SECURITY CONTRACT for `title` and `body` inputs:
#
# These values are rendered as **markdown** in a GitHub issue. The
# composite uses env-var indirection so attacker-controlled values
# cannot break out into shell or JS — but they CAN render arbitrary
# markdown (links, @mentions, HTML comments) in the resulting issue.
#
# DO NOT pass values derived from:
#   - github.event.issue.* / github.event.pull_request.*
#   - github.event.head_commit.message
#   - github.event.inputs.* (workflow_dispatch user input)
#   - any third-party-API field that isn't shape-validated upstream
#
# SAFE inputs:
#   - static literals
#   - github.event_name, github.run_id, github.sha
#   - needs.*.result
#   - shape-validated values (e.g. the canonical
#     `^[0-9]{8}-[0-9a-f]{7,40}$` pin shape enforced by
#     stale-pin-check.yml before reaching this composite)
#
# TRANSIENT HOLD-OFF: when `result` is `failure` or `cancelled`, the
# composite classifies its own run (the run named by GITHUB_RUN_ID) with
# scripts/fetch-ci-run.sh and scripts/classify-ci-run.sh --policy
# automated, the same predicate the CI watchdog applies before it re-runs
# a run. On the exact verdict `retry` the run is one the watchdog
# re-runs, so the composite files nothing and prints a notice; the re-run
# reaches this composite again, and files if it fails again for a reason
# that is not retryable or once the attempt cap is spent (`exhausted`).
# Every other outcome files: the verdicts `report`, `exhausted` and
# `ignore`, and any failure to fetch or classify (the step warns and
# reports), because a broken classifier must never silence an issue.
# `success` and `skipped` never classify. Callers' jobs need
# `actions: read` and `checks: read` for the fetch
# (tests/notify-caller-permissions.test.sh asserts both on every job
# that calls this composite). The scripts are read from the caller's
# checkout, so the caller checks out the repository before this step,
# and they are the checkout's `scripts/*`, not this composite revision's:
# a caller that pins this composite by SHA must keep its checkout
# compatible with that revision, in the arguments, output and exit codes
# this file relies on. The classify step carries no `if:`, so a result
# cannot skip it: it decides for itself whether to classify. The fetch is
# bounded at 180 seconds, and a timeout reports like any other fetch
# error.
#
# CALLER CONTRACT: the classification covers the whole run, so a caller's
# notify job must `needs:` every non-notify job in the run. A job that
# is still running has no conclusion yet and is ignored, so a notify job
# that does not wait for it can see only transient failures, hold off, and
# leave a later real failure with no issue because the watchdog then reports
# the run instead of re-running it. A notify job that watches one of
# several jobs lists all of them in `needs:`, keeps `always()` in its `if:`
# and names only the job it watches in the gate and the `result:` input.
#
# DEDUPLICATION BEHAVIOR: the composite lists open issues by
# `label`, then opens one if none exist. Two concurrent runs of the
# SAME caller workflow can race the `listForRepo` -> `issues.create`
# window and produce two open issues with the same label. The
# cleanup loop on the next success correctly closes N>1, so the
# duplication is self-healing within one cycle. If you see two
# duplicated failure issues, do not "fix" the race here; the
# alternative (a `concurrency:` mutex on the notify job) adds cost
# that isn't justified by the impact.

inputs:
  result:
    description: >-
      Aggregate result of the parent job(s)
      (success/failure/cancelled/skipped). `cancelled` is treated as an
      infrastructure failure — a job the runner pool never picked up,
      or `timeout-minutes` exceeded: it files/updates the same deduped
      issue as `failure`, with the issue text flagging the run as
      cancelled so triage does not read it as a finding. `failure` and
      `cancelled` file nothing while the run's own classification is
      `retry` (a transient failure the CI watchdog re-runs); a fetch or
      classifier error files. `success` closes open issues. `skipped` is
      inert.
    required: true
  label:
    description: "Label used to dedup open issues for this workflow."
    required: true
  title:
    description: "Title of the issue when opening."
    required: true
  body:
    description: "Markdown body of the issue when opening."
    required: true
  label-color:
    description: "Hex color (without #) for the label, applied on first-time creation."
    required: false
    default: b60205
  label-description:
    description: "Description string for the label. Written when a run opens a new issue: set on label creation, and refreshed when the live label's description differs."
    required: false
    default: Workflow failure auto-filed by .github/actions/notify-workflow-result
  github-token:
    description: "GitHub token with issues:write (e.g. secrets.GITHUB_TOKEN)."
    required: true

runs:
  using: composite
  steps:
    - name: classify the run for a transient hold-off
      id: classify
      shell: bash
      # A broken classify step must never stop the issue step: an absent
      # verdict files.
      continue-on-error: true
      env:
        RESULT: ${{ inputs.result }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -Eeuo pipefail
        IFS=$'\n\t'
        # Only a failed or cancelled result can be held off; any other
        # result leaves the verdict empty.
        if [[ ${RESULT} != 'failure' && ${RESULT} != 'cancelled' ]]; then
          printf 'verdict=\n' >>"${GITHUB_OUTPUT}" || true
          exit 0
        fi
        verdict='report'
        detail=''
        run_json=''
        classified=''
        fetch_status=0
        run_json="$(timeout 180 "${GITHUB_WORKSPACE}/scripts/fetch-ci-run.sh" "${GITHUB_RUN_ID}")" || fetch_status=$?
        if [[ ${fetch_status} -eq 124 ]]; then
          printf '::warning::fetching run %s timed out after 180s, so the failure is reported rather than held off\n' \
            "${GITHUB_RUN_ID}"
        elif [[ ${fetch_status} -ne 0 ]]; then
          printf '::warning::fetching run %s failed (exit %s), so the failure is reported rather than held off\n' \
            "${GITHUB_RUN_ID}" "${fetch_status}"
        elif ! classified="$("${GITHUB_WORKSPACE}/scripts/classify-ci-run.sh" --policy automated <<<"${run_json}")"; then
          printf '::warning::classifying run %s failed, so the failure is reported rather than held off\n' \
            "${GITHUB_RUN_ID}"
        else
          verdict="${classified%%$'\n'*}"
          if [[ ${classified} == *$'\n'* ]]; then
            detail="${classified#*$'\n'}"
          fi
        fi
        max_attempts="$("${GITHUB_WORKSPACE}/scripts/classify-ci-run.sh" --print-max-attempts)" || max_attempts=''
        # A failure to write the outputs leaves the verdict empty, which
        # the issue step treats as filing; it must not fail this step.
        delimiter="detail_$(od --address-radix=n --format=x1 --read-bytes=16 /dev/urandom | tr --delete ' \n')" ||
          delimiter=''
        if [[ ${#delimiter} -lt 30 ]]; then
          delimiter="detail_${RANDOM}${RANDOM}${RANDOM}${RANDOM}"
        fi
        if ! {
          printf 'verdict=%s\n' "${verdict}"
          printf 'max_attempts=%s\n' "${max_attempts}"
          printf 'detail<<%s\n%s\n%s\n' "${delimiter}" "${detail}" "${delimiter}"
        } >>"${GITHUB_OUTPUT}"; then
          printf '::warning::could not write the classification outputs, so the failure is reported\n'
        fi
    - name: open, comment, or close issue
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        RESULT: ${{ inputs.result }}
        LABEL: ${{ inputs.label }}
        TITLE: ${{ inputs.title }}
        BODY: ${{ inputs.body }}
        LABEL_COLOR: ${{ inputs.label-color }}
        LABEL_DESCRIPTION: ${{ inputs.label-description }}
        VERDICT: ${{ steps.classify.outputs.verdict }}
        DETAIL: ${{ steps.classify.outputs.detail }}
        MAX_ATTEMPTS: ${{ steps.classify.outputs.max_attempts }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const result = process.env.RESULT;
          const label = process.env.LABEL;
          const title = process.env.TITLE;
          const body = process.env.BODY;
          const labelColor = process.env.LABEL_COLOR;
          const labelDescription = process.env.LABEL_DESCRIPTION;
          const verdict = process.env.VERDICT;
          const detail = process.env.DETAIL;
          const maxAttempts = process.env.MAX_ATTEMPTS;
          const runUrl =
            `https://github.com/${context.repo.owner}/${context.repo.repo}` +
            `/actions/runs/${context.runId}`;

          // `cancelled` reaching this code means a job-level cancel,
          // because a run-level cancel (an operator's `gh run cancel`,
          // or a concurrency supersede where `cancel-in-progress: true`)
          // cancels this notify job along with the rest of the run,
          // `always()` included, so it never executes. A job-level
          // cancel is either a job the runner pool never picked up or
          // `timeout-minutes` exceeded, and `result` cannot tell them
          // apart — the jobs API can. See "Cancelled-job attribution"
          // in docs/architecture/ci.md. Filing keeps a job that died
          // either way from sitting red in the Actions tab unalerted;
          // the issue text flags it so triage does not read it as a
          // finding.
          const cancelled = result === 'cancelled';

          // Inert on skipped so callers can pass a raw job result and
          // let no-op paths (gated jobs, no-change cron days) stay
          // silent.
          if (result !== 'success' && result !== 'failure' && !cancelled) {
            core.notice(`Result is '${result}'; no action.`);
            return;
          }

          // Only the exact verdict `retry` holds off: the CI watchdog
          // re-runs the run, and the re-run files if it fails again.
          // The classify step reports on any fetch or classifier error,
          // so a broken classifier never silences an issue.
          if (verdict === 'retry') {
            core.notice(
              'Holding off: the CI watchdog retries transient failures on ' +
                'eligible runs; this run is eligible (attempt ' +
                `${process.env.GITHUB_RUN_ATTEMPT} of ${maxAttempts}).\n${detail}`,
            );
            return;
          }

          // Look up open issues carrying our dedup label.
          const existing = await github.paginate(
            github.rest.issues.listForRepo,
            {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100,
            },
          );

          if (result === 'success') {
            if (existing.length === 0) {
              core.notice('Success: no open issues to close.');
              return;
            }
            for (const issue of existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Auto-closing: workflow recovered. Run: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.notice(`Closed issue #${issue.number}`);
            }
            return;
          }

          // result === 'failure' || result === 'cancelled'
          const cancelledNote =
            'cancelled (never picked up by a runner, or ' +
            '`timeout-minutes` exceeded) — infrastructure failure, ' +
            'not a finding';
          if (existing.length > 0) {
            const issue = existing[0];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: cancelled
                ? `New run ${cancelledNote}: ${runUrl}`
                : `New failure: ${runUrl}`,
            });
            core.notice(`Appended comment to existing issue #${issue.number}`);
            return;
          }

          // Ensure label exists before creating the issue.
          // createLabel returns 422 when it already exists; swallow only that.
          //
          // A label that already exists keeps whatever description it was
          // created with, so an edit to label-description here would never
          // reach the label a maintainer reads. On the 422 path, compare and
          // update, which makes this file the source of truth for the wording
          // rather than whichever run first filed the label.
          try {
            await github.rest.issues.createLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: label,
              color: labelColor,
              description: labelDescription,
            });
          } catch (err) {
            if (err.status !== 422) {
              throw err;
            }
            // Best-effort: a description that could not be refreshed must not
            // stop the issue this run exists to file.
            try {
              const { data: live } = await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
              if ((live.description || '') !== labelDescription) {
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  description: labelDescription,
                });
                core.notice(`Refreshed description of label ${label}`);
              }
            } catch (syncErr) {
              core.warning(
                `Could not refresh description of label ${label}: ${syncErr.message}`,
              );
            }
          }

          const issueBody = cancelled
            ? `> [!WARNING]\n` +
              `> This run was ${cancelledNote}. The body below ` +
              `describes the workflow's failure mode and may not ` +
              `apply.\n\n${body}\n\nRun: ${runUrl}`
            : `${body}\n\nRun: ${runUrl}`;
          const created = await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title,
            body: issueBody,
            labels: [label],
          });
          core.notice(`Opened issue #${created.data.number}`);
